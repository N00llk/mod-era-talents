schemaVersion: 1
locale: ruRU
era: tbc
class: warlock
texts:
  tree.1:
    name: Колдовство
  talent.suppression:
    name: Подавление
    tooltip:
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 2%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 4%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 6%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 8%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 10%.
  talent.improved_corruption:
    name: Улучшенная порча
    tooltip:
    - Сокращает время применения "Порчи" на 0.4 сек.
    - Сокращает время применения "Порчи" на 0.8 сек.
    - Сокращает время применения "Порчи" на 1.2 сек.
    - Сокращает время применения "Порчи" на 1.6 сек.
    - Сокращает время применения "Порчи" на 2 сек.
  talent.improved_curse_of_weakness:
    name: Улучшенное проклятие слабости
    tooltip:
    - Усиливает эффект "Проклятия слабости" на 10%.
    - Усиливает эффект "Проклятия слабости" на 20%.
  talent.improved_drain_soul:
    name: Улучшенное похищение души
    tooltip:
    - Восполняет 7% максимального запаса маны при условии, что противник погиб в процессе
      применения заклинания "Похищение души", а также снижает на 5% угрозу, создаваемую
      заклинаниями категории "Колдовство".
    - Восполняет 15% максимального запаса маны при условии, что противник погиб в
      процессе применения заклинания "Похищение души", а также снижает на 10% угрозу,
      создаваемую заклинаниями категории "Колдовство".
  talent.improved_life_tap:
    name: Улучшенный жизнеотвод
    tooltip:
    - Увеличивает объем маны, получаемой от "Жизнеотвода", на 10%.
    - Увеличивает объем маны, получаемой от "Жизнеотвода", на 20%.
  talent.soul_siphon:
    name: Вытягивание души
    tooltip:
    - Увеличивает объем здоровья, вытягиваемого "Похищением жизни", еще на 2% за каждый
      эффект специализации "Колдовство" на цели, вплоть до 24%.
    - Увеличивает объем здоровья, вытягиваемого "Похищением жизни", еще на 4% за каждый
      эффект специализации "Колдовство" на цели, вплоть до 60%.
  talent.improved_curse_of_agony:
    name: Улучшенное проклятие агонии
    tooltip:
    - Увеличивает урон от "Проклятия агонии" на 5%.
    - Увеличивает урон от "Проклятия агонии" на 10%.
  talent.fel_concentration:
    name: Сосредоточение Скверны
    tooltip:
    - С вероятностью 14% поддержание "Похищения жизни", "Похищения маны" и "Похищения
      души" не прерывается при получении урона.
    - С вероятностью 28% поддержание "Похищения жизни", "Похищения маны" и "Похищения
      души" не прерывается при получении урона.
    - С вероятностью 42% поддержание "Похищения жизни", "Похищения маны" и "Похищения
      души" не прерывается при получении урона.
    - С вероятностью 56% поддержание "Похищения жизни", "Похищения маны" и "Похищения
      души" не прерывается при получении урона.
    - С вероятностью 70% поддержание "Похищения жизни", "Похищения маны" и "Похищения
      души" не прерывается при получении урона.
  talent.amplify_curse:
    name: Усиление проклятия
    tooltip:
    - Усиливает следующее "Проклятие слабости" или "Проклятие агонии" на 50%, либо
      следующее "Проклятие изнеможения" на 20%. Время действия – 30 сек..
  talent.grim_reach:
    name: Предел мрака
    tooltip:
    - Увеличивает дальность действия заклинаний специализации "Колдовство" на 10%.
    - Увеличивает дальность действия заклинаний специализации "Колдовство" на 20%.
  talent.nightfall:
    name: Сумерки
    tooltip:
    - '"Порча" и "Похищение жизни" с вероятностью 2% могут ввести вас в "Теневой транс"
      после нанесения урона противнику. Транс сокращает время применения следующей
      "Стрелы Тьмы" на 100%.'
    - '"Порча" и "Похищение жизни" с вероятностью 2% могут ввести вас в "Теневой транс"
      после нанесения урона противнику. Транс сокращает время применения следующей
      "Стрелы Тьмы" на 100%.'
  talent.empowered_corruption:
    name: Усиленная порча
    tooltip:
    - Ваше заклинание "Порча" получает дополнительно 12% от добавочных эффектов урона
      от заклинания.
    - Ваше заклинание "Порча" получает дополнительно 24% от добавочных эффектов урона
      от заклинания.
    - Ваше заклинание "Порча" получает дополнительно 36% от добавочных эффектов урона
      от заклинания.
  talent.shadow_embrace:
    name: Объятия Тьмы
    tooltip:
    - '"Порча", "Проклятие агонии", "Вытягивание жизни" и "Семя порчи" также применяют
      "Объятия Тьмы", уменьшающие наносимый физический урон на 1%.'
    - '"Порча", "Проклятие агонии", "Вытягивание жизни" и "Семя порчи" также применяют
      "Объятия Тьмы", уменьшающие наносимый физический урон на 2%.'
    - '"Порча", "Проклятие агонии", "Вытягивание жизни" и "Семя порчи" также применяют
      "Объятия Тьмы", уменьшающие наносимый физический урон на 3%.'
    - '"Порча", "Проклятие агонии", "Вытягивание жизни" и "Семя порчи" также применяют
      "Объятия Тьмы", уменьшающие наносимый физический урон на 4%.'
    - '"Порча", "Проклятие агонии", "Вытягивание жизни" и "Семя порчи" также применяют
      "Объятия Тьмы", уменьшающие наносимый физический урон на 5%.'
  talent.siphon_life:
    name: Вытягивание жизни
    tooltip:
    - Передача 15 ед. здоровья от цели к заклинателю раз в 3 сек. Время действия –
      30 сек..
  talent.curse_of_exhaustion:
    name: Проклятие изнеможения
    tooltip:
    - Снижает скорость передвижения цели на 30% на 12 сек.. Одновременно на цель может
      действовать только одно проклятие каждого чернокнижника.
  talent.shadow_mastery:
    name: Власть над Тенями
    tooltip:
    - Увеличение урона, наносимого заклинаниями темной магии на 2%.
    - Увеличение урона, наносимого заклинаниями темной магии на 4%.
    - Увеличение урона, наносимого заклинаниями темной магии на 6%.
    - Увеличение урона, наносимого заклинаниями темной магии на 8%.
    - Увеличение урона, наносимого заклинаниями темной магии на 10%.
  talent.contagion:
    name: Заражение
    tooltip:
    - Увеличивает урон от "Проклятия агонии", "Порчи" и "Семени порчи" на 1% и снижает
      вероятность рассеивания ваших заклинаний специализации "Колдовство" еще на 6%.
    - Увеличивает урон от "Проклятия агонии", "Порчи" и "Семени порчи" на 2% и снижает
      вероятность рассеивания ваших заклинаний специализации "Колдовство" еще на 12%.
    - Увеличивает урон от "Проклятия агонии", "Порчи" и "Семени порчи" на 3% и снижает
      вероятность рассеивания ваших заклинаний специализации "Колдовство" еще на 18%.
    - Увеличивает урон от "Проклятия агонии", "Порчи" и "Семени порчи" на 4% и снижает
      вероятность рассеивания ваших заклинаний специализации "Колдовство" еще на 24%.
    - Увеличивает урон от "Проклятия агонии", "Порчи" и "Семени порчи" на 5% и снижает
      вероятность рассеивания ваших заклинаний специализации "Колдовство" еще на 30%.
  talent.dark_pact:
    name: Темный союз
    tooltip:
    - Похищение 305 ед. маны вашего питомца; 100% ее передается заклинателю.
  talent.improved_howl_of_terror:
    name: Улучшенный вой ужаса
    tooltip:
    - Сокращает время применения "Воя ужаса" на 0.8 сек.
    - Сокращает время применения "Воя ужаса" на 1.5 сек.
  talent.malediction:
    name: Злое слово
    tooltip:
    - Повышение дополнительного урона от заклинания "Проклятие стихий" на 1%.
    - Повышение дополнительного урона от заклинания "Проклятие стихий" на 2%.
    - Повышение дополнительного урона от заклинания "Проклятие стихий" на 3%.
  talent.unstable_affliction:
    name: Нестабильное колдовство
    tooltip:
    - Энергия тьмы медленно уничтожает цель, нанося ей 660 ед. урона в течение 18
      сек.. Тот, кто рассеивает заклинание "Нестабильное колдовство", получает 990
      ед. урона и поражается эффектом немоты на 5 сек..
  tree.2:
    name: Демонология
  talent.improved_healthstone:
    name: Улучшенный камень здоровья
    tooltip:
    - Усиливает исцеление от камня здоровья на 10%.
    - Усиливает исцеление от камня здоровья на 20%.
  talent.improved_imp:
    name: Улучшенный бес
    tooltip:
    - Увеличение на 10% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
    - Увеличение на 20% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
    - Увеличение на 30% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
  talent.demonic_embrace:
    name: Демоническое облачение
    tooltip:
    - Повышение общей выносливости на 3% при снижении общего духа на 1%.
    - Повышение общей выносливости на 6% при снижении общего духа на 2%.
    - Повышение общей выносливости на 9% при снижении общего духа на 3%.
    - Повышение общей выносливости на 12% при снижении общего духа на 4%.
    - Повышение общей выносливости на 15% при снижении общего духа на 5%.
  talent.improved_health_funnel:
    name: Улучшенный канал здоровья
    tooltip:
    - Увеличение количества здоровья, передаваемого заклинанием "Канал здоровья",
      на 10%.
    - Увеличение количества здоровья, передаваемого заклинанием "Канал здоровья",
      на 20%..
  talent.improved_voidwalker:
    name: Улучшенный демон Бездны
    tooltip:
    - Повышает эффективность "Мучения", "Поглощения теней", "Жертвы" и "Мук" демона
      Бездны на 10%.
    - Повышает эффективность "Мучения", "Поглощения теней", "Жертвы" и "Мук" демона
      Бездны на 20%.
    - Повышает эффективность "Мучения", "Поглощения теней", "Жертвы" и "Мук" демона
      Бездны на 30%.
  talent.fel_intellect:
    name: Интеллект скверны
    tooltip:
    - Повышает на 5% интеллект беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны, а также увеличивает ваш максимальный запас маны на 1%.
    - Повышает на 10% интеллект беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны, а также увеличивает ваш максимальный запас маны на 2%.
    - Повышает на 15% интеллект беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны, а также увеличивает ваш максимальный запас маны на 3%.
  talent.improved_sayaad:
    name: Улучшенный сайаад
    tooltip:
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 10% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 10%.
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 20% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 20%.
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 30% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 30%.
  talent.fel_domination:
    name: Господство Скверны
    tooltip:
    - Сокращает время призыва следующего беса, демона Бездны, суккуба, инкуба, охотника
      Скверны или стража Скверны на 5.5 сек. и снижает его стоимость на 50%.
  talent.fel_stamina:
    name: Выносливость скверны
    tooltip:
    - Повышает на 5% выносливость беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны, а также увеличивает ваш максимальный запас здоровья на 1%.
    - Повышает на 10% выносливость беса, демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также увеличивает ваш максимальный запас здоровья
      на 2%.
    - Повышает на 15% выносливость беса, демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также увеличивает ваш максимальный запас здоровья
      на 3%.
  talent.demonic_aegis:
    name: Демоническая эгида
    tooltip:
    - Повышает эффективность "Демонического доспеха" и "Доспеха Скверны" на 10%.
    - Повышает эффективность "Демонического доспеха" и "Доспеха Скверны" на 20%.
    - Повышает эффективность "Демонического доспеха" и "Доспеха Скверны" на 30%.
  talent.master_summoner:
    name: Мастер призыва
    tooltip:
    - Сокращает время призыва беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны на 2 сек. и снижает его стоимость на 20%.
    - Сокращает время призыва беса, демона Бездны, суккуба, инкуба, охотника Скверны
      и стража Скверны на 4 сек. и снижает его стоимость на 40%.
  talent.unholy_power:
    name: Нечестивая сила
    tooltip:
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также от "Огненной стрелы" беса на 4%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также от "Огненной стрелы" беса на 8%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также от "Огненной стрелы" беса на 12%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также от "Огненной стрелы" беса на 16%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба, охотника
      Скверны и стража Скверны, а также от "Огненной стрелы" беса на 20%.
  talent.improved_subjugate_demon:
    name: Улучшенное порабощение демона
    tooltip:
    - Уменьшает штраф к скорости атаки и применения заклинаний от "Порабощения демона"
      на 5%, а также снижает вероятность сопротивления на 5%.
    - Уменьшает штраф к скорости атаки и применения заклинаний от "Порабощения демона"
      на 10%, а также снижает вероятность сопротивления на 10%.
  talent.demonic_sacrifice:
    name: Демоническое жертвоприношение
    tooltip:
    - 'При активации приносит в жертву призванного демона и дает вам на 30 мин.. эффект,
      который снимается при вызове нового демона.Бес: увеличивает урон от огня на
      15%.Демон Бездны: восполняет 2% общего запаса здоровья раз в 4 сек.Суккуб/инкуб:
      увеличивает урон от темной магии на 15%.Охотник Скверны: восполняет 3% общего
      запаса маны раз в 4 сек.Страж Скверны: увеличивает урон от темной магии на 10%
      и восполняет 2% общего запаса маны раз в 4 сек.'
  talent.master_conjuror:
    name: Мастер кудесник
    tooltip:
    - Увеличивает бонусный урон от камней огня и усиливает их эффект на 15%, а также
      увеличивает бонус к рейтингу критического эффекта заклинаний от камней чар на
      15%.
    - Увеличивает бонусный урон от камней огня и усиливает их эффект на 30%, а также
      увеличивает бонус к рейтингу критического эффекта заклинаний от камней чар на
      30%.
  talent.mana_feed:
    name: Манакорм
    tooltip:
    - Когда вы получаете ману с помощью "Похищения маны" или "Жизнеотвода", ваш прислужник
      получает 33% полученной маны.
    - Когда вы получаете ману с помощью "Похищения маны" или "Жизнеотвода", ваш прислужник
      получает 66% полученной маны.
    - Когда вы получаете ману с помощью "Похищения маны" или "Жизнеотвода", ваш прислужник
      получает 100% полученной маны.
  talent.master_demonologist:
    name: Мастер-демонолог
    tooltip:
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока активен демон.Бес:
      снижает уровень угрозы на 4%.Демон Бездны: уменьшает получаемый физический урон
      на 2%.Суккуб/инкуб: увеличивает наносимый урон на 2%.Охотник Скверны: повышает
      сопротивление всем видам магии на 0,2 за каждый уровень.Страж Скверны: увеличивает
