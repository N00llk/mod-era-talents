schemaVersion: 1
locale: ruRU
era: tbc
class: rogue
texts:
  tree.1:
    name: Ликвидация
  talent.improved_eviscerate:
    name: Улучшенное потрошение
    tooltip:
    - '"Потрошение" наносит на 5% больше урона.'
    - '"Потрошение" наносит на 10% больше урона.'
    - '"Потрошение" наносит на 15% больше урона.'
  talent.remorseless_attacks:
    name: Беспощадные атаки
    tooltip:
    - После убийства, которое дает опыт или честь, следующий "Коварный удар", "Кровоизлияние",
      "Удар в спину", "Расправа", "Внезапный удар" или "Призрачный удар" наносит критический
      урон с повышенной на 20% вероятностью. Время действия – 20 сек.
    - После убийства, которое дает опыт или честь, следующий "Коварный удар", "Кровоизлияние",
      "Удар в спину", "Расправа", "Внезапный удар" или "Призрачный удар" наносит критический
      урон с повышенной на 40% вероятностью. Время действия – 20 сек.
  talent.malice:
    name: Злоба
    tooltip:
    - Увеличивает вероятность нанести критический удар на 1%.
    - Увеличивает вероятность нанести критический удар на 2%.
    - Увеличивает вероятность нанести критический удар на 3%.
    - Увеличивает вероятность нанести критический удар на 4%.
    - Увеличивает вероятность нанести критический удар на 5%.
  talent.ruthlessness:
    name: Жестокость
    tooltip:
    - С вероятностью 20% ваш завершающий прием начнет новую серию приемов.
    - С вероятностью 40% ваш завершающий прием начнет новую серию приемов.
    - С вероятностью 60% ваш завершающий прием начнет новую серию приемов.
  talent.murder:
    name: Убийство
    tooltip:
    - Повышение урона, наносимого гуманоидам, великанам, животным и драконам на 1%.
    - Повышение урона, наносимого гуманоидам, великанам, животным и драконам на 2%.
  talent.puncturing_wounds:
    name: Колотые раны
    tooltip:
    - Повышает вероятность критического эффекта "Удара в спину" на 10%, а "Расправы"
      – на 5%.
    - Повышает вероятность критического эффекта "Удара в спину" на 20%, а "Расправы"
      – на 10%.
    - Повышает вероятность критического эффекта "Удара в спину" на 30%, а "Расправы"
      – на 15%.
  talent.relentless_strikes:
    name: Неослабевающие удары
    tooltip:
    - С вероятностью 20% за каждый прием в серии ваш завершающий прием восстановит
      25 энергии.
  talent.improved_expose_armor:
    name: Улучшенное ослабление доспеха
    tooltip:
    - Повышение на 25% эффекта ослабления брони при применении способности "Ослабление
      доспеха".
    - Повышение на 50% эффекта ослабления брони при применении способности "Ослабление
      доспеха".
  talent.lethality:
    name: Смертоносность
    tooltip:
    - Увеличивает бонус к критическому урону от "Коварного удара", "Парализующего
      удара", "Удара в спину", "Призрачного удара", "Расправы", "Отравляющего укола"
      и "Кровоизлияния" на 6%.
    - Увеличивает бонус к критическому урону от "Коварного удара", "Парализующего
      удара", "Удара в спину", "Призрачного удара", "Расправы", "Отравляющего укола"
      и "Кровоизлияния" на 12%.
    - Увеличивает бонус к критическому урону от "Коварного удара", "Парализующего
      удара", "Удара в спину", "Призрачного удара", "Расправы", "Отравляющего укола"
      и "Кровоизлияния" на 18%.
    - Увеличивает бонус к критическому урону от "Коварного удара", "Парализующего
      удара", "Удара в спину", "Призрачного удара", "Расправы", "Отравляющего укола"
      и "Кровоизлияния" на 24%.
    - Увеличивает бонус к критическому урону от "Коварного удара", "Парализующего
      удара", "Удара в спину", "Призрачного удара", "Расправы", "Отравляющего укола"
      и "Кровоизлияния" на 30%.
  talent.vile_poisons:
    name: Тлетворные яды
    tooltip:
    - Увеличивает урон, наносимый вашими ядами и способностью "Отравление", на 4%.
      Ваши яды с вероятностью 8% избегают эффектов рассеивания.
    - Увеличивает урон, наносимый вашими ядами и способностью "Отравление", на 8%.
      Ваши яды с вероятностью 16% избегают эффектов рассеивания.
    - Увеличивает урон, наносимый вашими ядами и способностью "Отравление", на 12%.
      Ваши яды с вероятностью 24% избегают эффектов рассеивания.
    - Увеличивает урон, наносимый вашими ядами и способностью "Отравление", на 16%.
      Ваши яды с вероятностью 32% избегают эффектов рассеивания.
    - Увеличивает урон, наносимый вашими ядами и способностью "Отравление", на 20%.
      Ваши яды с вероятностью 40% избегают эффектов рассеивания.
  talent.improved_poisons:
    name: Улучшенные яды
    tooltip:
    - Повышение на 2% вероятности поразить противника ядом.
    - Повышение на 4% вероятности поразить противника ядом.
    - Повышение на 6% вероятности поразить противника ядом.
    - Повышение на 8% вероятности поразить противника ядом.
    - Повышение на 10% вероятности поразить противника ядом.
  talent.fleet_footed:
    name: Скороход
    tooltip:
    - Увеличение на 5% вероятности не подвергнуться действию сдерживающих эффектов
      и на 8% скорости передвижения. Эффект не суммируется с другими, влияющими на
      скорость передвижения.
    - Увеличение на 10% вероятности не подвергнуться действию сдерживающих эффектов
      и на 15% скорости передвижения. Эффект не суммируется с другими, влияющими на
      скорость передвижения.
  talent.cold_blood:
    name: Хладнокровие
    tooltip:
    - При активации повышает вероятность критического эффекта следующей атакующей
      способности на 100%.
  talent.improved_kidney_shot:
    name: Улучшенный удар по почкам
    tooltip:
    - При воздействии вашей способности "Удар по почкам" противник получает дополнительно
      3% урона от всех источников.
    - При воздействии вашей способности "Удар по почкам" противник получает дополнительно
      6% урона от всех источников.
    - При воздействии вашей способности "Удар по почкам" противник получает дополнительно
      9% урона от всех источников.
  talent.quick_recovery:
    name: Быстрое восстановление
    tooltip:
    - Увеличение применяемых к вам целительных эффектов на 10%. Снижение затрат энергии
      на завершающие удары на 40%, если они прошли мимо цели.
    - Увеличение применяемых к вам целительных эффектов на 20%. Снижение затрат энергии
      на завершающие удары на 80%, если они прошли мимо цели.
  talent.seal_fate:
    name: Печать судьбы
    tooltip:
    - С вероятностью 20% критические эффекты способностей, которые продлевают серию
      приемов, дают еще один прием.
    - С вероятностью 40% критические эффекты способностей, которые продлевают серию
      приемов, дают еще один прием.
    - С вероятностью 60% критические эффекты способностей, которые продлевают серию
      приемов, дают еще один прием.
    - С вероятностью 80% критические эффекты способностей, которые продлевают серию
      приемов, дают еще один прием.
    - С вероятностью 100% критические эффекты способностей, которые продлевают серию
      приемов, дают еще один прием.
  talent.master_poisoner:
    name: Мастер ядоварения
    tooltip:
    - Снижение на 5% вероятности игнорирования ваших ядов и повышение собственного
      сопротивления ядам на 15%.
    - Снижение на 10% вероятности игнорирования ваших ядов и повышение собственного
      сопротивления ядам на 30%.
  talent.vigor:
    name: Неутомимость
    tooltip:
    - Увеличение на 10 ед. максимального запаса энергии.
  talent.deadened_nerves:
    name: Омертвевшие нервы
    tooltip:
    - Снижает получаемый физический урон на 1%.
    - Снижает получаемый физический урон на 2%.
    - Снижает получаемый физический урон на 3%.
    - Снижает получаемый физический урон на 4%.
    - Снижает получаемый физический урон на 5%.
  talent.find_weakness:
    name: Выявление слабости
    tooltip:
    - Увеличение урона всех атакующих способностей на 2% на 10 сек. после выполнения
      завершающего удара.
    - Увеличение урона всех атакующих способностей на 4% на 10 сек. после выполнения
      завершающего удара.
    - Увеличение урона всех атакующих способностей на 6% на 10 сек. после выполнения
      завершающего удара.
    - Увеличение урона всех атакующих способностей на 8% на 10 сек. после выполнения
      завершающего удара.
    - Увеличение урона всех атакующих способностей на 10% на 10 сек. после выполнения
      завершающего удара.
  talent.mutilate:
    name: Расправа
    tooltip:
    - Наносит одновременный удар двумя оружиями, причем урон от каждого оружия увеличивается
      на 44. Целям, находящимся под воздействием яда, наносится на 50% больше урона.
      Необходимо находиться позади цели. Длина серии приемов увеличивается на 2.
  tree.2:
    name: Бой
  talent.improved_gouge:
    name: Улучшенный парализующий удар
    tooltip:
    - Увеличение продолжительности действия эффекта способности "Парализующий удар"
      на 0.5 сек.
    - Увеличение продолжительности действия эффекта способности "Парализующий удар"
      на 1 сек.
    - Увеличение продолжительности действия эффекта способности "Парализующий удар"
      на 1.5 сек.
  talent.improved_sinister_strike:
    name: Улучшенный коварный удар
    tooltip:
    - Снижение на 3 ед. расхода энергии на совершение "Коварного удара".
    - Снижение на 5 ед. расхода энергии на совершение "Коварного удара".
  talent.lightning_reflexes:
    name: Молниеносные рефлексы
    tooltip:
    - Повышение на 1% вероятности уклонения от атак.
    - Повышение на 2% вероятности уклонения от атак.
    - Повышение на 3% вероятности уклонения от атак.
    - Повышение на 4% вероятности уклонения от атак.
    - Повышение на 5% вероятности уклонения от атак.
  talent.improved_slice_and_dice:
    name: Улучшенная мясорубка
    tooltip:
    - Увеличение длительности "Мясорубки" на 15%.
    - Увеличение длительности "Мясорубки" на 30%.
    - Увеличение длительности "Мясорубки" на 45%.
  talent.deflection:
    name: Отражение
    tooltip:
    - Увеличивает вероятность парирования атак на 1%.
    - Увеличивает вероятность парирования атак на 2%.
    - Увеличивает вероятность парирования атак на 3%.
    - Увеличивает вероятность парирования атак на 4%.
    - Увеличивает вероятность парирования атак на 5%.
  talent.precision:
    name: Точность
    tooltip:
    - Увеличение на 1% вероятности нанесения удара в ближнем бою.
    - Увеличение на 2% вероятности нанесения удара в ближнем бою.
    - Увеличение на 3% вероятности нанесения удара в ближнем бою.
    - Увеличение на 4% вероятности нанесения удара в ближнем бою.
    - Увеличение на 5% вероятности нанесения удара в ближнем бою.
  talent.endurance:
    name: Закалка
    tooltip:
    - Уменьшает время восстановления "Спринта" и "Ускользания" на 45 сек.
    - Уменьшает время восстановления "Спринта" и "Ускользания" на 1.5 мин.
  talent.riposte:
    name: Ответный удар
    tooltip:
    - Этот удар становится доступен игроку после парирования удара противника. Эта атака
      наносит 150% урона от оружия и обезоруживает противника на 6 сек.
  talent.improved_sprint:
    name: Улучшенный спринт
    tooltip:
    - Дает 50%-й шанс снятия затрудняющих передвижение эффектов при использовании
      способности "Спринт".
    - Дает 100%-й шанс снятия затрудняющих передвижение эффектов при использовании
      способности "Спринт".
  talent.improved_kick:
    name: Улучшенный пинок
    tooltip:
    - Повышение до 50% вероятности лишить противника дара речи на 2 сек. при использовании
      способности "Пинок".
    - Повышение до 100% вероятности лишить противника дара речи на 2 сек. при использовании
      способности "Пинок".
  talent.dagger_specialization:
    name: Специализация на кинжалах
    tooltip:
    - Повышение на 1% вероятности нанесения критического урона при использовании кинжалов.
    - Повышение на 2% вероятности нанесения критического урона при использовании кинжалов.
    - Повышение на 3% вероятности нанесения критического урона при использовании кинжалов.
    - Повышение на 4% вероятности нанесения критического урона при использовании кинжалов.
    - Повышение на 5% вероятности нанесения критического урона при использовании кинжалов.
  talent.dual_wield_specialization:
    name: Специализация на бое двумя оружиями
    tooltip:
    - Увеличение урона от вашего оружия в левой руке на 10%.
    - Увеличение урона от вашего оружия в левой руке на 20%.
    - Увеличение урона от вашего оружия в левой руке на 30%.
    - Увеличение урона от вашего оружия в левой руке на 40%.
    - Увеличение урона от вашего оружия в левой руке на 50%.
  talent.mace_specialization:
    name: Специализация на ударном оружии
    tooltip:
    - Увеличивает урон от критических ударов ударным оружием на 1% и с вероятностью
      1% оглушает цель на 3 сек. при атаке ударным оружием.
    - Увеличивает урон от критических ударов ударным оружием на 2% и с вероятностью
      2% оглушает цель на 3 сек. при атаке ударным оружием.
    - Увеличивает урон от критических ударов ударным оружием на 3% и с вероятностью
      3% оглушает цель на 3 сек. при атаке ударным оружием.
    - Увеличивает урон от критических ударов ударным оружием на 4% и с вероятностью
      4% оглушает цель на 3 сек. при атаке ударным оружием.
    - Увеличивает урон от критических ударов ударным оружием на 5% и с вероятностью
      6% оглушает цель на 3 сек. при атаке ударным оружием.
  talent.blade_flurry:
    name: Шквал клинков
    tooltip:
    - Увеличение скорости атаки на 20%, при этом атаки наносят удар по дополнительному
      ближайшему противнику. Длительность - 15 сек.
  talent.sword_specialization:
    name: Специализация на владении мечами
    tooltip:
    - 1%-я вероятность атаковать цель повторно после того, как вы ударите ее мечом.
    - 2%-я вероятность атаковать цель повторно после того, как вы ударите ее мечом.
    - 3%-я вероятность атаковать цель повторно после того, как вы ударите ее мечом.
    - 4%-я вероятность атаковать цель повторно после того, как вы ударите ее мечом.
    - 5%-я вероятность атаковать цель повторно после того, как вы ударите ее мечом.
  talent.fist_weapon_specialization:
    name: Специализация на кулачном оружии
    tooltip:
    - Увеличивает шанс нанести критический удар при использовании кистевого оружия
      на 1%.
    - Увеличивает шанс нанести критический удар при использовании кистевого оружия
      на 2%.
    - Увеличивает шанс нанести критический удар при использовании кистевого оружия
      на 3%.
    - Увеличивает шанс нанести критический удар при использовании кистевого оружия
      на 4%.
    - Увеличивает шанс нанести критический удар при использовании кистевого оружия
      на 5%.
  talent.blade_twisting:
    name: Вращение лезвий
    tooltip:
    - С вероятностью 10% "Коварный удар", "Удар в спину", "Парализующий удар" и "Отравляющий
      укол" вызывают у цели головокружение на 8 сек.
    - С вероятностью 20% "Коварный удар", "Удар в спину", "Парализующий удар" и "Отравляющий
      укол" вызывают у цели головокружение на 8 сек.
  talent.weapon_expertise:
    name: Оружейное мастерство
    tooltip:
    - Увеличивает мастерство на 5 ед.
    - Увеличивает мастерство на 10 ед.
  talent.aggression:
    name: Агрессивность
    tooltip:
    - Увеличивает урон от "Коварного удара", "Удара в спину" и "Потрошения" на 2%.
    - Увеличивает урон от "Коварного удара", "Удара в спину" и "Потрошения" на 4%.
    - Увеличивает урон от "Коварного удара", "Удара в спину" и "Потрошения" на 6%.
  talent.vitality:
    name: Живучесть
    tooltip:
    - Увеличивает выносливость на 2% и ловкость на 1%.
    - Увеличивает выносливость на 4% и ловкость на 2%.
  talent.adrenaline_rush:
    name: Выброс адреналина
    tooltip:
    - Увеличивает скорость восполнения энергии на 100% в течение 15 сек.
  talent.nerves_of_steel:
    name: Стальные нервы
    tooltip:
    - Повышает вероятность сопротивления страху и оглушению еще на 5%.
    - Повышает вероятность сопротивления страху и оглушению еще на 10%.
  talent.combat_potency:
    name: Боевой потенциал
    tooltip:
    - Есть вероятность 20%, что ваша успешная атака левой рукой восполнит 3 ед. энергии.
