schemaVersion: 1
locale: ruRU
era: tbc
class: priest
texts:
  tree.1:
    name: Послушание
  talent.unbreakable_will:
    name: Непреклонная воля
    tooltip:
    - Повышает вероятность сопротивления страху, оглушению и немоте еще на 3%.
    - Повышает вероятность сопротивления страху, оглушению и немоте еще на 6%.
    - Повышает вероятность сопротивления страху, оглушению и немоте еще на 9%.
    - Повышает вероятность сопротивления страху, оглушению и немоте еще на 12%.
    - Повышает вероятность сопротивления страху, оглушению и немоте еще на 15%.
  talent.wand_specialization:
    name: Специализация на жезлах
    tooltip:
    - Увеличение на 5% урона, наносимого при использовании магических жезлов.
    - Увеличение на 10% урона, наносимого при использовании магических жезлов.
    - Увеличение на 15% урона, наносимого при использовании магических жезлов.
    - Увеличение на 20% урона, наносимого при использовании магических жезлов.
    - Увеличение на 25% урона, наносимого при использовании магических жезлов.
  talent.silent_resolve:
    name: Молчаливая решимость
    tooltip:
    - Снижает угрозу, создаваемую заклинаниями Света и Послушания на 4% и вероятности
      рассеивания заклинаний на 4%.
    - Снижает угрозу, создаваемую заклинаниями Света и Послушания на 8% и вероятности
      рассеивания заклинаний на 8%.
    - Снижает угрозу, создаваемую заклинаниями Света и Послушания на 12% и вероятности
      рассеивания заклинаний на 12%.
    - Снижает угрозу, создаваемую заклинаниями Света и Послушания на 16% и вероятности
      рассеивания заклинаний на 16%.
    - Снижает угрозу, создаваемую заклинаниями Света и Послушания на 20% и вероятности
      рассеивания заклинаний на 20%.
  talent.improved_power_word_fortitude:
    name: 'Улучшенное слово силы: стойкость'
    tooltip:
    - 'Усиливает эффект "Слова силы: Стойкость" и "Молитвы стойкости" на 15%.'
    - 'Усиливает эффект "Слова силы: Стойкость" и "Молитвы стойкости" на 30%.'
  talent.improved_power_word_shield:
    name: 'Улучшенное слово силы: щит'
    tooltip:
    - 'Увеличение на 5% количества урона, поглощаемого при применении заклинания "Слово
      Cилы: Щит".'
    - 'Увеличение на 10% количества урона, поглощаемого при применении заклинания
      "Слово Cилы: Щит".'
    - 'Увеличение на 15% количества урона, поглощаемого при применении заклинания
      "Слово Cилы: Щит".'
  talent.martyrdom:
    name: Мученичество
    tooltip:
    - С вероятностью 50% жрец, получив критический удар оружием ближнего или дальнего
      боя, окажется под воздействием эффекта "Средоточие заклинаний" на 6 сек.. Этот
      эффект предохраняет от сбоев наложения жреческих заклинаний при получении урона
      и повышает сопротивление прерыванию заклинаний на 10%.
    - С вероятностью 100% жрец, получив критический удар оружием ближнего или дальнего
      боя, окажется под воздействием эффекта "Средоточие заклинаний" на 6 сек.. Этот
      эффект предохраняет от сбоев наложения жреческих заклинаний при получении урона
      и повышает сопротивление прерыванию заклинаний на 20%.
  talent.absolution:
    name: Отпущение
    tooltip:
    - Снижает стоимость "Рассеивания заклинаний", "Излечения болезни", "Снятия болезни"
      и "Массового рассеивания" на 5%.
    - Снижает стоимость "Рассеивания заклинаний", "Излечения болезни", "Снятия болезни"
      и "Массового рассеивания" на 10%.
    - Снижает стоимость "Рассеивания заклинаний", "Излечения болезни", "Снятия болезни"
      и "Массового рассеивания" на 15%.
  talent.inner_focus:
    name: Внутреннее сосредоточение
    tooltip:
    - При активации снижает стоимость следующего заклинания на 100%, а также повышает
      вероятность его критического эффекта на 25%, если такой эффект возможен.
  talent.meditation:
    name: Медитация
    tooltip:
    - Во время произнесения заклинаний продолжается 10% от обычного восполнения маны.
    - Во время произнесения заклинаний продолжается 20% от обычного восполнения маны.
    - Во время произнесения заклинаний продолжается 30% от обычного восполнения маны.
  talent.improved_inner_fire:
    name: Улучшенный внутренний огонь
    tooltip:
    - Увеличивает бонус к броне от "Внутреннего огня" на 10%.
    - Увеличивает бонус к броне от "Внутреннего огня" на 20%.
    - Увеличивает бонус к броне от "Внутреннего огня" на 30%.
  talent.mental_agility:
    name: Подвижность мысли
    tooltip:
    - Снижает стоимость мгновенно применяемых заклинаний на 2%.
    - Снижает стоимость мгновенно применяемых заклинаний на 4%.
    - Снижает стоимость мгновенно применяемых заклинаний на 6%.
    - Снижает стоимость мгновенно применяемых заклинаний на 8%.
    - Снижает стоимость мгновенно применяемых заклинаний на 10%.
  talent.improved_mana_burn:
    name: Улучшенное сожжение маны
    tooltip:
    - Сокращает время применения "Сжигания маны" на 0.5 сек.
    - Сокращает время применения "Сжигания маны" на 1 сек.
  talent.mental_strength:
    name: Сила мысли
    tooltip:
    - Повышает ваш максимальный запас маны на 2%.
    - Повышает ваш максимальный запас маны на 4%.
    - Повышает ваш максимальный запас маны на 6%.
    - Повышает ваш максимальный запас маны на 8%.
    - Повышает ваш максимальный запас маны на 10%.
  talent.divine_spirit:
    name: Божественный дух
    tooltip:
    - Наполняет цель силой Света, повышая дух на 17 на 30 мин..
  talent.improved_divine_spirit:
    name: Улучшенный божественный дух
    tooltip:
    - '"Божественный дух" и "Молитва духа" также дают цели бонус к исцелению и урону
      от заклинаний, равный 5% ее общего духа.'
    - '"Божественный дух" и "Молитва духа" также дают цели бонус к исцелению и урону
      от заклинаний, равный 10% ее общего духа.'
  talent.focused_power:
    name: Средоточие силы
    tooltip:
    - Ваши заклинания Кара, Взрыв разума и Массовое рассеяние получают дополнительную
      2% вероятность поражения. Кроме того, время применения Массового рассеяния сокращается
      на 0.5 сек.
    - Ваши заклинания Кара, Взрыв разума и Массовое рассеяние получают дополнительную
      4% вероятность поражения. Кроме того, время применения Массового рассеяния сокращается
      на 1 сек.
  talent.force_of_will:
    name: Сила воли
    tooltip:
    - Увеличение на 1% урона, наносимого заклинаниями, и на 1% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 2% урона, наносимого заклинаниями, и на 2% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 3% урона, наносимого заклинаниями, и на 3% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 4% урона, наносимого заклинаниями, и на 4% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 5% урона, наносимого заклинаниями, и на 5% вероятности критического
      эффекта атакующих заклинаний.
  talent.focused_will:
    name: Средоточие воли
    tooltip:
    - После получения критического удара, персонаж получает эффект "Средоточие воли",
      снижающий получаемый им урон на 2% и усиливающий действие лечебных эффектов
      на него на 4%. Суммируется до 3 раз. Время действия - 8 сек..
    - После получения критического удара, персонаж получает эффект "Средоточие воли",
      снижающий получаемый им урон на 3% и усиливающий действие лечебных эффектов
      на него на 7%. Суммируется до 3 раз. Время действия - 8 сек..
    - После получения критического удара, персонаж получает эффект "Средоточие воли",
      снижающий получаемый им урон на 4% и усиливающий действие лечебных эффектов
      на него на 10%. Суммируется до 3 раз. Время действия - 8 сек..
  talent.power_infusion:
    name: Придание сил
    tooltip:
    - Наполняет цель силой, повышая скорость применения заклинаний на 20% и снижая
      стоимость заклинаний на 20% на 15 сек..
  talent.reflective_shield:
    name: Отражающий щит
    tooltip:
    - 'Отражает 10% урона, поглощенного заклинанием "Слово силы: Щит", в сторону нападающего.
      Этот урон не создает угрозы.'
    - 'Отражает 20% урона, поглощенного заклинанием "Слово силы: Щит", в сторону нападающего.
      Этот урон не создает угрозы.'
    - 'Отражает 30% урона, поглощенного заклинанием "Слово силы: Щит", в сторону нападающего.
      Этот урон не создает угрозы.'
    - 'Отражает 40% урона, поглощенного заклинанием "Слово силы: Щит", в сторону нападающего.
      Этот урон не создает угрозы.'
    - 'Отражает 50% урона, поглощенного заклинанием "Слово силы: Щит", в сторону нападающего.
      Этот урон не создает угрозы.'
  talent.enlightenment:
    name: Просветление
    tooltip:
    - Повышение выносливости, интеллекта и духа на 1%.
    - Повышение выносливости, интеллекта и духа на 2%.
    - Повышение выносливости, интеллекта и духа на 3%.
    - Повышение выносливости, интеллекта и духа на 4%.
    - Повышение выносливости, интеллекта и духа на 5%.
  talent.pain_suppression:
    name: Подавление боли
    tooltip:
    - Мгновенно снижает угрозу, исходящую от дружественной цели, на 5%, снижает получаемый
      ей урон на 40% и повышает сопротивление рассеиванию магии на 65% на 8 сек..
  tree.2:
    name: Свет
  talent.healing_focus:
    name: Средоточие исцеления
    tooltip:
    - С 35%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 70%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
  talent.improved_renew:
    name: Улучшенное обновление
    tooltip:
    - Усиливает исцеление от "Обновления" на 5%.
    - Усиливает исцеление от "Обновления" на 10%.
    - Усиливает исцеление от "Обновления" на 15%.
  talent.holy_specialization:
    name: Cпециализация на магии Света
    tooltip:
    - Повышает вероятность критического эффекта заклинаний специализации "Свет" на
      1%.
    - Повышает вероятность критического эффекта заклинаний специализации "Свет" на
      2%.
    - Повышает вероятность критического эффекта заклинаний специализации "Свет" на
      3%.
    - Повышает вероятность критического эффекта заклинаний специализации "Свет" на
      4%.
    - Повышает вероятность критического эффекта заклинаний специализации "Свет" на
      5%.
  talent.spell_warding:
    name: Защита от заклинаний
    tooltip:
    - Снижение получаемого урона от заклинаний на 2%.
    - Снижение получаемого урона от заклинаний на 4%.
    - Снижение получаемого урона от заклинаний на 6%.
    - Снижение получаемого урона от заклинаний на 8%.
    - Снижение получаемого урона от заклинаний на 10%.
  talent.divine_fury:
    name: Божественное неистовство
    tooltip:
    - Сокращает время применения "Кары", "Священного огня", "Исцеления" и "Сильного
      исцеления" на 0.1 сек.
    - Сокращает время применения "Кары", "Священного огня", "Исцеления" и "Сильного
      исцеления" на 0.2 сек.
    - Сокращает время применения "Кары", "Священного огня", "Исцеления" и "Сильного
      исцеления" на 0.3 сек.
    - Сокращает время применения "Кары", "Священного огня", "Исцеления" и "Сильного
      исцеления" на 0.4 сек.
    - Сокращает время применения "Кары", "Священного огня", "Исцеления" и "Сильного
      исцеления" на 0.5 сек.
  talent.holy_nova:
    name: Кольцо Света
    tooltip:
    - Создает вокруг себя вспышку священного Света, нанося 29 в 34 ед. урона от светлой
      магии противникам в радиусе 10 м и восполняя 54 в 63 ед. здоровья участникам
      группы в радиусе 10 м. Эти эффекты не повышают уровень угрозы.
  talent.blessed_recovery:
    name: Благословленное восстановление
    tooltip:
    - Восполнение здоровья в течение 6 сек. после получении критического урона в ближнем
      или дальнем бою в объеме, равном 8% от полученного урона.
    - Восполнение здоровья в течение 6 сек. после получении критического урона в ближнем
      или дальнем бою в объеме, равном 16% от полученного урона.
    - Восполнение здоровья в течение 6 сек. после получении критического урона в ближнем
      или дальнем бою в объеме, равном 25% от полученного урона.
  talent.inspiration:
    name: Вдохновение
    tooltip:
    - Усиливает броню цели на 8% на 15 сек. после получения критического эффекта ваших
      "Быстрого исцеления", "Исцеления", "Сильного исцеления", "Связующего исцеления",
      "Молитвы исцеления" или "Круга исцеления".
    - Усиливает броню цели на 16% на 15 сек. после получения критического эффекта
      ваших "Быстрого исцеления", "Исцеления", "Сильного исцеления", "Связующего исцеления",
      "Молитвы исцеления" или "Круга исцеления".
    - Усиливает броню цели на 25% на 15 сек. после получения критического эффекта
      ваших "Быстрого исцеления", "Исцеления", "Сильного исцеления", "Связующего исцеления",
      "Молитвы исцеления" или "Круга исцеления".
  talent.holy_reach:
    name: Предел сил Света
    tooltip:
    - Увеличивает дальность действия "Кары" и "Священного огня", а также радиус действия
      "Молитвы исцеления" и "Кольца Света" на 10%.
    - Увеличивает дальность действия "Кары" и "Священного огня", а также радиус действия
      "Молитвы исцеления" и "Кольца Света" на 20%.
  talent.improved_healing:
    name: Улучшенное исцеление
    tooltip:
    - Снижает стоимость "Слабого исцеления", "Исцеления" и "Сильного исцеления" на
      5%.
    - Снижает стоимость "Слабого исцеления", "Исцеления" и "Сильного исцеления" на
      10%.
    - Снижает стоимость "Слабого исцеления", "Исцеления" и "Сильного исцеления" на
      15%.
  talent.searing_light:
    name: Опаляющий свет
    tooltip:
    - Увеличивает урон от заклинаний "Кара" и "Священный Огонь" на 5%.
    - Увеличивает урон от заклинаний "Кара" и "Священный Огонь" на 10%.
  talent.healing_prayers:
    name: Исцеляющие молитвы
    tooltip:
    - Снижает стоимость "Молитвы исцеления" и "Молитвы восстановления" на 10%.
    - Снижает стоимость "Молитвы исцеления" и "Молитвы восстановления" на 20%.
  talent.spirit_of_redemption:
    name: Дух воздаяния
    tooltip:
    - Повышает общий дух на 5%. После смерти жрец превращается в дух воздаяния на
      15 сек.. Дух не может двигаться, атаковать, быть атакованным или стать целью
      заклинаний и эффектов. В этом облике жрец может применять исцеляющие заклинания
      без затрат ресурсов. По истечении времени действия жрец умирает.
  talent.spiritual_guidance:
    name: Духовное направление
    tooltip:
    - Увеличивает эффекты исцеления и урон от заклинаний на 5% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 10% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 15% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 20% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 25% от вашего духа.
  talent.surge_of_light:
    name: Пробуждение Света
    tooltip:
    - При критическом ударе заклинанием возникает 25% шанс того, что следующее заклинание
      "Кара" будет прочитано моментально и без затрат маны, но нанести им критический
      удар будет невозможно. Длительность эффекта - 10 сек..
    - При критическом ударе заклинанием возникает 50% шанс того, что следующее заклинание
      "Кара" будет прочитано моментально и без затрат маны, но нанести им критический
      удар будет невозможно. Длительность эффекта - 10 сек..
  talent.spiritual_healing:
    name: Духовное исцеление
    tooltip:
    - Увеличивает на 2% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 4% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 6% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 8% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 10% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
  talent.holy_concentration:
    name: Светлое сосредоточение
    tooltip:
