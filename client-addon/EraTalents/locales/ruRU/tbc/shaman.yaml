schemaVersion: 1
locale: ruRU
era: tbc
class: shaman
texts:
  tree.1:
    name: Стихии
  talent.convection:
    name: Конвекция
    tooltip:
    - Снижает стоимость "Шока", "Молнии" и "Цепной молнии" на 2%.
    - Снижает стоимость "Шока", "Молнии" и "Цепной молнии" на 4%.
    - Снижает стоимость "Шока", "Молнии" и "Цепной молнии" на 6%.
    - Снижает стоимость "Шока", "Молнии" и "Цепной молнии" на 8%.
    - Снижает стоимость "Шока", "Молнии" и "Цепной молнии" на 10%.
  talent.concussion:
    name: Сотрясение мозга
    tooltip:
    - Увеличивает урон от "Молнии", "Цепной молнии" и заклинаний категории "Шок" на
      1%.
    - Увеличивает урон от "Молнии", "Цепной молнии" и заклинаний категории "Шок" на
      2%.
    - Увеличивает урон от "Молнии", "Цепной молнии" и заклинаний категории "Шок" на
      3%.
    - Увеличивает урон от "Молнии", "Цепной молнии" и заклинаний категории "Шок" на
      4%.
    - Увеличивает урон от "Молнии", "Цепной молнии" и заклинаний категории "Шок" на
      5%.
  talent.earth_s_grasp:
    name: Земной захват
    tooltip:
    - Увеличивает запас прочности тотема каменного когтя на 25% и радиус действия
      тотема оков земли на 10%.
    - Увеличивает запас прочности тотема каменного когтя на 50% и радиус действия
      тотема оков земли на 20%.
  talent.elemental_warding:
    name: Защита от стихий
    tooltip:
    - Уменьшает урон от эффектов огня, льда и природы на 4%.
    - Уменьшает урон от эффектов огня, льда и природы на 7%.
    - Уменьшает урон от эффектов огня, льда и природы на 10%.
  talent.call_of_flame:
    name: Зов пламени
    tooltip:
    - Увеличение на 5% урона, наносимого вашими тотемами огня.
    - Увеличение на 10% урона, наносимого вашими тотемами огня.
    - Увеличение на 15% урона, наносимого вашими тотемами огня.
  talent.elemental_focus:
    name: Концентрация стихий
    tooltip:
    - Критические эффекты наносящих урон заклинаний огня, магии льда или сил природы
      вводят вас в состояние "Ясность мысли". "Ясность мысли" снижает стоимость 2
      следующих наносящих урон заклинаний на 40%.
  talent.reverberation:
    name: Отзвук
    tooltip:
    - Уменьшает время восстановления заклинаний категории "Шок" на 0.2 сек.
    - Уменьшает время восстановления заклинаний категории "Шок" на 0.4 сек.
    - Уменьшает время восстановления заклинаний категории "Шок" на 0.6 сек.
    - Уменьшает время восстановления заклинаний категории "Шок" на 0.8 сек.
    - Уменьшает время восстановления заклинаний категории "Шок" на 1 сек.
  talent.call_of_thunder:
    name: Зов грома
    tooltip:
    - Повышает вероятность критического эффекта "Молнии" и "Цепной молнии" еще на
      1%.
    - Повышает вероятность критического эффекта "Молнии" и "Цепной молнии" еще на
      2%.
    - Повышает вероятность критического эффекта "Молнии" и "Цепной молнии" еще на
      3%.
    - Повышает вероятность критического эффекта "Молнии" и "Цепной молнии" еще на
      4%.
    - Повышает вероятность критического эффекта "Молнии" и "Цепной молнии" еще на
      5%.
  talent.improved_fire_totems:
    name: Улучшенный тотем огня
    tooltip:
    - Сокращает паузу перед активацией тотема кольца огня на 1 сек. Снижает угрозу,
      создаваемую тотемом магмы, на 25%.
    - Сокращает паузу перед активацией тотема кольца огня на 2 сек. Снижает угрозу,
      создаваемую тотемом магмы, на 50%.
  talent.eye_of_the_storm:
    name: Око шторма
    tooltip:
    - Вероятность 33%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек.. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
    - Вероятность 66%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек.. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
    - Вероятность 100%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек.. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
  talent.elemental_devastation:
    name: Опустошение Духов стихии
    tooltip:
    - Критические удары, нанесенные вашими атакующими заклинаниями, увеличивают ваш
      шанс нанести критический удар при атаке в ближнем бою на 3% на 10 сек..
    - Критические удары, нанесенные вашими атакующими заклинаниями, увеличивают ваш
      шанс нанести критический удар при атаке в ближнем бою на 6% на 10 сек..
    - Критические удары, нанесенные вашими атакующими заклинаниями, увеличивают ваш
      шанс нанести критический удар при атаке в ближнем бою на 9% на 10 сек..
  talent.storm_reach:
    name: Предел шторма
    tooltip:
    - Увеличивает дальность действия "Молнии" и "Цепной молнии" на 3 м.
    - Увеличивает дальность действия "Молнии" и "Цепной молнии" на 6 м.
  talent.elemental_fury:
    name: Неистовство стихий
    tooltip:
    - Усиливает бонус критического удара опаляющих тотемов, тотемов магмы, кольца
      огня, а также заклинаний огня, льда и природы на 100%.
  talent.unrelenting_storm:
    name: Неутихающая буря
    tooltip:
    - Восполнение маны в количестве 2% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 4% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 6% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 8% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 10% от вашего интеллекта раз в 5 секунд, даже
      при чтении заклинаний.
  talent.elemental_precision:
    name: Точность стихии
    tooltip:
    - Увеличение на 2% вероятности поражения заклинаниями огня, льда и сил природы
      и уменьшение создаваемой этими заклинаниями угрозы на 4%.
    - Увеличение на 4% вероятности поражения заклинаниями огня, льда и сил природы
      и уменьшение создаваемой этими заклинаниями угрозы на 7%.
    - Увеличение на 6% вероятности поражения заклинаниями огня, льда и сил природы
      и уменьшение создаваемой этими заклинаниями угрозы на 10%.
  talent.lightning_mastery:
    name: Покорение молнии
    tooltip:
    - Сокращает время применения "Молнии" и "Цепной молнии" на 0.1 сек.
    - Сокращает время применения "Молнии" и "Цепной молнии" на 0.2 сек.
    - Сокращает время применения "Молнии" и "Цепной молнии" на 0.3 сек.
    - Сокращает время применения "Молнии" и "Цепной молнии" на 0.4 сек.
    - Сокращает время применения "Молнии" и "Цепной молнии" на 0.5 сек.
  talent.elemental_mastery:
    name: Покорение стихий
    tooltip:
    - Увеличение вероятности критического эффекта последующего заклинания магии огня,
      льда или сил природы на 100% и снижение расхода маны на него на 100%.
  talent.elemental_shields:
    name: Щиты стихий
    tooltip:
    - Снижение на 2% вероятности получения критического урона от атак ближнего и дальнего
      боя.
    - Снижение на 4% вероятности получения критического урона от атак ближнего и дальнего
      боя.
    - Снижение на 6% вероятности получения критического урона от атак ближнего и дальнего
      боя.
  talent.lightning_overload:
    name: Электрическая перегрузка
    tooltip:
    - '"Молния" и "Цепная молния" с вероятностью 4% применяют второе такое же заклинание
      к той же цели без затрат ресурсов. Второе заклинание наносит вдвое меньше урона
      и не создает угрозы.'
    - '"Молния" и "Цепная молния" с вероятностью 8% применяют второе такое же заклинание
      к той же цели без затрат ресурсов. Второе заклинание наносит вдвое меньше урона
      и не создает угрозы.'
    - '"Молния" и "Цепная молния" с вероятностью 12% применяют второе такое же заклинание
      к той же цели без затрат ресурсов. Второе заклинание наносит вдвое меньше урона
      и не создает угрозы.'
    - '"Молния" и "Цепная молния" с вероятностью 16% применяют второе такое же заклинание
      к той же цели без затрат ресурсов. Второе заклинание наносит вдвое меньше урона
      и не создает угрозы.'
    - '"Молния" и "Цепная молния" с вероятностью 20% применяют второе такое же заклинание
      к той же цели без затрат ресурсов. Второе заклинание наносит вдвое меньше урона
      и не создает угрозы.'
  talent.totem_of_wrath:
    name: Тотем гнева
    tooltip:
    - Создает рядом с вами тотем с 5 ед. прочности и временем существования 2 мин..,
      который повышает вероятность попадания и критического эффекта заклинаний участников
      группы в радиусе 20 м на 3%.
  tree.2:
    name: Совершенствование
  talent.ancestral_knowledge:
    name: Знания предков
    tooltip:
    - Повышает ваш максимальный запас маны на 1%.
    - Повышает ваш максимальный запас маны на 2%.
    - Повышает ваш максимальный запас маны на 3%.
    - Повышает ваш максимальный запас маны на 4%.
    - Повышает ваш максимальный запас маны на 5%.
  talent.shield_specialization:
    name: Специализация на щитах
    tooltip:
    - Повышает вероятность блокирования атаки на 1% и показатель блокирования на 5%.
    - Повышает вероятность блокирования атаки на 2% и показатель блокирования на 10%.
    - Повышает вероятность блокирования атаки на 3% и показатель блокирования на 15%.
    - Повышает вероятность блокирования атаки на 4% и показатель блокирования на 20%.
    - Повышает вероятность блокирования атаки на 5% и показатель блокирования на 25%.
  talent.guardian_totems:
    name: Сторожевые тотемы
    tooltip:
    - Увеличивает объем урона, поглощаемого тотемами каменной кожи и стены ветра,
      на 10% и уменьшает время восстановления тотема заземления на 1 сек.
    - Увеличивает объем урона, поглощаемого тотемами каменной кожи и стены ветра,
      на 20% и уменьшает время восстановления тотема заземления на 2 сек.
  talent.thundering_strikes:
    name: Грохочущие удары
    tooltip:
    - Увеличение ваших шансов нанести критический удар оружием на 1%.
    - Увеличение ваших шансов нанести критический удар оружием на 2%.
    - Увеличение ваших шансов нанести критический удар оружием на 3%.
    - Увеличение ваших шансов нанести критический удар оружием на 4%.
    - Увеличение ваших шансов нанести критический удар оружием на 5%.
  talent.improved_ghost_wolf:
    name: Улучшенный призрачный волк
    tooltip:
    - Сокращает время применения "Призрачного волка" на 1 сек.
    - Сокращает время применения "Призрачного волка" на 2 сек.
  talent.improved_lightning_shield:
    name: Улучшенный щит молний
    tooltip:
    - Увеличивает урон от сфер "Щита молний" на 5%.
    - Увеличивает урон от сфер "Щита молний" на 10%.
    - Увеличивает урон от сфер "Щита молний" на 15%.
  talent.enhancing_totems:
    name: Улучшенные тотемы
    tooltip:
    - Усиливает эффекты тотемов силы земли и легкости воздуха на 8%.
    - Усиливает эффекты тотемов силы земли и легкости воздуха на 15%.
  talent.shamanistic_focus:
    name: Средоточие шамана
    tooltip:
    - Критические удары в ближнем бою вводят вас в состояние сосредоточения, снижающее
      стоимость следующего заклинания категории "Шок" на 60%.
  talent.anticipation:
    name: Предчувствие
    tooltip:
    - Увеличение вероятности уклонения от атак на 1%.
    - Увеличение вероятности уклонения от атак на 2%.
    - Увеличение вероятности уклонения от атак на 3%.
    - Увеличение вероятности уклонения от атак на 4%.
    - Увеличение вероятности уклонения от атак на 5%.
  talent.flurry:
    name: Шквал
    tooltip:
    - Увеличение на 10% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 15% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 20% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 25% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 30% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
  talent.toughness:
    name: Крепость
    tooltip:
    - Увеличивает бонус брони от предметов на 2% и снижает продолжительность действия
      наложенных на вас замедляющих эффектов на 10%.
    - Увеличивает бонус брони от предметов на 4% и снижает продолжительность действия
      наложенных на вас замедляющих эффектов на 20%.
    - Увеличивает бонус брони от предметов на 6% и снижает продолжительность действия
      наложенных на вас замедляющих эффектов на 30%.
    - Увеличивает бонус брони от предметов на 8% и снижает продолжительность действия
      наложенных на вас замедляющих эффектов на 40%.
    - Увеличивает бонус брони от предметов на 10% и снижает продолжительность действия
      наложенных на вас замедляющих эффектов на 50%.
  talent.improved_weapon_totems:
    name: Улучшенные тотемы чар
    tooltip:
    - Увеличивает бонус к силе атаки в ближнем бою от тотема неистовства ветра на
      15% и урон, наносимый тотемом языка пламени, на 6%.
    - Увеличивает бонус к силе атаки в ближнем бою от тотема неистовства ветра на
      30% и урон, наносимый тотемом языка пламени, на 12%.
  talent.spirit_weapons:
    name: Духовное оружие
    tooltip:
    - Вероятность отбить атаки противника в ближнем бою и снижение угрозы от атак
      игрока на 30%.
  talent.elemental_weapons:
    name: Оружие стихий
    tooltip:
    - Увеличивает урон от "Оружия камнедробителя" на 7%, бонус от "Оружия неистовства
      ветра" на 13%, а урон от "Оружия языка пламени" и "Ледяного клейма" – на 5%.
    - Увеличивает урон от "Оружия камнедробителя" на 14%, бонус от "Оружия неистовства
      ветра" на 27%, а урон от "Оружия языка пламени" и "Ледяного клейма" – на 10%.
    - Увеличивает урон от "Оружия камнедробителя" на 20%, бонус от "Оружия неистовства
      ветра" на 40%, а урон от "Оружия языка пламени" и "Ледяного клейма" – на 15%.
  talent.mental_quickness:
    name: Ментальная скорость
    tooltip:
    - Снижает стоимость мгновенно применяемых заклинаний шамана на 2%, а также увеличивает
      урон и объем исцеления от заклинаний на 10% силы атаки.
    - Снижает стоимость мгновенно применяемых заклинаний шамана на 4%, а также увеличивает
      урон и объем исцеления от заклинаний на 20% силы атаки.
    - Снижает стоимость мгновенно применяемых заклинаний шамана на 6%, а также увеличивает
      урон и объем исцеления от заклинаний на 30% силы атаки.
  talent.weapon_mastery:
    name: Мастеркое владение оружием
    tooltip:
    - Увеличение наносимого урона от оружия на 2%.
    - Увеличение наносимого урона от оружия на 4%.
    - Увеличение наносимого урона от оружия на 6%.
    - Увеличение наносимого урона от оружия на 8%.
    - Увеличение наносимого урона от оружия на 10%.
  talent.dual_wield_specialization:
    name: Специализация на бое двумя оружиями
    tooltip:
    - Увеличение на 2% вероятности нанесения удара при использовании оружия в обоих
      руках.
    - Увеличение на 4% вероятности нанесения удара при использовании оружия в обоих
      руках.
    - Увеличение на 6% вероятности нанесения удара при использовании оружия в обоих
      руках.
  talent.dual_wield:
    name: Бой двумя оружиями
    tooltip:
    - Позволяет брать в левую руку одноручное оружие и оружие для правой руки.
  talent.stormstrike:
    name: Удар бури
    tooltip:
    - Мгновенная атака обоими оружиями. Кроме того, две последующих атаки сил природы
      нанесут цели на 20%. больше урона. Время действия – 12 сек..
  talent.unleashed_rage:
    name: Высвобожденная ярость
    tooltip:
    - Ваши критические удары в ближнем бою увеличивают силу атаки всех участников
