schemaVersion: 1
locale: ruRU
era: tbc
class: druid
texts:
  tree.1:
    name: Баланс
  talent.starlight_wrath:
    name: Звездный гнев
    tooltip:
    - Сокращает время применения "Гнева" и "Звездного огня" на 0.1 сек.
    - Сокращает время применения "Гнева" и "Звездного огня" на 0.2 сек.
    - Сокращает время применения "Гнева" и "Звездного огня" на 0.3 сек.
    - Сокращает время применения "Гнева" и "Звездного огня" на 0.4 сек.
    - Сокращает время применения "Гнева" и "Звездного огня" на 0.5 сек.
  talent.nature_s_grasp:
    name: Природный захват
    tooltip:
    - Пока действует этот эффект, каждый раз, когда противники атакуют вас, их с вероятностью
      35% поражает "Гнев деревьев" 1-го уровня. Действует только вне помещений. Максимум
      зарядов – 1. Время действия – 45 сек.
  talent.improved_nature_s_grasp:
    name: Улучшенный природный захват
    tooltip:
    - Повышение шанса опутать противника заклинанием "Природный захват" на 15%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 30%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 45%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 65%.
  talent.control_of_nature:
    name: Улучшенный гнев деревьев
    tooltip:
    - С вероятностью 40% применение "Гнева деревьев" и "Смерча" не прерывается при
      получении урона.
    - С вероятностью 70% применение "Гнева деревьев" и "Смерча" не прерывается при
      получении урона.
    - С вероятностью 100% применение "Гнева деревьев" и "Смерча" не прерывается при
      получении урона.
  talent.focused_starlight:
    name: Направленный звездный свет
    tooltip:
    - Повышает вероятность критического эффекта "Гнева" и "Звездного огня" на 2%.
    - Повышает вероятность критического эффекта "Гнева" и "Звездного огня" на 4%.
  talent.improved_moonfire:
    name: Улучшенный лунный огонь
    tooltip:
    - Увеличивает урон и повышает вероятность критического эффекта "Лунного огня"
      на 5%.
    - Увеличивает урон и повышает вероятность критического эффекта "Лунного огня"
      на 10%.
  talent.brambles:
    name: Острые колючки
    tooltip:
    - Увеличивает урон от "Шипов" и "Гнева деревьев" на 25%.
    - Увеличивает урон от "Шипов" и "Гнева деревьев" на 50%.
    - Увеличивает урон от "Шипов" и "Гнева деревьев" на 75%.
  talent.insect_swarm:
    name: Рой насекомых
    tooltip:
    - Рой насекомых, снижающий вероятность нанесения удара на 2% и наносящий 108 ед.
      урона от сил природы за 12 сек.
  talent.nature_s_reach:
    name: Предел сил Природы
    tooltip:
    - Увеличивает дальность действия заклинаний специализации "Баланс" и "Волшебного
      огня" на 10%.
    - Увеличивает дальность действия заклинаний специализации "Баланс" и "Волшебного
      огня" на 20%.
  talent.vengeance:
    name: Отмщение
    tooltip:
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 20%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 40%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 60%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 80%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 100%.
  talent.celestial_focus:
    name: Средоточие божественности
    tooltip:
    - '"Звездный огонь" с вероятностью 5% оглушает цель на 3 сек. Повышает вероятность
      того, что применение "Гнева" не прервется при получении урона, на 25%.'
    - '"Звездный огонь" с вероятностью 10% оглушает цель на 3 сек. Повышает вероятность
      того, что применение "Гнева" не прервется при получении урона, на 50%.'
    - '"Звездный огонь" с вероятностью 15% оглушает цель на 3 сек. Повышает вероятность
      того, что применение "Гнева" не прервется при получении урона, на 70%.'
  talent.lunar_guidance:
    name: Покровительство луны
    tooltip:
    - Увеличивает урон от заклинаний и усиливает исцеление на 8% от показателя интеллекта.
    - Увеличивает урон от заклинаний и усиливает исцеление на 16% от показателя интеллекта.
    - Увеличивает урон от заклинаний и усиливает исцеление на 25% от показателя интеллекта.
  talent.nature_s_grace:
    name: Благоволение природы
    tooltip:
    - Все критические удары заклинаниями одаряют вас благословением Природы, снижая
      время наложения следующего заклинания на 0.5 сек.
  talent.moonglow:
    name: Лунное сияние
    tooltip:
    - Снижает стоимость "Лунного огня", "Звездного огня", "Гнева", "Целительного прикосновения",
      "Восстановления" и "Омоложения" на 3%.
    - Снижает стоимость "Лунного огня", "Звездного огня", "Гнева", "Целительного прикосновения",
      "Восстановления" и "Омоложения" на 6%.
    - Снижает стоимость "Лунного огня", "Звездного огня", "Гнева", "Целительного прикосновения",
      "Восстановления" и "Омоложения" на 9%.
  talent.moonfury:
    name: Лунное неистовство
    tooltip:
    - Увеличивает урон от "Звездного огня", "Лунного огня" и "Гнева" на 2%.
    - Увеличивает урон от "Звездного огня", "Лунного огня" и "Гнева" на 4%.
    - Увеличивает урон от "Звездного огня", "Лунного огня" и "Гнева" на 6%.
    - Увеличивает урон от "Звездного огня", "Лунного огня" и "Гнева" на 8%.
    - Увеличивает урон от "Звездного огня", "Лунного огня" и "Гнева" на 10%.
  talent.balance_of_power:
    name: Баланс сил
    tooltip:
    - Увеличение вероятности поражения заклинанием и снижение вероятности быть пораженным
      заклинанием на 2%.
    - Увеличение вероятности поражения заклинанием и снижение вероятности быть пораженным
      заклинанием на 4%.
  talent.dreamstate:
    name: Состояние сна
    tooltip:
    - Восполнение маны в количестве 4% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 7% от вашего интеллекта раз в 5 секунд, даже при
      чтении заклинаний.
    - Восполнение маны в количестве 10% от вашего интеллекта раз в 5 секунд, даже
      при чтении заклинаний.
  talent.moonkin_form:
    name: Облик лунного совуха
    tooltip:
    - Вы принимаете облик лунного совуха. В этом облике бонус к броне от предметов увеличивается
      на 370%, а вероятность критического эффекта заклинаний участников группы и рейда
      в радиусе 100 м повышается на 5%. В облике лунного совуха нельзя применять исцеляющие
      и воскрешающие заклинания. Смена облика освобождает от эффектов превращения и
      затрудняющих передвижение эффектов.
  talent.improved_faerie_fire:
    name: Улучшенный волшебный огонь
    tooltip:
    - '"Волшебный огонь" также повышает вероятность того, что цель будет поражена
      атакой в ближнем или дальнем бою, на 1%.'
    - '"Волшебный огонь" также повышает вероятность того, что цель будет поражена
      атакой в ближнем или дальнем бою, на 2%.'
    - '"Волшебный огонь" также повышает вероятность того, что цель будет поражена
      атакой в ближнем или дальнем бою, на 3%.'
  talent.wrath_of_cenarius:
    name: Гнев Кенария
    tooltip:
    - '"Звездный огонь" получает на 4% больше бонусов к урону, а "Гнев" – на 2%.'
    - '"Звездный огонь" получает на 8% больше бонусов к урону, а "Гнев" – на 4%.'
    - '"Звездный огонь" получает на 12% больше бонусов к урону, а "Гнев" – на 6%.'
    - '"Звездный огонь" получает на 16% больше бонусов к урону, а "Гнев" – на 8%.'
    - '"Звездный огонь" получает на 20% больше бонусов к урону, а "Гнев" – на 10%.'
  talent.force_of_nature:
    name: Сила Природы
    tooltip:
    - Призывает 3 древней, которые будут атаковать противников в течение 30 сек.
  tree.2:
    name: Сила зверя
  talent.ferocity:
    name: Свирепость
    tooltip:
    - Снижает стоимость "Трепки", "Размаха", "Цапнуть", "Глубокой раны" и "Увечья" на
      1 ед.
    - Снижает стоимость "Трепки", "Размаха", "Цапнуть", "Глубокой раны" и "Увечья" на
      2 ед.
    - Снижает стоимость "Трепки", "Размаха", "Цапнуть", "Глубокой раны" и "Увечья" на
      3 ед.
    - Снижает стоимость "Трепки", "Размаха", "Цапнуть", "Глубокой раны" и "Увечья" на
      4 ед.
    - Снижает стоимость "Трепки", "Размаха", "Цапнуть", "Глубокой раны" и "Увечья" на
      5 ед.
  talent.feral_aggression:
    name: Звериная агрессия
    tooltip:
    - '"Устрашающий рев" снижает силу атаки противника еще на 8%. "Свирепый укус"
      наносит на 3% больше урона.'
    - '"Устрашающий рев" снижает силу атаки противника еще на 16%. "Свирепый укус"
      наносит на 6% больше урона.'
    - '"Устрашающий рев" снижает силу атаки противника еще на 24%. "Свирепый укус"
      наносит на 9% больше урона.'
    - '"Устрашающий рев" снижает силу атаки противника еще на 32%. "Свирепый укус"
      наносит на 12% больше урона.'
    - '"Устрашающий рев" снижает силу атаки противника еще на 40%. "Свирепый укус"
      наносит на 15% больше урона.'
  talent.feral_instinct:
    name: Животный инстинкт
    tooltip:
    - Повышает уровень создаваемой угрозы в облике медведя или лютого медведя на 5%
      и снижает вероятность того, что противники обнаружат вас, пока вы крадетесь.
    - Повышает уровень создаваемой угрозы в облике медведя или лютого медведя на 10%
      и снижает вероятность того, что противники обнаружат вас, пока вы крадетесь.
    - Повышает уровень создаваемой угрозы в облике медведя или лютого медведя на 15%
      и снижает вероятность того, что противники обнаружат вас, пока вы крадетесь.
  talent.brutal_impact:
    name: Жестокий удар
    tooltip:
    - Увеличивает длительность эффекта оглушения от ваших способностей "Оглушить"
      и "Наскок" на 0.5 сек.
    - Увеличивает длительность эффекта оглушения от ваших способностей "Оглушить"
      и "Наскок" на 1 сек.
  talent.thick_hide:
    name: Плотная шкура
    tooltip:
    - Увеличение на 4% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 7% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 10% эффективности усиления брони за счет носимой экипировки.
  talent.feral_swiftness:
    name: Звериная скорость
    tooltip:
    - Увеличение на 15% скорости передвижения вне помещений в облике кошки, а также
      увеличение на 2% вероятности уклонения от атак в облике кошки.
    - Увеличение на 30% скорости передвижения вне помещений в облике кошки, а также
      увеличение на 4% вероятности уклонения от атак в облике кошки.
  talent.feral_charge:
    name: Звериная атака
    tooltip:
    - Бросается к противнику, обездвиживая его и прерывая применение заклинаний на
      4 сек.
  talent.sharpened_claws:
    name: Острые когти
    tooltip:
    - Увеличение на 2% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
    - Увеличение на 4% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
    - Увеличение на 6% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
  talent.shredding_attacks:
    name: Растерзать противника
    tooltip:
    - Снижение расхода энергии на способность "Полоснуть" на 9 ед., и снижение расхода
      ярости на способность "Растерзать" на 1 ед.
    - Снижение расхода энергии на способность "Полоснуть" на 18 ед., и снижение расхода
      ярости на способность "Растерзать" на 2 ед.
  talent.predatory_strikes:
    name: Удары хищника
    tooltip:
    - Увеличивает силу атаки ближнего боя на 50% от уровня в облике кошки, медведя или
      лютого медведя.
    - Увеличивает силу атаки ближнего боя на 100% от уровня в облике кошки, медведя
      или лютого медведя.
    - Увеличивает силу атаки ближнего боя на 150% от уровня в облике кошки, медведя
      или лютого медведя.
  talent.primal_fury:
    name: Изначальное неистовство
    tooltip:
    - С вероятностью 50% вы получаете на 5 ед. больше ярости, нанося критические удары
      в облике медведя или лютого медведя. С вероятностью 50% критические эффекты
      способностей облика кошки, которые продлевают серию приемов, дают еще один прием.
    - С вероятностью 100% вы получаете на 5 ед. больше ярости, нанося критические
      удары в облике медведя или лютого медведя. С вероятностью 100% критические эффекты
      способностей облика кошки, которые продлевают серию приемов, дают еще один прием.
  talent.savage_fury:
    name: Бешеное неистовство
    tooltip:
    - Увеличивает урон от "Цапнуть", "Глубокой раны" и "Увечья" (в облике кошки) на
      10%.
    - Увеличивает урон от "Цапнуть", "Глубокой раны" и "Увечья" (в облике кошки) на
      20%.
  talent.faerie_fire_feral:
    name: Волшебный огонь (сила зверя)
    tooltip:
    - Снижает броню цели на 5% на 5 мин. Пока действует эффект, цель не может становиться
      незаметной или невидимой.
  talent.nurturing_instinct:
    name: Материнский инстинкт
    tooltip:
    - Увеличивает эффективность ваших исцеляющих заклинаний на величину до 50% вашей
      ловкости.
    - Увеличивает эффективность ваших исцеляющих заклинаний на величину до 100% вашей
      ловкости.
  talent.heart_of_the_wild:
    name: Сердце дикой природы
    tooltip:
    - Повышение интеллекта на 4%, а также повышение на 4% выносливости в облике медведя
      и лютого медведя, и на 2% силы атаки в облике кошки.
    - Повышение интеллекта на 8%, а также повышение на 8% выносливости в облике медведя
      и лютого медведя, и на 4% силы атаки в облике кошки.
    - Повышение интеллекта на 12%, а также повышение на 12% выносливости в облике
      медведя и лютого медведя, и на 6% силы атаки в облике кошки.
    - Повышение интеллекта на 16%, а также повышение на 16% выносливости в облике
      медведя и лютого медведя, и на 8% силы атаки в облике кошки.
    - Повышение интеллекта на 20%, а также повышение на 20% выносливости в облике
      медведя и лютого медведя, и на 10% силы атаки в облике кошки.
  talent.survival_of_the_fittest:
    name: Выживание сильнейших
    tooltip:
    - Увеличивает все характеристики на 1% и уменьшает вероятность получить критический
      удар в ближнем бою на 1%.
    - Увеличивает все характеристики на 2% и уменьшает вероятность получить критический
      удар в ближнем бою на 2%.
    - Увеличивает все характеристики на 3% и уменьшает вероятность получить критический
      удар в ближнем бою на 3%.
  talent.primal_tenacity:
    name: Изначальная стойкость
    tooltip:
    - Повышает вероятность сопротивления страху и оглушению на 5%.
    - Повышает вероятность сопротивления страху и оглушению на 10%.
    - Повышает вероятность сопротивления страху и оглушению на 15%.
  talent.leader_of_the_pack:
    name: Вожак стаи
    tooltip:
    - В обличье кошки, медведя или лютого медведя способность "Вожак стаи" повышает
      вероятность нанесения критического удара всеми членами группы в радиусе 45 м.
      как в дальнем, так и в ближнем бою на 5%.
  talent.improved_leader_of_the_pack:
    name: Улучшенный вожак стаи
    tooltip:
    - Способность "Вожак стаи" также позволяет находящимся под ее действием целям восполнять
      2% максимального запаса здоровья при нанесении критического удара в ближнем или
      дальнем бою. Эффект срабатывает не чаще одного раза в 6 сек.
    - Способность "Вожак стаи" также позволяет находящимся под ее действием целям восполнять
      4% максимального запаса здоровья при нанесении критического удара в ближнем или
      дальнем бою. Эффект срабатывает не чаще одного раза в 6 сек.
  talent.predatory_instincts:
    name: Хищный инстинкт
    tooltip:
