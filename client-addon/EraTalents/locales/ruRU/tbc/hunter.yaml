schemaVersion: 1
locale: ruRU
era: tbc
class: hunter
texts:
  tree.1:
    name: Повелитель зверей
  talent.improved_aspect_of_the_hawk:
    name: Улучшенный дух ястреба
    tooltip:
    - Пока действует "Дух ястреба", обычные атаки в дальнем бою с вероятностью 10%
      повышают скорость атаки в дальнем бою на 3% на 12 сек..
    - Пока действует "Дух ястреба", обычные атаки в дальнем бою с вероятностью 10%
      повышают скорость атаки в дальнем бою на 6% на 12 сек..
    - Пока действует "Дух ястреба", обычные атаки в дальнем бою с вероятностью 10%
      повышают скорость атаки в дальнем бою на 9% на 12 сек..
    - Пока действует "Дух ястреба", обычные атаки в дальнем бою с вероятностью 10%
      повышают скорость атаки в дальнем бою на 12% на 12 сек..
    - Пока действует "Дух ястреба", обычные атаки в дальнем бою с вероятностью 10%
      повышают скорость атаки в дальнем бою на 15% на 12 сек..
  talent.endurance_training:
    name: Тренировка стойкости
    tooltip:
    - Увеличение запаса здоровья питомца на 2% и охотника на 1%.
    - Увеличение запаса здоровья питомца на 4% и охотника на 2%.
    - Увеличение запаса здоровья питомца на 6% и охотника на 3%.
    - Увеличение запаса здоровья питомца на 8% и охотника на 4%.
    - Увеличение запаса здоровья питомца на 10% и охотника на 5%.
  talent.focused_fire:
    name: Средоточие огня
    tooltip:
    - Пока ваш питомец активен, весь наносимый вами урон увеличивается на 1%, а шанс
      нанести критический удар способностью Команда "Взять!" увеличивается на 10%.
    - Пока ваш питомец активен, весь наносимый вами урон увеличивается на 2%, а шанс
      нанести критический удар способностью Команда "Взять!" увеличивается на 20%.
  talent.improved_aspect_of_the_monkey:
    name: Улучшенный дух обезьяны
    tooltip:
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 2%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 4%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 6%.
  talent.thick_hide:
    name: Плотная шкура
    tooltip:
    - Увеличивает рейтинг брони ваших питомцев на 7% и увеличение брони от использования
      предметов на 4%.
    - Увеличивает рейтинг брони ваших питомцев на 14% и увеличение брони от использования
      предметов на 7%.
    - Увеличивает рейтинг брони ваших питомцев на 20% и увеличение брони от использования
      предметов на 10%.
  talent.improved_revive_pet:
    name: Улучшенное воскрешение питомца
    tooltip:
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 3 сек., расход
      маны уменьшается на 20%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 15%.
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 6 сек., расход
      маны уменьшается на 40%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 30%.
  talent.pathfinding:
    name: Знание троп
    tooltip:
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 4%.
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 8%.
  talent.bestial_swiftness:
    name: Звериная стремительность
    tooltip:
    - Увеличение скорости передвижения ваших питомцев вне помещений на 30%.
  talent.unleashed_fury:
    name: Неудержимое неистовство
    tooltip:
    - Увеличение урона, наносимого вашими питомцами, на 4%.
    - Увеличение урона, наносимого вашими питомцами, на 8%.
    - Увеличение урона, наносимого вашими питомцами, на 12%.
    - Увеличение урона, наносимого вашими питомцами, на 16%.
    - Увеличение урона, наносимого вашими питомцами, на 20%.
  talent.improved_mend_pet:
    name: Улучшенное лечение питомца
    tooltip:
    - Снижает стоимость "Лечения питомца" на 10% и позволяет ему с вероятностью 25%
      снимать с питомца 1 эффект проклятия, болезни, магии или отравления с каждым
      тактом.
    - Снижает стоимость "Лечения питомца" на 20% и позволяет ему с вероятностью 50%
      снимать с питомца 1 эффект проклятия, болезни, магии или отравления с каждым
      тактом.
  talent.ferocity:
    name: Свирепость
    tooltip:
    - Повышает вероятность критического удара питомца на 2%.
    - Повышает вероятность критического удара питомца на 4%.
    - Повышает вероятность критического удара питомца на 6%.
    - Повышает вероятность критического удара питомца на 8%.
    - Повышает вероятность критического удара питомца на 10%.
  talent.spirit_bond:
    name: Узы духа
    tooltip:
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 1% общего объема
      здоровья раз в 10 сек.
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 2% общего объема
      здоровья раз в 10 сек.
  talent.intimidation:
    name: Устрашение
    tooltip:
    - Приказ вашему питомцу запугивать цель в следующей успешной атаке ближнего боя,
      что вызывает высокий уровень угрозы и оглушает цель на 3 сек..
  talent.bestial_discipline:
    name: Беспрекословное послушание
    tooltip:
    - Ускорение восстановления тонуса ваших питомцев на 50%.
    - Ускорение восстановления тонуса ваших питомцев на 100%.
  talent.animal_handler:
    name: Опытный дрессировщик
    tooltip:
    - Увеличение на 4% скорости передвижения верхом и на 2% вероятности питомца нанести
      удар. Эффект увеличения скорости передвижения верхом не суммируется с другими.
    - Увеличение на 8% скорости передвижения верхом и на 4% вероятности питомца нанести
      удар. Эффект увеличения скорости передвижения верхом не суммируется с другими.
  talent.frenzy:
    name: Исступление
    tooltip:
    - Дает вашему питомцу 20% шанс увеличить скорость атаки на 30% в течение 8 сек.
      после нанесения критического удара.
    - Дает вашему питомцу 40% шанс увеличить скорость атаки на 30% в течение 8 сек.
      после нанесения критического удара.
    - Дает вашему питомцу 60% шанс увеличить скорость атаки на 30% в течение 8 сек.
      после нанесения критического удара.
    - Дает вашему питомцу 80% шанс увеличить скорость атаки на 30% в течение 8 сек.
      после нанесения критического удара.
    - Дает вашему питомцу 100% шанс увеличить скорость атаки на 30% в течение 8 сек.
      после нанесения критического удара.
  talent.ferocious_inspiration:
    name: Свирепое воодушевление
    tooltip:
    - Когда ваш питомец совершает критический удар, для всех участников группы урон
      всех видов увеличивается на 1% в течение 10 сек..
    - Когда ваш питомец совершает критический удар, урон, наносимый всеми участниками
      группы, увеличивается на 2% в течение 10 сек..
    - Когда ваш питомец совершает критический удар, урон, наносимый всеми участниками
      группы, увеличивается на 3% в течение 10 сек..
  talent.bestial_wrath:
    name: Звериный гнев
    tooltip:
    - Приводит питомца в ярость, увеличивая наносимый им урон на 50% на 18 сек.. В
      состоянии ярости питомец не знает ни страха, ни жалости, и только смерть может
      остановить его.
  talent.catlike_reflexes:
    name: Кошачьи рефлексы
    tooltip:
    - Увеличение на 1% вероятности уклонения от атак, а также на 3% вероятности уклонения
      от атак у вашего питомца.
    - Увеличение на 2% вероятности уклонения от атак, а также на 6% вероятности уклонения
      от атак у вашего питомца.
    - Увеличение на 3% вероятности уклонения от атак, а также на 9% вероятности уклонения
      от атак у вашего питомца.
  talent.serpent_s_swiftness:
    name: Быстрота змеи
    tooltip:
    - Повышение скорости атаки в дальнем бою на 4%, а скорости ближнего боя питомца
      - на 4%.
    - Повышение скорости атаки в дальнем бою на 8%, а скорости ближнего боя питомца
      - на 8%.
    - Повышение скорости атаки в дальнем бою на 12%, а скорости ближнего боя питомца
      - на 12%.
    - Повышение скорости атаки в дальнем бою на 16%, а скорости ближнего боя питомца
      - на 16%.
    - Повышение скорости атаки в дальнем бою на 20%, а скорости ближнего боя питомца
      - на 20%.
  talent.the_beast_within:
    name: Звериная сущность
    tooltip:
    - Когда на вашего питомца действует "Звериный гнев", вы также впадаете в ярость.
      Наносимый урон увеличивается на 10%, а стоимость заклинаний снижается на 20%
      на 18 сек.. В этом состоянии вы не чувствуете ни страха, ни жалости, и только
      смерть может остановить вас.
  tree.2:
    name: Стрельба
  talent.improved_concussive_shot:
    name: Улучшенный контузящий выстрел
    tooltip:
    - Повышение до 4% вероятности оглушения противника на 3 сек. при использовании
      способности "Шокирующий выстрел".
    - Повышение до 8% вероятности оглушения противника на 3 сек. при использовании
      способности "Шокирующий выстрел".
    - Повышение до 12% вероятности оглушения противника на 3 сек. при использовании
      способности "Шокирующий выстрел".
    - Повышение до 16% вероятности оглушения противника на 3 сек. при использовании
      способности "Шокирующий выстрел".
    - Повышение до 20% вероятности оглушения противника на 3 сек. при использовании
      способности "Шокирующий выстрел".
  talent.lethal_shots:
    name: Стрельба на поражение
    tooltip:
    - Увеличение на 1% вероятности нанесения критического урона при использовании
      оружия дальнего боя.
    - Увеличение на 2% вероятности нанесения критического урона при использовании
      оружия дальнего боя.
    - Увеличение на 3% вероятности нанесения критического урона при использовании
      оружия дальнего боя.
    - Увеличение на 4% вероятности нанесения критического урона при использовании
      оружия дальнего боя.
    - Увеличение на 5% вероятности нанесения критического урона при использовании
      оружия дальнего боя.
  talent.improved_hunter_s_mark:
    name: Улучшенная метка охотника
    tooltip:
    - '"Метка охотника" также усиливает атаки ближнего боя с эффективностью 20%.'
    - '"Метка охотника" также усиливает атаки ближнего боя с эффективностью 40%.'
    - '"Метка охотника" также усиливает атаки ближнего боя с эффективностью 60%.'
    - '"Метка охотника" также усиливает атаки ближнего боя с эффективностью 80%.'
    - '"Метка охотника" также усиливает атаки ближнего боя с эффективностью 100%.'
  talent.efficiency:
    name: Эффективность
    tooltip:
    - Снижает стоимость способностей категорий "Выстрел" и "Жало" на 2%.
    - Снижает стоимость способностей категорий "Выстрел" и "Жало" на 4%.
    - Снижает стоимость способностей категорий "Выстрел" и "Жало" на 6%.
    - Снижает стоимость способностей категорий "Выстрел" и "Жало" на 8%.
    - Снижает стоимость способностей категорий "Выстрел" и "Жало" на 10%.
  talent.go_for_the_throat:
    name: Хватай за горло!
    tooltip:
    - Критический урон, наносимый вами в дальнем бою, восстанавливает вашему питомцу
      25 тонуса.
    - Критический урон, наносимый вами в дальнем бою, восстанавливает вашему питомцу
      50 тонуса.
  talent.improved_arcane_shot:
    name: Улучшенный чародейский выстрел
    tooltip:
    - Уменьшает время восстановления "Чародейского выстрела" на 0.2 сек.
    - Уменьшает время восстановления "Чародейского выстрела" на 0.4 сек.
    - Уменьшает время восстановления "Чародейского выстрела" на 0.6 сек.
    - Уменьшает время восстановления "Чародейского выстрела" на 0.8 сек.
    - Уменьшает время восстановления "Чародейского выстрела" на 1 сек.
  talent.aimed_shot:
    name: Прицельный выстрел
    tooltip:
    - Увеличивает урон в дальнем бою на 70 и понижает эффективность применяемого к
      цели лечения на 50%. Время действия – 10 сек..
  talent.rapid_killing:
    name: Быстрые убийства
    tooltip:
    - Уменьшает время восстановления "Быстрой стрельбы" на 1 мин. Следующий после
      убийства, которое дает опыт или честь, "Прицельный выстрел", "Чародейский выстрел"
      или автоматический выстрел наносит на 10% больше урона. Время действия – 20
      сек..
    - Уменьшает время восстановления "Быстрой стрельбы" на 2 мин. Следующий после
      убийства, которое дает опыт или честь, "Прицельный выстрел", "Чародейский выстрел"
      или автоматический выстрел наносит на 20% больше урона. Время действия – 20
      сек..
  talent.improved_stings:
    name: Смертельные укусы
    tooltip:
    - Увеличивает урон от "Укуса змеи" и "Укуса виверны" на 6% и объем маны, похищаемой
      "Укусом гадюки", на 6%. Снижает вероятность рассеивания заклинаний категории
      "Укус" на 6%.
    - Увеличивает урон от "Укуса змеи" и "Укуса виверны" на 12% и объем маны, похищаемой
      "Укусом гадюки", на 12%. Снижает вероятность рассеивания заклинаний категории
      "Укус" на 12%.
    - Увеличивает урон от "Укуса змеи" и "Укуса виверны" на 18% и объем маны, похищаемой
      "Укусом гадюки", на 18%. Снижает вероятность рассеивания заклинаний категории
      "Укус" на 18%.
    - Увеличивает урон от "Укуса змеи" и "Укуса виверны" на 24% и объем маны, похищаемой
      "Укусом гадюки", на 24%. Снижает вероятность рассеивания заклинаний категории
      "Укус" на 24%.
    - Увеличивает урон от "Укуса змеи" и "Укуса виверны" на 30% и объем маны, похищаемой
      "Укусом гадюки", на 30%. Снижает вероятность рассеивания заклинаний категории
      "Укус" на 30%.
  talent.mortal_shots:
    name: Смертоносные выстрелы
    tooltip:
    - Повышение на 6% величины критического урона при атаках дальнего боя.
    - Повышение на 12% величины критического урона при атаках дальнего боя.
    - Повышение на 18% величины критического урона при атаках дальнего боя.
    - Повышение на 24% величины критического урона при атаках дальнего боя.
    - Повышение на 30% величины критического урона при атаках дальнего боя.
  talent.concussive_barrage:
    name: Шокирующий залп
    tooltip:
    - Каждый ваш автоматический выстрел получает 2% шанс замедлить цель на 4 сек..
    - Каждый ваш автоматический выстрел получает 4% шанс замедлить цель на 4 сек..
    - Каждый ваш автоматический выстрел получает 6% шанс замедлить цель на 4 сек..
  talent.scatter_shot:
    name: Дезориентирующий выстрел
    tooltip:
    - Выстрел на короткой дистанции с нанесением цели 50% урона от оружия и лишением
      ее ощущения направления на 4 сек.. Любой нанесенный урон отменяет действие эффекта.
  talent.barrage:
    name: Заградительный огонь
    tooltip:
    - Увеличивает урон от "Залпа" и "Града стрел" на 4%.
    - Увеличивает урон от "Залпа" и "Града стрел" на 8%.
    - Увеличивает урон от "Залпа" и "Града стрел" на 12%.
  talent.combat_experience:
    name: Боевой опыт
    tooltip:
    - Повышение ловкости на 1% и интеллекта на 3%.
    - Повышение ловкости на 2% и интеллекта на 6%.
  talent.ranged_weapon_specialization:
    name: Специализация на оружии дальнего боя
    tooltip:
    - Повешение урона, наносимого оружием дальнего боя, на 1%.
    - Повешение урона, наносимого оружием дальнего боя, на 2%.
    - Повешение урона, наносимого оружием дальнего боя, на 3%.
    - Повешение урона, наносимого оружием дальнего боя, на 4%.
    - Повешение урона, наносимого оружием дальнего боя, на 5%.
  talent.careful_aim:
    name: Верная цель
    tooltip:
    - Повышает силу атаки дальнего боя на 15% от вашего интеллекта.
    - Повышает силу атаки дальнего боя на 30% от вашего интеллекта.
    - Повышает силу атаки дальнего боя на 45% от вашего интеллекта.
  talent.trueshot_aura:
    name: Аура меткого выстрела
    tooltip:
    - Повышает силу атаки участников группы в радиусе 45 м. на 50 ед. Время действия
      – до отмены.
  talent.improved_barrage:
    name: Улучшенный заградительный огонь
    tooltip:
    - Повышает вероятность критического эффекта "Залпа" на 4%. С вероятностью 33%
      поддержание "Града стрел" не прерывается при получении урона.
    - Повышает вероятность критического эффекта "Залпа" на 8%. С вероятностью 66%
