      на 10 мин. и продлевает их действие на 6 сек.
  talent.blood_frenzy:
    name: Кровавое неистовство
    tooltip:
    - Ваши способности "Кровопускание" и "Глубокие раны" увеличивают физический урон,
      нанесенный цели, на 2%.
    - Ваши способности "Кровопускание" и "Глубокие раны" увеличивают физический урон,
      нанесенный цели, на 4%.
  talent.mortal_strike:
    name: Смертельный удар
    tooltip:
    - Жестокий удар, наносящий урон от оружия плюс 85 ед. и наносящий цели серьезную
      рану, снижающую эффективность любого лечения на 50% в течение 10 сек.
  talent.second_wind:
    name: Второе дыхание
    tooltip:
    - При использовании против вас эффектов оглушения или обездвиживания вы накапливаете
      10 ед. ярости и восстанавливаете 5% от общего количества здоровья в течение 10
      сек.
    - При использовании против вас эффектов оглушения или обездвиживания вы накапливаете
      20 ед. ярости и восстанавливаете 10% от общего количества здоровья в течение 10
      сек.
  talent.improved_mortal_strike:
    name: Улучшенный смертельный удар
    tooltip:
    - Уменьшает время восстановления "Смертельного удара" на 0.2 сек. и увеличивает
      его урон на 1%.
    - Уменьшает время восстановления "Смертельного удара" на 0.4 сек. и увеличивает
      его урон на 2%.
    - Уменьшает время восстановления "Смертельного удара" на 0.6 сек. и увеличивает
      его урон на 3%.
    - Уменьшает время восстановления "Смертельного удара" на 0.8 сек. и увеличивает
