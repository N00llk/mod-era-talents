    - Увеличение дополнительного урона, наносимого вашей способностью "Рассекающий
      удар", на 120%.
  talent.piercing_howl:
    name: Пронзительный вой
    tooltip:
    - Вызывает головокружение всех врагов в радиусе 10 м., снижая скорость их передвижения
      на 50% в течение 6 сек.
  talent.blood_craze:
    name: Мания крови
    tooltip:
    - Восстанавливает 1% от общего количества здоровья в течение 6 сек. после нанесения
      вам критического удара.
    - Восстанавливает 2% от общего количества здоровья в течение 6 сек. после нанесения
