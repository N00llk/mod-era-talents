    - 2% шанс атаковать цель повторно после того, как вы ударите ее мечом.
    - 3% шанс атаковать цель повторно после того, как вы ударите ее мечом.
    - 4% шанс атаковать цель повторно после того, как вы ударите ее мечом.
    - 5% шанс атаковать цель повторно после того, как вы ударите ее мечом.
  talent.improved_intercept:
