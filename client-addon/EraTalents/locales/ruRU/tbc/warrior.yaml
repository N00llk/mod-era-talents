    tooltip:
    - Уменьшает время восстановления "Перехвата" на 5 сек.
    - Уменьшает время восстановления "Перехвата" на 10 сек.
  talent.improved_hamstring:
    name: Улучшенное подрезание сухожилий
    tooltip:
    - Есть вероятность 5%, что способность "Подрезать сухожилия" обездвижит цель на
      5 сек.
    - Есть вероятность 10%, что способность "Подрезать сухожилия" обездвижит цель на
