    - Повышение вероятности критического удара топорами и древковым оружием на 1%.
    - Повышение вероятности критического удара топорами и древковым оружием на 2%.
    - Повышение вероятности критического удара топорами и древковым оружием на 3%.
    - Повышение вероятности критического удара топорами и древковым оружием на 4%.
    - Повышение вероятности критического удара топорами и древковым оружием на 5%.
  talent.death_wish:
    name: Инстинкт смерти
    tooltip:
    - При активации увеличивает физический урон на 20% и дает невосприимчивость к страху,
      но увеличивает получаемый урон на 5%. Время действия – 30 сек.
  talent.mace_specialization:
    name: Специализация на ударном оружии
    tooltip:
    - При ближней атаке булавой вы с некоторой вероятностью можете оглушить врага
      на 3 сек. и накопить 7 ед. ярости.
    - При ближней атаке булавой вы с некоторой вероятностью можете оглушить врага
