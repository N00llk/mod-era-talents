      эффектами, влияющими на длительность обезоруживания.
  talent.improved_berserker_rage:
    name: Улучшенная ярость берсерка
    tooltip:
    - Способность "Ярость берсерка" при использовании создает 5 ед. ярости.
    - Способность "Ярость берсерка" при использовании создает 10 ед. ярости.
  talent.flurry:
    name: Шквал
    tooltip:
    - Увеличение на 5% скорости атаки для последующих 3 выпадов после нанесения критического
      урона в ближнем бою.
    - Увеличение на 10% скорости атаки для последующих 3 выпадов после нанесения критического
      урона в ближнем бою.
