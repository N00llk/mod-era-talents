    - Увеличивает вероятность сопротивления эффектам оглушения и подчинения на 15%.
  talent.improved_thunder_clap:
    name: Улучшенный удар грома
    tooltip:
    - Снижает стоимость "Удара грома" на 1 ед. ярости, увеличивает урон от него на
      40% и усиливает замедление еще на 4%.
