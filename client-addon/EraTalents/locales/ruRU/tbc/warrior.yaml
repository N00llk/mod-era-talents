    name: Улучшенное сокрушение
    tooltip:
    - Уменьшение времени применения способности "Сокрушение" на 0.5 сек.
    - Уменьшение времени применения способности "Сокрушение" на 1 сек.
  talent.sweeping_strikes:
    name: Размашистые удары
    tooltip:
    - 10 ваших следующих атак ближнего боя попадают еще по одному находящемуся рядом
