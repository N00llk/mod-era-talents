    - Есть вероятность 15%, что способность "Подрезать сухожилия" обездвижит цель на
      5 сек.
  talent.improved_disciplines:
    name: Улучшенные навыки
    tooltip:
    - Уменьшает время восстановления "Возмездия", "Безрассудства" и "Глухой обороны"
      на 4 мин. и продлевает их действие на 2 сек.
    - Уменьшает время восстановления "Возмездия", "Безрассудства" и "Глухой обороны"
