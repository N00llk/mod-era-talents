class: warrior
texts:
  tree.1:
    name: Оружие
  talent.improved_heroic_strike:
    name: Улучшенный удар героя
    tooltip:
    - Снижает стоимость "Удара героя" на 1 ед. ярости.
    - Снижает стоимость "Удара героя" на 2 ед. ярости.
    - Снижает стоимость "Удара героя" на 3 ед. ярости.
  talent.deflection:
