    - Увеличивает количество снижаемой силы атаки ближнего боя при применении способности
      "Деморализующий крик" на 40%.
  talent.unbridled_wrath:
    name: Необузданный гнев
    tooltip:
    - Дает шанс получить больше ярости при нанесении урона оружием в ближнем бою.
    - Дает шанс получить больше ярости при нанесении урона оружием в ближнем бою.
      Срабатывает чаще, чем "Необузданный гнев" 1-го уровня.
