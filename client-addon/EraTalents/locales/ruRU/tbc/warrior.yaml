    - Уменьшает расход ярости на способность "Казнь" на 5.
  talent.enrage:
    name: Исступление
    tooltip:
    - Увеличивает урон в ближнем бою на 5% в течение 12 сек. Максимальное число ударов
      с увеличенным уроном - 12. Эффект действует только после нанесения вам критического
      удара.
    - Увеличивает урон в ближнем бою на 10% в течение 12 сек. Максимальное число ударов
      с увеличенным уроном - 12. Эффект действует только после нанесения вам критического
      удара.
    - Увеличивает урон в ближнем бою на 15% в течение 12 сек. Максимальное число ударов
