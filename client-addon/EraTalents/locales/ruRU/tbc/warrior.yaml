    tooltip:
    - Вы накапливаете на 25% больше ярости от нанесенного вами урона.
  tree.2:
    name: Неистовство
  talent.booming_voice:
    name: Луженая глотка
    tooltip:
    - Увеличивает область и время действия "Боевого крика", "Деморализующего крика"
      и "Командирского крика" на 10%.
    - Увеличивает область и время действия "Боевого крика", "Деморализующего крика"
