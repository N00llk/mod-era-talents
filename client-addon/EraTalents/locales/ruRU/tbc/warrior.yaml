    - Увеличивает бонус к силе атаки в ближнем бою от "Боевого крика" и бонус к запасу
      здоровья от "Командирского крика" на 25%.
  talent.dual_wield_specialization:
    name: Специализация на бое двумя оружиями
    tooltip:
    - Увеличение урона от вашего оружия в левой руке на 5%.
    - Увеличение урона от вашего оружия в левой руке на 10%.
    - Увеличение урона от вашего оружия в левой руке на 15%.
    - Увеличение урона от вашего оружия в левой руке на 20%.
    - Увеличение урона от вашего оружия в левой руке на 25%.
  talent.improved_execute:
    name: Улучшенная казнь
