      урона вашим оружием в течение 12 сек.
  talent.two_handed_weapon_specialization:
    name: Специализация на двуручном оружии
    tooltip:
    - Увеличение урона от вашего двуручного оружия ближнего боя на 1%.
    - Увеличение урона от вашего двуручного оружия ближнего боя на 2%.
    - Увеличение урона от вашего двуручного оружия ближнего боя на 3%.
    - Увеличение урона от вашего двуручного оружия ближнего боя на 4%.
    - Увеличение урона от вашего двуручного оружия ближнего боя на 5%.
  talent.impale:
    name: Прокалывание
    tooltip:
    - Увеличивает бонус к урону от критических эффектов способностей в защитной стойке,
      боевой стойке и стойке берсерка на 10%.
    - Увеличивает бонус к урону от критических эффектов способностей в защитной стойке,
      боевой стойке и стойке берсерка на 20%.
  talent.poleaxe_specialization:
    name: Специализация на топорах и древковом оружии
