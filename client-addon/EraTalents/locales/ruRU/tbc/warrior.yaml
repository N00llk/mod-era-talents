    - Дает шанс получить больше ярости при нанесении урона оружием в ближнем бою.
      Срабатывает чаще, чем "Необузданный гнев" 4-го уровня.
  talent.improved_cleave:
    name: Улучшенный рассекающий удар
    tooltip:
    - Увеличение дополнительного урона, наносимого вашей способностью "Рассекающий
      удар", на 40%.
    - Увеличение дополнительного урона, наносимого вашей способностью "Рассекающий
