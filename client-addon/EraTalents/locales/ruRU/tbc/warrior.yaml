      100% и усиливает замедление еще на 10%.
  talent.improved_overpower:
    name: Улучшенное превосходство
    tooltip:
    - Повышает вероятность критического эффекта "Превосходства" на 25%.
    - Повышает вероятность критического эффекта "Превосходства" на 50%.
  talent.anger_management:
    name: Управление злостью
    tooltip:
    - Пока вы находитесь в бою, вы накапливаете 1 ед. ярости раз в 3 сек.
  talent.deep_wounds:
    name: Глубокие раны
    tooltip:
    - Ваши критические удары вызывают у противника кровотечение, наносящее 20% от среднего
      урона вашим оружием в течение 12 сек.
    - Ваши критические удары вызывают у противника кровотечение, наносящее 40% от среднего
      урона вашим оружием в течение 12 сек.
