schemaVersion: 1
locale: ruRU
era: tbc
class: mage
texts:
  tree.1:
    name: Тайная магия
  talent.arcane_subtlety:
    name: Искусные чары
    tooltip:
    - Снижение сопротивления цели всем вашим заклинаниям на 5 ед. и снижение угрозы
      от заклинаний тайной магии на 20%.
    - Снижение сопротивления цели всем вашим заклинаниям на 10 ед. и снижение угрозы
      от заклинаний тайной магии на 40%.
  talent.arcane_focus:
    name: Средоточие чар
    tooltip:
    - Снижение на 2% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 4% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 6% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 8% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 10% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
  talent.improved_arcane_missiles:
    name: Улучшенные чародейские стрелы
    tooltip:
    - С вероятностью 20% поддержание "Чародейских стрел" не прерывается при получении
      урона.
    - С вероятностью 40% поддержание "Чародейских стрел" не прерывается при получении
      урона.
    - С вероятностью 60% поддержание "Чародейских стрел" не прерывается при получении
      урона.
    - С вероятностью 80% поддержание "Чародейских стрел" не прерывается при получении
      урона.
    - С вероятностью 100% поддержание "Чародейских стрел" не прерывается при получении
      урона.
  talent.wand_specialization:
    name: Специализация на жезлах
    tooltip:
    - Увеличение на 13% урона, наносимого при использовании магических жезлов.
    - Увеличение на 25% урона, наносимого при использовании магических жезлов.
  talent.magic_absorption:
    name: Магическое поглощение
    tooltip:
    - Повышение всех типов сопротивления на 2 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 1% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 4 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 2% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 6 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 3% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 8 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 4% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 10 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 5% общего уровня вашей маны. Время
      восстановления - 1 сек.
  talent.arcane_concentration:
    name: Чародейская сосредоточенность
    tooltip:
    - Поражая цель наносящим урон заклинанием, вы с вероятностью 2% можете войти в
      состояние "Ясность мысли", которое снижает стоимость следующего наносящего урон
      заклинания на 100%.
    - Поражая цель наносящим урон заклинанием, вы с вероятностью 4% можете войти в
      состояние "Ясность мысли", которое снижает стоимость следующего наносящего урон
      заклинания на 100%.
    - Поражая цель наносящим урон заклинанием, вы с вероятностью 6% можете войти в
      состояние "Ясность мысли", которое снижает стоимость следующего наносящего урон
      заклинания на 100%.
    - Поражая цель наносящим урон заклинанием, вы с вероятностью 8% можете войти в
      состояние "Ясность мысли", которое снижает стоимость следующего наносящего урон
      заклинания на 100%.
    - Поражая цель наносящим урон заклинанием, вы с вероятностью 10% можете войти
      в состояние "Ясность мысли", которое снижает стоимость следующего наносящего
      урон заклинания на 100%.
  talent.magic_attunement:
    name: Магическое созвучие
    tooltip:
    - Повышает эффективность "Усиления магии" и "Ослабления магии" на 25%.
    - Повышает эффективность "Усиления магии" и "Ослабления магии" на 50%.
  talent.arcane_impact:
    name: Магическое действие
    tooltip:
    - Повышает вероятность критического эффекта "Чародейского взрыва" и "Чародейской
      вспышки" еще на 2%.
    - Повышает вероятность критического эффекта "Чародейского взрыва" и "Чародейской
      вспышки" еще на 4%.
    - Повышает вероятность критического эффекта "Чародейского взрыва" и "Чародейской
      вспышки" еще на 6%.
  talent.arcane_fortitude:
    name: Чародейская стойкость
    tooltip:
    - Усиление брони на величину, равную 100% от значения интеллекта.
  talent.improved_mana_shield:
    name: Улучшенный щит маны
    tooltip:
    - Снижение на 10% расхода маны на снятие каждой единицы урона, получаемого при
      использовании заклинания "Щит маны".
    - Снижение на 20% расхода маны на снятие каждой единицы урона, получаемого при
      использовании заклинания "Щит маны".
  talent.improved_counterspell:
    name: Улучшенная антимагия
    tooltip:
    - '"Антимагия" с вероятностью 50% поражает цель немотой на 4 сек.'
    - '"Антимагия" с вероятностью 100% поражает цель немотой на 4 сек.'
  talent.arcane_meditation:
    name: Чародейская медитация
    tooltip:
    - В процессе произнесения заклинаний продолжается 10% от восполнения маны.
    - В процессе произнесения заклинаний продолжается 20% от восполнения маны.
    - В процессе произнесения заклинаний продолжается 30% от восполнения маны.
  talent.improved_blink:
    name: Улучшенный скачок
    tooltip:
    - Снижает вероятность попадания по вам атак и заклинаний на 13% в течение 4 сек.
      после применения "Скачка".
    - Снижает вероятность попадания по вам атак и заклинаний на 25% в течение 4 сек.
      после применения "Скачка".
  talent.presence_of_mind:
    name: Присутствие разума
    tooltip:
    - Мгновенное применение следующего магического заклинания, обычное время применения
      которого ниже 10 сек.
  talent.arcane_mind:
    name: Чародейский ум
    tooltip:
    - Увеличение интеллекта на 3%.
    - Увеличение интеллекта на 6%.
    - Увеличение интеллекта на 9%.
    - Увеличение интеллекта на 12%.
    - Увеличение интеллекта на 15%.
  talent.prismatic_cloak:
    name: Призматический плащ
    tooltip:
    - Получаемый урон уменьшен на 2%.
    - Получаемый урон уменьшен на 4%.
  talent.arcane_instability:
    name: Магическая нестабильность
    tooltip:
    - Увеличение урона от заклинаний и вероятности критического удара на 1%.
    - Увеличение урона от заклинаний и вероятности критического удара на 2%.
    - Увеличение урона от заклинаний и вероятности критического удара на 3%.
  talent.arcane_potency:
    name: Чародейское могущество
    tooltip:
    - Увеличение на 10% шанса нанести критический удар любым заклинанием, накладываемым
      в состоянии "Ясность мысли".
    - Увеличение на 20% шанса нанести критический удар любым заклинанием, накладываемым
      в состоянии "Ясность мысли".
    - Увеличение на 30% шанса нанести критический удар любым заклинанием, накладываемым
      в состоянии "Ясность мысли".
  talent.empowered_arcane_missiles:
    name: Усиленные чародейские стрелы
    tooltip:
    - '"Чародейские стрелы" получают еще 15% бонусов к урону от заклинаний, но их
      стоимость повышается на 2%.'
    - '"Чародейские стрелы" получают еще 30% бонусов к урону от заклинаний, но их
      стоимость повышается на 4%.'
    - '"Чародейские стрелы" получают еще 45% бонусов к урону от заклинаний, но их
      стоимость повышается на 6%.'
  talent.arcane_power:
    name: Мощь тайной магии
    tooltip:
    - Повышение урона от заклинаний на 30% за счет повышения расхода на них маны на
      30%. Время действия – 15 сек.
  talent.spell_power:
    name: Сила заклинаний
    tooltip:
    - Увеличивает дополнительный урон от критического удара заклинаний на 25%.
    - Увеличивает дополнительный урон от критического удара заклинаний на 50%.
  talent.mind_mastery:
    name: Владыка разума
    tooltip:
    - Повышение урона от заклинаний на 5% от суммарного интеллекта.
    - Повышение урона от заклинаний на 10% от суммарного интеллекта.
    - Повышение урона от заклинаний на 15% от суммарного интеллекта.
    - Повышение урона от заклинаний на 20% от суммарного интеллекта.
    - Повышение урона от заклинаний на 25% от суммарного интеллекта.
  talent.slow:
    name: Замедление
    tooltip:
    - Снижает скорость передвижения цели на 50%, увеличивает интервал между ее атаками
      в дальнем бою на 50% и время применения заклинаний на 50%. Время действия – 15
      сек. Одновременно действует только на одну цель.
  tree.2:
    name: Огонь
  talent.improved_fireball:
    name: Улучшенный огненный шар
    tooltip:
    - Сокращает время применения "Огненного шара" на 0.1 сек.
    - Сокращает время применения "Огненного шара" на 0.2 сек.
    - Сокращает время применения "Огненного шара" на 0.3 сек.
    - Сокращает время применения "Огненного шара" на 0.4 сек.
    - Сокращает время применения "Огненного шара" на 0.5 сек.
  talent.impact:
    name: Сотрясение
    tooltip:
    - С вероятностью 2% заклинания огня оглушают цель на 2 сек.
    - С вероятностью 4% заклинания огня оглушают цель на 2 сек.
    - С вероятностью 6% заклинания огня оглушают цель на 2 сек.
    - С вероятностью 8% заклинания огня оглушают цель на 2 сек.
    - С вероятностью 10% заклинания огня оглушают цель на 2 сек.
  talent.ignite:
    name: Воспламенение
    tooltip:
    - Критические эффекты заклинаний огня поджигают цель, нанося дополнительно 8% урона
      от примененного заклинания за 4 сек.
    - Критические эффекты заклинаний огня поджигают цель, нанося дополнительно 16% урона
      от примененного заклинания за 4 сек.
    - Критические эффекты заклинаний огня поджигают цель, нанося дополнительно 24% урона
      от примененного заклинания за 4 сек.
    - Критические эффекты заклинаний огня поджигают цель, нанося дополнительно 32% урона
      от примененного заклинания за 4 сек.
    - Критические эффекты заклинаний огня поджигают цель, нанося дополнительно 40% урона
      от примененного заклинания за 4 сек.
  talent.flame_throwing:
    name: Метание пламени
    tooltip:
    - Увеличивает дальность действия заклинаний огня на 3 м.
    - Увеличивает дальность действия заклинаний огня на 6 м.
  talent.improved_fire_blast:
    name: Улучшенный огненный взрыв
    tooltip:
    - Уменьшает время восстановления "Огненного взрыва" на 0.5 сек.
    - Уменьшает время восстановления "Огненного взрыва" на 1 сек.
    - Уменьшает время восстановления "Огненного взрыва" на 1.5 сек.
  talent.incineration:
    name: Испепеление
    tooltip:
    - Повышает вероятность критического эффекта "Огненного взрыва" и "Ожога" на 2%.
    - Повышает вероятность критического эффекта "Огненного взрыва" и "Ожога" на 4%.
  talent.improved_flamestrike:
    name: Улучшенный огненный столб
    tooltip:
    - Повышает вероятность критического эффекта "Огненного столба" на 5%.
    - Повышает вероятность критического эффекта "Огненного столба" на 10%.
    - Повышает вероятность критического эффекта "Огненного столба" на 15%.
  talent.pyroblast:
    name: Огненная глыба
    tooltip:
    - Бросок огромной огненной глыбы, которая наносит от 148 до 195 ед. урона от огня
      единовременно и 56 ед. урона от огня в течение 12 сек.
  talent.burning_soul:
    name: Пылающая душа
    tooltip:
    - С вероятностью 35% применение заклинаний огня не останавливается при получении
      урона. Снижает уровень угрозы от заклинаний огня на 5%.
    - С вероятностью 70% применение заклинаний огня не останавливается при получении
      урона. Снижает уровень угрозы от заклинаний огня на 10%.
  talent.improved_scorch:
    name: Улучшенный ожог
    tooltip:
    - '"Ожог" с вероятностью 33% делает цель уязвимой к урону от огня, и она в течение
      30 сек. получает на 3% больше урона от огня. Суммируется до 5 раз.'
    - '"Ожог" с вероятностью 66% делает цель уязвимой к урону от огня, и она в течение
      30 сек. получает на 3% больше урона от огня. Суммируется до 5 раз.'
    - '"Ожог" с вероятностью 100% делает цель уязвимой к урону от огня, и она в течение
      30 сек. получает на 3% больше урона от огня. Суммируется до 5 раз.'
  talent.molten_shields:
    name: Раскаленные щиты
    tooltip:
    - '"Защита от огня" с вероятностью 10% отражает заклинания огня. Кроме того, "Раскаленный
      доспех" с вероятностью 50% действует на атаки в дальнем бою и заклинания.'
    - '"Защита от огня" с вероятностью 20% отражает заклинания огня. Кроме того, "Раскаленный
      доспех" с вероятностью 100% действует на атаки в дальнем бою и заклинания.'
  talent.master_of_elements:
    name: Повелитель Стихий
    tooltip:
    - Критические эффекты заклинаний огня и льда возвращают 10% их базовой стоимости
      в мане.
    - Критические эффекты заклинаний огня и льда возвращают 20% их базовой стоимости
      в мане.
    - Критические эффекты заклинаний огня и льда возвращают 30% их базовой стоимости
      в мане.
  talent.playing_with_fire:
    name: Игра с огнем
    tooltip:
    - Увеличение наносимого урона от всех видов заклинаний на 1% и получаемого урона
      от всех видов заклинаний на 1%.
    - Увеличение наносимого урона от всех видов заклинаний на 2% и получаемого урона
      от всех видов заклинаний на 2%.
    - Увеличение наносимого урона от всех видов заклинаний на 3% и получаемого урона
      от всех видов заклинаний на 3%.
  talent.critical_mass:
    name: Критическая масса
    tooltip:
    - Повышает вероятность критического эффекта заклинаний огня на 2%.
    - Повышает вероятность критического эффекта заклинаний огня на 4%.
    - Повышает вероятность критического эффекта заклинаний огня на 6%.
  talent.blast_wave:
    name: Взрывная волна
    tooltip:
    - Выпускает волну пламени, нанося противникам в области действия от 160 до 192 ед.
      урона от огня и вызывая головокружение на 6 сек.
  talent.blazing_speed:
    name: Молниеносность
    tooltip:
    - Дает вам 5%-й шанс при получении удара в ближнем или дальнем бою увеличить скорость
      вашего передвижения на 50% и рассеять все воздействия, сковывающие движения. Время
      действия - 8 сек.
    - Дает вам 10%-й шанс при получении удара в ближнем или дальнем бою увеличить скорость
      вашего передвижения на 50% и рассеять все воздействия, сковывающие движения. Время
      действия - 8 сек.
  talent.fire_power:
    name: Сила огня
    tooltip:
    - Увеличивает урон от ваших заклинаний огня на 2%.
    - Увеличивает урон от ваших заклинаний огня на 4%.
    - Увеличивает урон от ваших заклинаний огня на 6%.
    - Увеличивает урон от ваших заклинаний огня на 8%.
    - Увеличивает урон от ваших заклинаний огня на 10%.
  talent.pyromaniac:
    name: Пироманьяк
    tooltip:
    - Повышает вероятность критического эффекта и снижает стоимость заклинаний огня
      еще на 1%.
    - Повышает вероятность критического эффекта и снижает стоимость заклинаний огня
      еще на 2%.
    - Повышает вероятность критического эффекта и снижает стоимость заклинаний огня
      еще на 3%.
  talent.combustion:
    name: Возгорание
    tooltip:
    - При использовании каждое атакующее заклинание огня, достигшее цели, повышает вероятность
      критического попадания заклинаний огня на 10%. Эффект действует, пока заклинания
      огня не нанесут 3 критических удара.
  talent.molten_fury:
    name: Раскаленное неистовство
    tooltip:
    - Увеличение на 10% урона от заклинаний, наносимого целям с запасом здоровья ниже
      20%.
    - Увеличение на 20% урона от заклинаний, наносимого целям с запасом здоровья ниже
      20%.
  talent.empowered_fireball:
    name: Усиленный огненный шар
    tooltip:
    - '"Огненный шар" получает на 3% больше бонусов к урону от заклинаний.'
    - '"Огненный шар" получает на 6% больше бонусов к урону от заклинаний.'
    - '"Огненный шар" получает на 9% больше бонусов к урону от заклинаний.'
