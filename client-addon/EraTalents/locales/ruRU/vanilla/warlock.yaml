schemaVersion: 1
locale: ruRU
era: vanilla
class: warlock
texts:
  tree.1:
    name: Колдовство
  talent.suppression:
    name: Подавление
    tooltip:
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 2%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 4%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 6%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 8%.
    - Снижает вероятность сопротивления противника вашим заклинаниям специализации
      "Колдовство" на 10%.
  talent.improved_corruption:
    name: Улучшенная порча
    tooltip:
    - Уменьшает время применения "Порчи" на 0.4 сек.
    - Уменьшает время применения "Порчи" на 0.8 сек.
    - Уменьшает время применения "Порчи" на 1.2 сек.
    - Уменьшает время применения "Порчи" на 1.6 сек.
    - Уменьшает время применения "Порчи" на 2 сек.
  talent.improved_curse_of_weakness:
    name: Улучшенное проклятие слабости
    tooltip:
    - Увеличение эффекта от проклятия слабости на 6%.
    - Увеличение эффекта от проклятия слабости на 13%.
    - Увеличение эффекта от проклятия слабости на 20%.
  talent.improved_drain_soul:
    name: Улучшенное похищение души
    tooltip:
    - Если ваша цель погибает пока вы похищаете ее душу, с вероятностью 50% ваша скорость
      восполнения маны будет повышена на 100% в течение 10 сек. Кроме того, во время
      произнесения заклинаний вы продолжаете восполнять ману со скоростью 50% от нормальной.
    - Если ваша цель погибает пока вы похищаете ее душу, с вероятностью 100% ваша
      скорость восполнения маны будет повышена на 100% в течение 10 сек. Кроме того,
      во время произнесения заклинаний вы продолжаете восполнять ману со скоростью
      50% от нормальной.
  talent.improved_life_tap:
    name: Улучшенный жизнеотвод
    tooltip:
    - Увеличение количества маны, полученной при использовании вами заклинания "Жизнеотвод"
      на 10%.
    - Увеличение количества маны, полученной при использовании вами заклинания "Жизнеотвод"
      на 20%.
  talent.improved_life_drain:
    name: Улучшенное похищение жизни
    tooltip:
    - Увеличение количества здоровья, которого лишается противник при помощи заклинания
      "Похищение жизни", на 2%.
    - Увеличение количества здоровья, которого лишается противник при помощи заклинания
      "Похищение жизни", на 4%.
    - Повышение на 6% величины похищаемого здоровья при применении заклинания "Похищение
      жизни".
    - Повышение на 8% величины похищаемого здоровья при применении заклинания "Похищение
      жизни".
    - Повышение на 10% величины похищаемого здоровья при применении заклинания "Похищение
      жизни".
  talent.improved_curse_of_agony:
    name: Улучшенное проклятие агонии
    tooltip:
    - Увеличение урона, нанесенного заклинанием "Проклятие агонии", на 2%.
    - Увеличение урона, нанесенного заклинанием "Проклятие агонии", на 4%.
    - Увеличение урона, нанесенного заклинанием "Проклятие агонии", на 6%.
  talent.fel_concentration:
    name: Сосредоточение Скверны
    tooltip:
    - С 14%-й вероятностью ваши "Похищение жизни", "Похищение маны" и "Похищение души"
      не прерываются при получении урона.
    - С 28%-й вероятностью ваши "Похищение жизни", "Похищение маны" и "Похищение души"
      не прерываются при получении урона.
    - С 42%-й вероятностью ваши "Похищение жизни", "Похищение маны" и "Похищение души"
      не прерываются при получении урона.
    - С 56%-й вероятностью ваши "Похищение жизни", "Похищение маны" и "Похищение души"
      не прерываются при получении урона.
    - С 70%-й вероятностью ваши "Похищение жизни", "Похищение маны" и "Похищение души"
      не прерываются при получении урона.
  talent.amplify_curse:
    name: Усиление проклятия
    tooltip:
    - Увеличивает эффект следующего заклинания "Проклятие слабости" или "Проклятие
      агонии" на 50%, либо заклинания "Проклятие изнеможения" на 20%. Время действия
      – 30 сек.
  talent.grim_reach:
    name: Предел мрака
    tooltip:
    - Увеличивает дальность действия заклинаний специализации "Колдовство" на 10%.
    - Увеличивает дальность действия заклинаний специализации "Колдовство" на 20%.
  talent.nightfall:
    name: Сумерки
    tooltip:
    - '"Порча" и "Похищение жизни" с вероятностью 2% могут ввести вас в "Теневой транс"
      после нанесения урона противнику. Транс сокращает время применения следующей
      "Стрелы Тьмы" на 100%.'
    - '"Порча" и "Похищение жизни" с вероятностью 4% могут ввести вас в "Теневой транс"
      после нанесения урона противнику. Транс сокращает время применения следующей
      "Стрелы Тьмы" на 100%.'
  talent.improved_drain_mana:
    name: Улучшенное похищение маны
    tooltip:
    - Заставляет 15% маны, откачанной вашим заклинанием "Похищение маны", причинять
      урон противнику.
    - Заставляет 30% маны, откачанной вашим заклинанием "Похищение маны", причинять
      урон противнику.
  talent.siphon_life:
    name: Вытягивание жизни
    tooltip:
    - Передача 15 ед. здоровья от цели к заклинателю раз в 3 сек. Время действия –
      30 сек.
  talent.curse_of_exhaustion:
    name: Проклятие изнеможения
    tooltip:
    - Снижает скорость передвижения цели на 10% на 12 сек. На цель может одновременно
      действовать только одно проклятие каждого чернокнижника.
  talent.improved_curse_of_exhaustion:
    name: Улучшенное проклятие изнеможения
    tooltip:
    - Увеличение ограничения скорости от заклинания "Проклятие изнеможения" на 5%.
    - Увеличение ограничения скорости от заклинания "Проклятие изнеможения" на 10%.
    - Увеличение ограничения скорости от заклинания "Проклятие изнеможения" на 15%.
    - Увеличение ограничения скорости от заклинания "Проклятие изнеможения" на 20%.
  talent.shadow_mastery:
    name: Власть над Тенями
    tooltip:
    - Увеличение урона, наносимого заклинаниями темной магии на 2%.
    - Увеличение урона, наносимого заклинаниями темной магии на 4%.
    - Увеличение урона, наносимого заклинаниями темной магии на 6%.
    - Увеличение урона, наносимого заклинаниями темной магии на 8%.
    - Увеличение урона, наносимого заклинаниями темной магии на 10%.
  talent.dark_pact:
    name: Темный союз
    tooltip:
    - Похищение 150 ед. маны вашего питомца; 100% ее передается заклинателю.
  tree.2:
    name: Демонология
  talent.improved_healthstone:
    name: Улучшенный камень здоровья
    tooltip:
    - Увеличение на 10% количества здоровья, восполняемого камнем здоровья.
    - Увеличение на 20% количества здоровья, восполняемого камнем здоровья.
  talent.improved_imp:
    name: Улучшенный бес
    tooltip:
    - Увеличение на 10% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
    - Увеличение на 20% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
    - Увеличение на 30% эффективности применения вашим бесом заклинаний "Огненная
      стрела", "Огненный щит" и "Кровавый союз".
  talent.demonic_embrace:
    name: Демоническое облачение
    tooltip:
    - Повышение общей выносливости на 3% при снижении общего духа на 1%.
    - Повышение общей выносливости на 6% при снижении общего духа на 2%.
    - Повышение общей выносливости на 9% при снижении общего духа на 3%.
    - Повышение общей выносливости на 12% при снижении общего духа на 4%.
    - Повышение общей выносливости на 15% при снижении общего духа на 5%.
  talent.improved_health_funnel:
    name: Улучшенный канал здоровья
    tooltip:
    - Увеличение количества здоровья, передаваемого заклинанием "Канал здоровья",
      на 10%.
    - Увеличение количества здоровья, передаваемого заклинанием "Канал здоровья",
      на 20%..
  talent.improved_voidwalker:
    name: Улучшенный демон Бездны
    tooltip:
    - Увеличение эффективности заклинаний демона Бездны "Мучение", "Поглощение теней",
      "Жертва" и "Муки" на 10%.
    - Увеличение эффективности заклинаний демона Бездны "Мучение", "Поглощение теней",
      "Жертва" и "Муки" на 20%.
    - Увеличение эффективности заклинаний демона Бездны "Мучение", "Поглощение теней",
      "Жертва" и "Муки" на 30%.
  talent.fel_intellect:
    name: Интеллект скверны
    tooltip:
    - Увеличивает на 3% максимальный запас маны беса, демона Бездны, суккуба, инкуба
      и охотника Скверны.
    - Увеличивает на 6% максимальный запас маны беса, демона Бездны, суккуба, инкуба
      и охотника Скверны.
    - Увеличивает на 9% максимальный запас маны беса, демона Бездны, суккуба, инкуба
      и охотника Скверны.
    - Увеличивает на 12% максимальный запас маны беса, демона Бездны, суккуба, инкуба
      и охотника Скверны.
    - Увеличивает на 15% максимальный запас маны беса, демона Бездны, суккуба, инкуба
      и охотника Скверны.
  talent.improved_succubus:
    name: Улучшенный сайаад
    tooltip:
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 10% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 10%.
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 20% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 20%.
    - Усиливает эффект от "Всплеска боли" и "Утешительного поцелуя" суккуба или инкуба
      на 30% и продлевает действие "Соблазнения" и "Слабой невидимости" суккуба или
      инкуба на 30%.
  talent.fel_domination:
    name: Господство Скверны
    tooltip:
    - Сокращает время призыва следующего беса, демона Бездны, суккуба, инкуба или
      охотника Скверны на 5.5 сек. и снижает его стоимость на 50%.
  talent.fel_stamina:
    name: Выносливость скверны
    tooltip:
    - Увеличивает на 3% максимальный запас здоровья вашего беса, демона Бездны, суккуба,
      инкуба или охотника скверны.
    - Увеличивает на 6% максимальный запас здоровья вашего беса, демона Бездны, суккуба,
      инкуба или охотника скверны.
    - Увеличивает на 9% максимальный запас здоровья вашего беса, демона Бездны, суккуба,
      инкуба или охотника скверны.
    - Увеличивает на 12% максимальный запас здоровья вашего беса, демона Бездны, суккуба,
      инкуба или охотника скверны.
    - Увеличивает на 15% максимальный запас здоровья вашего беса, демона Бездны, суккуба,
      инкуба или охотника скверны.
  talent.master_summoner:
    name: Мастер призыва
    tooltip:
    - Сокращает время призыва беса, демона Бездны, суккуба, инкуба и охотника Скверны
      на 2 сек. и снижает его стоимость на 20%.
    - Сокращает время призыва беса, демона Бездны, суккуба, инкуба и охотника Скверны
      на 4 сек. и снижает его стоимость на 40%.
  talent.unholy_power:
    name: Нечестивая сила
    tooltip:
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба и охотника
      Скверны на 4%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба и охотника
      Скверны на 8%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба и охотника
      Скверны на 12%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба и охотника
      Скверны на 16%.
    - Увеличивает урон от атак в ближнем бою демона Бездны, суккуба, инкуба и охотника
      Скверны на 20%.
  talent.improved_enslave_demon:
    name: Улучшенное порабощение демона
    tooltip:
    - Уменьшает на 2% штраф к скорости атаки и применения заклинаний от "Порабощения
      демона", а также снижает вероятность сопротивления на 2%.
    - Уменьшает на 4% штраф к скорости атаки и применения заклинаний от "Порабощения
      демона", а также снижает вероятность сопротивления на 4%.
    - Уменьшает на 6% штраф к скорости атаки и применения заклинаний от "Порабощения
      демона", а также снижает вероятность сопротивления на 6%.
    - Уменьшает на 8% штраф к скорости атаки и применения заклинаний от "Порабощения
      демона", а также снижает вероятность сопротивления на 8%.
    - Уменьшает на 10% штраф к скорости атаки и применения заклинаний от "Порабощения
      демона", а также снижает вероятность сопротивления на 10%.
  talent.demonic_sacrifice:
    name: Демоническое жертвоприношение
    tooltip:
    - 'При активации приносит в жертву призванного демона и дает вам на 30 мин. эффект,
      который снимается при вызове нового демона.Бес: увеличивает урон от огня на
      15%.Демон Бездны: восполняет 3% общего запаса здоровья раз в 4 сек.Суккуб/инкуб:
      увеличивает урон от темной магии на 15%.Охотник Скверны: восполняет 2% общего
      запаса маны раз в 4 сек.'
  talent.improved_firestone:
    name: Улучшенный камень огня
    tooltip:
    - Увеличение дополнительного урона от камня огня и эффекта камня огня на 15%.
    - Увеличение дополнительного урона от камня огня и эффекта камня огня на 30%.
  talent.master_demonologist:
    name: Мастер-демонолог
    tooltip:
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока демон активен.Бес:
      снижает уровень угрозы на 4%.Демон бездны: уменьшает получаемый физический урон
      на 2%.Суккуб/инкуб: увеличивает наносимый урон на 2%.Охотник Скверны: повышает
      все типы сопротивления на 0,2 за уровень.'
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока демон активен.Бес:
      снижает уровень угрозы на 8%.Демон бездны: уменьшает получаемый физический урон
      на 4%.Суккуб/инкуб: увеличивает наносимый урон на 4%.Охотник Скверны: повышает
      все типы сопротивления на 0,4 за уровень.'
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока демон активен.Бес:
      снижает уровень угрозы на 12%.Демон бездны: уменьшает получаемый физический
      урон на 6%.Суккуб/инкуб: увеличивает наносимый урон на 6%.Охотник Скверны: повышает
      все типы сопротивления на 0,6 за уровень.'
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока демон активен.Бес:
      снижает уровень угрозы на 16%.Демон бездны: уменьшает получаемый физический
      урон на 8%.Суккуб/инкуб: увеличивает наносимый урон на 8%.Охотник Скверны: повышает
      все типы сопротивления на 0,8 за уровень.'
    - 'Дает чернокнижнику и призванному демону эффект, действующий, пока демон активен.Бес:
      снижает уровень угрозы на 20%.Демон бездны: уменьшает получаемый физический
      урон на 10%.Суккуб/инкуб: увеличивает наносимый урон на 10%.Охотник Скверны:
      повышает все типы сопротивления на 1 за уровень.'
  talent.soul_link:
    name: Связка души
    tooltip:
    - Пока действует этот эффект, 30% получаемого вами урона перенаправляется на вашего
      беса, демона Бездны, суккуба, инкуба или охотника Скверны. Кроме того, вы и
      ваш демон наносите на 3% больше урона. Эффект действует, пока демон активен.
  talent.improved_spellstone:
    name: Улучшенный камень чар
    tooltip:
    - Увеличение урона, поглощаемого камнем чар, на 15%.
    - Увеличение урона, поглощаемого камнем чар, на 30%.
  tree.3:
    name: Разрушение
  talent.improved_shadow_bolt:
    name: Улучшенная стрела Тьмы
    tooltip:
    - Критические попадания "Стрелы Тьмы" увеличивают урон от темной магии по цели
      на 4% до тех пор, пока к цели не будут применены 4 непериодических вредоносных
      эффекта. Максимальное время действия – 12 сек.
    - Критические попадания "Стрелы Тьмы" увеличивают урон от темной магии по цели
      на 8% до тех пор, пока к цели не будут применены 4 непериодических вредоносных
      эффекта. Максимальное время действия – 12 сек.
