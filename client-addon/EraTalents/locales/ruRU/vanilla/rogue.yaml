    - Увеличение до 50% вероятности снятия эффектов снижения скорости передвижения
      при использовании способности "Спринт".
    - Увеличение до 100% вероятности снятия эффектов снижения скорости передвижения
      при использовании способности "Спринт".
  talent.improved_kick:
