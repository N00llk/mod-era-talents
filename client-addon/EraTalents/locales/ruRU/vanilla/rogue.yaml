schemaVersion: 1
locale: ruRU
era: vanilla
class: rogue
texts:
  tree.1:
    name: Ликвидация
  talent.improved_eviscerate:
    name: Улучшенное потрошение
    tooltip:
    - Повышение на 5% урона, наносимого при применении способности "Потрошение".
    - Повышение на 10% урона, наносимого при применении способности "Потрошение".
    - Повышение на 15% урона, наносимого при применении способности "Потрошение".
  talent.remorseless_attacks:
    name: Беспощадные атаки
    tooltip:
    - Повышение вероятности критического поражения следующими способностями "Коварный
      удар", "Удар в спину", "Внезапный удар" и "Призрачный удар" на 20% после убийства,
      которое приносит опыт или честь. Время действия – 20 сек.
    - Повышение вероятности критического поражения следующими способностями "Коварный
      удар", "Удар в спину", "Внезапный удар" и "Призрачный удар" на 40% после убийства,
      которое приносит опыт или честь. Время действия – 20 сек.
  talent.malice:
    name: Злоба
    tooltip:
    - Увеличивает вероятность нанести критический удар на 1%.
    - Увеличивает вероятность нанести критический удар на 2%.
    - Увеличивает вероятность нанести критический удар на 3%.
    - Увеличивает вероятность нанести критический удар на 4%.
    - Увеличивает вероятность нанести критический удар на 5%.
  talent.ruthlessness:
    name: Жестокость
    tooltip:
    - С вероятностью 20% ваш завершающий прием начнет новую серию приемов.
    - С вероятностью 40% ваш завершающий прием начнет новую серию приемов.
    - С вероятностью 60% ваш завершающий прием начнет новую серию приемов.
  talent.murder:
    name: Убийство
    tooltip:
    - Повышение урона, наносимого гуманоидам, великанам, животным и драконам на 1%.
    - Повышение урона, наносимого гуманоидам, великанам, животным и драконам на 2%.
  talent.improved_slice_and_dice:
    name: Улучшенная мясорубка
    tooltip:
    - Увеличение длительности "Мясорубки" на 15%.
    - Увеличение длительности "Мясорубки" на 30%.
    - Увеличение длительности "Мясорубки" на 45%.
  talent.relentless_strikes:
    name: Неослабевающие удары
    tooltip:
    - С вероятностью 20% за каждый прием в серии ваш завершающий прием восстановит
      25 энергии.
  talent.improved_expose_armor:
    name: Улучшенное ослабление доспеха
    tooltip:
    - Повышение на 25% эффекта ослабления брони при применении способности "Ослабление
      доспеха".
    - Повышение на 50% эффекта ослабления брони при применении способности "Ослабление
      доспеха".
  talent.lethality:
    name: Смертоносность
    tooltip:
    - Увеличивает урон от критических ударов способностей "Коварный удар", "Парализующий
      удар", "Удар в спину", "Призрачный удар" и "Кровоизлияние" на 6%.
    - Увеличивает урон от критических ударов способностей "Коварный удар", "Парализующий
      удар", "Удар в спину", "Призрачный удар" и "Кровоизлияние" на 12%.
    - Увеличивает урон от критических ударов способностей "Коварный удар", "Парализующий
      удар", "Удар в спину", "Призрачный удар" и "Кровоизлияние" на 18%.
    - Увеличивает урон от критических ударов способностей "Коварный удар", "Парализующий
      удар", "Удар в спину", "Призрачный удар" и "Кровоизлияние" на 24%.
    - Увеличивает урон от критических ударов способностей "Коварный удар", "Парализующий
      удар", "Удар в спину", "Призрачный удар" и "Кровоизлияние" на 30%.
  talent.vile_poisons:
    name: Тлетворные яды
    tooltip:
    - Увеличение урона, наносимого вашими ядами, на 4% и увеличение шанса того, что
      ваши яды не подвергнутся рассеиванию, на 8%.
    - Увеличение урона, наносимого вашими ядами, на 8% и увеличение шанса того, что
      ваши яды не подвергнутся рассеиванию, на 16%.
    - Увеличение урона, наносимого вашими ядами, на 12% и увеличение шанса того, что
      ваши яды не подвергнутся рассеиванию, на 24%.
    - Увеличение урона, наносимого вашими ядами, на 16% и увеличение шанса того, что
      ваши яды не подвергнутся рассеиванию, на 32%.
    - Увеличение урона, наносимого вашими ядами, на 20% и увеличение шанса того, что
      ваши яды не подвергнутся рассеиванию, на 40%.
