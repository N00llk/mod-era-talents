    - Сокращение времени восстановления ваших способностей "Спринт" и "Ускользание"
      на 1.5 мин.
  talent.riposte:
    name: Ответный удар
    tooltip:
    - Этот удар становится доступен игроку после парирования удара противника. Эта
      атака наносит 150% урона от оружия и обезоруживает противника на 6 сек.
