    - В случае, если прием, увеличивающий длину серии, нанесет критический урон, есть
      вероятность 100%, что длина серии увеличится дополнительно на 1 прием.
  talent.vigor:
    name: Неутомимость
    tooltip:
    - Увеличение на 10 ед. максимального запаса энергии.
  tree.2:
    name: Бой
  talent.improved_gouge:
    name: Улучшенный парализующий удар
    tooltip:
    - Увеличение продолжительности действия эффекта способности "Парализующий удар"
      на 0.5 сек.
    - Увеличение продолжительности действия эффекта способности "Парализующий удар"
