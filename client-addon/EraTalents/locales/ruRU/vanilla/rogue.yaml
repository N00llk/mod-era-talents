    - При воздействии вашей способности "Удар по почкам" противник получает дополнительно
      9% урона от всех источников.
  talent.seal_fate:
    name: Печать судьбы
    tooltip:
    - В случае, если прием, увеличивающий длину серии, нанесет критический урон, есть
      вероятность 20%, что длина серии увеличится дополнительно на 1 прием.
    - В случае, если прием, увеличивающий длину серии, нанесет критический урон, есть
