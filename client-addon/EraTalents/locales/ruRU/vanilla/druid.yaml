schemaVersion: 1
locale: ruRU
era: vanilla
class: druid
texts:
  tree.1:
    name: Баланс
  talent.improved_wrath:
    name: Улучшенный гнев
    tooltip:
    - Уменьшение времени наложения заклинания "Гнев" на 0.1 сек.
    - Уменьшение времени наложения заклинания "Гнев" на 0.2 сек.
    - Уменьшение времени наложения заклинания "Гнев" на 0.3 сек.
    - Уменьшение времени наложения заклинания "Гнев" на 0.4 сек.
    - Уменьшение времени наложения заклинания "Гнев" на 0.5 сек.
  talent.nature_s_grasp:
    name: Природный захват
    tooltip:
    - Во время действия заклинания каждый раз, когда противники наносят удар заклинателю,
      их с 35% вероятностью поражает заклинание "Гнев деревьев" (уровень 1). Можно
      использовать только под открытым небом. 1 срабатывание. Время действия – 45
      сек.
  talent.improved_nature_s_grasp:
    name: Улучшенный природный захват
    tooltip:
    - Повышение шанса опутать противника заклинанием "Природный захват" на 15%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 30%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 45%.
    - Повышение шанса опутать противника заклинанием "Природный захват" на 65%.
  talent.improved_entangling_roots:
    name: Улучшенный гнев деревьев
    tooltip:
    - С 40%-й вероятностью ваш "Гнев деревьев" не прерывается при получении урона.
    - С 70%-й вероятностью ваш "Гнев деревьев" не прерывается при получении урона.
    - С 100%-й вероятностью ваш "Гнев деревьев" не прерывается при получении урона.
  talent.improved_moonfire:
    name: Улучшенный лунный огонь
    tooltip:
    - Увеличение урона и шанса на критический удар от вашего заклинания "Лунный огонь"
      на 2%.
    - Увеличение урона и шанса на критический удар от вашего заклинания "Лунный огонь"
      на 4%.
    - Увеличение урона и шанса на критический удар от вашего заклинания "Лунный огонь"
      на 6%.
    - Увеличение урона и шанса на критический удар от вашего заклинания "Лунный огонь"
      на 8%.
    - Увеличение урона и шанса на критический удар от вашего заклинания "Лунный огонь"
      на 10%.
  talent.natural_weapons:
    name: Природное оружие
    tooltip:
    - Увеличивает урон, наносимый физическими атаками во всех обликах, на 2%.
    - Увеличивает урон, наносимый физическими атаками во всех обликах, на 4%.
    - Увеличивает урон, наносимый физическими атаками во всех обликах, на 6%.
    - Увеличивает урон, наносимый физическими атаками во всех обликах, на 8%.
    - Увеличивает урон, наносимый физическими атаками во всех обликах, на 10%.
  talent.natural_shapeshifter:
    name: Прирожденный оборотень
    tooltip:
    - Снижение расхода маны на оборотничество на 10%.
    - Снижение расхода маны на оборотничество на 20%.
    - Снижение расхода маны на оборотничество на 30%.
  talent.improved_thorns:
    name: Улучшенные шипы
    tooltip:
    - Увеличение на 25% урона, наносимого вашим заклинанием "Шипы".
    - Увеличение на 50% урона, наносимого вашим заклинанием "Шипы".
    - Увеличение на 75% урона, наносимого вашим заклинанием "Шипы".
  talent.omen_of_clarity:
    name: Знамение ясности
    tooltip:
    - Переполняет друида энергией природы. Атаки ближнего боя с некоторой вероятностью
      дают друиду эффект "Ясность мысли", который снижает затраты маны, ярости или энергии
      на следующую атакующую способность, исцеляющее или наносящее урон заклинание на
      100%. Время действия – 10 мин.
  talent.nature_s_reach:
    name: Предел сил Природы
    tooltip:
    - Повышение дальности действия заклинаний "Гнев", "Гнев деревьев", "Волшебный огонь",
      "Лунный огонь", "Звездный огонь" и "Гроза" на 10%.
    - Повышение дальности действия заклинаний "Гнев", "Гнев деревьев", "Волшебный огонь",
      "Лунный огонь", "Звездный огонь" и "Гроза" на 20%.
  talent.vengeance:
    name: Отмщение
    tooltip:
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 20%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 40%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 60%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 80%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний "Звездный огонь",
      "Лунный огонь" и "Гнев" на 100%.
  talent.improved_starfire:
    name: Улучшенный звездный огонь
    tooltip:
    - Уменьшение времени применения заклинания "Звездный огонь" на 0.1 с. Кроме того,
      оно будет с вероятностью 3% оглушать цель на 3 сек.
    - Уменьшение времени применения заклинания "Звездный огонь" на 0.2 с. Кроме того,
      оно будет с вероятностью 6% оглушать цель на 3 сек.
    - Уменьшение времени применения заклинания "Звездный огонь" на 0.3 с. Кроме того,
      оно будет с вероятностью 9% оглушать цель на 3 сек.
    - Уменьшение времени применения заклинания "Звездный огонь" на 0.4 с. Кроме того,
      оно будет с вероятностью 12% оглушать цель на 3 сек.
    - Уменьшение времени применения заклинания "Звездный огонь" на 0.5 с. Кроме того,
      оно будет с вероятностью 15% оглушать цель на 3 сек.
  talent.nature_s_grace:
    name: Благоволение природы
    tooltip:
    - Все критические удары заклинаниями одаряют вас благословением Природы, снижая
      время наложения следующего заклинания на 0.5 сек.
  talent.moonglow:
    name: Лунное сияние
    tooltip:
    - Снижение расхода маны на заклинания "Лунный огонь", "Звездный огонь", "Гнев",
      "Целительное прикосновение", "Восстановление" и "Омоложение" на 3%.
    - Снижение расхода маны на заклинания "Лунный огонь", "Звездный огонь", "Гнев",
      "Целительное прикосновение", "Восстановление" и "Омоложение" на 6%.
    - Снижение расхода маны на заклинания "Лунный огонь", "Звездный огонь", "Гнев",
      "Целительное прикосновение", "Восстановление" и "Омоложение" на 9%.
  talent.moonfury:
    name: Лунное неистовство
    tooltip:
    - Увеличивает урон от заклинаний "Звездный огонь", "Лунный огонь" и "Гнев" на 2%.
    - Увеличивает урон от заклинаний "Звездный огонь", "Лунный огонь" и "Гнев" на 4%.
    - Увеличивает урон от заклинаний "Звездный огонь", "Лунный огонь" и "Гнев" на 6%.
    - Увеличивает урон от заклинаний "Звездный огонь", "Лунный огонь" и "Гнев" на 8%.
    - Увеличивает урон от заклинаний "Звездный огонь", "Лунный огонь" и "Гнев" на 10%.
  talent.moonkin_form:
    name: Облик лунного совуха
    tooltip:
    - Вы принимаете облик лунного совуха. В этом облике бонус к броне от предметов увеличивается
      на 360%, а вероятность критического эффекта заклинаний участников группы в радиусе
      30 м повышается на 3%. В облике лунного совуха можно применять только заклинания
      специализации "Баланс". Смена облика освобождает от эффектов превращения и затрудняющих
      передвижение эффектов.
  tree.2:
    name: Сила зверя
  talent.ferocity:
    name: Свирепость
    tooltip:
    - Снижает стоимость способностей "Трепка", "Размах", "Цапнуть" и "Глубокая рана"
      на 1 ед.
    - Снижает стоимость способностей "Трепка", "Размах", "Цапнуть" и "Глубокая рана"
      на 2 ед.
    - Снижает стоимость способностей "Трепка", "Размах", "Цапнуть" и "Глубокая рана"
      на 3 ед.
    - Снижает стоимость способностей "Трепка", "Размах", "Цапнуть" и "Глубокая рана"
      на 4 ед.
    - Снижает стоимость способностей "Трепка", "Размах", "Цапнуть" и "Глубокая рана"
      на 5 ед.
  talent.feral_aggression:
    name: Звериная агрессия
    tooltip:
    - Ваш "Устрашающий рев" снижает силу атаки противника дополнительно на 8%. Ваш
      "Свирепый укус" наносит на 3% больше урона.
    - Ваш "Устрашающий рев" снижает силу атаки противника дополнительно на 16%. Ваш
      "Свирепый укус" наносит на 6% больше урона.
    - Ваш "Устрашающий рев" снижает силу атаки противника дополнительно на 24%. Ваш
      "Свирепый укус" наносит на 9% больше урона.
    - Ваш "Устрашающий рев" снижает силу атаки противника дополнительно на 32%. Ваш
      "Свирепый укус" наносит на 12% больше урона.
    - Ваш "Устрашающий рев" снижает силу атаки противника дополнительно на 40%. Ваш
      "Свирепый укус" наносит на 15% больше урона.
  talent.feral_instinct:
    name: Животный инстинкт
    tooltip:
    - Увеличение угрозы, наносимой в форме медведя или лютого медведя, на 3% и уменьшение
      для противника шансов заметить вас, пока вы пользуетесь способностью "Красться".
    - Увеличение угрозы, наносимой в форме медведя или лютого медведя, на 6% и уменьшение
      для противника шансов заметить вас, пока вы пользуетесь способностью "Красться".
    - Увеличение угрозы, наносимой в форме медведя или лютого медведя, на 9% и уменьшение
      для противника шансов заметить вас, пока вы пользуетесь способностью "Красться".
    - Увеличение угрозы, наносимой в форме медведя или лютого медведя, на 12% и уменьшение
      для противника шансов заметить вас, пока вы пользуетесь способностью "Красться".
    - Увеличение угрозы, наносимой в форме медведя или лютого медведя, на 15% и уменьшение
      для противника шансов заметить вас, пока вы пользуетесь способностью "Красться".
  talent.brutal_impact:
    name: Жестокий удар
    tooltip:
    - Увеличивает длительность эффекта оглушения от ваших способностей "Оглушить"
      и "Наскок" на 0.5 сек.
    - Увеличивает длительность эффекта оглушения от ваших способностей "Оглушить"
      и "Наскок" на 1 сек.
  talent.thick_hide:
    name: Плотная шкура
    tooltip:
    - Увеличение на 2% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 4% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 6% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 8% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 10% эффективности усиления брони за счет носимой экипировки.
  talent.feline_swiftness:
    name: Кошачья скорость
    tooltip:
    - Повышает скорость передвижения в облике кошки вне помещений на 15%, а вероятность
      уклонения в облике кошки – на 2%.
    - Повышает скорость передвижения в облике кошки вне помещений на 30%, а вероятность
      уклонения в облике кошки – на 4%.
  talent.feral_charge:
    name: Звериная атака
    tooltip:
    - Бросается к противнику, обездвиживая его и прерывая применение заклинаний на
      4 сек.
  talent.sharpened_claws:
    name: Острые когти
    tooltip:
    - Увеличение на 2% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
    - Увеличение на 4% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
    - Увеличение на 6% вероятности нанесения критического урона в облике кошки, медведя
      или лютого медведя.
  talent.improved_shred:
    name: Улучшенное полосование
    tooltip:
    - Снижение расхода энергии на способность "Полоснуть" на 6 ед.
    - Снижение расхода энергии на способность "Полоснуть" на 12 ед.
  talent.predatory_strikes:
    name: Удары хищника
    tooltip:
    - Увеличивает силу атаки ближнего боя на 50% от уровня в облике кошки, медведя
      или лютого медведя.
    - Увеличивает силу атаки ближнего боя на 100% от уровня в облике кошки, медведя
      или лютого медведя.
    - Увеличивает силу атаки ближнего боя на 150% от уровня в облике кошки, медведя
      или лютого медведя.
  talent.blood_frenzy:
    name: Кровавое неистовство
    tooltip:
    - В случае, если прием облика кошки, увеличивающий длину серии, нанесет критический
      урон, есть вероятность 50%, что длина серии увеличится дополнительно на 1 прием.
    - В случае, если прием облика кошки, увеличивающий длину серии, нанесет критический
      урон, есть вероятность 100%, что длина серии увеличится дополнительно на 1 прием.
  talent.primal_fury:
    name: Изначальное неистовство
    tooltip:
    - С вероятностью 50% дает дополнительно 5 ед. ярости, когда вы наносите критический
      удар в облике медведя или лютого медведя.
    - С вероятностью 100% дает дополнительно 5 ед. ярости, когда вы наносите критический
      удар в облике медведя или лютого медведя.
  talent.savage_fury:
    name: Бешеное неистовство
    tooltip:
    - Увеличивает урон, наносимый вашими способностями "Цапнуть", "Глубокая рана", "Трепка"
      и "Размах" на 10%.
    - Увеличивает урон, наносимый вашими способностями "Цапнуть", "Глубокая рана", "Трепка"
      и "Размах" на 20%.
  talent.faerie_fire_feral:
    name: Волшебный огонь (сила зверя)
    tooltip:
    - Ослабляет броню на 175 ед. на 40 сек. Во время действия заклинания цель не может
      становиться незаметной или невидимой.
  talent.heart_of_the_wild:
    name: Сердце дикой природы
    tooltip:
    - Повышает интеллект на 4%, выносливость в облике медведя и лютого медведя — на
      2%, а силу атаки в облике кошки — на 2%.
    - Повышает интеллект на 8%, выносливость в облике медведя и лютого медведя — на
      4%, а силу атаки в облике кошки — на 4%.
    - Повышает интеллект на 12%, выносливость в облике медведя и лютого медведя — на
      6%, а силу атаки в облике кошки — на 6%.
    - Повышает интеллект на 16%, выносливость в облике медведя и лютого медведя — на
      8%, а силу атаки в облике кошки — на 8%.
    - Повышает интеллект на 20%, выносливость в облике медведя и лютого медведя — на
      10%, а силу атаки в облике кошки — на 10%.
  talent.leader_of_the_pack:
    name: Вожак стаи
    tooltip:
    - В обличье кошки, медведя или лютого медведя способность "Вожак стаи" повышает
      вероятность нанесения критического удара всеми членами группы в радиусе 45 м.
      как в дальнем, так и в ближнем бою на 3%.
  tree.3:
    name: Исцеление
  talent.improved_mark_of_the_wild:
    name: Улучшенный знак дикой природы
    tooltip:
    - Увеличение эффекта от заклинаний "Знак дикой природы" и "Дар леса" на 7%.
    - Увеличение эффекта от заклинаний "Знак дикой природы" и "Дар леса" на 14%.
    - Увеличение эффекта от заклинаний "Знак дикой природы" и "Дар леса" на 21%.
    - Увеличение эффекта от заклинаний "Знак дикой природы" и "Дар леса" на 28%.
    - Увеличение эффекта от заклинаний "Знак дикой природы" и "Дар леса" на 35%.
  talent.furor:
    name: Гнев
    tooltip:
    - Дает вам 20% шанс обрести 10 ед. ярости при превращении в облик медведя или
      лютого медведя; или 40 ед. энергии при превращении в облик кошки.
    - Дает вам 40% шанс обрести 10 ед. ярости при превращении в облик медведя или
      лютого медведя; или 40 ед. энергии при превращении в облик кошки.
    - Дает вам 60% шанс обрести 10 ед. ярости при превращении в облик медведя или
      лютого медведя; или 40 ед. энергии при превращении в облик кошки.
    - Дает вам 80% шанс обрести 10 ед. ярости при превращении в облик медведя или
      лютого медведя; или 40 ед. энергии при превращении в облик кошки.
    - Дает вам 100% шанс обрести 10 ед. ярости при превращении в облик медведя или
      лютого медведя; или 40 ед. энергии при превращении в облик кошки.
  talent.improved_healing_touch:
    name: Улучшенное целительное прикосновение
    tooltip:
    - Уменьшение времени наложения заклинания "Целительное прикосновение" на 0.1 сек.
    - Уменьшение времени наложения заклинания "Целительное прикосновение" на 0.2 сек.
    - Уменьшение времени наложения заклинания "Целительное прикосновение" на 0.3 сек.
    - Уменьшение времени наложения заклинания "Целительное прикосновение" на 0.4 сек.
    - Уменьшение времени наложения заклинания "Целительное прикосновение" на 0.5 сек.
  talent.nature_s_focus:
    name: Средоточие Природы
    tooltip:
