    tooltip:
    - Прицельный выстрел, увеличивающий урон в дальнем бою на 70 ед.
  talent.improved_arcane_shot:
    name: Улучшенный чародейский выстрел
    tooltip:
    - Сокращение времени восстановления вашего заклинания "Чародейский выстрел" на 0.2
