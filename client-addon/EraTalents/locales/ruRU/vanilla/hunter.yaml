    - Увеличение на 4% урона, наносимого "Укусом змеи".
    - Увеличение на 6% урона, наносимого "Укусом змеи".
    - Увеличение на 8% урона, наносимого "Укусом змеи".
    - Увеличение на 10% урона, наносимого "Укусом змеи".
