    name: Глаз ястреба
    tooltip:
    - Увеличение дальности применения оружия дальнего боя на 2 м.
    - Увеличение дальности применения оружия дальнего боя на 4 м.
    - Увеличение дальности применения оружия дальнего боя на 6 м.
  talent.improved_serpent_sting:
