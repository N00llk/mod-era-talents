      боя]на 18%.'
    - 'Увеличивает дополнительный урон при критическом ударе оружием дальнего боя
      [S03 – настройка и отмена пассивных эффектов – охотник: и способностями ближнего
      боя]на 24%.'
    - 'Увеличивает дополнительный урон при критическом ударе оружием дальнего боя
