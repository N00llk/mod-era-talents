    name: Улучшенный звериный глаз
    tooltip:
    - Увеличение длительности заклинания "Звериный глаз" на 30 сек.
    - Увеличение длительности заклинания "Звериный глаз" на 60 сек.
  talent.improved_aspect_of_the_monkey:
    name: Улучшенный дух обезьяны
    tooltip:
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 1%.
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 2%.
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 3%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 4%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 5%.
  talent.thick_hide:
    name: Плотная шкура
    tooltip:
    - Увеличивает рейтинг брони ваших питомцев на 10%.
    - Увеличивает рейтинг брони ваших питомцев на 20%.
    - Увеличивает рейтинг брони ваших питомцев на 30%.
  talent.improved_revive_pet:
    name: Улучшенное воскрешение питомца
    tooltip:
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 3 сек., расход
      маны уменьшается на 20%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 15%.
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 6 сек., расход
      маны уменьшается на 40%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 30%.
  talent.pathfinding:
    name: Знание троп
    tooltip:
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 3%.
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 6%.
  talent.bestial_swiftness:
    name: Звериная стремительность
    tooltip:
    - Увеличение скорости передвижения ваших питомцев вне помещений на 30%.
  talent.unleashed_fury:
    name: Неудержимое неистовство
    tooltip:
    - Увеличение урона, наносимого вашими питомцами, на 4%.
    - Увеличение урона, наносимого вашими питомцами, на 8%.
    - Увеличение урона, наносимого вашими питомцами, на 12%.
    - Увеличение урона, наносимого вашими питомцами, на 16%.
    - Увеличение урона, наносимого вашими питомцами, на 20%.
  talent.improved_mend_pet:
    name: Улучшенное лечение питомца
    tooltip:
    - С вероятностью 15% способность "Лечение питомца" на каждом такте может снять
      с питомца 1 эффект проклятия, болезни, магии или яда.
    - С вероятностью 50% способность "Лечение питомца" на каждом такте может снять
      с питомца 1 эффект проклятия, болезни, магии или яда.
  talent.ferocity:
    name: Свирепость
    tooltip:
    - Повышает вероятность критического удара питомца на 3%.
    - Повышает вероятность критического удара питомца на 6%.
    - Повышает вероятность критического удара питомца на 9%.
    - Повышает вероятность критического удара питомца на 12%.
    - Повышает вероятность критического удара питомца на 15%.
  talent.spirit_bond:
    name: Узы духа
    tooltip:
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 1% общего объема
      здоровья раз в 10 сек.
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 2% общего объема
      здоровья раз в 10 сек.
  talent.intimidation:
    name: Устрашение
    tooltip:
    - Приказ вашему питомцу запугивать цель в следующей успешной атаке ближнего боя,
      что вызывает высокий уровень угрозы и оглушает цель на 3 сек.
