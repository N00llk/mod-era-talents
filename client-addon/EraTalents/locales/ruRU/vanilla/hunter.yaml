    tooltip:
    - Увеличение дальности применения оружия дальнего боя на 2 метра:метров.
    - Увеличение дальности применения оружия дальнего боя на 4 метра:метров.
    - Увеличение дальности применения оружия дальнего боя на 6 метра:метров.
