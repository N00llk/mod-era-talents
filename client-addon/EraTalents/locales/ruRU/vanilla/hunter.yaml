schemaVersion: 1
locale: ruRU
era: vanilla
class: hunter
texts:
  tree.1:
    name: Повелитель зверей
  talent.improved_aspect_of_the_hawk:
    name: Улучшенный дух ястреба
    tooltip:
    - Если охотник обратился к духу ястреба, все обычные атаки получают 1% шанс увеличить
      скорость атаки дальнего боя на 30% на 12 сек.
    - Если охотник обратился к духу ястреба, все обычные атаки получают 2% шанс увеличить
      скорость атаки дальнего боя на 30% на 12 сек.
    - Если охотник обратился к духу ястреба, все обычные атаки получают 3% шанс увеличить
      скорость атаки дальнего боя на 30% на 12 сек.
    - Если охотник обратился к духу ястреба, все обычные атаки получают 4% шанс увеличить
      скорость атаки дальнего боя на 30% на 12 сек.
    - Если охотник обратился к духу ястреба, все обычные атаки получают 5% шанс увеличить
      скорость атаки дальнего боя на 30% на 12 сек.
  talent.endurance_training:
    name: Тренировка стойкости
    tooltip:
    - Увеличение здоровья вашего питомца на 3%.
    - Увеличение здоровья вашего питомца на 6%.
    - Увеличение здоровья вашего питомца на 9%.
    - Увеличение здоровья вашего питомца на 12%.
    - Увеличение здоровья вашего питомца на 15%.
  talent.improved_eyes_of_the_beast:
    name: Улучшенный звериный глаз
    tooltip:
    - Увеличение длительности заклинания "Звериный глаз" на 30 сек.
    - Увеличение длительности заклинания "Звериный глаз" на 60 сек.
  talent.improved_aspect_of_the_monkey:
    name: Улучшенный дух обезьяны
    tooltip:
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 1%.
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 2%.
    - Увеличение дополнительного уклонения при использовании способности "Дух обезьяны"
      на 3%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 4%.
    - Увеличивает шанс уклониться при обращении к духу обезьяны на 5%.
  talent.thick_hide:
    name: Плотная шкура
    tooltip:
    - Увеличивает рейтинг брони ваших питомцев на 10%.
    - Увеличивает рейтинг брони ваших питомцев на 20%.
    - Увеличивает рейтинг брони ваших питомцев на 30%.
  talent.improved_revive_pet:
    name: Улучшенное воскрешение питомца
    tooltip:
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 3 сек., расход
      маны уменьшается на 20%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 15%.
    - Время наложения заклинания "Воскрешение питомца" уменьшается на 6 сек., расход
      маны уменьшается на 40%, здоровье, которым наделен ваш питомец по возвращении,
      увеличивается дополнительно на 30%.
  talent.pathfinding:
    name: Знание троп
    tooltip:
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 3%.
    - Увеличение приращения скорости при обращении к духу гепарда и духу стаи на 6%.
  talent.bestial_swiftness:
    name: Звериная стремительность
    tooltip:
    - Увеличение скорости передвижения ваших питомцев вне помещений на 30%.
  talent.unleashed_fury:
    name: Неудержимое неистовство
    tooltip:
    - Увеличение урона, наносимого вашими питомцами, на 4%.
    - Увеличение урона, наносимого вашими питомцами, на 8%.
    - Увеличение урона, наносимого вашими питомцами, на 12%.
    - Увеличение урона, наносимого вашими питомцами, на 16%.
    - Увеличение урона, наносимого вашими питомцами, на 20%.
  talent.improved_mend_pet:
    name: Улучшенное лечение питомца
    tooltip:
    - С вероятностью 15% способность "Лечение питомца" на каждом такте может снять
      с питомца 1 эффект проклятия, болезни, магии или яда.
    - С вероятностью 50% способность "Лечение питомца" на каждом такте может снять
      с питомца 1 эффект проклятия, болезни, магии или яда.
  talent.ferocity:
    name: Свирепость
    tooltip:
    - Повышает вероятность критического удара питомца на 3%.
    - Повышает вероятность критического удара питомца на 6%.
    - Повышает вероятность критического удара питомца на 9%.
    - Повышает вероятность критического удара питомца на 12%.
    - Повышает вероятность критического удара питомца на 15%.
  talent.spirit_bond:
    name: Узы духа
    tooltip:
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 1% общего объема
      здоровья раз в 10 сек.
    - Пока ваш питомец активен, вы и ваш питомец восстанавливаете 2% общего объема
      здоровья раз в 10 сек.
  talent.intimidation:
    name: Устрашение
    tooltip:
    - Приказ вашему питомцу запугивать цель в следующей успешной атаке ближнего боя,
      что вызывает высокий уровень угрозы и оглушает цель на 3 сек.
  talent.bestial_discipline:
    name: Беспрекословное послушание
    tooltip:
    - Ускорение восстановления тонуса ваших питомцев на 10%.
    - Ускорение восстановления тонуса ваших питомцев на 20%.
  talent.frenzy:
    name: Бешенство
    tooltip:
    - Дает вашему питомцу 20% шанс увеличить скорость атаки на 30% в течение 8 сек
      после нанесения критического удара.
    - Дает вашему питомцу 40% шанс увеличить скорость атаки на 30% в течение 8 сек
      после нанесения критического удара.
    - Дает вашему питомцу 60% шанс увеличить скорость атаки на 30% в течение 8 сек
      после нанесения критического удара.
    - Дает вашему питомцу 80% шанс увеличить скорость атаки на 30% в течение 8 сек
      после нанесения критического удара.
    - Дает вашему питомцу 100% шанс увеличить скорость атаки на 30% в течение 8 сек
      после нанесения критического удара.
  talent.bestial_wrath:
    name: Звериный гнев
    tooltip:
    - Введение питомца в ярость, повышающую наносимый им урон на 50% на 18 сек. В
      состоянии ярости питомец не знает ни страха, ни жалости, и только смерть может
      остановить его.
  tree.2:
    name: Стрельба
  talent.improved_concussive_shot:
    name: Улучшенный контузящий выстрел
    tooltip:
    - Повышение до 4% вероятности оглушения противника на 3 сек при использовании
      способности "Шокирующий выстрел".
    - Повышение до 8% вероятности оглушения противника на 3 сек при использовании
      способности "Шокирующий выстрел".
    - Повышение до 12% вероятности оглушения противника на 3 сек при использовании
      способности "Шокирующий выстрел".
    - Повышение до 16% вероятности оглушения противника на 3 сек при использовании
      способности "Шокирующий выстрел".
    - Повышение до 20% вероятности оглушения противника на 3 сек при использовании
      способности "Шокирующий выстрел".
  talent.efficiency:
    name: Эффективность
    tooltip:
    - 'Снижает стоимость способностей категорий "Выстрел" [S03 – настройка и отмена
      пассивных эффектов – охотник: "Удар"] и "Укус" на 2%.'
    - 'Снижает стоимость способностей категорий "Выстрел" [S03 – настройка и отмена
      пассивных эффектов – охотник: "Удар"] и "Укус" на 4%.'
    - 'Снижает стоимость способностей категорий "Выстрел" [S03 – настройка и отмена
      пассивных эффектов – охотник: "Удар"] и "Укус" на 6%.'
    - 'Снижает стоимость способностей категорий "Выстрел" [S03 – настройка и отмена
      пассивных эффектов – охотник: "Удар"] и "Укус" на 8%.'
    - 'Снижает стоимость способностей категорий "Выстрел" [S03 – настройка и отмена
      пассивных эффектов – охотник: "Удар"] и "Укус" на 10%.'
  talent.improved_hunter_s_mark:
    name: Улучшенная метка охотника
    tooltip:
    - Увеличивает на 3% дополнительную силу атаки в дальнем бою от "Метки охотника".
    - Увеличивает на 6% дополнительную силу атаки в дальнем бою от "Метки охотника".
    - Увеличивает на 9% дополнительную силу атаки в дальнем бою от "Метки охотника".
    - Увеличивает на 12% дополнительную силу атаки в дальнем бою от "Метки охотника".
    - Увеличивает на 15% дополнительную силу атаки в дальнем бою от "Метки охотника".
  talent.lethal_shots:
    name: Стрельба на поражение
    tooltip:
    - Повышает вероятность критического удара оружием дальнего боя на 1%.
