    - Повышает вероятность критического удара при применении "Удара ящера" и "Укуса
      мангуста" на 20%.
  talent.improved_wing_clip:
    name: Улучшенная подрезка крыльев
    tooltip:
    - Ваша способность "Подрезать крылья" обездвиживает цель на 5 сек с 4% вероятностью.
    - Ваша способность "Подрезать крылья" обездвиживает цель на 5 сек с 8% вероятностью.
    - Ваша способность "Подрезать крылья" обездвиживает цель на 5 сек с 12% вероятностью.
    - Ваша способность "Подрезать крылья" обездвиживает цель на 5 сек с 16% вероятностью.
