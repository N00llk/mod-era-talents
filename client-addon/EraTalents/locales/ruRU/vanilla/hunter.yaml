schemaVersion: 1
locale: ruRU
era: vanilla
class: hunter
texts:
  tree.1:
    name: Повелитель зверей
  talent.improved_aspect_of_the_hawk:
    name: Улучшенный дух ястреба
    tooltip:
    - Увеличивает бонус к силе атаки дальнего боя от "Духа ястреба" на 4%.
    - Увеличивает бонус к силе атаки дальнего боя от "Духа ястреба" на 8%.
    - Увеличивает бонус к силе атаки дальнего боя от "Духа ястреба" на 12%.
    - Увеличивает бонус к силе атаки дальнего боя от "Духа ястреба" на 16%.
    - Увеличивает бонус к силе атаки дальнего боя от "Духа ястреба" на 20%.
  talent.endurance_training:
    name: Тренировка стойкости
    tooltip:
    - Увеличение здоровья вашего питомца на 3%.
    - Увеличение здоровья вашего питомца на 6%.
    - Увеличение здоровья вашего питомца на 9%.
    - Увеличение здоровья вашего питомца на 12%.
    - Увеличение здоровья вашего питомца на 15%.
