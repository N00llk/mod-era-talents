schemaVersion: 1
locale: ruRU
era: vanilla
class: mage
texts:
  tree.1:
    name: Тайная магия
  talent.arcane_subtlety:
    name: Искусные чары
    tooltip:
    - Снижение сопротивления цели всем вашим заклинаниям на 5 ед. и снижение угрозы
      от заклинаний тайной магии на 20%.
    - Снижение сопротивления цели всем вашим заклинаниям на 10 ед. и снижение угрозы
      от заклинаний тайной магии на 40%.
  talent.arcane_focus:
    name: Средоточие чар
    tooltip:
    - Снижение на 2% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 4% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 6% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 8% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
    - Снижение на 10% вероятности того, что противник сможет противостоять вашим заклинаниям
      тайной магии.
  talent.improved_arcane_missiles:
    name: Улучшенный чародейский снаряд
    tooltip:
    - С вероятностью 20% полученный урон не прерывает поддержание "Чародейских снарядов".
    - С вероятностью 40% полученный урон не прерывает поддержание "Чародейских снарядов".
    - С вероятностью 60% полученный урон не прерывает поддержание "Чародейских снарядов".
    - С вероятностью 80% полученный урон не прерывает поддержание "Чародейских снарядов".
    - С вероятностью 100% полученный урон не прерывает поддержание "Чародейских снарядов".
  talent.wand_specialization:
    name: Специализация на жезлах
    tooltip:
    - Увеличение на 13% урона, наносимого при использовании магических жезлов.
    - Увеличение на 25% урона, наносимого при использовании магических жезлов.
  talent.magic_absorption:
    name: Магическое поглощение
    tooltip:
    - Повышение всех типов сопротивления на 2 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 1% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 4 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 2% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 6 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 3% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 8 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 4% общего уровня вашей маны. Время
      восстановления - 1 сек.
    - Повышение всех типов сопротивления на 10 ед. Все заклинания, которые не сработали
      из-за вашей сопротивляемости, восстанавливают 5% общего уровня вашей маны. Время
      восстановления - 1 сек.
  talent.arcane_concentration:
    name: Чародейская сосредоточенность
    tooltip:
    - Вероятность 2% войти в состояние "Ясность мысли" после того, как любое ваше заклинание
      нанесет урон противнику. Состояние "Ясность мысли" снижает расход маны на ваше
      следующее поражающее заклинание на 100%.
    - Вероятность 4% войти в состояние "Ясность мысли" после того, как любое ваше заклинание
      нанесет урон противнику. Состояние "Ясность мысли" снижает расход маны на ваше
      следующее поражающее заклинание на 100%.
    - Вероятность 6% войти в состояние "Ясность мысли" после того, как любое ваше заклинание
      нанесет урон противнику. Состояние "Ясность мысли" снижает расход маны на ваше
      следующее поражающее заклинание на 100%.
    - Вероятность 8% войти в состояние "Ясность мысли" после того, как любое ваше заклинание
      нанесет урон противнику. Состояние "Ясность мысли" снижает расход маны на ваше
      следующее поражающее заклинание на 100%.
    - Вероятность 10% войти в состояние "Ясность мысли" после того, как любое ваше заклинание
      нанесет урон противнику. Состояние "Ясность мысли" снижает расход маны на ваше
      следующее поражающее заклинание на 100%.
  talent.magic_attunement:
    name: Магическое созвучие
    tooltip:
    - Усиление действия заклинаний "Усиление магии" и "Ослабление магии" на 25%.
    - Усиление действия заклинаний "Усиление магии" и "Ослабление магии" на 50%.
  talent.improved_arcane_explosion:
    name: Улучшенный чародейский взрыв
    tooltip:
    - Повышает вероятность критического удара при применении "Чародейского взрыва"
      еще на 2%.
    - Повышает вероятность критического удара при применении "Чародейского взрыва"
      еще на 4%.
    - Повышает вероятность критического удара при применении "Чародейского взрыва"
      еще на 6%.
  talent.arcane_resilience:
    name: Чародейская стойкость
    tooltip:
    - Усиление брони на величину, равную 50% от значения интеллекта.
  talent.improved_mana_shield:
    name: Улучшенный щит маны
    tooltip:
    - Снижение на 10% расхода маны на снятие каждой единицы урона, получаемого при
      использовании заклинания "Щит маны".
    - Снижение на 20% расхода маны на снятие каждой единицы урона, получаемого при
      использовании заклинания "Щит маны".
  talent.improved_counterspell:
    name: Улучшенная Антимагия
    tooltip:
    - Повышение до 50% вероятности лишить противника дара речи на 4 сек при применении
      заклинания "Антимагия".
    - Повышение до 100% вероятности лишить противника дара речи на 4 сек при применении
      заклинания "Антимагия".
  talent.arcane_meditation:
    name: Чародейская медитация
    tooltip:
    - В процессе применения заклинаний продолжается 5% от восполнения маны.
    - В процессе применения заклинаний продолжается 10% от восполнения маны.
    - В процессе применения заклинаний продолжается 15% от восполнения маны.
  talent.presence_of_mind:
    name: Присутствие разума
    tooltip:
    - Мгновенное применение следующего магического заклинания, обычное время применения
      которого ниже 10 сек.
  talent.arcane_mind:
    name: Чародейский ум
    tooltip:
    - Повышение максимального запаса маны на 2%.
    - Повышение максимального запаса маны на 4%.
    - Повышение максимального запаса маны на 6%.
    - Повышение максимального запаса маны на 8%.
    - Повышение максимального запаса маны на 10%.
  talent.arcane_instability:
    name: Магическая нестабильность
    tooltip:
    - Увеличение урона от заклинаний и вероятности критического удара на 1%.
    - Увеличение урона от заклинаний и вероятности критического удара на 2%.
    - Увеличение урона от заклинаний и вероятности критического удара на 3%.
  talent.arcane_power:
    name: Мощь тайной магии
    tooltip:
    - Повышение урона от заклинаний на 30% за счет повышения расхода на них маны на
      30%. Время действия – 15 сек.
  tree.2:
    name: Огонь
  talent.improved_fireball:
    name: Улучшенный огненный шар
    tooltip:
    - Уменьшает время применения заклинания "Огненный шар" на 0.1 секунды.
    - Уменьшает время применения заклинания "Огненный шар" на 0.2 секунды.
    - Уменьшает время применения заклинания "Огненный шар" на 0.3 секунды.
    - Уменьшает время применения заклинания "Огненный шар" на 0.4 секунды.
    - Уменьшает время применения заклинания "Огненный шар" на 0.5 секунды.
  talent.impact:
    name: Сотрясение
    tooltip:
    - Есть вероятность 2%, что ваши заклинания огня оглушат цель на 2 сек.
    - Есть вероятность 4%, что ваши заклинания огня оглушат цель на 2 сек.
    - Есть вероятность 6%, что ваши заклинания огня оглушат цель на 2 сек.
    - Есть вероятность 8%, что ваши заклинания огня оглушат цель на 2 сек.
    - Есть вероятность 10%, что ваши заклинания огня оглушат цель на 2 сек.
  talent.ignite:
    name: Воспламенение
    tooltip:
    - Критические удары заклинаниями огня воспламеняют цель, нанося ей дополнительно
      8% урона от примененного заклинания в течение 4 сек.
    - Критические удары заклинаниями огня воспламеняют цель, нанося ей дополнительно
      16% урона от примененного заклинания в течение 4 сек.
    - Критические удары заклинаниями огня воспламеняют цель, нанося ей дополнительно
      24% урона от примененного заклинания в течение 4 сек.
    - Критические удары заклинаниями огня воспламеняют цель, нанося ей дополнительно
      32% урона от примененного заклинания в течение 4 сек.
    - Критические удары заклинаниями огня воспламеняют цель, нанося ей дополнительно
      40% урона от примененного заклинания в течение 4 сек.
  talent.flame_throwing:
    name: Метание пламени
    tooltip:
    - Увеличивает дальность применения ваших заклинаний огня на 3 м.
    - Увеличивает дальность применения ваших заклинаний огня на 6 м.
  talent.improved_fire_blast:
    name: Улучшенный огненный взрыв
    tooltip:
    - Уменьшает время восстановления заклинания "Огненный взрыв" на 0.5 секунды.
    - Уменьшает время восстановления заклинания "Огненный взрыв" на 1 секунды.
    - Уменьшает время восстановления заклинания "Огненный взрыв" на 1.5 секунды.
  talent.incinerate:
    name: Испепеление
    tooltip:
    - Повышает вероятность критического удара при применении "Огненного взрыва" и
      "Ожога" на 2%.
    - Повышает вероятность критического удара при применении "Огненного взрыва" и
      "Ожога" на 4%.
  talent.improved_flamestrike:
    name: Улучшенный огненный столб
    tooltip:
    - Повышает вероятность критического удара при применении "Огненного столба" на
      5%.
    - Повышает вероятность критического удара при применении "Огненного столба" на
      10%.
    - Повышает вероятность критического удара при применении "Огненного столба" на
      15%.
  talent.pyroblast:
    name: Огненная глыба
    tooltip:
    - Бросок огромной огненной глыбы, которая наносит от 148 до 195 ед. урона от огня
      единовременно и 56 ед. урона от огня в течение 12 сек.
  talent.burning_soul:
    name: Пылающая душа
    tooltip:
    - Прочтение заклинаний огня не будет замедлено при получении урона с вероятностью
      35%. Угроза от ваших заклинаний огня уменьшается на 15%.
    - Прочтение заклинаний огня не будет замедлено при получении урона с вероятностью
      70%. Угроза от ваших заклинаний огня уменьшается на 30%.
  talent.improved_scorch:
    name: Улучшенный ожог
    tooltip:
    - Повышение до 33% вероятности сделать цель уязвимой для урона от огня при применении
      на ней заклинания "Ожог". В случае успеха цель в течение 30 сек получает на
      3% больше урона от огня. Эффект может быть суммирован до 5 раз.
    - Повышение до 66% вероятности сделать цель уязвимой для урона от огня при применении
      на ней заклинания "Ожог". В случае успеха цель в течение 30 сек получает на
      3% больше урона от огня. Эффект может быть суммирован до 5 раз.
    - Повышение до 100% вероятности сделать цель уязвимой для урона от огня при применении
      на ней заклинания "Ожог". В случае успеха цель в течение 30 сек получает на
      3% больше урона от огня. Эффект может быть суммирован до 5 раз.
  talent.improved_fire_ward:
    name: Улучшенная защита от огня
    tooltip:
    - Защита от огня с вероятностью 10% отражает заклинания школы огня.
    - Защита от огня с вероятностью 20% отражает заклинания школы огня.
  talent.master_of_elements:
    name: Повелитель Стихий
    tooltip:
    - При критическом поражении противника заклинаниями огня и льда, у вас восстанавливается
      10% от затраченной на них маны.
    - При критическом поражении противника заклинаниями огня и льда, у вас восстанавливается
      20% от затраченной на них маны.
    - При критическом поражении противника заклинаниями огня и льда, у вас восстанавливается
      30% от затраченной на них маны.
  talent.critical_mass:
    name: Критическая масса
    tooltip:
    - Повышает вероятность критического удара при применении заклинаний огня на 2%.
    - Повышает вероятность критического удара при применении заклинаний огня на 4%.
    - Повышает вероятность критического удара при применении заклинаний огня на 6%.
  talent.blast_wave:
    name: Взрывная волна
    tooltip:
    - От заклинателя расходится волна пламени, нанося всем противникам, захваченным
      ею, от 160 до 192 ед. урона от огня и замедляя их на 6 сек.
  talent.fire_power:
    name: Сила огня
    tooltip:
    - Увеличивает урон от ваших заклинаний огня на 2%.
    - Увеличивает урон от ваших заклинаний огня на 4%.
    - Увеличивает урон от ваших заклинаний огня на 6%.
    - Увеличивает урон от ваших заклинаний огня на 8%.
    - Увеличивает урон от ваших заклинаний огня на 10%.
  talent.combustion:
    name: Возгорание
    tooltip:
    - При использовании каждое атакующее заклинание огня, достигшее цели, повышает вероятность
      критического попадания заклинаний огня на 10%. Эффект действует, пока заклинания
      огня не нанесут 3 критических удара.
  tree.3:
    name: Лед
  talent.frost_warding:
    name: Защита от льда
    tooltip:
    - Увеличение на 15% эффекта усиления брони заклинаниями "Морозный доспех" и "Ледяной
      доспех", а также повышение до 10% вероятности отражения заклинаний магии льда
      во время действия эффекта "Защита от магии льда".
    - Увеличение на 30% эффекта усиления брони заклинаниями "Морозный доспех" и "Ледяной
      доспех", а также повышение до 20% вероятности отражения заклинаний магии льда
      во время действия эффекта "Защита от магии льда".
  talent.improved_frostbolt:
    name: Улучшенная ледяная стрела
    tooltip:
    - Снижение времени применения заклинания "Ледяная стрела" на 0.1 сек.
    - Снижение времени применения заклинания "Ледяная стрела" на 0.2 сек.
    - Снижение времени применения заклинания "Ледяная стрела" на 0.3 сек.
    - Снижение времени применения заклинания "Ледяная стрела" на 0.4 сек.
    - Снижение времени применения заклинания "Ледяная стрела" на 0.5 сек.
  talent.elemental_precision:
    name: Точность стихии
    tooltip:
    - Уменьшение шанса целей оказать сопротивление вашим заклинаниям льда и огня на
      2%.
    - Уменьшение шанса целей оказать сопротивление вашим заклинаниям льда и огня на
      4%.
    - Уменьшение шанса целей оказать сопротивление вашим заклинаниям льда и огня на
      6%.
  talent.ice_shards:
    name: Ледяные осколки
    tooltip:
    - Увеличивает дополнительный урон от критических эффектов заклинаний льда на 20%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний льда на 40%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний льда на 60%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний льда на 80%.
    - Увеличивает дополнительный урон от критических эффектов заклинаний льда на 100%.
  talent.frostbite:
    name: Обморожение
    tooltip:
    - Ваши остужающие эффекты получают 5% шанс заморозить цель на 5 сек.
    - Ваши остужающие эффекты получают 10% шанс заморозить цель на 5 сек.
    - Ваши остужающие эффекты получают 15% шанс заморозить цель на 5 сек.
  talent.improved_frost_nova:
    name: Улучшенное кольцо льда
    tooltip:
    - Уменьшает время восстановления "Кольца льда" на 2 сек.
    - Уменьшает время восстановления "Кольца льда" на 4 сек.
  talent.perma_frost:
    name: Вечная мерзлота
    tooltip:
    - Увеличение продолжительности эффектов категории "Стужа" на 1 сек. и снижение
      скорости передвижения противника на 4%.
    - Увеличение продолжительности эффектов категории "Стужа" на 2 сек. и снижение
      скорости передвижения противника на 7%.
    - Увеличение продолжительности эффектов категории "Стужа" на 3 сек. и снижение
      скорости передвижения противника на 10%.
  talent.piercing_ice:
    name: Пронзающий лед
    tooltip:
    - Увеличение урона, наносимого вашими ледяными заклинаниями на 2%.
    - Увеличение урона, наносимого вашими ледяными заклинаниями на 4%.
    - Увеличение урона, наносимого вашими ледяными заклинаниями на 6%.
  talent.cold_snap:
    name: Холодная хватка
    tooltip:
    - При использовании завершает время восстановления всех ваших заклинаний магии
      льда.
  talent.improved_blizzard:
