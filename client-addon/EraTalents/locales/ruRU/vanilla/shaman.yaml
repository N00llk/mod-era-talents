schemaVersion: 1
locale: ruRU
era: vanilla
class: shaman
texts:
  tree.1:
    name: Стихии
  talent.convection:
    name: Конвекция
    tooltip:
    - Снижает расход маны на заклинания "Шок", "Молния" и "Цепная молния" на 2%.
    - Снижает расход маны на заклинания "Шок", "Молния" и "Цепная молния" на 4%.
    - Снижает расход маны на заклинания "Шок", "Молния" и "Цепная молния" на 6%.
    - Снижает расход маны на заклинания "Шок", "Молния" и "Цепная молния" на 8%.
    - Снижает расход маны на заклинания "Шок", "Молния" и "Цепная молния" на 10%.
  talent.concussion:
    name: Сотрясение мозга
    tooltip:
    - Увеличивает на 1% урон, наносимый вашими заклинаниями "Молния", "Цепная молния"
      и "Шок".
    - Увеличивает на 2% урон, наносимый вашими заклинаниями "Молния", "Цепная молния"
      и "Шок".
    - Увеличивает на 3% урон, наносимый вашими заклинаниями "Молния", "Цепная молния"
      и "Шок".
    - Увеличивает на 4% урон, наносимый вашими заклинаниями "Молния", "Цепная молния"
      и "Шок".
    - Увеличивает на 5% урон, наносимый вашими заклинаниями "Молния", "Цепная молния"
      и "Шок".
  talent.earth_s_grasp:
    name: Земной захват
    tooltip:
    - Увеличивает уровень прочности вашего Тотема каменного когтя на 25% и радиус
      действия Тотема оков земли на 10%.
    - Увеличивает уровень прочности вашего Тотема каменного когтя на 50% и радиус
      действия Тотема оков земли на 20%.
  talent.elemental_warding:
    name: Защита от стихий
    tooltip:
    - Уменьшает урон от эффектов огня, льда и природы на 4%.
    - Уменьшает урон от эффектов огня, льда и природы на 7%.
    - Уменьшает урон от эффектов огня, льда и природы на 10%.
  talent.call_of_flame:
    name: Зов пламени
    tooltip:
    - Увеличение на 5% урона, наносимого вашими тотемами огня.
    - Увеличение на 10% урона, наносимого вашими тотемами огня.
    - Увеличение на 15% урона, наносимого вашими тотемами огня.
  talent.elemental_focus:
    name: Концентрация стихий
    tooltip:
    - При произнесении заклинания школы огня, магии льда или природы вы с вероятностью
      10% впадаете в состояние "Ясность мысли". Состояние "Ясность мысли" уменьшает
      расход маны на следующее боевое заклинание на 100%.
  talent.reverberation:
    name: Отзвук
    tooltip:
    - Сокращение времени восстановления заклинания "Шок" на 0.2 сек.
    - Сокращение времени восстановления заклинания "Шок" на 0.4 сек.
    - Сокращение времени восстановления заклинания "Шок" на 0.6 сек.
    - Сокращение времени восстановления заклинания "Шок" на 0.8 сек.
    - Сокращение времени восстановления заклинания "Шок" на 1 сек.
  talent.call_of_thunder:
    name: Зов грома
    tooltip:
    - Повышает вероятность критического удара при применении "Молнии" и "Цепной молнии"
      на 1%.
    - Повышает вероятность критического удара при применении "Молнии" и "Цепной молнии"
      на 2%.
    - Повышает вероятность критического удара при применении "Молнии" и "Цепной молнии"
      на 3%.
    - Повышает вероятность критического удара при применении "Молнии" и "Цепной молнии"
      на 4%.
    - Повышает вероятность критического удара при применении "Молнии" и "Цепной молнии"
      на 6%.
  talent.improved_fire_totems:
    name: Улучшенный тотем огня
    tooltip:
    - Уменьшает паузу перед активацией тотема кольца огня на 1 сек. Снижает угрозу,
      создаваемую тотемом магмы, на 25%.
    - Уменьшает паузу перед активацией тотема кольца огня на 2 сек. Снижает угрозу,
      создаваемую тотемом магмы, на 50%.
  talent.eye_of_the_storm:
    name: Око шторма
    tooltip:
    - Вероятность 33%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
    - Вероятность 66%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
    - Вероятность 100%, что, получив критический удар оружием ближнего или дальнего
      боя, персонаж окажется под воздействием эффекта "Средоточие заклинаний" на 6
      сек. Этот эффект предохраняет от удлинения времени наложения шаманских заклинаний
      при получении урона.
  talent.elemental_devastation:
    name: Опустошение Духов стихии
    tooltip:
    - Критические удары, нанесенные вашими нападательными заклинаниями, увеличивают
      ваш шанс нанести критический удар при атаке в ближнем бою на 3% на 10 сек.
    - Критические удары, нанесенные вашими нападательными заклинаниями, увеличивают
      ваш шанс нанести критический удар при атаке в ближнем бою на 6% на 10 сек.
    - Критические удары, нанесенные вашими нападательными заклинаниями, увеличивают
      ваш шанс нанести критический удар при атаке в ближнем бою на 9% на 10 сек.
  talent.storm_reach:
    name: Предел шторма
    tooltip:
    - Увеличивает возможную дальность применения ваших заклинаний "Молния" и "Цепная
      молния" на 3 метра:метров.
    - Увеличивает возможную дальность применения ваших заклинаний "Молния" и "Цепная
      молния" на 6 метра:метров.
  talent.elemental_fury:
    name: Неистовство стихий
    tooltip:
    - Усиливает бонус критического удара опаляющих тотемов, тотемов магмы, кольца
      огня, а также заклинаний огня, льда и природы на 100%.
  talent.lightning_mastery:
    name: Покорение молнии
    tooltip:
    - Сокращает время наложения заклинаний "Молния" и "Цепная молния" на 0.2 сек.
    - Сокращает время наложения заклинаний "Молния" и "Цепная молния" на 0.4 сек.
    - Сокращает время наложения заклинаний "Молния" и "Цепная молния" на 0.6 сек.
    - Сокращает время наложения заклинаний "Молния" и "Цепная молния" на 0.8 сек.
    - Сокращает время наложения заклинаний "Молния" и "Цепная молния" на 1 сек.
  talent.elemental_mastery:
    name: Покорение стихий
    tooltip:
    - Увеличение вероятности критического эффекта последующего заклинания магии огня,
      льда или сил природы на 100% и снижение расхода маны на него на 100%.
  tree.2:
    name: Совершенствование
  talent.ancestral_knowledge:
    name: Знания предков
    tooltip:
    - Повышение максимального запаса маны на 1%.
    - Повышение максимального запаса маны на 2%.
    - Повышение максимального запаса маны на 3%.
    - Повышение максимального запаса маны на 4%.
    - Повышение максимального запаса маны на 5%.
  talent.shield_specialization:
    name: Специализация на щитах
    tooltip:
    - Повышает вероятность блокирования атаки на 1% и показатель блокирования на 5%.
    - Повышает вероятность блокирования атаки на 2% и показатель блокирования на 10%.
    - Повышает вероятность блокирования атаки на 3% и показатель блокирования на 15%.
    - Повышает вероятность блокирования атаки на 4% и показатель блокирования на 20%.
    - Повышает вероятность блокирования атаки на 5% и показатель блокирования на 25%.
  talent.guardian_totems:
    name: Сторожевые тотемы
    tooltip:
    - Повышение на 10% величниы урона, снижаемого эффектами Тотемов каменной кожи
      и стены ветра, а также снижение времени подготовки Тотема заземления на 1 сек.
    - Повышение на 20% величниы урона, снижаемого эффектами Тотемов каменной кожи
      и стены ветра, а также снижение времени подготовки Тотема заземления на 2 сек.
  talent.thundering_strikes:
    name: Грохочущие удары
    tooltip:
    - Увеличение ваших шансов нанести критический удар оружием на 1%.
    - Увеличение ваших шансов нанести критический удар оружием на 2%.
    - Увеличение ваших шансов нанести критический удар оружием на 3%.
    - Увеличение ваших шансов нанести критический удар оружием на 4%.
    - Увеличение ваших шансов нанести критический удар оружием на 5%.
  talent.improved_ghost_wolf:
    name: Улучшенный призрачный волк
    tooltip:
    - Уменьшение времени наложения заклинания "Призрачный волк" на 1 сек.
    - Уменьшение времени наложения заклинания "Призрачный волк" на 2 сек.
  talent.improved_lightning_shield:
    name: Улучшенный щит молний
    tooltip:
    - Увеличение урона, нанесенного шарами заклинания "Щит молний", на 5%.
    - Увеличение урона, нанесенного шарами заклинания "Щит молний", на 10%.
    - Увеличение урона, нанесенного шарами заклинания "Щит молний", на 15%.
  talent.enhancing_totems:
    name: Улучшенные тотемы
    tooltip:
    - Увеличение эффектов от Тотемов силы земли и легкости воздуха на 8%.
    - Увеличение эффектов от Тотема силы земли и Тотема легкости воздуха на 15%.
  talent.two_handed_axes_and_maces:
    name: Двуручные топоры и ударное оружие
    tooltip:
    - Возможность использовать двуручные топоры и двуручные булавы.
  talent.anticipation:
    name: Предчувствие
    tooltip:
    - Увеличение вероятности уклонения от атак на 1%.
    - Увеличение вероятности уклонения от атак на 2%.
    - Увеличение вероятности уклонения от атак на 3%.
    - Увеличение вероятности уклонения от атак на 4%.
    - Увеличение вероятности уклонения от атак на 5%.
  talent.flurry:
    name: Шквал
    tooltip:
    - Увеличение на 10% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 15% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 20% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 25% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
    - Увеличение на 30% скорости атаки для последующих 3 выпадов после нанесения критического
      урона.
  talent.toughness:
    name: Крепость
    tooltip:
    - Показатель брони, который вы получаете от предметов вашей экипировки, увеличен
      на 2%.
    - Показатель брони, который вы получаете от предметов вашей экипировки, увеличен
      на 4%.
    - Показатель брони, который вы получаете от предметов вашей экипировки, увеличен
      на 6%.
    - Показатель брони, который вы получаете от предметов вашей экипировки, увеличен
      на 8%.
    - Показатель брони, который вы получаете от предметов вашей экипировки, увеличен
      на 10%.
  talent.improved_weapon_totems:
    name: Совершенные тотемы чар
    tooltip:
    - Увеличение дополнительной силы атаки в ближнем бою для вашего Тотема неистовства
      ветра на 15% и увеличение урона, наносимого Тотемом языка пламени, на 6%.
    - Увеличение дополнительной силы атаки в ближнем бою для вашего Тотема неистовства
      ветра на 30% и увеличение урона, наносимого Тотемом языка пламени, на 12%.
  talent.elemental_weapons:
    name: Оружие стихий
    tooltip:
    - Увеличивает бонус к силе атаки в ближнем бою от вашего оружия Камнедробителя
      на 7%, эффект оружия неистовства ветра на 13%, а урон от оружия языка пламени
      и ледяного клейма – на 5%.
    - Увеличивает бонус к силе атаки в ближнем бою от вашего оружия Камнедробителя
      на 14%, эффект оружия неистовства ветра на 27%, а урон от оружия языка пламени
      и ледяного клейма – на 10%.
    - Увеличивает бонус к силе атаки в ближнем бою от вашего оружия Камнедробителя
      на 20%, эффект оружия неистовства ветра на 40%, а урон от оружия языка пламени
      и ледяного клейма – на 15%.
  talent.parry:
    name: Парирование
    tooltip:
    - Дает шанс отразить атаки противника в ближнем бою.
  talent.weapon_mastery:
    name: Мастеркое владение оружием
    tooltip:
    - Увеличение наносимого урона от оружия на 2%.
    - Увеличение наносимого урона от оружия на 4%.
    - Увеличение наносимого урона от оружия на 6%.
    - Увеличение наносимого урона от оружия на 8%.
    - Увеличение наносимого урона от оружия на 10%.
  talent.stormstrike:
    name: Удар бури
    tooltip:
    - Позволяет совершить еще одну атаку. Увеличивает урон от сил природы, который
      цель получит от следующих 2 атак, на 20%. Время действия – 12 сек.
  tree.3:
    name: Исцеление
  talent.improved_healing_wave:
    name: Улучшенная волна исцеления
    tooltip:
    - Уменьшение на 0.1 сек. времени применения заклинания "Волна исцеления".
    - Уменьшение на 0.2 сек. времени применения заклинания "Волна исцеления".
    - Уменьшение на 0.3 сек. времени применения заклинания "Волна исцеления".
    - Уменьшение на 0.4 сек. времени применения заклинания "Волна исцеления".
    - Уменьшение на 0.5 сек. времени применения заклинания "Волна исцеления".
  talent.tidal_focus:
    name: Приливная концентрация
    tooltip:
    - Снижение расхода маны на все заклинания исцеления на 1%.
    - Снижение расхода маны на все заклинания исцеления на 2%.
    - Снижение расхода маны на все заклинания исцеления на 3%.
    - Снижение расхода маны на все заклинания исцеления на 4%.
    - Снижение расхода маны на все заклинания исцеления на 5%.
  talent.improved_reincarnation:
    name: Улучшенное восстание из мертвых
    tooltip:
    - Сокращение времени восстановления заклинания "Восстание из мертвых" на 10 мин.
      и увеличение здоровья и маны, наличествующих после восстания из мертвых, дополнительно
      на 10%.
    - Сокращение времени восстановления заклинания "Восстание из мертвых" на 20 мин.
      и увеличение здоровья и маны, наличествующих после восстания из мертвых, дополнительно
      на 20%.
  talent.ancestral_healing:
    name: Исцеление предков
    tooltip:
    - Усиление на 8% брони цели на 15 сек после получения критического эффекта примененого
      на ней исцеляющего заклинания.
    - Усиление на 16% брони цели на 15 сек после получения критического эффекта примененого
      на ней исцеляющего заклинания.
    - Усиление на 25% брони цели на 15 сек после получения критического эффекта примененого
      на ней исцеляющего заклинания.
  talent.totemic_focus:
    name: Тотемное средоточие
    tooltip:
    - Снижение расхода маны на создание тотемов на 5%.
    - Снижение расхода маны на создание тотемов на 10%.
    - Снижение расхода маны на создание тотемов на 15%.
    - Снижение расхода маны на создание тотемов на 20%.
    - Снижение расхода маны на создание тотемов на 25%.
  talent.nature_s_guidance:
    name: Помощь природы
    tooltip:
    - Увеличение на 1% вероятности нанесения удара в атаках ближнего боя и при применении
      заклинаний.
    - Увеличение на 2% вероятности нанесения удара в атаках ближнего боя и при применении
      заклинаний.
    - Увеличение на 3% вероятности нанесения удара в атаках ближнего боя и при применении
      заклинаний.
  talent.healing_focus:
    name: Средоточие исцеления
    tooltip:
    - С 14%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 28%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 42%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 56%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 70%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
  talent.totemic_mastery:
    name: Мастерство владения тотемами
    tooltip:
    - Увеличение радиуса действия тотемов, влияющих на дружественные цели, до 30 метров.
  talent.healing_grace:
    name: Исцеляющая благодать
    tooltip:
    - Снижает уровень угрозы, создаваемой вашими исцеляющими заклинаниями на 5%.
    - Снижает уровень угрозы, создаваемой вашими исцеляющими заклинаниями на 10%.
    - Снижает уровень угрозы, создаваемой вашими исцеляющими заклинаниями на 15%.
  talent.restorative_totems:
    name: Восстанавливающий тотем
    tooltip:
    - Увеличение эффекта Тотема источника маны и Тотема исцеляющего потока на 5%.
    - Увеличение эффекта Тотема источника маны и Тотема исцеляющего потока на 10%.
    - Увеличение эффекта Тотема источника маны и Тотема исцеляющего потока на 15%.
    - Увеличение эффекта Тотема источника маны и Тотема исцеляющего потока на 20%.
