schemaVersion: 1
locale: ruRU
era: vanilla
class: priest
texts:
  tree.1:
    name: Послушание
  talent.unbreakable_will:
    name: Непреклонная воля
    tooltip:
    - Увеличивает на 3% вероятность не подвергнуться влиянию оглушающих, устрашающих
      или лишающих речи эффектов.
    - Увеличивает на 6% вероятность не подвергнуться влиянию оглушающих, устрашающих
      или лишающих речи эффектов.
    - Увеличивает на 9% вероятность не подвергнуться влиянию оглушающих, устрашающих
      или лишающих речи эффектов.
    - Увеличивает на 12% вероятность не подвергнуться влиянию оглушающих, устрашающих
      или лишающих речи эффектов.
    - Увеличивает на 15% вероятность не подвергнуться влиянию оглушающих, устрашающих
      или лишающих речи эффектов.
  talent.wand_specialization:
    name: Специализация на жезлах
    tooltip:
    - Увеличение на 5% урона, наносимого при использовании магических жезлов.
    - Увеличение на 10% урона, наносимого при использовании магических жезлов.
    - Увеличение на 15% урона, наносимого при использовании магических жезлов.
    - Увеличение на 20% урона, наносимого при использовании магических жезлов.
    - Увеличение на 25% урона, наносимого при использовании магических жезлов.
  talent.silent_resolve:
    name: Молчаливая решимость
    tooltip:
    - Снижает уровень угрозы, создаваемой вашими заклинаниями, на 4%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями, на 8%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями, на 12%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями, на 16%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями, на 20%.
  talent.improved_power_word_fortitude:
    name: 'Улучшенное слово силы: Стойкость'
    tooltip:
    - 'Увеличение эффекта от заклинаний "Слово силы: Стойкость" и "Молитва стойкости"
      на 15%.'
    - 'Увеличение эффекта от заклинаний "Слово силы: Стойкость" и "Молитва стойкости"
      на 30%.'
  talent.improved_power_word_shield:
    name: 'Улучшенное Слово силы: Щит'
    tooltip:
    - 'Увеличение на 5% количества урона, поглощаемого при применении заклинания "Слово
      силы: щит".'
    - 'Увеличение на 10% количества урона, поглощаемого при применении заклинания
      "Слово Cилы: Щит".'
    - 'Увеличение на 15% количества урона, поглощаемого при применении заклинания
      "Слово силы: щит".'
  talent.martyrdom:
    name: Мученичество
    tooltip:
    - С вероятностью 50% жрец, получив критический удар оружием ближнего или дальнего
      боя, окажется под воздействием эффекта "Средоточие заклинаний" на 6 сек. Этот
      эффект предохраняет от сбоев наложения жреческих заклинаний при получении урона
      и повышает сопротивление прерыванию заклинаний на 10%.
    - С вероятностью 100% жрец, получив критический удар оружием ближнего или дальнего
      боя, окажется под воздействием эффекта "Средоточие заклинаний" на 6 сек. Этот
      эффект предохраняет от сбоев наложения жреческих заклинаний при получении урона
      и повышает сопротивление прерыванию заклинаний на 20%.
  talent.inner_focus:
    name: Внутреннее сосредоточение
    tooltip:
    - Понижение расхода маны на последующее заклинание на 100%, а также повышение
      вероятности критического эффекта на 25%, если такой эффект возможен.
  talent.meditation:
    name: Медитация
    tooltip:
    - В процессе применения заклинаний продолжается 5% от восполнения маны.
    - В процессе применения заклинаний продолжается 10% от восполнения маны.
    - В процессе применения заклинаний продолжается 15% от восполнения маны.
  talent.improved_inner_fire:
    name: Улучшенный внутренний огонь
    tooltip:
    - Повышение на 10% эффекта усиления брони заклинания "Внутренний огонь".
    - Повышение на 20% эффекта усиления брони заклинания "Внутренний огонь".
    - Повышение на 30% эффекта усиления брони заклинания "Внутренний огонь".
  talent.mental_agility:
    name: Подвижность мысли
    tooltip:
    - Снижение расхода маны на мгновенные заклинания на 2%.
    - Снижение расхода маны на мгновенные заклинания на 4%.
    - Снижение расхода маны на мгновенные заклинания на 6%.
    - Снижение расхода маны на мгновенные заклинания на 8%.
    - Снижение расхода маны на мгновенные заклинания на 10%.
  talent.improved_mana_burn:
    name: Улучшенное сожжение маны
    tooltip:
    - Уменьшение времени наложения заклинания "Сжигание маны" на 0,25 сек.
    - Уменьшение времени наложения заклинания "Сжигание маны" на 0.5 сек.
  talent.mental_strength:
    name: Сила мысли
    tooltip:
    - Повышение максимального запаса маны на 2%.
    - Повышение максимального запаса маны на 4%.
    - Повышение максимального запаса маны на 6%.
    - Повышение максимального запаса маны на 8%.
    - Повышение максимального запаса маны на 10%.
  talent.divine_spirit:
    name: Божественный дух
    tooltip:
    - Божественные силы снисходят на объект заклинания, повышая его дух на 17 ед.
      на 30 мин.
  talent.force_of_will:
    name: Сила воли
    tooltip:
    - Увеличение на 1% урона, наносимого заклинаниями, и на 1% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 2% урона, наносимого заклинаниями, и на 2% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 3% урона, наносимого заклинаниями, и на 3% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 4% урона, наносимого заклинаниями, и на 4% вероятности критического
      эффекта атакующих заклинаний.
    - Увеличение на 5% урона, наносимого заклинаниями, и на 5% вероятности критического
      эффекта атакующих заклинаний.
  talent.power_infusion:
    name: Придание сил
    tooltip:
    - Наполнение цели силой, увеличивающей наносимый ее заклинаниями урон и исцеляющие
      эффекты на 20%. Время действия – 15 сек.
  tree.2:
    name: Свет
  talent.healing_focus:
    name: Средоточие исцеления
    tooltip:
    - С 35%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
    - С 70%-й вероятностью ваши заклинания исцеления не прерываются при получении
      урона.
  talent.improved_renew:
    name: Улучшенное обновление
    tooltip:
    - Увеличение на 5% количества здоровья, восполняемого при действии заклинания
      "Обновление".
    - Увеличение на 10% количества здоровья, восполняемого при действии заклинания
      "Обновление".
    - Увеличение на 15% количества здоровья, восполняемого при действии заклинания
      "Обновление".
  talent.holy_specialization:
    name: Cпециализация на магии Света
    tooltip:
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      1%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      2%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      3%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      4%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      5%.
  talent.spell_warding:
    name: Защита от заклинаний
    tooltip:
    - Снижение получаемого урона от заклинаний на 2%.
    - Снижение получаемого урона от заклинаний на 4%.
    - Снижение получаемого урона от заклинаний на 6%.
    - Снижение получаемого урона от заклинаний на 8%.
    - Снижение получаемого урона от заклинаний на 10%.
  talent.divine_fury:
    name: Божественное неистовство
    tooltip:
    - Уменьшает время наложения заклинаний "Кара", "Священный Огонь", "Исцеление"
      и "Большее исцеление" на 0.1 сек.
    - Уменьшает время наложения заклинаний "Кара", "Священный Огонь", "Исцеление"
      и "Большее исцеление" на 0.2 сек.
    - Уменьшает время наложения заклинаний "Кара", "Священный Огонь", "Исцеление"
      и "Большее исцеление" на 0.3 сек.
    - Уменьшает время наложения заклинаний "Кара", "Священный Огонь", "Исцеление"
      и "Большее исцеление" на 0.4 сек.
    - Уменьшает время наложения заклинаний "Кара", "Священный Огонь", "Исцеление"
      и "Большее исцеление" на 0.5 сек.
  talent.holy_nova:
    name: Кольцо Света
    tooltip:
    - Создание вокруг заклинателя вспышки священного света, наносящей 29 в 34 ед.
      урона от светлой магии всем целям противника в радиусе 10 м. и исцеляющей всех
      участников группы в радиусе 10 м. на 54 в 63 ед. Эти эффекты не увеличивают
      угрозы.
  talent.blessed_recovery:
    name: Благословленное восстановление
    tooltip:
    - Восполнение здоровья в течение 6 сек после получении критического урона в ближнем
      или дальнем бою в объеме, равном 8% от полученного урона.
    - Восполнение здоровья в течение 6 сек после получении критического урона в ближнем
      или дальнем бою в объеме, равном 16% от полученного урона.
    - Восполнение здоровья в течение 6 сек после получении критического урона в ближнем
      или дальнем бою в объеме, равном 25% от полученного урона.
  talent.inspiration:
    name: Вдохновение
    tooltip:
    - 'Критические эффекты [S03 – настройка и отмена пассивных эффектов – жрец: ваших
      исцеляющих заклинаний / вашего "Быстрого исцеления", "Исцеления", "Большего
      исцеления" или "Молитвы исцеления"] усиливают броню цели на 8% на 15 сек.'
    - 'Критические эффекты [S03 – настройка и отмена пассивных эффектов – жрец: ваших
      исцеляющих заклинаний / вашего "Быстрого исцеления", "Исцеления", "Большего
      исцеления" или "Молитвы исцеления"] усиливают броню цели на 16% на 15 сек.'
    - 'Критические эффекты [S03 – настройка и отмена пассивных эффектов – жрец: ваших
      исцеляющих заклинаний / вашего "Быстрого исцеления", "Исцеления", "Большего
      исцеления" или "Молитвы исцеления"] усиливают броню цели на 25% на 15 сек.'
  talent.holy_reach:
    name: Предел сил Света
    tooltip:
    - Увеличивает дальность действия "Кары" и "Священного огня", а также радиус действия
      "Молитвы об исцелении" и "Кольца Света" на 10%.
    - Увеличивает дальность действия "Кары" и "Священного огня", а также радиус действия
      "Молитвы об исцелении" и "Кольца Света" на 20%.
  talent.improved_healing:
    name: Улучшенное исцеление
    tooltip:
    - Снижение на 5% расхода маны на применение заклинаний "Малое исцеление", "Исцеление"
      и "Большее исцеление".
    - Снижение на 10% расхода маны на применение заклинаний "Малое исцеление", "Исцеление"
      и "Большее исцеление".
    - Снижение на 15% расхода маны на применение заклинаний "Малое исцеление", "Исцеление"
      и "Большее исцеление".
  talent.searing_light:
    name: Опаляющий свет
    tooltip:
    - Увеличивает урон от заклинаний "Кара" и "Священный Огонь" на 5%.
    - Увеличивает урон от заклинаний "Кара" и "Священный Огонь" на 10%.
  talent.improved_prayer_of_healing:
    name: Улучшенная молитва исцеления
    tooltip:
    - Уменьшает на 10% расход маны на ваше заклинание "Молитва об исцелении".
    - Уменьшает на 20% расход маны на ваше заклинание "Молитва об исцелении".
  talent.spirit_of_redemption:
    name: Дух воздаяния
    tooltip:
    - После смерти жрец превращается в Дух воздаяния на 10 сек. Дух воздаяния не может
      двигаться, атаковать, быть атакованным или стать целью любых заклинаний и воздействий.
      Находясь в этом облике, жрец может бесплатно воспользоваться любым исцеляющим
      заклинанием. По окончании действия эффекта жрец умирает.
  talent.spiritual_guidance:
    name: Духовное направление
    tooltip:
    - Увеличивает эффекты исцеления и урон от заклинаний на 5% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 10% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 15% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 20% от вашего духа.
    - Увеличивает эффекты исцеления и урон от заклинаний на 25% от вашего духа.
  talent.spiritual_healing:
    name: Духовное исцеление
    tooltip:
    - Увеличивает на 2% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 4% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 6% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 8% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
    - Увеличивает на 10% количество здоровья, восполняемого вашими исцеляющими заклинаниями.
  talent.lightwell:
    name: Колодец Света
    tooltip:
    - Создает священный колодец Света. Члены вашей группы или рейда могут испить из
      него для восстановления 800 ед. здоровья в течение 10 сек. Любой полученный
      урон снимает данный эффект. Колодец содержит 5 зарядов целительной энергии и
      существует в течение 3 мин.
  tree.3:
    name: Тьма
  talent.spirit_tap:
    name: Захват духа
    tooltip:
    - С вероятностью 20% после убийства цели, за которое вы получаете опыт или честь,
      ваш дух повышается на 100%. В течение действия эффекта мана восполняется также
      и во время применения заклинаний с 50% скоростью. Время действия – 15 сек.
    - С вероятностью 40% после убийства цели, за которое вы получаете опыт или честь,
      ваш дух повышается на 100%. В течение действия эффекта мана восполняется также
      и во время применения заклинаний с 50% скоростью. Время действия – 15 сек.
    - С вероятностью 60% после убийства цели, за которое вы получаете опыт или честь,
      ваш дух повышается на 100%. В течение действия эффекта мана восполняется также
      и во время применения заклинаний с 50% скоростью. Время действия – 15 сек.
    - С вероятностью 80% после убийства цели, за которое вы получаете опыт или честь,
      ваш дух повышается на 100%. В течение действия эффекта мана восполняется также
      и во время применения заклинаний с 50% скоростью. Время действия – 15 сек.
    - С вероятностью 100% после убийства цели, за которое вы получаете опыт или честь,
      ваш дух повышается на 100%. В течение действия эффекта мана восполняется также
      и во время применения заклинаний с 50% скоростью. Время действия – 15 сек.
  talent.blackout:
    name: Затмение
    tooltip:
    - Повышение до 2% вероятности оглушения цели на 3 сек при нанесении ей урона от
      темной магии.
    - Повышение до 4% вероятности оглушения цели на 3 сек при нанесении ей урона от
      темной магии.
    - Повышение до 6% вероятности оглушения цели на 3 сек при нанесении ей урона от
      темной магии.
    - Повышение до 8% вероятности оглушения цели на 3 сек при нанесении ей урона от
      темной магии.
    - Повышение до 10% вероятности оглушения цели на 3 сек при нанесении ей урона
      от темной магии.
  talent.shadow_affinity:
    name: Единение с Тьмой
    tooltip:
    - Снижает уровень угрозы, создаваемой вашими заклинаниями категории "Тьма", на
      8%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями категории "Тьма", на
      16%.
    - Снижает уровень угрозы, создаваемой вашими заклинаниями категории "Тьма", на
      25%.
  talent.improved_shadow_word_pain:
    name: 'Улучшенное слово Тьмы: Боль'
    tooltip:
    - 'Увеличение длительности заклинания "Слово Тьмы: Боль" на 3 сек.'
    - 'Увеличение длительности заклинания "Слово Тьмы: Боль" на 6 сек.'
  talent.shadow_focus:
    name: Средоточие Тьмы
    tooltip:
    - Снижение на 2% вероятности противнику противостоять вашим заклинаниям темной
      магии.
    - Снижение на 4% вероятности противнику противостоять вашим заклинаниям темной
      магии.
    - Снижение на 6% вероятности противнику противостоять вашим заклинаниям темной
      магии.
    - Снижение на 8% вероятности противнику противостоять вашим заклинаниям темной
      магии.
    - Снижение на 10% вероятности противнику противостоять вашим заклинаниям темной
      магии.
  talent.improved_psychic_scream:
    name: Улучшенный ментальный крик
    tooltip:
    - Сокращение времени восстановления заклинания "Ментальный крик" на 2 сек.
