schemaVersion: 1
locale: ruRU
era: vanilla
class: paladin
texts:
  tree.1:
    name: Свет
  talent.divine_strength:
    name: Божественная сила
    tooltip:
    - Повышает силу на 2%.
    - Повышает силу на 4%.
    - Повышает силу на 6%.
    - Повышает силу на 8%.
    - Повышает силу на 10%.
  talent.divine_intellect:
    name: Божественный интеллект
    tooltip:
    - Увеличение интеллекта на 2%.
    - Увеличение интеллекта на 4%.
    - Увеличение интеллекта на 6%.
    - Увеличение интеллекта на 8%.
    - Увеличение интеллекта на 10%.
  talent.spiritual_focus:
    name: Духовное концентрация
    tooltip:
    - Повышение до 14% вероятности не прерывать применение заклинаний "Свет небес"
      и "Вспышка Света" при получении урона.
    - Повышение до 28% вероятности не прерывать применение заклинаний "Свет небес"
      и "Вспышка Света" при получении урона.
    - Повышение до 42% вероятности не прерывать применение заклинаний "Свет небес"
      и "Вспышка Света" при получении урона.
    - Повышение до 56% вероятности не прерывать применение заклинаний "Свет небес"
      и "Вспышка Света" при получении урона.
    - Повышение до 70% вероятности не прерывать применение заклинаний "Свет небес"
      и "Вспышка Света" при получении урона.
  talent.improved_seal_of_righteousness:
    name: Улучшенная печать праведности
    tooltip:
    - Увеличение на 3% урона, наносимого при применении способностей "Печать праведности"
      и "Правосудие праведности".
    - Увеличение на 6% урона, наносимого при применении способностей "Печать праведности"
      и "Правосудие праведности".
    - Увеличение на 9% урона, наносимого при применении способностей "Печать праведности"
      и "Правосудие праведности".
    - Увеличение на 12% урона, наносимого при применении способностей "Печать праведности"
      и "Правосудие праведности".
    - Увеличение на 15% урона, наносимого при применении способностей "Печать праведности"
      и "Правосудие праведности".
  talent.healing_light:
    name: Исцеляющий Свет
    tooltip:
    - Повышение исцеляющего эффекта заклинаний "Свет небес" и "Вспышка Света" на 4%.
    - Повышение исцеляющего эффекта заклинаний "Свет небес" и "Вспышка Света" на 8%.
    - Повышение исцеляющего эффекта заклинаний "Свет небес" и "Вспышка Света" на 12%.
  talent.consecration:
    name: Освящение
    tooltip:
    - Освящение земли, на которой стоит паладин, с нанесением 64 ед. урона от светлой
      магии в течение 8 сек. противникам, которые входят на этот участок.
  talent.improved_lay_on_hands:
    name: Улучшенное наложение рук
    tooltip:
    - Дает цели вашего заклинания "Возложение рук" 15% дополнительно к усилению брони
      от предметов, на 2 мин. Помимо этого, время восстановления заклинания "Наложение
      рук" сокращается на 10 мин.
    - Дает цели вашего заклинания "Возложение рук" 30% дополнительно к усилению брони
      от предметов, на 2 мин. Помимо этого, время восстановления заклинания "Наложение
      рук" сокращается на 20 мин.
  talent.unyielding_faith:
    name: Непоколебимая вера
    tooltip:
    - Увеличение на 5% вероятности не подвергнуться влиянию устрашающих или дезориентирующих
      эффектов.
    - Увеличение на 10% вероятности не подвергнуться влиянию устрашающих или дезориентирующих
      эффектов.
  talent.illumination:
    name: Свечение
    tooltip:
    - Повышение до 20% вероятности восполнить ману, потраченную на заклинание после
      критического эффекта заклинаний "Свет небес", "Вспышка Света" или "Шок небес".
    - Повышение до 40% вероятности восполнить ману, потраченную на заклинание после
      критического эффекта заклинаний "Свет небес", "Вспышка Света" или "Шок небес".
    - Повышение до 60% вероятности восполнить ману, потраченную на заклинание после
      критического эффекта заклинаний "Свет небес", "Вспышка Света" или "Шок небес".
    - Повышение до 80% вероятности восполнить ману, потраченную на заклинание после
      критического эффекта заклинаний "Свет небес", "Вспышка Света" или "Шок небес".
    - Повышение до 100% вероятности восполнить ману, потраченную на заклинание после
      критического эффекта заклинаний "Свет небес", "Вспышка Света" или "Шок небес".
  talent.improved_blessing_of_wisdom:
    name: Улучшенное благословение мудрости
    tooltip:
    - Повышение эффекта благословения познания на 10%.
    - Повышение эффекта благословения познания на 20%.
  talent.divine_favor:
    name: Божественное одобрение
    tooltip:
    - При приведении в действие это заклинание дает вашим следующим заклинаниям "Свет
      небес", "Вспышка Света" или "Шок небес" 100% шанса на критическое воздействие.
  talent.lasting_judgement:
    name: Долгое правосудие
    tooltip:
    - Повышение длительности эффекта "Правосудия света" и "Правосудие мудрости" на
      10 сек.
    - Повышение длительности эффекта "Правосудия света" и "Правосудие мудрости" на
      20 сек.
    - Повышение длительности эффекта "Правосудия света" и "Правосудие мудрости" на
      30 сек.
  talent.holy_power:
    name: Священная сила
    tooltip:
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      1%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      2%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      3%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      4%.
    - Повышает вероятность критического эффекта ваших заклинаний светлой магии на
      5%.
  talent.holy_shock:
    name: Шок небес
    tooltip:
    - Взрывает цель с помощью энергии светлой магии, нанося 204 в 220 ед. урона от
      светлой магии противнику или обеспечивая 204 в 220 исцеления союзнику.
  tree.2:
    name: Защита
  talent.improved_devotion_aura:
    name: Улучшенная аура благочестия
    tooltip:
    - Увеличение на 5% эффекта усиления брони способностью "Аура благочестия".
    - Увеличение на 10% эффекта усиления брони способностью "Аура благочестия".
    - Увеличение на 15% эффекта усиления брони способностью "Аура благочестия".
    - Увеличение на 20% эффекта усиления брони способностью "Аура благочестия".
    - Увеличение на 25% эффекта усиления брони способностью "Аура благочестия".
  talent.redoubt:
    name: Оплот
    tooltip:
    - Повышает вероятность блокирования атаки щитом на 6% после получения критического
      удара. Эффект длится 10 сек или 5 блоков.
    - Повышает вероятность блокирования атаки щитом на 12% после получения критического
      удара. Эффект длится 10 сек или 5 блоков.
    - Повышает вероятность блокирования атаки щитом на 18% после получения критического
      удара. Эффект длится 10 сек или 5 блоков.
    - Повышает вероятность блокирования атаки щитом на 24% после получения критического
      удара. Эффект длится 10 сек или 5 блоков.
    - Повышает вероятность блокирования атаки щитом на 30% после получения критического
      удара. Эффект длится 10 сек или 5 блоков.
  talent.precision:
    name: Точность
    tooltip:
    - Увеличение на 1% вероятности нанесения удара в ближнем бою.
    - Увеличение на 2% вероятности нанесения удара в ближнем бою.
    - Увеличение на 3% вероятности нанесения удара в ближнем бою.
  talent.guardian_s_favor:
    name: Помощь стража
    tooltip:
    - Уменьшение срока восстановления вашего "Благословения защиты" на 60сек. и увеличение
      времени действия вашего "Благословения свободы" на 3 сек.
    - Уменьшение срока восстановления вашего "Благословения защиты" на 120сек. и увеличение
      времени действия вашего "Благословения свободы" на 6 сек.
  talent.toughness:
    name: Крепость
    tooltip:
    - Увеличение на 2% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 4% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 6% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 8% эффективности усиления брони за счет носимой экипировки.
    - Увеличение на 10% эффективности усиления брони за счет носимой экипировки.
  talent.blessing_of_kings:
    name: Благословение королей
    tooltip:
    - Наложение на дружественную цель благословения, на 5 мин. повышающего все характеристики
      на 10%. Каждый паладин единовременно может накладывать на одного игрока только
      одно благословение.
  talent.improved_righteous_fury:
    name: Улучшенное праведное неистовство
    tooltip:
    - Увеличение количества угрозы, создаваемой "Праведным неистовством" на 16%.
    - Увеличение количества угрозы, создаваемой "Праведным неистовством" на 33%.
    - Увеличение количества угрозы, создаваемой "Праведным неистовством" на 50%.
  talent.shield_specialization:
    name: Специализация на щитах
    tooltip:
    - Увеличение количества урона, поглощаемого вашим щитом, на 10%.
    - Увеличение количества урона, поглощаемого вашим щитом, на 20%.
    - Увеличение количества урона, поглощаемого вашим щитом, на 30%.
  talent.anticipation:
    name: Предчувствие
    tooltip:
    - Повышение навыка защиты на 2.
    - Повышение навыка защиты на 4.
    - Повышение навыка защиты на 6.
    - Повышение навыка защиты на 8.
    - Повышение навыка защиты на 10.
  talent.improved_hammer_of_justice:
    name: Улучшенный молот правосудия
    tooltip:
    - Сокращение времени восстановления заклинания "Молот правосудия" на 5 сек.
    - Сокращение времени восстановления заклинания "Молот правосудия" на 10 сек.
    - Сокращение времени восстановления заклинания "Молот правосудия" на 15 сек.
  talent.improved_concentration_aura:
    name: Улучшенная аура сосредоточенности
    tooltip:
    - Повышение эффекта заклинания "Аура сосредоточенности" на 5% и увеличение на
      5% вероятности всех участников группы, облаченных аурой, сопротивляться эффектам
      безмолвия и прерывания.
    - Повышение эффекта заклинания "Аура сосредоточенности" на 10% и увеличение на
      10% вероятности всех участников группы, облаченных аурой, сопротивляться эффектам
      безмолвия и прерывания.
    - Повышение эффекта заклинания "Аура сосредоточенности" на 15% и увеличение на
      15% вероятности всех участников группы, облаченных аурой, сопротивляться эффектам
      безмолвия и прерывания.
  talent.blessing_of_sanctuary:
    name: Благословение неприкосновенности
    tooltip:
    - Наложение на дружественную цель благословения, в течение 5 мин. уменьшающего
      любой наносимый ей урон на 10 ед. Блокирование целью атаки ближнего боя наносит
      ее противнику 14 ед. урона от светлой магии. Каждый паладин единовременно может
      накладывать на каждого игрока только одно благословение.
  talent.reckoning:
    name: Расплата
    tooltip:
    - Если вы получаете критический урон, то с вероятностью 20% ваша следующая атака
      будет двойной.
    - Если вы получаете критический урон, то с вероятностью 40% ваша следующая атака
      будет двойной.
    - Если вы получаете критический урон, то с вероятностью 60% ваша следующая атака
      будет двойной.
    - Если вы получаете критический урон, то с вероятностью 80% ваша следующая атака
      будет двойной.
    - Если вы получаете критический урон, то с вероятностью 100% ваша следующая атака
      будет двойной.
  talent.one_handed_weapon_specialization:
    name: Специализация на одноручном оружии
    tooltip:
    - Увеличение на 2% урона, наносимого используемым одноручным оружием ближнего
      боя.
    - Увеличение на 4% урона, наносимого используемым одноручным оружием ближнего
      боя.
    - Увеличение на 6% урона, наносимого используемым одноручным оружием ближнего
      боя.
    - Увеличение на 8% урона, наносимого используемым одноручным оружием ближнего
      боя.
    - Увеличение на 10% урона, наносимого используемым одноручным оружием ближнего
      боя.
  talent.holy_shield:
    name: Щит небес
    tooltip:
    - 'Повышает вероятность блокирования на 30% на 10 сек. После блокирования атаки
      вы наносите атакующему 65 ед. урона от светлой магии. Урон от "Щита небес" создает
      на 20% больше угрозы. При каждом блоке расходуется 1 заряд. 4 заряда:зарядов.
      [S03 – настройка и отмена пассивных эффектов – все классы: При активации "Щита
      небес" ваша сила заклинаний повышается на 2 за каждую единицу навыка защиты
      выше (60 * 5). Время действия эффекта – 15 сек]'
  tree.3:
    name: Воздаяние
  talent.improved_blessing_of_might:
    name: Улучшенное благословение могущества
    tooltip:
    - Повышение эффективности заклинания "Благословение могущества" на 4%.
    - Повышение эффективности заклинания "Благословение могущества" на 8%.
    - Повышение эффективности заклинания "Благословение могущества" на 12%.
    - Повышение эффективности заклинания "Благословение могущества" на 16%.
    - Повышение эффективности заклинания "Благословение могущества" на 20%.
  talent.benediction:
    name: Благодарение
    tooltip:
    - Снижение на 3% расхода маны на применение заклинаний категорий "Правосудие"
      и "Печать".
    - Снижение на 6% расхода маны на применение заклинаний категорий "Правосудие"
      и "Печать".
    - Снижение на 9% расхода маны на применение заклинаний категорий "Правосудие"
      и "Печать".
    - Снижение на 12% расхода маны на применение заклинаний категорий "Правосудие"
      и "Печать".
    - Снижение на 15% расхода маны на применение заклинаний категорий "Правосудие"
      и "Печать".
  talent.improved_judgement:
    name: Улучшенное провосудие
    tooltip:
    - Сокращение времени восстановления заклинания "Правосудие" на 1 сек.
    - Сокращение времени восстановления заклинания "Правосудие" на 2 сек.
  talent.improved_seal_of_the_crusader:
    name: Улучшенная печать воина Света
    tooltip:
    - Увеличение дополнительной силы атаки ближнего боя при использовании заклинания
      "Печать воина Света", а также урона от светлой магии, наносимого заклинанием
      "Правосудие воина Света", на 5%.
    - Увеличение дополнительной силы атаки ближнего боя при использовании заклинания
      "Печать воина Света", а также урона от светлой магии, наносимого заклинанием
      "Правосудие воина Света", на 10%.
    - Увеличение дополнительной силы атаки ближнего боя при использовании заклинания
      "Печать воина Света", а также урона от светлой магии, наносимого заклинанием
      "Правосудие воина Света", на 15%.
  talent.deflection:
    name: Отражение
    tooltip:
    - Увеличивает вероятность парирования атак на 1%.
    - Увеличивает вероятность парирования атак на 2%.
    - Увеличивает вероятность парирования атак на 3%.
    - Увеличивает вероятность парирования атак на 4%.
    - Увеличивает вероятность парирования атак на 5%.
  talent.vindication:
    name: Подтверждение
    tooltip:
    - 'Атакующие способности ближнего боя могут уменьшить силу и ловкость цели на
      5% [S03 – настройка и отмена пассивных эффектов – паладин: снизить ее силу атаки
      на (30 /- 3) ед. и увеличить силу атаки паладина на 5% на 30 сек / 10 сек.]'
    - 'Атакующие способности ближнего боя могут уменьшить силу и ловкость цели на
      10% [S03 – настройка и отмена пассивных эффектов – паладин: снизить ее силу
      атаки на (30 * 2 /- 3) ед. и увеличить силу атаки паладина на 10% на 30 сек
      / 10 сек.]'
    - 'Атакующие способности ближнего боя могут уменьшить силу и ловкость цели на
      15% [S03 – настройка и отмена пассивных эффектов – паладин: снизить ее силу
      атаки на (30 *- 1) ед. и увеличить силу атаки паладина на 15% на 30 сек / 10
      сек.]'
  talent.conviction:
    name: Приговор
    tooltip:
    - Повышение на 1% вероятности нанесения критического урона при использовании оружия
      ближнего боя.
    - Повышение на 2% вероятности нанесения критического урона при использовании оружия
      ближнего боя.
    - Повышение на 3% вероятности нанесения критического урона при использовании оружия
      ближнего боя.
    - Повышение на 4% вероятности нанесения критического урона при использовании оружия
      ближнего боя.
    - Повышение на 5% вероятности нанесения критического урона при использовании оружия
      ближнего боя.
  talent.seal_of_command:
    name: Печать повиновения
    tooltip:
    - Наделяет атаки паладина возможностью нанести дополнительный урон от светлой
      магии, равный 70% от базового урона оружия. Единовременно паладин может привести
