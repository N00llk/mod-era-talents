schemaVersion: 1
locale: enUS
era: tbc
class: hunter
texts:
  tree.1:
    name: Beast Mastery
  talent.improved_aspect_of_the_hawk:
    name: Improved Aspect of the Hawk
    tooltip:
    - While Aspect of the Hawk is active, all normal ranged attacks have a 10% chance
      of increasing ranged attack speed by 3% for 12 sec.
    - While Aspect of the Hawk is active, all normal ranged attacks have a 10% chance
      of increasing ranged attack speed by 6% for 12 sec.
    - While Aspect of the Hawk is active, all normal ranged attacks have a 10% chance
      of increasing ranged attack speed by 9% for 12 sec.
    - While Aspect of the Hawk is active, all normal ranged attacks have a 10% chance
      of increasing ranged attack speed by 12% for 12 sec.
    - While Aspect of the Hawk is active, all normal ranged attacks have a 10% chance
      of increasing ranged attack speed by 15% for 12 sec.
  talent.endurance_training:
    name: Endurance Training
    tooltip:
    - Increases the Health of your pet by 2% and your total health by 1%.
    - Increases the Health of your pet by 4% and your total health by 2%.
    - Increases the Health of your pet by 6% and your total health by 3%.
    - Increases the Health of your pet by 8% and your total health by 4%.
    - Increases the Health of your pet by 10% and your total health by 5%.
  talent.focused_fire:
    name: Focused Fire
    tooltip:
    - All damage caused by you is increased by 1% while your pet is active.
    - All damage caused by you is increased by 2% while your pet is active.
  talent.improved_aspect_of_the_monkey:
    name: Improved Aspect of the Monkey
    tooltip:
    - Increases the Dodge bonus of your Aspect of the Monkey by 2%.
    - Increases the Dodge bonus of your Aspect of the Monkey by 4%.
    - Increases the Dodge bonus of your Aspect of the Monkey by 6%.
  talent.thick_hide:
    name: Thick Hide
    tooltip:
    - Increases the armor rating of your pets by 7% and your armor contribution from
      items by 4%.
    - Increases the armor rating of your pets by 14% and your armor contribution from
      items by 7%.
    - Increases the armor rating of your pets by 20% and your armor contribution from
      items by 10%.
  talent.improved_revive_pet:
    name: Improved Revive Pet
    tooltip:
    - Revive Pet's casting time is reduced by 3 sec, mana cost is reduced by 20%,
      and increases the health your pet returns with by an additional 15%.
    - Revive Pet's casting time is reduced by 6 sec, mana cost is reduced by 40%,
      and increases the health your pet returns with by an additional 30%.
  talent.pathfinding:
    name: Pathfinding
    tooltip:
    - Increases the speed bonus of your Aspect of the Cheetah and Aspect of the Pack
      by 4%.
    - Increases the speed bonus of your Aspect of the Cheetah and Aspect of the Pack
      by 8%.
  talent.bestial_swiftness:
    name: Bestial Swiftness
    tooltip:
    - Increases the outdoor movement speed of your pets by 30%.
  talent.unleashed_fury:
    name: Unleashed Fury
    tooltip:
    - Increases the damage done by your pets by 4%.
    - Increases the damage done by your pets by 8%.
    - Increases the damage done by your pets by 12%.
    - Increases the damage done by your pets by 16%.
    - Increases the damage done by your pets by 20%.
  talent.improved_mend_pet:
    name: Improved Mend Pet
    tooltip:
    - Reduces the mana cost of your Mend Pet spell by 10% and gives the Mend Pet spell
      a 25% chance of cleansing 1 Curse, Disease, Magic or Poison effect from the
      pet each tick.
    - Reduces the mana cost of your Mend Pet spell by 20% and gives the Mend Pet spell
      a 50% chance of cleansing 1 Curse, Disease, Magic or Poison effect from the
      pet each tick.
  talent.ferocity:
    name: Ferocity
    tooltip:
    - Increases the critical strike chance of your pet by 2%.
    - Increases the critical strike chance of your pet by 4%.
    - Increases the critical strike chance of your pet by 6%.
    - Increases the critical strike chance of your pet by 8%.
    - Increases the critical strike chance of your pet by 10%.
  talent.spirit_bond:
    name: Spirit Bond
    tooltip:
    - While your pet is active, you and your pet will regenerate 1% of total health
      every 10 sec.
    - While your pet is active, you and your pet will regenerate 2% of total health
      every 10 sec.
  talent.intimidation:
    name: Intimidation
    tooltip:
    - Command your pet to intimidate the target on the next successful melee attack,
      causing a high amount of threat and stunning the target for 3 sec.
  talent.bestial_discipline:
    name: Bestial Discipline
    tooltip:
    - Increases the Focus regeneration of your pets by 50%.
    - Increases the Focus regeneration of your pets by 100%.
  talent.animal_handler:
    name: Animal Handler
    tooltip:
    - Increases your speed while mounted by 4% and your pet's chance to hit by 2%.
      The mounted movement speed increase does not stack with other effects.
    - Increases your speed while mounted by 8% and your pet's chance to hit by 4%.
      The mounted movement speed increase does not stack with other effects.
  talent.frenzy:
    name: Frenzy
    tooltip:
    - Gives your pet a 20% chance to gain a 30% attack speed increase for 8 sec after
      dealing a critical strike.
    - Gives your pet a 40% chance to gain a 30% attack speed increase for 8 sec after
      dealing a critical strike.
    - Gives your pet a 60% chance to gain a 30% attack speed increase for 8 sec after
      dealing a critical strike.
    - Gives your pet a 80% chance to gain a 30% attack speed increase for 8 sec after
      dealing a critical strike.
    - Gives your pet a 100% chance to gain a 30% attack speed increase for 8 sec after
      dealing a critical strike.
  talent.ferocious_inspiration:
    name: Ferocious Inspiration
    tooltip:
    - When your pet scores a critical hit, all party members have all damage increased
      by 1% for 10 sec.
    - When your pet scores a critical hit, all party members have all damage increased
      by 2% for 10 sec.
    - When your pet scores a critical hit, all party members have all damage increased
      by 3% for 10 sec.
  talent.bestial_wrath:
    name: Bestial Wrath
    tooltip:
    - Send your pet into a rage causing 50% additional damage for 18 sec. While enraged,
      the beast does not feel pity or remorse or fear and it cannot be stopped unless
      killed.
  talent.catlike_reflexes:
    name: Catlike Reflexes
    tooltip:
    - Increases your chance to dodge by 1% and your pet's chance to dodge by an additional
      3%.
    - Increases your chance to dodge by 2% and your pet's chance to dodge by an additional
      6%.
    - Increases your chance to dodge by 3% and your pet's chance to dodge by an additional
      9%.
  talent.serpent_s_swiftness:
    name: Serpent's Swiftness
    tooltip:
    - Increases ranged combat attack speed by 4% and your pet's melee attack speed
      by 4%.
    - Increases ranged combat attack speed by 8% and your pet's melee attack speed
      by 8%.
    - Increases ranged combat attack speed by 12% and your pet's melee attack speed
      by 12%.
    - Increases ranged combat attack speed by 16% and your pet's melee attack speed
      by 16%.
    - Increases ranged combat attack speed by 20% and your pet's melee attack speed
      by 20%.
  talent.the_beast_within:
    name: The Beast Within
    tooltip:
    - When your pet is under the effects of Bestial Wrath, you also go into a rage
      causing 10% additional damage and reducing mana costs of all spells by 20% for
      18 sec. While enraged, you do not feel pity or remorse or fear and you cannot
      be stopped unless killed.
  tree.2:
    name: Marksmanship
  talent.improved_concussive_shot:
    name: Improved Concussive Shot
    tooltip:
    - Gives your Concussive Shot a 4% chance to stun the target for 3 sec.
    - Gives your Concussive Shot a 8% chance to stun the target for 3 sec.
    - Gives your Concussive Shot a 12% chance to stun the target for 3 sec.
    - Gives your Concussive Shot a 16% chance to stun the target for 3 sec.
    - Gives your Concussive Shot a 20% chance to stun the target for 3 sec.
  talent.lethal_shots:
    name: Lethal Shots
    tooltip:
    - Increases your critical strike chance with ranged weapons by 1%.
    - Increases your critical strike chance with ranged weapons by 2%.
    - Increases your critical strike chance with ranged weapons by 3%.
    - Increases your critical strike chance with ranged weapons by 4%.
    - Increases your critical strike chance with ranged weapons by 5%.
  talent.improved_hunter_s_mark:
    name: Improved Hunter's Mark
    tooltip:
    - Causes 20% of your Hunter's Mark ability's base attack power to apply to melee
      attack power as well.
    - Causes 40% of your Hunter's Mark ability's base attack power to apply to melee
      attack power as well.
    - Causes 60% of your Hunter's Mark ability's base attack power to apply to melee
      attack power as well.
    - Causes 80% of your Hunter's Mark ability's base attack power to apply to melee
      attack power as well.
    - Causes 100% of your Hunter's Mark ability's base attack power to apply to melee
      attack power as well.
  talent.efficiency:
    name: Efficiency
    tooltip:
    - Reduces the Mana cost of your Shots and Stings by 2%.
    - Reduces the Mana cost of your Shots and Stings by 4%.
    - Reduces the Mana cost of your Shots and Stings by 6%.
    - Reduces the Mana cost of your Shots and Stings by 8%.
    - Reduces the Mana cost of your Shots and Stings by 10%.
  talent.go_for_the_throat:
    name: Go for the Throat
    tooltip:
    - Your ranged critical hits cause your pet to generate 25 Focus.
    - Your ranged critical hits cause your pet to generate 50 Focus.
  talent.improved_arcane_shot:
    name: Improved Arcane Shot
    tooltip:
    - Reduces the cooldown of your Arcane Shot by 0.2 sec.
    - Reduces the cooldown of your Arcane Shot by 0.4 sec.
    - Reduces the cooldown of your Arcane Shot by 0.6 sec.
    - Reduces the cooldown of your Arcane Shot by 0.8 sec.
    - Reduces the cooldown of your Arcane Shot by 1 sec.
  talent.aimed_shot:
    name: Aimed Shot
    tooltip:
    - An aimed shot that increases ranged damage by 70 and reduces healing done to
      that target by 50%. Lasts 10 sec.
  talent.rapid_killing:
    name: Rapid Killing
    tooltip:
    - Reduces the cooldown of your Rapid Fire ability by 1 min. In addition, after
      killing an opponent that yields experience or honor, your next Aimed Shot, Arcane
      Shot or Auto Shot causes 10% additional damage. Lasts 20 sec.
    - Reduces the cooldown of your Rapid Fire ability by 2 min. In addition, after
      killing an opponent that yields experience or honor, your next Aimed Shot, Arcane
      Shot or Auto Shot causes 20% additional damage. Lasts 20 sec.
  talent.improved_stings:
    name: Improved Stings
    tooltip:
    - Increases the damage done by your Serpent Sting and Wyvern Sting by 6% and the
      mana drained by your Viper Sting by 6%. In addition, reduces the chance your
      Stings will be dispelled by 6%.
    - Increases the damage done by your Serpent Sting and Wyvern Sting by 12% and
      the mana drained by your Viper Sting by 12%. In addition, reduces the chance
      your Stings will be dispelled by 12%.
    - Increases the damage done by your Serpent Sting and Wyvern Sting by 18% and
      the mana drained by your Viper Sting by 18%. In addition, reduces the chance
      your Stings will be dispelled by 18%.
    - Increases the damage done by your Serpent Sting and Wyvern Sting by 24% and
      the mana drained by your Viper Sting by 24%. In addition, reduces the chance
      your Stings will be dispelled by 24%.
    - Increases the damage done by your Serpent Sting and Wyvern Sting by 30% and
      the mana drained by your Viper Sting by 30%. In addition, reduces the chance
      your Stings will be dispelled by 30%.
  talent.mortal_shots:
    name: Mortal Shots
    tooltip:
    - Increases your ranged weapon critical strike damage bonus by 6%.
    - Increases your ranged weapon critical strike damage bonus by 12%.
    - Increases your ranged weapon critical strike damage bonus by 18%.
    - Increases your ranged weapon critical strike damage bonus by 24%.
    - Increases your ranged weapon critical strike damage bonus by 30%.
  talent.concussive_barrage:
    name: Concussive Barrage
    tooltip:
    - Your successful Auto Shot attacks have a 2% chance to Daze the target for 4
      sec.
    - Your successful Auto Shot attacks have a 4% chance to Daze the target for 4
      sec.
    - Your successful Auto Shot attacks have a 6% chance to Daze the target for 4
      sec.
  talent.scatter_shot:
    name: Scatter Shot
    tooltip:
    - A short-range shot that deals 50% weapon damage and disorients the target for
      4 sec. Any damage caused will remove the effect. Turns off your attack when
      used.
  talent.barrage:
    name: Barrage
    tooltip:
    - Increases the damage done by your Multi-Shot and Volley spells by 4%.
    - Increases the damage done by your Multi-Shot and Volley spells by 8%.
    - Increases the damage done by your Multi-Shot and Volley spells by 12%.
  talent.combat_experience:
    name: Combat Experience
    tooltip:
    - Increases your total Agility by 1% and your total Intellect by 3%.
    - Increases your total Agility by 2% and your total Intellect by 6%.
  talent.ranged_weapon_specialization:
    name: Ranged Weapon Specialization
    tooltip:
    - Increases the damage you deal with ranged weapons by 1%.
    - Increases the damage you deal with ranged weapons by 2%.
    - Increases the damage you deal with ranged weapons by 3%.
    - Increases the damage you deal with ranged weapons by 4%.
    - Increases the damage you deal with ranged weapons by 5%.
  talent.careful_aim:
    name: Careful Aim
    tooltip:
    - Increases your ranged attack power by an amount equal to 15% of your total Intellect.
    - Increases your ranged attack power by an amount equal to 30% of your total Intellect.
    - Increases your ranged attack power by an amount equal to 45% of your total Intellect.
  talent.trueshot_aura:
    name: Trueshot Aura
    tooltip:
    - Increases the attack power of party members within 45 yards by 50. Lasts until
      cancelled.
  talent.improved_barrage:
    name: Improved Barrage
    tooltip:
    - Increases the critical strike chance of your Multi-Shot ability by 4% and gives
      you a 33% chance to avoid interruption caused by damage while channeling Volley.
    - Increases the critical strike chance of your Multi-Shot ability by 8% and gives
      you a 66% chance to avoid interruption caused by damage while channeling Volley.
    - Increases the critical strike chance of your Multi-Shot ability by 12% and gives
      you a 100% chance to avoid interruption caused by damage while channeling Volley.
  talent.master_marksman:
    name: Master Marksman
    tooltip:
    - Increases your ranged attack power by 2%.
    - Increases your ranged attack power by 4%.
    - Increases your ranged attack power by 6%.
    - Increases your ranged attack power by 8%.
    - Increases your ranged attack power by 10%.
  talent.silencing_shot:
    name: Silencing Shot
    tooltip:
    - A shot that deals 50% weapon damage and Silences the target for 3 sec.
  tree.3:
    name: Survival
  talent.monster_slaying:
    name: Monster Slaying
    tooltip:
    - Increases all damage caused against Beasts, Giants and Dragonkin targets by
      1% and increases critical damage caused against Beasts, Giants and Dragonkin
      targets by an additional 1%.
    - Increases all damage caused against Beasts, Giants and Dragonkin targets by
      2% and increases critical damage caused against Beasts, Giants and Dragonkin
      targets by an additional 2%.
    - Increases all damage caused against Beasts, Giants and Dragonkin targets by
      3% and increases critical damage caused against Beasts, Giants and Dragonkin
      targets by an additional 3%.
  talent.humanoid_slaying:
    name: Humanoid Slaying
    tooltip:
    - Increases all damage caused against Humanoid targets by 1% and increases critical
      damage caused against Humanoid targets by an additional 1%.
    - Increases all damage caused against Humanoid targets by 2% and increases critical
      damage caused against Humanoid targets by an additional 2%.
    - Increases all damage caused against Humanoid targets by 3% and increases critical
      damage caused against Humanoid targets by an additional 3%.
  talent.hawk_eye:
    name: Hawk Eye
    tooltip:
    - Increases the range of your ranged weapons by 2 yards.
    - Increases the range of your ranged weapons by 4 yards.
    - Increases the range of your ranged weapons by 6 yards.
  talent.savage_strikes:
    name: Savage Strikes
    tooltip:
    - Increases the critical strike chance of Raptor Strike and Mongoose Bite by 10%.
    - Increases the critical strike chance of Raptor Strike and Mongoose Bite by 20%.
  talent.entrapment:
    name: Entrapment
    tooltip:
    - Gives your Immolation Trap, Frost Trap, Explosive Trap, and Snake Trap a 8%
      chance to entrap the target, preventing them from moving for 4 sec.
    - Gives your Immolation Trap, Frost Trap, Explosive Trap, and Snake Trap a 16%
      chance to entrap the target, preventing them from moving for 4 sec.
    - Gives your Immolation Trap, Frost Trap, Explosive Trap, and Snake Trap a 25%
      chance to entrap the target, preventing them from moving for 4 sec.
  talent.deflection:
    name: Deflection
    tooltip:
    - Increases your Parry chance by 1%.
    - Increases your Parry chance by 2%.
    - Increases your Parry chance by 3%.
    - Increases your Parry chance by 4%.
    - Increases your Parry chance by 5%.
  talent.improved_wing_clip:
    name: Improved Wing Clip
    tooltip:
    - Gives your Wing Clip ability a 7% chance to immobilize the target for 5 sec.
    - Gives your Wing Clip ability a 14% chance to immobilize the target for 5 sec.
    - Gives your Wing Clip ability a 20% chance to immobilize the target for 5 sec.
  talent.clever_traps:
    name: Clever Traps
    tooltip:
    - Increases the duration of Freezing and Frost Trap effects by 15%, the damage
      of Immolation and Explosive Trap effects by 15%, and the number of snakes summoned
      from Snake Traps by 15%.
    - Increases the duration of Freezing and Frost Trap effects by 30%, the damage
      of Immolation and Explosive Trap effects by 30%, and the number of snakes summoned
      from Snake Traps by 30%.
  talent.survivalist:
    name: Survivalist
    tooltip:
    - Increases total health by 2%.
    - Increases total health by 4%.
    - Increases total health by 6%.
    - Increases total health by 8%.
    - Increases total health by 10%.
  talent.deterrence:
    name: Deterrence
    tooltip:
    - When activated, increases your Dodge and Parry chance by 25% for 10 sec.
  talent.trap_mastery:
    name: Trap Mastery
    tooltip:
    - Decreases the chance enemies will resist trap effects by 5%.
    - Decreases the chance enemies will resist trap effects by 10%.
  talent.surefooted:
    name: Surefooted
    tooltip:
    - Increases hit chance by 1% and increases the chance movement impairing effects
      will be resisted by an additional 5%.
    - Increases hit chance by 2% and increases the chance movement impairing effects
      will be resisted by an additional 10%.
    - Increases hit chance by 3% and increases the chance movement impairing effects
      will be resisted by an additional 15%.
  talent.improved_feign_death:
    name: Improved Feign Death
    tooltip:
    - Reduces the chance your Feign Death ability will be resisted by 2%.
    - Reduces the chance your Feign Death ability will be resisted by 4%.
  talent.survival_instincts:
    name: Survival Instincts
    tooltip:
    - Reduces all damage taken by 2% and increases attack power by 2%.
    - Reduces all damage taken by 4% and increases attack power by 4%.
  talent.killer_instinct:
    name: Killer Instinct
    tooltip:
    - Increases your critical strike chance with all attacks by 1%.
    - Increases your critical strike chance with all attacks by 2%.
    - Increases your critical strike chance with all attacks by 3%.
  talent.counterattack:
    name: Counterattack
    tooltip:
    - A strike that becomes active after parrying an opponent's attack. This attack
      deals 40 damage and immobilizes the target for 5 sec. Counterattack cannot be
      blocked, dodged, or parried.
  talent.resourcefulness:
    name: Resourcefulness
    tooltip:
    - Reduces the mana cost of all traps and melee abilities by 20% and reduces the
      cooldown of all traps by 2 sec.
    - Reduces the mana cost of all traps and melee abilities by 40% and reduces the
      cooldown of all traps by 4 sec.
    - Reduces the mana cost of all traps and melee abilities by 60% and reduces the
      cooldown of all traps by 6 sec.
  talent.lightning_reflexes:
    name: Lightning Reflexes
    tooltip:
    - Increases your Agility by 3%.
    - Increases your Agility by 6%.
    - Increases your Agility by 9%.
    - Increases your Agility by 12%.
    - Increases your Agility by 15%.
  talent.thrill_of_the_hunt:
    name: Thrill of the Hunt
    tooltip:
    - Gives you a 33% chance to regain 40% of the mana cost of any shot when it critically
      hits.
    - Gives you a 66% chance to regain 40% of the mana cost of any shot when it critically
      hits.
    - Gives you a 100% chance to regain 40% of the mana cost of any shot when it critically
      hits.
  talent.wyvern_sting:
    name: Wyvern Sting
    tooltip:
    - A stinging shot that puts the target to sleep for 12 sec. Any damage will cancel
      the effect. When the target wakes up, the Sting causes 300 Nature damage over
      12 sec. Only one Sting per Hunter can be active on the target at a time.
  talent.expose_weakness:
    name: Expose Weakness
    tooltip:
    - Your ranged criticals have a 33% chance to apply an Expose Weakness effect to
      the target. Expose Weakness increases the attack power of all attackers against
      that target by 25% of your Agility for 7 sec.
    - Your ranged criticals have a 66% chance to apply an Expose Weakness effect to
      the target. Expose Weakness increases the attack power of all attackers against
      that target by 25% of your Agility for 7 sec.
    - Your ranged criticals have a 100% chance to apply an Expose Weakness effect
      to the target. Expose Weakness increases the attack power of all attackers against
      that target by 25% of your Agility for 7 sec.
  talent.master_tactician:
    name: Master Tactician
    tooltip:
    - Your successful ranged attacks have a 6% chance to increase your critical strike
      chance with all attacks by 2% for 8 sec.
    - Your successful ranged attacks have a 6% chance to increase your critical strike
      chance with all attacks by 4% for 8 sec.
    - Your successful ranged attacks have a 6% chance to increase your critical strike
      chance with all attacks by 6% for 8 sec.
    - Your successful ranged attacks have a 6% chance to increase your critical strike
      chance with all attacks by 8% for 8 sec.
    - Your successful ranged attacks have a 6% chance to increase your critical strike
      chance with all attacks by 10% for 8 sec.
  talent.readiness:
    name: Readiness
    tooltip:
    - When activated, this ability immediately finishes the cooldown on your other
      Hunter abilities.
  spell.Aimed Shot:
    name: Aimed Shot
  spell.Aimed Shot (Era):
    name: Aimed Shot (Era)
  spell.Arcane Shot:
    name: Arcane Shot
  spell.Auto Shot:
    name: Auto Shot
  spell.Concussive Shot:
    name: Concussive Shot
  spell.Multi-Shot:
    name: Multi-Shot
  spell.Rapid Fire:
    name: Rapid Fire
  spell.Scatter Shot:
    name: Scatter Shot
  spell.Scorpid Sting:
    name: Scorpid Sting
  spell.Serpent Sting:
    name: Serpent Sting
  spell.Steady Shot:
    name: Steady Shot
  spell.Viper Sting:
    name: Viper Sting
  spell.Volley:
    name: Volley
  spell.Wyvern Sting:
    name: Wyvern Sting
