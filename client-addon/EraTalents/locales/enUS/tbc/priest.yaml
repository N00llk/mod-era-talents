schemaVersion: 1
locale: enUS
era: tbc
class: priest
texts:
  tree.1:
    name: Discipline
  talent.unbreakable_will:
    name: Unbreakable Will
    tooltip:
    - Increases your chance to resist Stun, Fear, and Silence effects by an additional
      3%.
    - Increases your chance to resist Stun, Fear, and Silence effects by an additional
      6%.
    - Increases your chance to resist Stun, Fear, and Silence effects by an additional
      9%.
    - Increases your chance to resist Stun, Fear, and Silence effects by an additional
      12%.
    - Increases your chance to resist Stun, Fear, and Silence effects by an additional
      15%.
  talent.wand_specialization:
    name: Wand Specialization
    tooltip:
    - Increases your damage with Wands by 5%.
    - Increases your damage with Wands by 10%.
    - Increases your damage with Wands by 15%.
    - Increases your damage with Wands by 20%.
    - Increases your damage with Wands by 25%.
  talent.silent_resolve:
    name: Silent Resolve
    tooltip:
    - Reduces the threat generated by your Holy and Discipline spells by 4% and reduces
      the chance your spells will be dispelled by 4%.
    - Reduces the threat generated by your Holy and Discipline spells by 8% and reduces
      the chance your spells will be dispelled by 8%.
    - Reduces the threat generated by your Holy and Discipline spells by 12% and reduces
      the chance your spells will be dispelled by 12%.
    - Reduces the threat generated by your Holy and Discipline spells by 16% and reduces
      the chance your spells will be dispelled by 16%.
    - Reduces the threat generated by your Holy and Discipline spells by 20% and reduces
      the chance your spells will be dispelled by 20%.
  talent.improved_power_word_fortitude:
    name: 'Improved Power Word: Fortitude'
    tooltip:
    - 'Increases the effect of your Power Word: Fortitude and Prayer of Fortitude
      spells by 15%.'
    - 'Increases the effect of your Power Word: Fortitude and Prayer of Fortitude
      spells by 30%.'
  talent.improved_power_word_shield:
    name: 'Improved Power Word: Shield'
    tooltip:
    - 'Increases the damage absorbed by your Power Word: Shield by 5%.'
    - 'Increases the damage absorbed by your Power Word: Shield by 10%.'
    - 'Increases the damage absorbed by your Power Word: Shield by 15%.'
  talent.martyrdom:
    name: Martyrdom
    tooltip:
    - Gives you a 50% chance to gain the Focused Casting effect that lasts for 6 sec
      after being the victim of a melee or ranged critical strike. The Focused Casting
      effect prevents you from losing casting time when taking damage while casting
      Priest spells and increases resistance to Interrupt effects by 10%.
    - Gives you a 100% chance to gain the Focused Casting effect that lasts for 6
      sec after being the victim of a melee or ranged critical strike. The Focused
      Casting effect prevents you from losing casting time when taking damage while
      casting Priest spells and increases resistance to Interrupt effects by 20%.
  talent.absolution:
    name: Absolution
    tooltip:
    - Reduces the mana cost of your Dispel Magic, Cure Disease, Abolish Disease and
      Mass Dispel spells by 5%.
    - Reduces the mana cost of your Dispel Magic, Cure Disease, Abolish Disease and
      Mass Dispel spells by 10%.
    - Reduces the mana cost of your Dispel Magic, Cure Disease, Abolish Disease and
      Mass Dispel spells by 15%.
  talent.inner_focus:
    name: Inner Focus
    tooltip:
    - When activated, reduces the mana cost of your next spell by 100% and increases
      its critical effect chance by 25% if it is capable of a critical effect.
  talent.meditation:
    name: Meditation
    tooltip:
    - Allows 10% of your mana regeneration to continue while casting.
    - Allows 20% of your mana regeneration to continue while casting.
    - Allows 30% of your mana regeneration to continue while casting.
  talent.improved_inner_fire:
    name: Improved Inner Fire
    tooltip:
    - Increases the armor bonus of your Inner Fire spell by 10%.
    - Increases the armor bonus of your Inner Fire spell by 20%.
    - Increases the armor bonus of your Inner Fire spell by 30%.
  talent.mental_agility:
    name: Mental Agility
    tooltip:
    - Reduces the mana cost of your instant cast spells by 2%.
    - Reduces the mana cost of your instant cast spells by 4%.
    - Reduces the mana cost of your instant cast spells by 6%.
    - Reduces the mana cost of your instant cast spells by 8%.
    - Reduces the mana cost of your instant cast spells by 10%.
  talent.improved_mana_burn:
    name: Improved Mana Burn
    tooltip:
    - Reduces the casting time of your Mana Burn spell by 0.5 sec.
    - Reduces the casting time of your Mana Burn spell by 1 sec.
  talent.mental_strength:
    name: Mental Strength
    tooltip:
    - Increases your maximum mana by 2%.
    - Increases your maximum mana by 4%.
    - Increases your maximum mana by 6%.
    - Increases your maximum mana by 8%.
    - Increases your maximum mana by 10%.
  talent.divine_spirit:
    name: Divine Spirit
    tooltip:
    - Holy power infuses the target, increasing their Spirit by 17 for 30 min.
  talent.improved_divine_spirit:
    name: Improved Divine Spirit
    tooltip:
    - Your Divine Spirit and Prayer of Spirit spells also increase the target's spell
      damage and healing by an amount equal to 5% of their total Spirit.
    - Your Divine Spirit and Prayer of Spirit spells also increase the target's spell
      damage and healing by an amount equal to 10% of their total Spirit.
  talent.focused_power:
    name: Focused Power
    tooltip:
    - Your Smite, Mind Blast and Mass Dispel spells have an additional 2% chance to
      hit. In addition, your Mass Dispel cast time is reduced by 0.5 sec.
    - Your Smite, Mind Blast and Mass Dispel spells have an additional 4% chance to
      hit. In addition, your Mass Dispel cast time is reduced by 1 sec.
  talent.force_of_will:
    name: Force of Will
    tooltip:
    - Increases your spell damage by 1% and the critical strike chance of your offensive
      spells by 1%.
    - Increases your spell damage by 2% and the critical strike chance of your offensive
      spells by 2%.
    - Increases your spell damage by 3% and the critical strike chance of your offensive
      spells by 3%.
    - Increases your spell damage by 4% and the critical strike chance of your offensive
      spells by 4%.
    - Increases your spell damage by 5% and the critical strike chance of your offensive
      spells by 5%.
  talent.focused_will:
    name: Focused Will
    tooltip:
    - After taking a critical hit you gain the Focused Will effect, reducing all damage
      taken by 2% and increasing healing effects on you by 4%. Stacks up to 3 times.
      Lasts 8 sec.
    - After taking a critical hit you gain the Focused Will effect, reducing all damage
      taken by 3% and increasing healing effects on you by 7%. Stacks up to 3 times.
      Lasts 8 sec.
    - After taking a critical hit you gain the Focused Will effect, reducing all damage
      taken by 4% and increasing healing effects on you by 10%. Stacks up to 3 times.
      Lasts 8 sec.
  talent.power_infusion:
    name: Power Infusion
    tooltip:
    - Infuses the target with power, increasing spell casting speed by 20% and reducing
      the mana cost of all spells by 20%. Lasts 15 sec.
  talent.reflective_shield:
    name: Reflective Shield
    tooltip:
    - 'Causes 10% of the damage absorbed by your Power Word: Shield to reflect back
      at the attacker. This damage causes no threat.'
    - 'Causes 20% of the damage absorbed by your Power Word: Shield to reflect back
      at the attacker. This damage causes no threat.'
    - 'Causes 30% of the damage absorbed by your Power Word: Shield to reflect back
      at the attacker. This damage causes no threat.'
    - 'Causes 40% of the damage absorbed by your Power Word: Shield to reflect back
      at the attacker. This damage causes no threat.'
    - 'Causes 50% of the damage absorbed by your Power Word: Shield to reflect back
      at the attacker. This damage causes no threat.'
  talent.enlightenment:
    name: Enlightenment
    tooltip:
    - Increases your total Stamina, Intellect and Spirit by 1%.
    - Increases your total Stamina, Intellect and Spirit by 2%.
    - Increases your total Stamina, Intellect and Spirit by 3%.
    - Increases your total Stamina, Intellect and Spirit by 4%.
    - Increases your total Stamina, Intellect and Spirit by 5%.
  talent.pain_suppression:
    name: Pain Suppression
    tooltip:
    - Instantly reduces a friendly target's threat by 5%, reduces all damage taken
      by 40% and increases resistance to Dispel mechanics by 65% for 8 sec.
  tree.2:
    name: Holy
  talent.healing_focus:
    name: Healing Focus
    tooltip:
    - Gives you a 35% chance to avoid interruption caused by damage while casting
      any healing spell.
    - Gives you a 70% chance to avoid interruption caused by damage while casting
      any healing spell.
  talent.improved_renew:
    name: Improved Renew
    tooltip:
    - Increases the amount healed by your Renew spell by 5%.
    - Increases the amount healed by your Renew spell by 10%.
    - Increases the amount healed by your Renew spell by 15%.
  talent.holy_specialization:
    name: Holy Specialization
    tooltip:
    - Increases the critical effect chance of your Holy spells by 1%.
    - Increases the critical effect chance of your Holy spells by 2%.
    - Increases the critical effect chance of your Holy spells by 3%.
    - Increases the critical effect chance of your Holy spells by 4%.
    - Increases the critical effect chance of your Holy spells by 5%.
  talent.spell_warding:
    name: Spell Warding
    tooltip:
    - Reduces all spell damage taken by 2%.
    - Reduces all spell damage taken by 4%.
    - Reduces all spell damage taken by 6%.
    - Reduces all spell damage taken by 8%.
    - Reduces all spell damage taken by 10%.
  talent.divine_fury:
    name: Divine Fury
    tooltip:
    - Reduces the casting time of your Smite, Holy Fire, Heal and Greater Heal spells
      by 0.1 sec.
    - Reduces the casting time of your Smite, Holy Fire, Heal and Greater Heal spells
      by 0.2 sec.
    - Reduces the casting time of your Smite, Holy Fire, Heal and Greater Heal spells
      by 0.3 sec.
    - Reduces the casting time of your Smite, Holy Fire, Heal and Greater Heal spells
      by 0.4 sec.
    - Reduces the casting time of your Smite, Holy Fire, Heal and Greater Heal spells
      by 0.5 sec.
  talent.holy_nova:
    name: Holy Nova
    tooltip:
    - Causes an explosion of holy light around the caster, causing 29 to 34 Holy damage
      to all enemy targets within 10 yards and healing all party members within 10
      yards for 54 to 63. These effects cause no threat.
  talent.blessed_recovery:
    name: Blessed Recovery
    tooltip:
    - After being struck by a melee or ranged critical hit, heal 8% of the damage
      taken over 6 sec.
    - After being struck by a melee or ranged critical hit, heal 16% of the damage
      taken over 6 sec.
    - After being struck by a melee or ranged critical hit, heal 25% of the damage
      taken over 6 sec.
  talent.inspiration:
    name: Inspiration
    tooltip:
    - Increases your target's armor by 8% for 15 sec after getting a critical effect
      from your Flash Heal, Heal, Greater Heal, Binding Heal, Prayer of Healing, or
      Circle of Healing spell.
    - Increases your target's armor by 16% for 15 sec after getting a critical effect
      from your Flash Heal, Heal, Greater Heal, Binding Heal, Prayer of Healing, or
      Circle of Healing spell.
    - Increases your target's armor by 25% for 15 sec after getting a critical effect
      from your Flash Heal, Heal, Greater Heal, Binding Heal, Prayer of Healing, or
      Circle of Healing spell.
  talent.holy_reach:
    name: Holy Reach
    tooltip:
    - Increases the range of your Smite and Holy Fire spells and the radius of your
      Prayer of Healing, Holy Nova and Circle of Healing spells by 10%.
    - Increases the range of your Smite and Holy Fire spells and the radius of your
      Prayer of Healing, Holy Nova and Circle of Healing spells by 20%.
  talent.improved_healing:
    name: Improved Healing
    tooltip:
    - Reduces the mana cost of your Lesser Heal, Heal, and Greater Heal spells by
      5%.
    - Reduces the mana cost of your Lesser Heal, Heal, and Greater Heal spells by
      10%.
    - Reduces the mana cost of your Lesser Heal, Heal, and Greater Heal spells by
      15%.
  talent.searing_light:
    name: Searing Light
    tooltip:
    - Increases the damage of your Smite and Holy Fire spells by 5%.
    - Increases the damage of your Smite and Holy Fire spells by 10%.
  talent.healing_prayers:
    name: Healing Prayers
    tooltip:
    - Reduces the mana cost of your Prayer of Healing and Prayer of Mending spell
      by 10%.
    - Reduces the mana cost of your Prayer of Healing and Prayer of Mending spell
      by 20%.
  talent.spirit_of_redemption:
    name: Spirit of Redemption
    tooltip:
    - Increases total Spirit by 5% and upon death, the priest becomes the Spirit of
      Redemption for 15 sec. The Spirit of Redemption cannot move, attack, be attacked
      or targeted by any spells or effects. While in this form the priest can cast
      any healing spell free of cost. When the effect ends, the priest dies.
  talent.spiritual_guidance:
    name: Spiritual Guidance
    tooltip:
    - Increases spell damage and healing by up to 5% of your total Spirit.
    - Increases spell damage and healing by up to 10% of your total Spirit.
    - Increases spell damage and healing by up to 15% of your total Spirit.
    - Increases spell damage and healing by up to 20% of your total Spirit.
    - Increases spell damage and healing by up to 25% of your total Spirit.
  talent.surge_of_light:
    name: Surge of Light
    tooltip:
    - Your spell criticals have a 25% chance to cause your next Smite spell to be
      instant cast, cost no mana but be incapable of a critical hit. This effect lasts
      10 sec.
    - Your spell criticals have a 50% chance to cause your next Smite spell to be
      instant cast, cost no mana but be incapable of a critical hit. This effect lasts
      10 sec.
  talent.spiritual_healing:
    name: Spiritual Healing
    tooltip:
    - Increases the amount healed by your healing spells by 2%.
    - Increases the amount healed by your healing spells by 4%.
    - Increases the amount healed by your healing spells by 6%.
    - Increases the amount healed by your healing spells by 8%.
    - Increases the amount healed by your healing spells by 10%.
  talent.holy_concentration:
    name: Holy Concentration
    tooltip:
    - Gives you a 2% chance to enter a Clearcasting state after casting any Flash
      Heal, Binding Heal, or Greater Heal spell. The Clearcasting state reduces the
      mana cost of your next Flash Heal, Binding Heal, or Greater Heal spell by 100%.
    - Gives you a 4% chance to enter a Clearcasting state after casting any Flash
      Heal, Binding Heal, or Greater Heal spell. The Clearcasting state reduces the
      mana cost of your next Flash Heal, Binding Heal, or Greater Heal spell by 100%.
    - Gives you a 6% chance to enter a Clearcasting state after casting any Flash
      Heal, Binding Heal, or Greater Heal spell. The Clearcasting state reduces the
      mana cost of your next Flash Heal, Binding Heal, or Greater Heal spell by 100%.
  talent.lightwell:
    name: Lightwell
    tooltip:
    - Creates a Holy Lightwell. Members of your raid or party can click the Lightwell
      to restore 801 health over 6 sec. Attacks done to you equal to 30% of your total
      health will cancel the effect. Lightwell lasts for 3 min or 10 charges.
  talent.blessed_resilience:
    name: Blessed Resilience
    tooltip:
    - Critical hits made against you have a 20% chance to prevent you from being critically
      hit again for 6 sec.
    - Critical hits made against you have a 40% chance to prevent you from being critically
      hit again for 6 sec.
    - Critical hits made against you have a 60% chance to prevent you from being critically
      hit again for 6 sec.
  talent.empowered_healing:
    name: Empowered Healing
    tooltip:
    - Your Greater Heal spell gains an additional 4% and your Flash Heal and Binding
      Heal gain an additional 2% of your bonus healing effects.
    - Your Greater Heal spell gains an additional 8% and your Flash Heal and Binding
      Heal gain an additional 4% of your bonus healing effects.
    - Your Greater Heal spell gains an additional 12% and your Flash Heal and Binding
      Heal gain an additional 6% of your bonus healing effects.
    - Your Greater Heal spell gains an additional 16% and your Flash Heal and Binding
      Heal gain an additional 8% of your bonus healing effects.
    - Your Greater Heal spell gains an additional 20% and your Flash Heal and Binding
      Heal gain an additional 10% of your bonus healing effects.
  talent.circle_of_healing:
    name: Circle of Healing
    tooltip:
    - Heals friendly target and that target's party members within 15 yards of the
      target for 250 to 274.
  tree.3:
    name: Shadow
  talent.spirit_tap:
    name: Spirit Tap
    tooltip:
    - Gives you a 20% chance to gain a 100% bonus to your Spirit after killing a target
      that yields experience or honor. For the duration, your mana will regenerate
      at a 50% rate while casting. Lasts 15 sec.
    - Gives you a 40% chance to gain a 100% bonus to your Spirit after killing a target
      that yields experience or honor. For the duration, your mana will regenerate
      at a 50% rate while casting. Lasts 15 sec.
    - Gives you a 60% chance to gain a 100% bonus to your Spirit after killing a target
      that yields experience or honor. For the duration, your mana will regenerate
      at a 50% rate while casting. Lasts 15 sec.
    - Gives you a 80% chance to gain a 100% bonus to your Spirit after killing a target
      that yields experience or honor. For the duration, your mana will regenerate
      at a 50% rate while casting. Lasts 15 sec.
    - Gives you a 100% chance to gain a 100% bonus to your Spirit after killing a
      target that yields experience or honor. For the duration, your mana will regenerate
      at a 50% rate while casting. Lasts 15 sec.
  talent.blackout:
    name: Blackout
    tooltip:
    - Gives your Shadow damage spells a 2% chance to stun the target for 3 sec.
    - Gives your Shadow damage spells a 4% chance to stun the target for 3 sec.
    - Gives your Shadow damage spells a 6% chance to stun the target for 3 sec.
    - Gives your Shadow damage spells a 8% chance to stun the target for 3 sec.
    - Gives your Shadow damage spells a 10% chance to stun the target for 3 sec.
  talent.shadow_affinity:
    name: Shadow Affinity
    tooltip:
    - Reduces the threat generated by your Shadow spells by 8%.
    - Reduces the threat generated by your Shadow spells by 16%.
    - Reduces the threat generated by your Shadow spells by 25%.
  talent.improved_shadow_word_pain:
    name: 'Improved Shadow Word: Pain'
    tooltip:
    - 'Increases the duration of your Shadow Word: Pain spell by 3 sec.'
    - 'Increases the duration of your Shadow Word: Pain spell by 6 sec.'
  talent.shadow_focus:
    name: Shadow Focus
    tooltip:
    - Reduces your target's chance to resist your Shadow spells by 2%.
    - Reduces your target's chance to resist your Shadow spells by 4%.
    - Reduces your target's chance to resist your Shadow spells by 6%.
    - Reduces your target's chance to resist your Shadow spells by 8%.
    - Reduces your target's chance to resist your Shadow spells by 10%.
  talent.improved_psychic_scream:
    name: Improved Psychic Scream
    tooltip:
    - Reduces the cooldown of your Psychic Scream spell by 2 sec.
    - Reduces the cooldown of your Psychic Scream spell by 4 sec.
  talent.improved_mind_blast:
    name: Improved Mind Blast
    tooltip:
    - Reduces the cooldown of your Mind Blast spell by 0.5 sec.
    - Reduces the cooldown of your Mind Blast spell by 1 sec.
    - Reduces the cooldown of your Mind Blast spell by 1.5 sec.
    - Reduces the cooldown of your Mind Blast spell by 2 sec.
    - Reduces the cooldown of your Mind Blast spell by 2.5 sec.
  talent.mind_flay:
    name: Mind Flay
    tooltip:
    - Assault the target's mind with Shadow energy, causing 75 Shadow damage over
      3 sec and slowing their movement speed by 50%.
  talent.improved_fade:
    name: Improved Fade
    tooltip:
    - Decreases the cooldown of your Fade ability by 3 sec.
    - Decreases the cooldown of your Fade ability by 6 sec.
  talent.shadow_reach:
    name: Shadow Reach
    tooltip:
    - Increases the range of your offensive Shadow spells by 10%.
    - Increases the range of your offensive Shadow spells by 20%.
  talent.shadow_weaving:
    name: Shadow Weaving
    tooltip:
    - Your Shadow damage spells have a 20% chance to cause your target to be vulnerable
      to Shadow damage. This vulnerability increases the Shadow damage dealt to your
      target by 2% and lasts 15 sec. Stacks up to 5 times.
    - Your Shadow damage spells have a 40% chance to cause your target to be vulnerable
      to Shadow damage. This vulnerability increases the Shadow damage dealt to your
      target by 2% and lasts 15 sec. Stacks up to 5 times.
    - Your Shadow damage spells have a 60% chance to cause your target to be vulnerable
      to Shadow damage. This vulnerability increases the Shadow damage dealt to your
      target by 2% and lasts 15 sec. Stacks up to 5 times.
    - Your Shadow damage spells have a 80% chance to cause your target to be vulnerable
      to Shadow damage. This vulnerability increases the Shadow damage dealt to your
      target by 2% and lasts 15 sec. Stacks up to 5 times.
    - Your Shadow damage spells have a 100% chance to cause your target to be vulnerable
      to Shadow damage. This vulnerability increases the Shadow damage dealt to your
      target by 2% and lasts 15 sec. Stacks up to 5 times.
  talent.silence:
    name: Silence
    tooltip:
    - Silences the target, preventing them from casting spells for 5 sec.
  talent.vampiric_embrace:
    name: Vampiric Embrace
    tooltip:
    - Afflicts your target with Shadow energy that causes all party members to be
      healed for 15% of any Shadow spell damage you deal for 1 min.
  talent.improved_vampiric_embrace:
    name: Improved Vampiric Embrace
    tooltip:
    - Increases the percentage healed by Vampiric Embrace by an additional 5%.
    - Increases the percentage healed by Vampiric Embrace by an additional 10%.
  talent.focused_mind:
    name: Focused Mind
    tooltip:
    - Reduces the mana cost of your Mind Blast, Mind Control and Mind Flay spells
      by 5%.
    - Reduces the mana cost of your Mind Blast, Mind Control and Mind Flay spells
      by 10%.
    - Reduces the mana cost of your Mind Blast, Mind Control and Mind Flay spells
      by 15%.
  talent.shadow_resilience:
    name: Shadow Resilience
    tooltip:
    - Reduces the chance you'll be critically hit by all spells by 2%.
    - Reduces the chance you'll be critically hit by all spells by 4%.
  talent.darkness:
    name: Darkness
    tooltip:
    - Increases your Shadow spell damage by 2%.
    - Increases your Shadow spell damage by 4%.
    - Increases your Shadow spell damage by 6%.
    - Increases your Shadow spell damage by 8%.
    - Increases your Shadow spell damage by 10%.
  talent.shadowform:
    name: Shadowform
    tooltip:
    - Assume a Shadowform, increasing your Shadow damage by 15% and reducing Physical
      damage done to you by 15%. However, you may not cast Holy spells while in this
      form.
  talent.shadow_power:
    name: Shadow Power
    tooltip:
    - 'Increases the critical strike chance of your Mind Blast and Shadow Word: Death
      spells by 3%.'
    - 'Increases the critical strike chance of your Mind Blast and Shadow Word: Death
      spells by 6%.'
    - 'Increases the critical strike chance of your Mind Blast and Shadow Word: Death
      spells by 9%.'
    - 'Increases the critical strike chance of your Mind Blast and Shadow Word: Death
      spells by 12%.'
    - 'Increases the critical strike chance of your Mind Blast and Shadow Word: Death
      spells by 15%.'
  talent.misery:
    name: Misery
    tooltip:
    - 'Your Shadow Word: Pain, Mind Flay and Vampiric Touch spells also cause the
      target to take an additional 1% spell damage.'
    - 'Your Shadow Word: Pain, Mind Flay and Vampiric Touch spells also cause the
      target to take an additional 2% spell damage.'
    - 'Your Shadow Word: Pain, Mind Flay and Vampiric Touch spells also cause the
      target to take an additional 3% spell damage.'
    - 'Your Shadow Word: Pain, Mind Flay and Vampiric Touch spells also cause the
      target to take an additional 4% spell damage.'
    - 'Your Shadow Word: Pain, Mind Flay and Vampiric Touch spells also cause the
      target to take an additional 5% spell damage.'
  talent.vampiric_touch:
    name: Vampiric Touch
    tooltip:
    - Causes 450 Shadow damage over 15 sec to your target and causes all party members
      to gain mana equal to 5% of any Shadow spell damage you deal.
  spell.Circle of Healing:
    name: Circle of Healing
  spell.Devouring Plague:
    name: Devouring Plague
  spell.Dispel Magic:
    name: Dispel Magic
  spell.Divine Spirit:
    name: Divine Spirit
  spell.Fade:
    name: Fade
  spell.Holy Nova:
