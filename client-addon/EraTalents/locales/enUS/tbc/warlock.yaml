schemaVersion: 1
locale: enUS
era: tbc
class: warlock
texts:
  tree.1:
    name: Affliction
  talent.suppression:
    name: Suppression
    tooltip:
    - Reduces the chance for enemies to resist your Affliction spells by 2%.
    - Reduces the chance for enemies to resist your Affliction spells by 4%.
    - Reduces the chance for enemies to resist your Affliction spells by 6%.
    - Reduces the chance for enemies to resist your Affliction spells by 8%.
    - Reduces the chance for enemies to resist your Affliction spells by 10%.
  talent.improved_corruption:
    name: Improved Corruption
    tooltip:
    - Reduces the casting time of your Corruption spell by 0.4 sec.
    - Reduces the casting time of your Corruption spell by 0.8 sec.
    - Reduces the casting time of your Corruption spell by 1.2 sec.
    - Reduces the casting time of your Corruption spell by 1.6 sec.
    - Reduces the casting time of your Corruption spell by 2 sec.
  talent.improved_curse_of_weakness:
    name: Improved Curse of Weakness
    tooltip:
    - Increases the effect of your Curse of Weakness by 10%.
    - Increases the effect of your Curse of Weakness by 20%.
  talent.improved_drain_soul:
    name: Improved Drain Soul
    tooltip:
    - Returns 7% of your maximum mana if the target is killed by you while you drain
      its soul. In addition, your Affliction spells generate 5% less threat.
    - Returns 15% of your maximum mana if the target is killed by you while you drain
      its soul. In addition, your Affliction spells generate 10% less threat.
  talent.improved_life_tap:
    name: Improved Life Tap
    tooltip:
    - Increases the amount of Mana awarded by your Life Tap spell by 10%.
    - Increases the amount of Mana awarded by your Life Tap spell by 20%.
  talent.soul_siphon:
    name: Soul Siphon
    tooltip:
    - Increases the amount drained by your Drain Life spell by an additional 2% for
      each Affliction effect on the target, up to a maximum of 24% additional effect.
    - Increases the amount drained by your Drain Life spell by an additional 4% for
      each Affliction effect on the target, up to a maximum of 60% additional effect.
  talent.improved_curse_of_agony:
    name: Improved Curse of Agony
    tooltip:
    - Increases the damage done by your Curse of Agony by 5%.
    - Increases the damage done by your Curse of Agony by 10%.
  talent.fel_concentration:
    name: Fel Concentration
    tooltip:
    - Gives you a 14% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 28% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 42% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 56% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 70% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
  talent.amplify_curse:
    name: Amplify Curse
    tooltip:
    - Increases the effect of your next Curse of Doom or Curse of Agony by 50%, or
      your next Curse of Exhaustion by an additional 20%. Lasts 30 sec.
  talent.grim_reach:
    name: Grim Reach
    tooltip:
    - Increases the range of your Affliction spells by 10%.
    - Increases the range of your Affliction spells by 20%.
  talent.nightfall:
    name: Nightfall
    tooltip:
    - Gives your Corruption and Drain Life spells a 2% chance to cause you to enter
      a Shadow Trance state after damaging the opponent. The Shadow Trance state reduces
      the casting time of your next Shadow Bolt spell by 100%.
    - Gives your Corruption and Drain Life spells a 4% chance to cause you to enter
      a Shadow Trance state after damaging the opponent. The Shadow Trance state reduces
      the casting time of your next Shadow Bolt spell by 100%.
  talent.empowered_corruption:
    name: Empowered Corruption
    tooltip:
    - Your Corruption spell gains an additional 12% of your bonus spell damage effects.
    - Your Corruption spell gains an additional 24% of your bonus spell damage effects.
    - Your Corruption spell gains an additional 36% of your bonus spell damage effects.
  talent.shadow_embrace:
    name: Shadow Embrace
    tooltip:
    - Your Corruption, Curse of Agony, Siphon Life and Seed of Corruption spells also
      cause the Shadow Embrace effect, which reduces physical damage caused by 1%.
    - Your Corruption, Curse of Agony, Siphon Life and Seed of Corruption spells also
      cause the Shadow Embrace effect, which reduces physical damage caused by 2%.
    - Your Corruption, Curse of Agony, Siphon Life and Seed of Corruption spells also
      cause the Shadow Embrace effect, which reduces physical damage caused by 3%.
    - Your Corruption, Curse of Agony, Siphon Life and Seed of Corruption spells also
      cause the Shadow Embrace effect, which reduces physical damage caused by 4%.
    - Your Corruption, Curse of Agony, Siphon Life and Seed of Corruption spells also
      cause the Shadow Embrace effect, which reduces physical damage caused by 5%.
  talent.siphon_life:
    name: Siphon Life
    tooltip:
    - Transfers 15 health from the target to the caster every 3 sec. Lasts 30 sec.
  talent.curse_of_exhaustion:
    name: Curse of Exhaustion
    tooltip:
    - Reduces the target's movement speed by 30% for 12 sec. Only one Curse per Warlock
      can be active on any one target.
  talent.shadow_mastery:
    name: Shadow Mastery
    tooltip:
    - Increases the damage dealt or life drained by your Shadow spells by 2%.
    - Increases the damage dealt or life drained by your Shadow spells by 4%.
    - Increases the damage dealt or life drained by your Shadow spells by 6%.
    - Increases the damage dealt or life drained by your Shadow spells by 8%.
    - Increases the damage dealt or life drained by your Shadow spells by 10%.
  talent.contagion:
    name: Contagion
    tooltip:
    - Increases the damage of Curse of Agony, Corruption and Seed of Corruption by
      1% and reduces the chance your Affliction spells will be dispelled by an additional
      6%.
    - Increases the damage of Curse of Agony, Corruption and Seed of Corruption by
      2% and reduces the chance your Affliction spells will be dispelled by an additional
      12%.
    - Increases the damage of Curse of Agony, Corruption and Seed of Corruption by
      3% and reduces the chance your Affliction spells will be dispelled by an additional
      18%.
    - Increases the damage of Curse of Agony, Corruption and Seed of Corruption by
      4% and reduces the chance your Affliction spells will be dispelled by an additional
      24%.
    - Increases the damage of Curse of Agony, Corruption and Seed of Corruption by
      5% and reduces the chance your Affliction spells will be dispelled by an additional
      30%.
  talent.dark_pact:
    name: Dark Pact
    tooltip:
    - Drains 305 of your pet's Mana, returning 100% to you.
  talent.improved_howl_of_terror:
    name: Improved Howl of Terror
    tooltip:
    - Reduces the casting time of your Howl of Terror spell by 0.8 sec.
    - Reduces the casting time of your Howl of Terror spell by 1.5 sec.
  talent.malediction:
    name: Malediction
    tooltip:
    - Increases the damage bonus effect of your Curse of the Elements spell by an
      additional 1%.
    - Increases the damage bonus effect of your Curse of the Elements spell by an
      additional 2%.
    - Increases the damage bonus effect of your Curse of the Elements spell by an
      additional 3%.
  talent.unstable_affliction:
    name: Unstable Affliction
    tooltip:
    - Shadow energy slowly destroys the target, causing 660 damage over 18 sec. In
      addition, if the Unstable Affliction is dispelled it will cause 990 damage to
      the dispeller and silence them for 5 sec.
  tree.2:
    name: Demonology
  talent.improved_healthstone:
    name: Improved Healthstone
    tooltip:
    - Increases the amount of Health restored by your Healthstone by 10%.
    - Increases the amount of Health restored by your Healthstone by 20%.
  talent.improved_imp:
    name: Improved Imp
    tooltip:
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 10%.
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 20%.
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 30%.
  talent.demonic_embrace:
    name: Demonic Embrace
    tooltip:
    - Increases your total Stamina by 3% but reduces your total Spirit by 1%.
    - Increases your total Stamina by 6% but reduces your total Spirit by 2%.
    - Increases your total Stamina by 9% but reduces your total Spirit by 3%.
    - Increases your total Stamina by 12% but reduces your total Spirit by 4%.
    - Increases your total Stamina by 15% but reduces your total Spirit by 5%.
  talent.improved_health_funnel:
    name: Improved Health Funnel
    tooltip:
    - Increases the amount of Health transferred by your Health Funnel spell by 10%
      and reduces the initial health cost by 10%.
    - Increases the amount of Health transferred by your Health Funnel spell by 20%
      and reduces the initial health cost by 20%.
  talent.improved_voidwalker:
    name: Improved Voidwalker
    tooltip:
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 10%.
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 20%.
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 30%.
  talent.fel_intellect:
    name: Fel Intellect
    tooltip:
    - Increases the Intellect of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 5% and increases your maximum mana by 1%.
    - Increases the Intellect of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 10% and increases your maximum mana by 2%.
    - Increases the Intellect of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 15% and increases your maximum mana by 3%.
  talent.improved_sayaad:
    name: Improved Succubus
    tooltip:
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 10%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 10%.
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 20%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 20%.
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 30%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 30%.
  talent.fel_domination:
    name: Fel Domination
    tooltip:
    - Your next Imp, Voidwalker, Succubus, Felhunter or Felguard Summon spell has
      its casting time reduced by 5.5 sec and its Mana cost reduced by 50%.
  talent.fel_stamina:
    name: Fel Stamina
    tooltip:
    - Increases the Stamina of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 5% and increases your maximum health by 1%.
    - Increases the Stamina of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 10% and increases your maximum health by 2%.
    - Increases the Stamina of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      by 15% and increases your maximum health by 3%.
  talent.demonic_aegis:
    name: Demonic Aegis
    tooltip:
    - Increases the effectiveness of your Demon Armor and Fel Armor spells by 10%.
    - Increases the effectiveness of your Demon Armor and Fel Armor spells by 20%.
    - Increases the effectiveness of your Demon Armor and Fel Armor spells by 30%.
  talent.master_summoner:
    name: Master Summoner
    tooltip:
    - Reduces the casting time of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      Summoning spells by 2 sec and the Mana cost by 20%.
    - Reduces the casting time of your Imp, Voidwalker, Succubus, Felhunter and Felguard
      Summoning spells by 4 sec and the Mana cost by 40%.
  talent.unholy_power:
    name: Unholy Power
    tooltip:
    - Increases the damage done by your Voidwalker, Succubus, Felhunter and Felguard's
      melee attacks and your Imp's Firebolt by 4%.
    - Increases the damage done by your Voidwalker, Succubus, Felhunter and Felguard's
      melee attacks and your Imp's Firebolt by 8%.
    - Increases the damage done by your Voidwalker, Succubus, Felhunter and Felguard's
      melee attacks and your Imp's Firebolt by 12%.
    - Increases the damage done by your Voidwalker, Succubus, Felhunter and Felguard's
      melee attacks and your Imp's Firebolt by 16%.
    - Increases the damage done by your Voidwalker, Succubus, Felhunter and Felguard's
      melee attacks and your Imp's Firebolt by 20%.
  talent.improved_subjugate_demon:
    name: Improved Enslave Demon
    tooltip:
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 5% and reduces the resist chance by 5%.
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 10% and reduces the resist chance by 10%.
  talent.demonic_sacrifice:
    name: Demonic Sacrifice
    tooltip:
    - 'When activated, sacrifices your summoned demon to grant you an effect that
      lasts 30 min. The effect is canceled if any Demon is summoned. Imp: Increases
      your Fire damage by 15%. Voidwalker: Restores 2% of total health every 4 sec.
      Succubus: Increases your Shadow damage by 15%. Felhunter: Restores 3% of total
      mana every 4 sec. Felguard: Increases your Shadow damage by 10% and restores
      2% of total mana every 4 sec.'
  talent.master_conjuror:
    name: Master Conjuror
    tooltip:
    - Increases the bonus Fire damage from Firestones and the Firestone effect by
      15% and increases the spell critical strike rating bonus of your Spellstone
      by 15%.
    - Increases the bonus Fire damage from Firestones and the Firestone effect by
      30% and increases the spell critical strike rating bonus of your Spellstone
      by 30%.
  talent.mana_feed:
    name: Mana Feed
    tooltip:
    - When you gain mana from Drain Mana or Life Tap spells, your pet gains 33% of
      the mana you gain.
    - When you gain mana from Drain Mana or Life Tap spells, your pet gains 66% of
      the mana you gain.
    - When you gain mana from Drain Mana or Life Tap spells, your pet gains 100% of
      the mana you gain.
  talent.master_demonologist:
    name: Master Demonologist
    tooltip:
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 4%. Voidwalker - Reduces physical
      damage taken by 2%. Succubus - Increases all damage caused by 2%. Felhunter
      - Increases all resistances by .2 per level. Felguard - Increases all damage
      caused by 1% and all resistances by .1 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 8%. Voidwalker - Reduces physical
      damage taken by 4%. Succubus - Increases all damage caused by 4%. Felhunter
      - Increases all resistances by .4 per level. Felguard - Increases all damage
      caused by 2% and all resistances by .2 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 12%. Voidwalker - Reduces physical
      damage taken by 6%. Succubus - Increases all damage caused by 6%. Felhunter
      - Increases all resistances by .6 per level. Felguard - Increases all damage
      caused by 3% and all resistances by .3 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 16%. Voidwalker - Reduces physical
      damage taken by 8%. Succubus - Increases all damage caused by 8%. Felhunter
      - Increases all resistances by .8 per level. Felguard - Increases all damage
      caused by 4% and all resistances by .4 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 20%. Voidwalker - Reduces physical
      damage taken by 10%. Succubus - Increases all damage caused by 10%. Felhunter
      - Increases all resistances by 1 per level. Felguard - Increases all damage
      caused by 5% and all resistances by .5 per level.
  talent.demonic_resilience:
    name: Demonic Resilience
    tooltip:
    - Reduces the chance you'll be critically hit by melee and spells by 1% and reduces
      all damage your summoned demon takes by 5%.
    - Reduces the chance you'll be critically hit by melee and spells by 2% and reduces
      all damage your summoned demon takes by 10%.
    - Reduces the chance you'll be critically hit by melee and spells by 3% and reduces
      all damage your summoned demon takes by 15%.
  talent.soul_link:
    name: Soul Link
    tooltip:
    - When active, 20% of all damage taken by the caster is taken by your Imp, Voidwalker,
      Succubus, Felhunter, Felguard, or enslaved demon instead. That damage cannot
      be prevented. In addition, both the demon and master will inflict 5% more damage.
      Lasts as long as the demon is active and controlled.
  talent.demonic_knowledge:
    name: Demonic Knowledge
    tooltip:
    - Increases your spell damage by an amount equal to 4% of the total of your active
      demon's Stamina plus Intellect.
    - Increases your spell damage by an amount equal to 8% of the total of your active
      demon's Stamina plus Intellect.
    - Increases your spell damage by an amount equal to 12% of the total of your active
      demon's Stamina plus Intellect.
  talent.demonic_tactics:
    name: Demonic Tactics
    tooltip:
    - Increases melee and spell critical strike chance for you and your summoned demon
      by 1%.
    - Increases melee and spell critical strike chance for you and your summoned demon
      by 2%.
    - Increases melee and spell critical strike chance for you and your summoned demon
      by 3%.
    - Increases melee and spell critical strike chance for you and your summoned demon
      by 4%.
    - Increases melee and spell critical strike chance for you and your summoned demon
      by 5%.
  talent.summon_felguard:
    name: Summon Felguard
    tooltip:
    - Summons a Felguard under the command of the Warlock.
  tree.3:
    name: Destruction
  talent.improved_shadow_bolt:
    name: Improved Shadow Bolt
    tooltip:
    - Your Shadow Bolt critical strikes increase Shadow damage dealt to the target
      by 4% until 4 non-periodic damage sources are applied. Effect lasts a maximum
      of 12 sec.
    - Your Shadow Bolt critical strikes increase Shadow damage dealt to the target
      by 8% until 4 non-periodic damage sources are applied. Effect lasts a maximum
      of 12 sec.
    - Your Shadow Bolt critical strikes increase Shadow damage dealt to the target
      by 12% until 4 non-periodic damage sources are applied. Effect lasts a maximum
      of 12 sec.
    - Your Shadow Bolt critical strikes increase Shadow damage dealt to the target
      by 16% until 4 non-periodic damage sources are applied. Effect lasts a maximum
      of 12 sec.
    - Your Shadow Bolt critical strikes increase Shadow damage dealt to the target
      by 20% until 4 non-periodic damage sources are applied. Effect lasts a maximum
      of 12 sec.
  talent.cataclysm:
    name: Cataclysm
    tooltip:
    - Reduces the Mana cost of your Destruction spells by 1%.
    - Reduces the Mana cost of your Destruction spells by 2%.
    - Reduces the Mana cost of your Destruction spells by 3%.
    - Reduces the Mana cost of your Destruction spells by 4%.
    - Reduces the Mana cost of your Destruction spells by 5%.
  talent.bane:
    name: Bane
    tooltip:
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.1 sec
      and your Soul Fire spell by 0.4 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.2 sec
      and your Soul Fire spell by 0.8 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.3 sec
      and your Soul Fire spell by 1.2 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.4 sec
      and your Soul Fire spell by 1.6 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.5 sec
      and your Soul Fire spell by 2 sec.
  talent.aftermath:
    name: Aftermath
    tooltip:
    - Gives your Destruction spells a 2% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 4% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 6% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 8% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 10% chance to daze the target for 5 sec.
  talent.improved_firebolt:
    name: Improved Firebolt
    tooltip:
    - Reduces the casting time of your Imp's Firebolt spell by 0.25 sec.
    - Reduces the casting time of your Imp's Firebolt spell by 0.5 sec.
  talent.improved_lash_of_pain:
    name: Improved Lash of Pain
    tooltip:
    - Reduces the cooldown of your Succubus' and Incubus' Lash of Pain spell by 3
      sec.
    - Reduces the cooldown of your Succubus' and Incubus' Lash of Pain spell by 6
      sec.
  talent.devastation:
    name: Devastation
    tooltip:
    - Increases the critical strike chance of your Destruction spells by 1%.
    - Increases the critical strike chance of your Destruction spells by 2%.
    - Increases the critical strike chance of your Destruction spells by 3%.
    - Increases the critical strike chance of your Destruction spells by 4%.
    - Increases the critical strike chance of your Destruction spells by 5%.
  talent.shadowburn:
    name: Shadowburn
    tooltip:
    - Instantly blasts the target for 91 to 104 Shadow damage. If the target dies
      within 5 sec of Shadowburn, and yields experience or honor, the caster gains
      a Soul Shard.
  talent.intensity:
    name: Intensity
    tooltip:
    - Gives you a 35% chance to resist interruption caused by damage while casting
      or channeling any Destruction spell.
    - Gives you a 70% chance to resist interruption caused by damage while casting
      or channeling any Destruction spell.
  talent.destructive_reach:
    name: Destructive Reach
    tooltip:
    - Increases the range of your Destruction spells by 10% and reduces threat caused
      by Destruction spells by 5%.
    - Increases the range of your Destruction spells by 20% and reduces threat caused
      by Destruction spells by 10%.
  talent.improved_searing_pain:
    name: Improved Searing Pain
    tooltip:
    - Increases the critical strike chance of your Searing Pain spell by 4%.
    - Increases the critical strike chance of your Searing Pain spell by 7%.
    - Increases the critical strike chance of your Searing Pain spell by 10%.
  talent.pyroclasm:
    name: Pyroclasm
    tooltip:
    - Gives your Rain of Fire, Hellfire, and Soul Fire spells a 13% chance to stun
      the target for 3 sec.
    - Gives your Rain of Fire, Hellfire, and Soul Fire spells a 26% chance to stun
      the target for 3 sec.
  talent.improved_immolate:
    name: Improved Immolate
    tooltip:
    - Increases the initial damage of your Immolate spell by 5%.
    - Increases the initial damage of your Immolate spell by 10%.
    - Increases the initial damage of your Immolate spell by 15%.
    - Increases the initial damage of your Immolate spell by 20%.
    - Increases the initial damage of your Immolate spell by 25%.
  talent.ruin:
    name: Ruin
    tooltip:
    - Increases the critical strike damage bonus of your Destruction spells by 100%.
  talent.nether_protection:
    name: Nether Protection
    tooltip:
    - After being hit with a Shadow or Fire spell, you have a 10% chance to become
      immune to Shadow and Fire spells for 4 sec.
    - After being hit with a Shadow or Fire spell, you have a 20% chance to become
      immune to Shadow and Fire spells for 4 sec.
    - After being hit with a Shadow or Fire spell, you have a 30% chance to become
      immune to Shadow and Fire spells for 4 sec.
  talent.emberstorm:
    name: Emberstorm
    tooltip:
    - Increases the damage done by your Fire spells by 2% and reduces the cast time
      of your Incinerate spell by 2%.
    - Increases the damage done by your Fire spells by 4%, and reduces the cast time
      of your Incinerate spell by 4%.
    - Increases the damage done by your Fire spells by 6%, and reduces the cast time
      of your Incinerate spell by 6%.
    - Increases the damage done by your Fire spells by 8%, and reduces the cast time
      of your Incinerate spell by 8%.
    - Increases the damage done by your Fire spells by 10%, and reduces the cast time
      of your Incinerate spell by 10%.
  talent.backlash:
    name: Backlash
    tooltip:
    - Increases your critical strike chance with spells by an additional 1% and gives
      you a 8% chance when hit by a physical attack to reduce the cast time of your
      next Shadow Bolt or Incinerate spell by 100%. This effect lasts 8 sec and will
      not occur more than once every 8 seconds.
    - Increases your critical strike chance with spells by an additional 2% and gives
      you a 16% chance when hit by a physical attack to reduce the cast time of your
      next Shadow Bolt or Incinerate spell by 100%. This effect lasts 8 sec and will
      not occur more than once every 8 seconds.
    - Increases your critical strike chance with spells by an additional 3% and gives
      you a 25% chance when hit by a physical attack to reduce the cast time of your
      next Shadow Bolt or Incinerate spell by 100%. This effect lasts 8 sec and will
      not occur more than once every 8 seconds.
  talent.conflagrate:
    name: Conflagrate
    tooltip:
    - Ignites a target that is already afflicted by your Immolate, dealing 249 to
      316 Fire damage and consuming the Immolate spell.
  talent.soul_leech:
    name: Soul Leech
    tooltip:
    - Gives your Shadow Bolt, Shadowburn, Soul Fire, Incinerate, Searing Pain and
      Conflagrate spells a 10% chance to return health equal to 20% of the damage
      caused.
    - Gives your Shadow Bolt, Shadowburn, Soul Fire, Incinerate, Searing Pain and
      Conflagrate spells a 20% chance to return health equal to 20% of the damage
      caused.
    - Gives your Shadow Bolt, Shadowburn, Soul Fire, Incinerate, Searing Pain and
      Conflagrate spells a 30% chance to return health equal to 20% of the damage
      caused.
  talent.shadow_and_flame:
    name: Shadow and Flame
    tooltip:
    - Your Shadow Bolt and Incinerate spells gain an additional 4% of your bonus spell
      damage effects.
    - Your Shadow Bolt and Incinerate spells gain an additional 8% of your bonus spell
      damage effects.
    - Your Shadow Bolt and Incinerate spells gain an additional 12% of your bonus
      spell damage effects.
    - Your Shadow Bolt and Incinerate spells gain an additional 16% of your bonus
      spell damage effects.
    - Your Shadow Bolt and Incinerate spells gain an additional 20% of your bonus
      spell damage effects.
  talent.shadowfury:
    name: Shadowfury
    tooltip:
    - Shadowfury is unleashed, causing 357 to 422 Shadow damage and stunning all enemies
      within 8 yds for 2 sec.
  spell.Conflagrate:
    name: Conflagrate
  spell.Corruption:
    name: Corruption
  spell.Firebolt:
