schemaVersion: 1
locale: enUS
era: tbc
class: warrior
texts:
  tree.1:
    name: Arms
  talent.improved_heroic_strike:
    name: Improved Heroic Strike
    tooltip:
    - Reduces the cost of your Heroic Strike ability by 1 rage point.
    - Reduces the cost of your Heroic Strike ability by 2 rage points.
    - Reduces the cost of your Heroic Strike ability by 3 rage points.
  talent.deflection:
    name: Deflection
    tooltip:
    - Increases your Parry chance by 1%.
    - Increases your Parry chance by 2%.
    - Increases your Parry chance by 3%.
    - Increases your Parry chance by 4%.
    - Increases your Parry chance by 5%.
  talent.improved_rend:
    name: Improved Rend
    tooltip:
    - Increases the bleed damage done by your Rend ability by 25%.
    - Increases the bleed damage done by your Rend ability by 50%.
    - Increases the bleed damage done by your Rend ability by 75%.
  talent.improved_charge:
    name: Improved Charge
    tooltip:
    - Increases the amount of rage generated by your Charge ability by 3.
    - Increases the amount of rage generated by your Charge ability by 6.
  talent.iron_will:
    name: Iron Will
    tooltip:
    - Increases your chance to resist Stun and Charm effects by an additional 3%.
    - Increases your chance to resist Stun and Charm effects by an additional 6%.
    - Increases your chance to resist Stun and Charm effects by an additional 9%.
    - Increases your chance to resist Stun and Charm effects by an additional 12%.
    - Increases your chance to resist Stun and Charm effects by an additional 15%.
  talent.improved_thunder_clap:
    name: Improved Thunder Clap
    tooltip:
    - Reduces the cost of your Thunder Clap ability by 1 rage point and increases
      the damage by 40% and the slowing effect by an additional 4%.
    - Reduces the cost of your Thunder Clap ability by 2 rage points and increases
      the damage by 70% and the slowing effect by an additional 7%.
    - Reduces the cost of your Thunder Clap ability by 4 rage points and increases
      the damage by 100% and the slowing effect by an additional 10%.
  talent.improved_overpower:
    name: Improved Overpower
    tooltip:
    - Increases the critical strike chance of your Overpower ability by 25%.
    - Increases the critical strike chance of your Overpower ability by 50%.
  talent.anger_management:
    name: Anger Management
    tooltip:
    - Generates 1 rage per 3 seconds while in combat.
  talent.deep_wounds:
    name: Deep Wounds
    tooltip:
    - Your critical strikes cause the opponent to bleed, dealing 20% of your melee
      weapon's average damage over 12 sec.
    - Your critical strikes cause the opponent to bleed, dealing 40% of your melee
      weapon's average damage over 12 sec.
    - Your critical strikes cause the opponent to bleed, dealing 60% of your melee
      weapon's average damage over 12 sec.
  talent.two_handed_weapon_specialization:
    name: Two-Handed Weapon Specialization
    tooltip:
    - Increases the damage you deal with two-handed melee weapons by 1%.
    - Increases the damage you deal with two-handed melee weapons by 2%.
    - Increases the damage you deal with two-handed melee weapons by 3%.
    - Increases the damage you deal with two-handed melee weapons by 4%.
    - Increases the damage you deal with two-handed melee weapons by 5%.
  talent.impale:
    name: Impale
    tooltip:
    - Increases the critical strike damage bonus of your abilities in Battle, Defensive,
      and Berserker stance by 10%.
    - Increases the critical strike damage bonus of your abilities in Battle, Defensive,
      and Berserker stance by 20%.
  talent.poleaxe_specialization:
    name: Poleaxe Specialization
    tooltip:
    - Increases your chance to get a critical strike with Axes and Polearms by 1%.
    - Increases your chance to get a critical strike with Axes and Polearms by 2%.
    - Increases your chance to get a critical strike with Axes and Polearms by 3%.
    - Increases your chance to get a critical strike with Axes and Polearms by 4%.
    - Increases your chance to get a critical strike with Axes and Polearms by 5%.
  talent.death_wish:
    name: Death Wish
    tooltip:
    - When activated, increases your physical damage by 20% and makes you immune to
      Fear effects, but increases all damage taken by 5%. Lasts 30 sec.
  talent.mace_specialization:
    name: Mace Specialization
    tooltip:
    - Gives your melee attacks a chance to stun your target for 3 sec and generate
      7 rage when using a Mace.
    - Gives your melee attacks a chance to stun your target for 3 sec and generate
      7 rage when using a Mace. More effective than Mace Specialization (Rank 1).
    - Gives your melee attacks a chance to stun your target for 3 sec and generate
      7 rage when using a Mace. More effective than Mace Specialization (Rank 2).
    - Gives your melee attacks a chance to stun your target for 3 sec and generate
      7 rage when using a Mace. More effective than Mace Specialization (Rank 3).
    - Gives your melee attacks a chance to stun your target for 3 sec and generate
      7 rage when using a Mace. More effective than Mace Specialization (Rank 4).
  talent.sword_specialization:
    name: Sword Specialization
    tooltip:
    - Gives you a 1% chance to get an extra attack on the same target after hitting
      your target with your Sword.
    - Gives you a 2% chance to get an extra attack on the same target after hitting
      your target with your Sword.
    - Gives you a 3% chance to get an extra attack on the same target after hitting
      your target with your Sword.
    - Gives you a 4% chance to get an extra attack on the same target after hitting
      your target with your Sword.
    - Gives you a 5% chance to get an extra attack on the same target after hitting
      your target with your Sword.
  talent.improved_intercept:
    name: Improved Intercept
    tooltip:
    - Reduces the cooldown of your Intercept ability by 5 sec.
    - Reduces the cooldown of your Intercept ability by 10 sec.
  talent.improved_hamstring:
    name: Improved Hamstring
    tooltip:
    - Gives your Hamstring ability a 5% chance to immobilize the target for 5 sec.
    - Gives your Hamstring ability a 10% chance to immobilize the target for 5 sec.
    - Gives your Hamstring ability a 15% chance to immobilize the target for 5 sec.
  talent.improved_disciplines:
    name: Improved Disciplines
    tooltip:
    - Reduces the cooldown of your Retaliation, Recklessness and Shield Wall abilities
      by 4 min and increases their duration by 2 sec.
    - Reduces the cooldown of your Retaliation, Recklessness and Shield Wall abilities
      by 7 min and increases their duration by 4 sec.
    - Reduces the cooldown of your Retaliation, Recklessness and Shield Wall abilities
      by 10 min and increases their duration by 6 sec.
  talent.blood_frenzy:
    name: Blood Frenzy
    tooltip:
    - Your Rend and Deep Wounds abilities also increase all physical damage caused
      to that target by 2%.
    - Your Rend and Deep Wounds abilities also increase all physical damage caused
      to that target by 4%.
  talent.mortal_strike:
    name: Mortal Strike
    tooltip:
    - A vicious strike that deals weapon damage plus 85 and wounds the target, reducing
      the effectiveness of any healing by 50% for 10 sec.
  talent.second_wind:
    name: Second Wind
    tooltip:
    - Whenever you are struck by a Stun or Immobilize effect you will generate 10
      rage and 5% of your total health over 10 sec.
    - Whenever you are struck by a Stun or Immobilize effect you will generate 20
      rage and 10% of your total health over 10 sec.
  talent.improved_mortal_strike:
    name: Improved Mortal Strike
    tooltip:
    - Reduces the cooldown of your Mortal Strike ability by 0.2 sec and increases
      the damage it causes by 1%.
    - Reduces the cooldown of your Mortal Strike ability by 0.4 sec and increases
      the damage it causes by 2%.
    - Reduces the cooldown of your Mortal Strike ability by 0.6 sec and increases
      the damage it causes by 3%.
    - Reduces the cooldown of your Mortal Strike ability by 0.8 sec and increases
      the damage it causes by 4%.
    - Reduces the cooldown of your Mortal Strike ability by 1 sec and increases the
      damage it causes by 5%.
  talent.endless_rage:
    name: Endless Rage
    tooltip:
    - You generate 25% more rage from damage dealt.
  tree.2:
    name: Fury
  talent.booming_voice:
    name: Booming Voice
    tooltip:
    - Increases the area of effect and duration of your Battle Shout, Demoralizing
      Shout and Commanding Shout by 10%.
    - Increases the area of effect and duration of your Battle Shout, Demoralizing
      Shout and Commanding Shout by 20%.
    - Increases the area of effect and duration of your Battle Shout, Demoralizing
      Shout and Commanding Shout by 30%.
    - Increases the area of effect and duration of your Battle Shout, Demoralizing
      Shout and Commanding Shout by 40%.
    - Increases the area of effect and duration of your Battle Shout, Demoralizing
      Shout and Commanding Shout by 50%.
  talent.cruelty:
    name: Cruelty
    tooltip:
    - Increases your chance to get a critical strike with melee weapons by 1%.
    - Increases your chance to get a critical strike with melee weapons by 2%.
    - Increases your chance to get a critical strike with melee weapons by 3%.
    - Increases your chance to get a critical strike with melee weapons by 4%.
    - Increases your chance to get a critical strike with melee weapons by 5%.
  talent.improved_demoralizing_shout:
    name: Improved Demoralizing Shout
    tooltip:
    - Increases the melee attack power reduction of your Demoralizing Shout by 8%.
    - Increases the melee attack power reduction of your Demoralizing Shout by 16%.
    - Increases the melee attack power reduction of your Demoralizing Shout by 24%.
    - Increases the melee attack power reduction of your Demoralizing Shout by 32%.
    - Increases the melee attack power reduction of your Demoralizing Shout by 40%.
  talent.unbridled_wrath:
    name: Unbridled Wrath
    tooltip:
    - Gives you a chance to generate an additional rage point when you deal melee
      damage with a weapon.
    - Gives you a chance to generate an additional rage point when you deal melee
      damage with a weapon. Effect occurs more often than Unbridled Wrath (Rank 1).
    - Gives you a chance to generate an additional rage point when you deal melee
      damage with a weapon. Effect occurs more often than Unbridled Wrath (Rank 2).
    - Gives you a chance to generate an additional rage point when you deal melee
      damage with a weapon. Effect occurs more often than Unbridled Wrath (Rank 3).
    - Gives you a chance to generate an additional rage point when you deal melee
      damage with a weapon. Effect occurs more often than Unbridled Wrath (Rank 4).
  talent.improved_cleave:
    name: Improved Cleave
    tooltip:
    - Increases the bonus damage done by your Cleave ability by 40%.
    - Increases the bonus damage done by your Cleave ability by 80%.
    - Increases the bonus damage done by your Cleave ability by 120%.
  talent.piercing_howl:
    name: Piercing Howl
    tooltip:
    - Causes all enemies within 10 yards to be Dazed, reducing movement speed by 50%
