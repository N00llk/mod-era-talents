  talent.improved_whirlwind:
    name: Improved Whirlwind
    tooltip:
    - Reduces the cooldown of your Whirlwind ability by 1 sec.
    - Reduces the cooldown of your Whirlwind ability by 2 sec.
  talent.improved_berserker_stance:
    name: Improved Berserker Stance
    tooltip:
    - Increases attack power by 2% and reduces threat caused by 2% while in Berserker
      Stance.
    - Increases attack power by 4% and reduces threat caused by 4% while in Berserker
      Stance.
    - Increases attack power by 6% and reduces threat caused by 6% while in Berserker
      Stance.
    - Increases attack power by 8% and reduces threat caused by 8% while in Berserker
      Stance.
    - Increases attack power by 10% and reduces threat caused by 10% while in Berserker
      Stance.
  talent.rampage:
    name: Rampage
    tooltip:
    - Warrior goes on a rampage, increasing attack power by 30 and causing most successful
      melee attacks to increase attack power by an additional 30. This effect will
      stack up to 5 times. Lasts 30 sec. This ability can only be used after scoring
      a critical hit.
  tree.3:
    name: Protection
  talent.improved_bloodrage:
    name: Improved Bloodrage
    tooltip:
    - Increases the instant rage generated by your Bloodrage ability by 3.
    - Increases the instant rage generated by your Bloodrage ability by 6.
  talent.tactical_mastery:
    name: Tactical Mastery
    tooltip:
    - You retain up to an additional 5 of your rage points when you change stances.
      Also greatly increases the threat generated by your Bloodthirst and Mortal Strike
      abilities when you are in Defensive Stance.
    - You retain up to an additional 10 of your rage points when you change stances.
      Also greatly increases the threat generated by your Bloodthirst and Mortal Strike
      abilities when you are in Defensive Stance (More effective than Rank 1).
    - You retain up to an additional 15 of your rage points when you change stances.
      Also greatly increases the threat generated by your Bloodthirst and Mortal Strike
      abilities when you are in Defensive Stance (More effective than Rank 2).
