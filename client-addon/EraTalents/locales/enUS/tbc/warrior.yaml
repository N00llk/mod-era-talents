  talent.blood_craze:
    name: Blood Craze
    tooltip:
    - Regenerates 1% of your total Health over 6 sec after being the victim of a critical
      strike.
    - Regenerates 2% of your total Health over 6 sec after being the victim of a critical
      strike.
    - Regenerates 3% of your total Health over 6 sec after being the victim of a critical
      strike.
  talent.commanding_presence:
    name: Commanding Presence
    tooltip:
    - Increases the melee attack power bonus of your Battle Shout and the health bonus
      of your Commanding Shout by 5%.
    - Increases the melee attack power bonus of your Battle Shout and the health bonus
      of your Commanding Shout by 10%.
    - Increases the melee attack power bonus of your Battle Shout and the health bonus
      of your Commanding Shout by 15%.
    - Increases the melee attack power bonus of your Battle Shout and the health bonus
      of your Commanding Shout by 20%.
    - Increases the melee attack power bonus of your Battle Shout and the health bonus
      of your Commanding Shout by 25%.
  talent.dual_wield_specialization:
    name: Dual Wield Specialization
    tooltip:
    - Increases the damage done by your offhand weapon by 5%.
    - Increases the damage done by your offhand weapon by 10%.
    - Increases the damage done by your offhand weapon by 15%.
    - Increases the damage done by your offhand weapon by 20%.
    - Increases the damage done by your offhand weapon by 25%.
  talent.improved_execute:
    name: Improved Execute
    tooltip:
    - Reduces the rage cost of your Execute ability by 2.
    - Reduces the rage cost of your Execute ability by 5.
  talent.enrage:
    name: Enrage
    tooltip:
    - Gives you a 5% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 10% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 15% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 20% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 25% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
  talent.improved_slam:
    name: Improved Slam
    tooltip:
    - Decreases the casting time of your Slam ability by 0.5 sec.
    - Decreases the casting time of your Slam ability by 1 sec.
  talent.sweeping_strikes:
    name: Sweeping Strikes
    tooltip:
    - Your next 10 melee attacks strike an additional nearby opponent.
  talent.weapon_mastery:
    name: Weapon Mastery
    tooltip:
    - Reduces the chance for your attacks to be dodged by 1% and reduces the duration
      of all Disarm effects used against you by 25%. This does not stack with other
      Disarm duration reducing effects.
    - Reduces the chance for your attacks to be dodged by 2% and reduces the duration
      of all Disarm effects used against you by 50%. This does not stack with other
      Disarm duration reducing effects.
  talent.improved_berserker_rage:
    name: Improved Berserker Rage
    tooltip:
    - The Berserker Rage ability will generate 5 rage when used.
    - The Berserker Rage ability will generate 10 rage when used.
  talent.flurry:
    name: Flurry
    tooltip:
    - Increases your attack speed by 5% for your next 3 swings after dealing a melee
      critical strike.
    - Increases your attack speed by 10% for your next 3 swings after dealing a melee
      critical strike.
    - Increases your attack speed by 15% for your next 3 swings after dealing a melee
      critical strike.
    - Increases your attack speed by 20% for your next 3 swings after dealing a melee
      critical strike.
    - Increases your attack speed by 25% for your next 3 swings after dealing a melee
      critical strike.
  talent.precision:
    name: Precision
    tooltip:
    - Increases your chance to hit with melee weapons by 1%.
    - Increases your chance to hit with melee weapons by 2%.
    - Increases your chance to hit with melee weapons by 3%.
  talent.bloodthirst:
    name: Bloodthirst
    tooltip:
