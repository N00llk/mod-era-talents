schemaVersion: 1
locale: enUS
era: vanilla
class: warlock
texts:
  tree.1:
    name: Affliction
  talent.suppression:
    name: Suppression
    tooltip:
    - Reduces the chance for enemies to resist your Affliction spells by 2%.
    - Reduces the chance for enemies to resist your Affliction spells by 4%.
    - Reduces the chance for enemies to resist your Affliction spells by 6%.
    - Reduces the chance for enemies to resist your Affliction spells by 8%.
    - Reduces the chance for enemies to resist your Affliction spells by 10%.
  talent.improved_corruption:
    name: Improved Corruption
    tooltip:
    - Reduces the casting time of your Corruption spell by 0.4 sec.
    - Reduces the casting time of your Corruption spell by 0.8 sec.
    - Reduces the casting time of your Corruption spell by 1.2 sec.
    - Reduces the casting time of your Corruption spell by 1.6 sec.
    - Reduces the casting time of your Corruption spell by 2 sec.
  talent.improved_curse_of_weakness:
    name: Improved Curse of Weakness
    tooltip:
    - Increases the effect of your Curse of Weakness by 6%.
    - Increases the effect of your Curse of Weakness by 13%.
    - Increases the effect of your Curse of Weakness by 20%.
  talent.improved_drain_soul:
    name: Improved Drain Soul
    tooltip:
    - Gives you a 50% chance to get a 100% increase to your Mana regeneration for
      10 sec if the target dies while you drain its soul. In addition your Mana may
      continue to regenerate while casting at 50% of normal.
    - Gives you a 100% chance to get a 100% increase to your Mana regeneration for
      10 sec if the target dies while you drain its soul. In addition your Mana may
      continue to regenerate while casting at 50% of normal.
  talent.improved_life_tap:
    name: Improved Life Tap
    tooltip:
    - Increases the amount of Mana awarded by your Life Tap spell by 10%.
    - Increases the amount of Mana awarded by your Life Tap spell by 20%.
  talent.improved_life_drain:
    name: Improved Drain Life
    tooltip:
    - Increases the Health drained by your Drain Life spell by 2%.
    - Increases the Health drained by your Drain Life spell by 4%.
    - Increases the Health drained by your Drain Life spell by 6%.
    - Increases the Health drained by your Drain Life spell by 8%.
    - Increases the Health drained by your Drain Life spell by 10%.
  talent.improved_curse_of_agony:
    name: Improved Curse of Agony
    tooltip:
    - Increases the damage done by your Curse of Agony by 2%.
    - Increases the damage done by your Curse of Agony by 4%.
    - Increases the damage done by your Curse of Agony by 6%.
  talent.fel_concentration:
    name: Fel Concentration
    tooltip:
    - Gives you a 14% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 28% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 42% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 56% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
    - Gives you a 70% chance to avoid interruption caused by damage while channeling
      the Drain Life, Drain Mana, or Drain Soul spell.
  talent.amplify_curse:
    name: Amplify Curse
    tooltip:
    - Increases the effect of your next Curse of Weakness or Curse of Agony by 50%,
      or your next Curse of Exhaustion by 20%.
  talent.grim_reach:
    name: Grim Reach
    tooltip:
    - Increases the range of your Affliction spells by 10%.
    - Increases the range of your Affliction spells by 20%.
  talent.nightfall:
    name: Nightfall
    tooltip:
    - Gives your Corruption and Drain Life spells a 2% chance to cause you to enter
      a Shadow Trance state after damaging the opponent. The Shadow Trance state reduces
      the casting time of your next Shadow Bolt spell by 100%.
    - Gives your Corruption and Drain Life spells a 4% chance to cause you to enter
      a Shadow Trance state after damaging the opponent. The Shadow Trance state reduces
      the casting time of your next Shadow Bolt spell by 100%.
  talent.improved_drain_mana:
    name: Improved Drain Mana
    tooltip:
    - Causes 15% of the Mana drained by your Drain Mana spell to damage the opponent.
    - Causes 30% of the Mana drained by your Drain Mana spell to damage the opponent.
  talent.siphon_life:
    name: Siphon Life
    tooltip:
    - Transfers 15 health from the target to the caster every 3 sec. Lasts 30 sec.
  talent.curse_of_exhaustion:
    name: Curse of Exhaustion
    tooltip:
    - Reduces the target's speed to 70% of normal for 12 sec. Only one Curse per Warlock
      can be active on any one target.
  talent.improved_curse_of_exhaustion:
    name: Improved Curse of Exhaustion
    tooltip:
    - Increases the speed reduction of your Curse of Exhaustion by 5%.
    - Increases the speed reduction of your Curse of Exhaustion by 10%.
    - Increases the speed reduction of your Curse of Exhaustion by 15%.
    - Increases the speed reduction of your Curse of Exhaustion by 20%.
  talent.shadow_mastery:
    name: Shadow Mastery
    tooltip:
    - Increases the damage dealt or life drained by your Shadow spells by 2%.
    - Increases the damage dealt or life drained by your Shadow spells by 4%.
    - Increases the damage dealt or life drained by your Shadow spells by 6%.
    - Increases the damage dealt or life drained by your Shadow spells by 8%.
    - Increases the damage dealt or life drained by your Shadow spells by 10%.
  talent.dark_pact:
    name: Dark Pact
    tooltip:
    - Drains 150 of your pet's Mana, returning 100% to you.
  tree.2:
    name: Demonology
  talent.improved_healthstone:
    name: Improved Healthstone
    tooltip:
    - Increases the amount of Health restored by your Healthstone by 10%.
    - Increases the amount of Health restored by your Healthstone by 20%.
  talent.improved_imp:
    name: Improved Imp
    tooltip:
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 10%.
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 20%.
    - Increases the effect of your Imp's Firebolt, Fire Shield, and Blood Pact spells
      by 30%.
  talent.demonic_embrace:
    name: Demonic Embrace
    tooltip:
    - Increases your total Stamina by 3% but reduces your total Spirit by 1%.
    - Increases your total Stamina by 6% but reduces your total Spirit by 2%.
    - Increases your total Stamina by 9% but reduces your total Spirit by 3%.
    - Increases your total Stamina by 12% but reduces your total Spirit by 4%.
    - Increases your total Stamina by 15% but reduces your total Spirit by 5%.
  talent.improved_health_funnel:
    name: Improved Health Funnel
    tooltip:
    - Increases the amount of Health transfered by your Health Funnel spell by 10%.
    - Increases the amount of Health transfered by your Health Funnel spell by 20%.
  talent.improved_voidwalker:
    name: Improved Voidwalker
    tooltip:
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 10%.
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 20%.
    - Increases the effectiveness of your Voidwalker's Torment, Consume Shadows, Sacrifice
      and Suffering spells by 30%.
  talent.fel_intellect:
    name: Fel Intellect
    tooltip:
    - Increases the maximum Mana of your Imp, Voidwalker, Succubus, and Felhunter
      by 3%.
    - Increases the maximum Mana of your Imp, Voidwalker, Succubus, and Felhunter
      by 6%.
    - Increases the maximum Mana of your Imp, Voidwalker, Succubus, and Felhunter
      by 9%.
    - Increases the maximum Mana of your Imp, Voidwalker, Succubus, and Felhunter
      by 12%.
    - Increases the maximum Mana of your Imp, Voidwalker, Succubus, and Felhunter
      by 15%.
  talent.improved_succubus:
    name: Improved Succubus
    tooltip:
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 10%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 10%.
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 20%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 20%.
    - Increases the effect of your Succubus' Lash of Pain and Soothing Kiss spells
      by 30%, and increases the duration of your Succubus' Seduction and Lesser Invisibility
      spells by 30%.
  talent.fel_domination:
    name: Fel Domination
    tooltip:
    - Your next Imp, Voidwalker, Succubus, or Felhunter Summon spell has its casting
      time reduced by 5 sec and its Mana cost reduced by 50%.
  talent.fel_stamina:
    name: Fel Stamina
    tooltip:
    - Increases the maximum Health of your Imp, Voidwalker, Succubus, and Felhunter
      by 3%.
    - Increases the maximum Health of your Imp, Voidwalker, Succubus, and Felhunter
      by 6%.
    - Increases the maximum Health of your Imp, Voidwalker, Succubus, and Felhunter
      by 9%.
    - Increases the maximum Health of your Imp, Voidwalker, Succubus, and Felhunter
      by 12%.
    - Increases the maximum Health of your Imp, Voidwalker, Succubus, and Felhunter
      by 15%.
  talent.master_summoner:
    name: Master Summoner
    tooltip:
    - Reduces the casting time of your Imp, Voidwalker, Succubus, and Felhunter Summoning
      spells by 2 sec and the Mana cost by 20%.
    - Reduces the casting time of your Imp, Voidwalker, Succubus, and Felhunter Summoning
      spells by 4 sec and the Mana cost by 40%.
  talent.unholy_power:
    name: Unholy Power
    tooltip:
    - Increases the damage done by your Voidwalker, Succubus, and Felhunter's melee
      attacks by 4%.
    - Increases the damage done by your Voidwalker, Succubus, and Felhunter's melee
      attacks by 8%.
    - Increases the damage done by your Voidwalker, Succubus, and Felhunter's melee
      attacks by 12%.
    - Increases the damage done by your Voidwalker, Succubus, and Felhunter's melee
      attacks by 16%.
    - Increases the damage done by your Voidwalker, Succubus, and Felhunter's melee
      attacks by 20%.
  talent.improved_enslave_demon:
    name: Improved Enslave Demon
    tooltip:
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 2% and reduces the resist chance by 2%.
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 4% and reduces the resist chance by 4%.
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 6% and reduces the resist chance by 6%.
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 8% and reduces the resist chance by 8%.
    - Reduces the Attack Speed and Casting Speed penalty of your Enslave Demon spell
      by 10% and reduces the resist chance by 10%.
  talent.demonic_sacrifice:
    name: Demonic Sacrifice
    tooltip:
    - 'Instant. Sacrifices your summoned demon to grant you an effect that lasts 30
      min, canceled if you resummon a demon. Imp: Increases your Fire damage by 15%.
      Voidwalker: Restores 3% of total Health every 4 sec. Succubus: Increases your
      Shadow damage by 15%. Felhunter: Restores 2% of total Mana every 4 sec.'
  talent.improved_firestone:
    name: Improved Firestone
    tooltip:
    - Increases the bonus Fire damage from Firestones and the Firestone effect by
      15%.
    - Increases the bonus Fire damage from Firestones and the Firestone effect by
      30%.
  talent.master_demonologist:
    name: Master Demonologist
    tooltip:
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 4%. Voidwalker - Reduces physical
      damage taken by 2%. Succubus - Increases all damage caused by 2%. Felhunter
      - Increases all resistances by .2 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 8%. Voidwalker - Reduces physical
      damage taken by 4%. Succubus - Increases all damage caused by 4%. Felhunter
      - Increases all resistances by .4 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 12%. Voidwalker - Reduces physical
      damage taken by 6%. Succubus - Increases all damage caused by 6%. Felhunter
      - Increases all resistances by .6 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 16%. Voidwalker - Reduces physical
      damage taken by 8%. Succubus - Increases all damage caused by 8%. Felhunter
      - Increases all resistances by .8 per level.
    - Grants both the Warlock and the summoned demon an effect as long as that demon
      is active. Imp - Reduces threat caused by 20%. Voidwalker - Reduces physical
      damage taken by 10%. Succubus - Increases all damage caused by 10%. Felhunter
      - Increases all resistances by 1 per level.
  talent.soul_link:
    name: Soul Link
    tooltip:
    - Instant. 270 Mana. While active and your demon is alive, 30% of all damage taken
      by you is taken by your demon instead. Lasts as long as the demon is active.
  talent.improved_spellstone:
    name: Improved Spellstone
    tooltip:
    - Increases the amount of damage absorbed by your Spellstone by 15%.
    - Increases the amount of damage absorbed by your Spellstone by 30%.
  tree.3:
    name: Destruction
  talent.improved_shadow_bolt:
    name: Improved Shadow Bolt
    tooltip:
    - Your Shadow Bolt critical strikes increase the next 4 sources of Shadow damage
      dealt to the target by 4%. Effect lasts a maximum of 12 sec.
    - Your Shadow Bolt critical strikes increase the next 4 sources of Shadow damage
      dealt to the target by 8%. Effect lasts a maximum of 12 sec.
    - Your Shadow Bolt critical strikes increase the next 4 sources of Shadow damage
      dealt to the target by 12%. Effect lasts a maximum of 12 sec.
    - Your Shadow Bolt critical strikes increase the next 4 sources of Shadow damage
      dealt to the target by 16%. Effect lasts a maximum of 12 sec.
    - Your Shadow Bolt critical strikes increase the next 4 sources of Shadow damage
      dealt to the target by 20%. Effect lasts a maximum of 12 sec.
  talent.cataclysm:
    name: Cataclysm
    tooltip:
    - Reduces the Mana cost of your Destruction spells by 1%.
    - Reduces the Mana cost of your Destruction spells by 2%.
    - Reduces the Mana cost of your Destruction spells by 3%.
    - Reduces the Mana cost of your Destruction spells by 4%.
    - Reduces the Mana cost of your Destruction spells by 5%.
  talent.bane:
    name: Bane
    tooltip:
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.1 sec
      and your Soul Fire spell by 0.4 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.2 sec
      and your Soul Fire spell by 0.8 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.3 sec
      and your Soul Fire spell by 1.2 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.4 sec
      and your Soul Fire spell by 1.6 sec.
    - Reduces the casting time of your Shadow Bolt and Immolate spells by 0.5 sec
      and your Soul Fire spell by 2 sec.
  talent.aftermath:
    name: Aftermath
    tooltip:
    - Gives your Destruction spells a 2% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 4% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 6% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 8% chance to daze the target for 5 sec.
    - Gives your Destruction spells a 10% chance to daze the target for 5 sec.
  talent.improved_firebolt:
    name: Improved Firebolt
    tooltip:
    - Reduces the casting time of your Imp's Firebolt spell by 0.5 sec.
    - Reduces the casting time of your Imp's Firebolt spell by 1 sec.
  talent.improved_lash_of_pain:
    name: Improved Lash of Pain
    tooltip:
    - Reduces the cooldown of your Succubus' Lash of Pain spell by 3 sec.
    - Reduces the cooldown of your Succubus' Lash of Pain spell by 6 sec.
  talent.devastation:
    name: Devastation
    tooltip:
    - Increases the critical strike chance of your Destruction spells by 1%.
    - Increases the critical strike chance of your Destruction spells by 2%.
    - Increases the critical strike chance of your Destruction spells by 3%.
    - Increases the critical strike chance of your Destruction spells by 4%.
    - Increases the critical strike chance of your Destruction spells by 5%.
  talent.shadowburn:
    name: Shadowburn
    tooltip:
    - '105 Mana 20 yd range Instant cast 15 sec cooldown Reagents: Soul Shard Instantly
      blasts the target for 91 to 104 Shadow damage. If the target dies from Shadowburn,
      and yields experience or honor, the caster gains a Soul Shard.'
  talent.intensity:
    name: Intensity
    tooltip:
    - Gives you a 35% chance to resist interruption caused by damage while channeling
      the Rain of Fire or Hellfire spell.
    - Gives you a 70% chance to resist interruption caused by damage while channeling
      the Rain of Fire or Hellfire spell.
  talent.destructive_reach:
    name: Destructive Reach
    tooltip:
    - Increases the range of your Destruction spells by 10% and reduces their threat
      by 10%.
    - Increases the range of your Destruction spells by 20% and reduces their threat
      by 20%.
  talent.improved_searing_pain:
    name: Improved Searing Pain
    tooltip:
    - Increases the critical strike chance of your Searing Pain spell by 2%.
    - Increases the critical strike chance of your Searing Pain spell by 4%.
    - Increases the critical strike chance of your Searing Pain spell by 6%.
    - Increases the critical strike chance of your Searing Pain spell by 8%.
    - Increases the critical strike chance of your Searing Pain spell by 10%.
  talent.pyroclasm:
    name: Pyroclasm
    tooltip:
    - Gives your Rain of Fire and Hellfire spells a 13% chance to stun the target
      for 3 sec.
    - Gives your Rain of Fire and Hellfire spells a 26% chance to stun the target
      for 3 sec.
  talent.improved_immolate:
    name: Improved Immolate
    tooltip:
    - Increases the initial damage of your Immolate spell by 5%.
    - Increases the initial damage of your Immolate spell by 10%.
    - Increases the initial damage of your Immolate spell by 15%.
    - Increases the initial damage of your Immolate spell by 20%.
    - Increases the initial damage of your Immolate spell by 25%.
  talent.ruin:
    name: Ruin
    tooltip:
    - Increases the critical strike damage bonus of your Destruction spells by 100%.
  talent.emberstorm:
    name: Emberstorm
    tooltip:
    - Increases the damage done by your Fire spells by 2%.
    - Increases the damage done by your Fire spells by 4%.
    - Increases the damage done by your Fire spells by 6%.
    - Increases the damage done by your Fire spells by 8%.
    - Increases the damage done by your Fire spells by 10%.
  talent.conflagrate:
    name: Conflagrate
    tooltip:
    - Ignites a target that is already afflicted by Immolate, dealing 240 to 307 Fire
      damage and consuming the Immolate spell.
  spell.Conflagrate:
    name: Conflagrate
  spell.Corruption:
    name: Corruption
