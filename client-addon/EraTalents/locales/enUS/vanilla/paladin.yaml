schemaVersion: 1
locale: enUS
era: vanilla
class: paladin
texts:
  tree.1:
    name: Holy
  talent.divine_strength:
    name: Divine Strength
    tooltip:
    - Increases your Strength by 2%
    - Increases your Strength by 4%
    - Increases your Strength by 6%
    - Increases your Strength by 8%
    - Increases your Strength by 10%
  talent.divine_intellect:
    name: Divine Intellect
    tooltip:
    - Increases your total Intellect by 2%.
    - Increases your total Intellect by 4%.
    - Increases your total Intellect by 6%.
    - Increases your total Intellect by 8%.
    - Increases your total Intellect by 10%.
  talent.spiritual_focus:
    name: Spiritual Focus
    tooltip:
    - Gives your Flash of Light and Holy Light spells a 14% chance to not lose casting
      time when you take damage.
    - Gives your Flash of Light and Holy Light spells a 28% chance to not lose casting
      time when you take damage.
    - Gives your Flash of Light and Holy Light spells a 42% chance to not lose casting
      time when you take damage.
    - Gives your Flash of Light and Holy Light spells a 56% chance to not lose casting
      time when you take damage.
    - Gives your Flash of Light and Holy Light spells a 70% chance to not lose casting
      time when you take damage.
  talent.improved_seal_of_righteousness:
    name: Improved Seal of Righteousness
    tooltip:
    - Increases the damage done by your Seal of Righteousness by 3%.
    - Increases the damage done by your Seal of Righteousness by 6%.
    - Increases the damage done by your Seal of Righteousness by 9%.
    - Increases the damage done by your Seal of Righteousness by 12%.
    - Increases the damage done by your Seal of Righteousness by 15%.
  talent.healing_light:
    name: Healing Light
    tooltip:
    - Increases the amount healed by your Holy Light and Flash of Light spells by
      4%.
    - Increases the amount healed by your Holy Light and Flash of Light spells by
      8%.
    - Increases the amount healed by your Holy Light and Flash of Light spells by
      12%.
  talent.consecration:
    name: Consecration
    tooltip:
    - Consecrates the land beneath the Paladin, doing 64 Holy damage over 8 sec to
      enemies who enter the area.
  talent.improved_lay_on_hands:
    name: Improved Lay on Hands
    tooltip:
    - Gives the target of your Lay on Hands spell a 15% bonus to their armor value
      from items for 2 min. In addition, the cooldown for your Lay on Hands spell
      is reduced by 10 min.
    - Gives the target of your Lay on Hands spell a 30% bonus to their armor value
      from items for 2 min. In addition, the cooldown for your Lay on Hands spell
      is reduced by 20 min.
  talent.unyielding_faith:
    name: Unyielding Faith
    tooltip:
    - Increases your chance to resist Fear and Disorient effects by an additional
      5%.
    - Increases your chance to resist Fear and Disorient effects by an additional
      10%.
  talent.illumination:
    name: Illumination
    tooltip:
    - After getting a critical effect from your Flash of Light, Holy Light or Holy
      Shock heal spell, gives you a 20% chance to gain Mana equal to the base cost
      of the spell.
    - After getting a critical effect from your Flash of Light, Holy Light or Holy
      Shock heal spell, gives you a 40% chance to gain Mana equal to the base cost
      of the spell.
    - After getting a critical effect from your Flash of Light, Holy Light or Holy
      Shock heal spell, gives you a 60% chance to gain Mana equal to the base cost
      of the spell.
    - After getting a critical effect from your Flash of Light, Holy Light or Holy
      Shock heal spell, gives you a 80% chance to gain Mana equal to the base cost
      of the spell.
    - After getting a critical effect from your Flash of Light, Holy Light or Holy
      Shock heal spell, gives you a 100% chance to gain Mana equal to the base cost
      of the spell.
  talent.improved_blessing_of_wisdom:
    name: Improved Blessing of Wisdom
    tooltip:
    - Increases the effect of your Blessing of Wisdom spell by 10%.
    - Increases the effect of your Blessing of Wisdom spell by 20%.
  talent.divine_favor:
    name: Divine Favor
    tooltip:
    - When activated, gives your next Flash of Light or Holy Light spell a 100% critical
      effect chance.
  talent.lasting_judgement:
    name: Lasting Judgement
    tooltip:
    - Increases the duration of your Judgement of Light and Judgement of Wisdom by
      10 sec.
    - Increases the duration of your Judgement of Light and Judgement of Wisdom by
      20 sec.
    - Increases the duration of your Judgement of Light and Judgement of Wisdom by
      30 sec.
  talent.holy_power:
    name: Holy Power
    tooltip:
    - Increases the critical effect chance of your Holy spells by 1%.
    - Increases the critical effect chance of your Holy spells by 2%.
    - Increases the critical effect chance of your Holy spells by 3%.
    - Increases the critical effect chance of your Holy spells by 4%.
    - Increases the critical effect chance of your Holy spells by 5%.
  talent.holy_shock:
    name: Holy Shock
    tooltip:
    - Blasts the target with Holy energy, causing 204 to 220 Holy damage to an enemy,
      or 204 to 220 healing to an ally.
  tree.2:
    name: Protection
  talent.improved_devotion_aura:
    name: Improved Devotion Aura
    tooltip:
    - Increases the armor bonus of your Devotion Aura by 5%.
    - Increases the armor bonus of your Devotion Aura by 10%.
    - Increases the armor bonus of your Devotion Aura by 15%.
    - Increases the armor bonus of your Devotion Aura by 20%.
    - Increases the armor bonus of your Devotion Aura by 25%.
  talent.redoubt:
    name: Redoubt
    tooltip:
    - Increases your chance to block attacks with your shield by 6% after being the
      victim of a critical strike. Lasts 10 sec or 5 blocks.
    - Increases your chance to block attacks with your shield by 12% after being the
      victim of a critical strike. Lasts 10 sec or 5 blocks.
    - Increases your chance to block attacks with your shield by 18% after being the
      victim of a critical strike. Lasts 10 sec or 5 blocks.
    - Increases your chance to block attacks with your shield by 24% after being the
      victim of a critical strike. Lasts 10 sec or 5 blocks.
    - Increases your chance to block attacks with your shield by 30% after being the
      victim of a critical strike. Lasts 10 sec or 5 blocks.
  talent.precision:
    name: Precision
    tooltip:
    - Increases your chance to hit with melee weapons by 1%.
    - Increases your chance to hit with melee weapons by 2%.
    - Increases your chance to hit with melee weapons by 3%.
  talent.guardian_s_favor:
    name: Guardian's Favor
    tooltip:
    - Reduces the cooldown of your Blessing of Protection by 60 sec and increases
      the duration of your Blessing of Freedom 3 sec.
    - Reduces the cooldown of your Blessing of Protection by 120 sec and increases
      the duration of your Blessing of Freedom 6 sec.
  talent.toughness:
    name: Toughness
    tooltip:
    - Increases your armor value from items by 2%.
    - Increases your armor value from items by 4%.
    - Increases your armor value from items by 6%.
    - Increases your armor value from items by 8%.
    - Increases your armor value from items by 10%.
  talent.blessing_of_kings:
    name: Blessing of Kings
    tooltip:
    - Places a Blessing on the friendly target, increasing total stats by 10% for
      5 min. Players may only have one Blessing on them per Paladin at any one time.
  talent.improved_righteous_fury:
    name: Improved Righteous Fury
    tooltip:
    - Increases the amount of threat generated by your Righteous Fury spell by 16%.
    - Increases the amount of threat generated by your Righteous Fury spell by 33%.
    - Increases the amount of threat generated by your Righteous Fury spell by 50%.
  talent.shield_specialization:
    name: Shield Specialization
    tooltip:
    - Increases the amount of damage absorbed by your shield by 10%.
    - Increases the amount of damage absorbed by your shield by 20%.
    - Increases the amount of damage absorbed by your shield by 30%.
  talent.anticipation:
    name: Anticipation
    tooltip:
    - Increases your Defense skill by 2.
    - Increases your Defense skill by 4.
    - Increases your Defense skill by 6.
    - Increases your Defense skill by 8.
    - Increases your Defense skill by 10.
  talent.improved_hammer_of_justice:
    name: Improved Hammer of Justice
    tooltip:
    - Decreases the cooldown of your Hammer of Justice spell by 5 sec.
    - Decreases the cooldown of your Hammer of Justice spell by 10 sec.
    - Decreases the cooldown of your Hammer of Justice spell by 15 sec.
  talent.improved_concentration_aura:
    name: Improved Concentration Aura
    tooltip:
    - Increases the effect of your Concentration Aura by an additional 5% and gives
      all group members affected by the aura an additional 5% chance to resist Silence
      and Interrupt effects.
    - Increases the effect of your Concentration Aura by an additional 10% and gives
      all group members affected by the aura an additional 10% chance to resist Silence
      and Interrupt effects.
    - Increases the effect of your Concentration Aura by an additional 15% and gives
      all group members affected by the aura an additional 15% chance to resist Silence
      and Interrupt effects.
  talent.blessing_of_sanctuary:
    name: Blessing of Sanctuary
    tooltip:
    - Places a Blessing on the friendly target, reducing damage dealt from all sources
      by up to 10 for 5 min. In addition, when the target blocks a melee attack the
      attacker will take 14 Holy damage. Players may only have one Blessing on them
      per Paladin at any one time.
  talent.reckoning:
    name: Reckoning
    tooltip:
    - Gives you a 20% chance to gain an extra attack after being the victim of a critical
      strike.
    - Gives you a 40% chance to gain an extra attack after being the victim of a critical
      strike.
    - Gives you a 60% chance to gain an extra attack after being the victim of a critical
      strike.
    - Gives you a 80% chance to gain an extra attack after being the victim of a critical
      strike.
    - Gives you a 100% chance to gain an extra attack after being the victim of a
      critical strike.
  talent.one_handed_weapon_specialization:
    name: One-Handed Weapon Specialization
    tooltip:
    - Increases the damage you deal with one-handed melee weapons by 2%.
    - Increases the damage you deal with one-handed melee weapons by 4%.
    - Increases the damage you deal with one-handed melee weapons by 6%.
    - Increases the damage you deal with one-handed melee weapons by 8%.
    - Increases the damage you deal with one-handed melee weapons by 10%.
  talent.holy_shield:
    name: Holy Shield
    tooltip:
    - Increases chance to block by 30% for 10 sec and deals 40 Holy damage for each
      attack blocked while active. Each block expends a charge. 4 charges.
  tree.3:
    name: Retribution
  talent.improved_blessing_of_might:
    name: Improved Blessing of Might
    tooltip:
    - Increases the Attack Power bonus of your Blessing of Might by 4%.
    - Increases the Attack Power bonus of your Blessing of Might by 8%.
    - Increases the Attack Power bonus of your Blessing of Might by 12%.
    - Increases the Attack Power bonus of your Blessing of Might by 16%.
    - Increases the Attack Power bonus of your Blessing of Might by 20%.
  talent.benediction:
    name: Benediction
    tooltip:
    - Reduces the Mana cost of your Judgement and Seal spells by 3%.
    - Reduces the Mana cost of your Judgement and Seal spells by 6%.
    - Reduces the Mana cost of your Judgement and Seal spells by 9%.
    - Reduces the Mana cost of your Judgement and Seal spells by 12%.
    - Reduces the Mana cost of your Judgement and Seal spells by 15%.
  talent.improved_judgement:
    name: Improved Judgement
    tooltip:
    - Decreases the cooldown of your Judgement spell by 1 sec.
    - Decreases the cooldown of your Judgement spell by 2 sec.
  talent.improved_seal_of_the_crusader:
    name: Improved Seal of the Crusader
    tooltip:
    - Increases the Attack Power bonus of your Seal of the Crusader and the Holy damage
      increase of your Judgement of the Crusader by 5%.
    - Increases the Attack Power bonus of your Seal of the Crusader and the Holy damage
      increase of your Judgement of the Crusader by 10%.
    - Increases the Attack Power bonus of your Seal of the Crusader and the Holy damage
      increase of your Judgement of the Crusader by 15%.
  talent.deflection:
    name: Deflection
    tooltip:
    - Increases your Parry chance by 1%.
    - Increases your Parry chance by 2%.
    - Increases your Parry chance by 3%.
    - Increases your Parry chance by 4%.
    - Increases your Parry chance by 5%.
  talent.vindication:
    name: Vindication
    tooltip:
    - Gives the Paladin's damaging melee attacks a chance to reduce the target's Strength
      and Agility by 5% for 10 sec.
    - Gives the Paladin's damaging melee attacks a chance to reduce the target's Strength
      and Agility by 10% for 10 sec.
    - Gives the Paladin's damaging melee attacks a chance to reduce the target's Strength
      and Agility by 15% for 10 sec.
  talent.conviction:
    name: Conviction
    tooltip:
    - Increases your chance to get a critical strike with melee weapons by 1%.
    - Increases your chance to get a critical strike with melee weapons by 2%.
    - Increases your chance to get a critical strike with melee weapons by 3%.
    - Increases your chance to get a critical strike with melee weapons by 4%.
    - Increases your chance to get a critical strike with melee weapons by 5%.
  talent.seal_of_command:
    name: Seal of Command
    tooltip:
    - Gives the Paladin a chance to deal additional Holy damage equal to 70% of the
      damage of the attack. Only one Seal can be active on the Paladin at any one
      time. Lasts 30 sec. Unleashing this Seal's energy will judge an enemy, instantly
      causing 68 to 74 Holy damage, 137 to 147 if the target is stunned.
  talent.pursuit_of_justice:
    name: Pursuit of Justice
    tooltip:
    - Increases movement and mounted movement speed by 4%. This does not stack with
      other movement speed increasing effects.
    - Increases movement and mounted movement speed by 8%. This does not stack with
      other movement speed increasing effects.
  talent.eye_for_an_eye:
    name: Eye for an Eye
    tooltip:
    - All spell criticals against you cause 15% of the damage taken to the caster
      as well. The damage caused by Eye for an Eye will not exceed 50% of the Paladin's
      total health.
    - All spell criticals against you cause 30% of the damage taken to the caster
      as well. The damage caused by Eye for an Eye will not exceed 50% of the Paladin's
      total health.
  talent.improved_retribution_aura:
    name: Improved Retribution Aura
    tooltip:
    - Increases the damage done by your Retribution Aura by 25%.
    - Increases the damage done by your Retribution Aura by 50%.
  talent.two_handed_weapon_specialization:
    name: Two-Handed Weapon Specialization
    tooltip:
    - Increases the damage you deal with two-handed melee weapons by 2%.
    - Increases the damage you deal with two-handed melee weapons by 4%.
    - Increases the damage you deal with two-handed melee weapons by 6%.
  talent.sanctity_aura:
    name: Sanctity Aura
    tooltip:
    - Increases Holy damage done by party members within 30 yards by 10%. Players
      may only have one Aura on them per Paladin at any one time.
  talent.vengeance:
    name: Vengeance
    tooltip:
    - Gives you a 3% bonus to Physical and Holy damage you deal for 8 sec after dealing
      a critical strike from a swing, spell or ability.
    - Gives you a 6% bonus to Physical and Holy damage you deal for 8 sec after dealing
      a critical strike from a swing, spell or ability.
    - Gives you a 9% bonus to Physical and Holy damage you deal for 8 sec after dealing
      a critical strike from a swing, spell or ability.
    - Gives you a 12% bonus to Physical and Holy damage you deal for 8 sec after dealing
      a critical strike from a swing, spell or ability.
    - Gives you a 15% bonus to Physical and Holy damage you deal for 8 sec after dealing
      a critical strike from a swing, spell or ability.
  talent.repentance:
    name: Repentance
    tooltip:
    - Puts the enemy target in a state of meditation for up to 6 sec. Any damage caused
      will awaken the target. Only works against Humanoids.
  spell.Hammer of Justice:
    name: Hammer of Justice
  spell.Hand of Protection:
    name: Hand of Protection
  spell.Judgement:
    name: Judgement
  spell.Lay on Hands:
    name: Lay on Hands
  spell.Seal of Command:
    name: Seal of Command
  spell.Seal of Justice:
    name: Seal of Justice
  spell.Seal of Light:
    name: Seal of Light
  spell.Seal of Righteousness:
    name: Seal of Righteousness
  spell.Seal of Wisdom:
    name: Seal of Wisdom
