schemaVersion: 1
locale: enUS
era: vanilla
class: rogue
texts:
  tree.1:
    name: Assassination
  talent.improved_eviscerate:
    name: Improved Eviscerate
    tooltip:
    - Increases the damage done by your Eviscerate ability by 5%.
    - Increases the damage done by your Eviscerate ability by 10%.
    - Increases the damage done by your Eviscerate ability by 15%.
  talent.remorseless_attacks:
    name: Remorseless Attacks
    tooltip:
    - After killing an opponent that yields experience, gives you a 20% increased
      critical strike chance on your next Sinister Strike, Backstab, Ambush, or Ghostly
      Strike. Lasts 20 sec.
    - After killing an opponent that yields experience, gives you a 40% increased
      critical strike chance on your next Sinister Strike, Backstab, Ambush, or Ghostly
      Strike. Lasts 20 sec.
  talent.malice:
    name: Malice
    tooltip:
    - Increases your critical strike chance by 1%.
    - Increases your critical strike chance by 2%.
    - Increases your critical strike chance by 3%.
    - Increases your critical strike chance by 4%.
    - Increases your critical strike chance by 5%.
  talent.ruthlessness:
    name: Ruthlessness
    tooltip:
    - Gives your finishing moves a 20% chance to add a combo point to your target.
    - Gives your finishing moves a 40% chance to add a combo point to your target.
    - Gives your finishing moves a 60% chance to add a combo point to your target.
  talent.murder:
    name: Murder
    tooltip:
    - Increases all damage caused against Humanoid, Giant, Beast, and Dragonkin by
      1%
    - Increases all damage caused against Humanoid, Giant, Beast, and Dragonkin by
      2%
  talent.improved_slice_and_dice:
    name: Improved Slice and Dice
    tooltip:
    - Increases the duration of your Slice and Dice ability by 15%.
    - Increases the duration of your Slice and Dice ability by 30%.
    - Increases the duration of your Slice and Dice ability by 45%.
  talent.relentless_strikes:
    name: Relentless Strikes
    tooltip:
    - Your finishing moves have a 20% chance per combo point to restore 25 energy.
  talent.improved_expose_armor:
    name: Improved Expose Armor
    tooltip:
    - Increases the armor reduced by your Expose Armor ability by an additional 25%.
    - Increases the armor reduced by your Expose Armor ability by an additional 50%.
  talent.lethality:
    name: Lethality
    tooltip:
    - Increases the critical strike damage bonus of your Sinister Strike, Gouge, Backstab,
      Ghostly Strike, and Hemorrhage abilites by 6%.
    - Increases the critical strike damage bonus of your Sinister Strike, Gouge, Backstab,
      Ghostly Strike, and Hemorrhage abilites by 12%.
    - Increases the critical strike damage bonus of your Sinister Strike, Gouge, Backstab,
      Ghostly Strike, and Hemorrhage abilites by 18%.
    - Increases the critical strike damage bonus of your Sinister Strike, Gouge, Backstab,
      Ghostly Strike, and Hemorrhage abilites by 24%.
    - Increases the critical strike damage bonus of your Sinister Strike, Gouge, Backstab,
      Ghostly Strike, and Hemorrhage abilites by 30%.
  talent.vile_poisons:
    name: Vile Poisons
    tooltip:
    - Increases the damage dealt by your poisons by 4% and gives your poisons a 8%
      chance to resist dispel effects.
    - Increases the damage dealt by your poisons by 8% and gives your poisons a 16%
      chance to resist dispel effects.
    - Increases the damage dealt by your poisons by 12% and gives your poisons a 24%
      chance to resist dispel effects.
    - Increases the damage dealt by your poisons by 16% and gives your poisons a 32%
      chance to resist dispel effects.
    - Increases the damage dealt by your poisons by 20% and gives your poisons a 40%
      chance to resist dispel effects.
  talent.improved_poisons:
    name: Improved Poisons
    tooltip:
    - Increases the chance to apply poisons to your target by 2%.
    - Increases the chance to apply poisons to your target by 4%.
    - Increases the chance to apply poisons to your target by 6%.
    - Increases the chance to apply poisons to your target by 8%.
    - Increases the chance to apply poisons to your target by 10%.
  talent.cold_blood:
    name: Cold Blood
    tooltip:
    - When activated, increases the critical strike chance of your next Sinister Strike,
      Backstab, Ambush, or Eviscerate by 100%.
  talent.improved_kidney_shot:
    name: Improved Kidney Shot
    tooltip:
    - While affected by your Kidney Shot ability, target receives an additional 3%
      damage from all sources.
    - While affected by your Kidney Shot ability, target receives an additional 6%
      damage from all sources.
    - While affected by your Kidney Shot ability, target receives an additional 9%
      damage from all sources.
  talent.seal_fate:
    name: Seal Fate
    tooltip:
    - Your critical strikes from abilities that add combo points have a 20% chance
      to add an additional combo point.
    - Your critical strikes from abilities that add combo points have a 40% chance
      to add an additional combo point.
    - Your critical strikes from abilities that add combo points have a 60% chance
      to add an additional combo point.
    - Your critical strikes from abilities that add combo points have a 80% chance
      to add an additional combo point.
    - Your critical strikes from abilities that add combo points have a 100% chance
      to add an additional combo point.
  talent.vigor:
    name: Vigor
    tooltip:
    - Increases your maximum Energy by 10.
  tree.2:
    name: Combat
  talent.improved_gouge:
    name: Improved Gouge
    tooltip:
    - Increases the effect duration of your Gouge ability by 0.5 sec.
    - Increases the effect duration of your Gouge ability by 1 sec.
    - Increases the effect duration of your Gouge ability by 1.5 sec.
  talent.improved_sinister_strike:
    name: Improved Sinister Strike
    tooltip:
    - Reduces the Energy cost of your Sinister Strike ability by 3.
    - Reduces the Energy cost of your Sinister Strike ability by 5.
  talent.lightning_reflexes:
    name: Lightning Reflexes
    tooltip:
    - Increases your Dodge chance by 1%.
    - Increases your Dodge chance by 2%.
    - Increases your Dodge chance by 3%.
    - Increases your Dodge chance by 4%.
    - Increases your Dodge chance by 5%.
  talent.improved_backstab:
    name: Improved Backstab
    tooltip:
    - Increases the critical strike chance of your Backstab ability by 10%.
    - Increases the critical strike chance of your Backstab ability by 20%.
    - Increases the critical strike chance of your Backstab ability by 30%.
  talent.deflection:
    name: Deflection
    tooltip:
    - Increases your Parry chance by 1%.
    - Increases your Parry chance by 2%.
    - Increases your Parry chance by 3%.
    - Increases your Parry chance by 4%.
    - Increases your Parry chance by 5%.
  talent.precision:
    name: Precision
    tooltip:
    - Increases your chance to hit with melee weapons by 1%.
    - Increases your chance to hit with melee weapons by 2%.
    - Increases your chance to hit with melee weapons by 3%.
    - Increases your chance to hit with melee weapons by 4%.
    - Increases your chance to hit with melee weapons by 5%.
  talent.endurance:
    name: Endurance
    tooltip:
    - Reduces the cooldown of your Sprint and Evasion abilities by 45 sec
    - Reduces the cooldown of your Sprint and Evasion abilities by 1.5 min.
  talent.riposte:
    name: Riposte
    tooltip:
    - A strike that becomes active after parrying an opponent's attack. This attack
      deals 150% weapon damage and disarms the target for 6 sec.
  talent.improved_sprint:
    name: Improved Sprint
    tooltip:
    - Gives a 50% chance to remove all movement imparing effects when you activate
      your Sprint ability.
    - Gives a 100% chance to remove all movement imparing effects when you activate
      your Sprint ability.
  talent.improved_kick:
    name: Improved Kick
    tooltip:
    - Gives your Kick ability a 50% chance to silence the target for 2 sec.
    - Gives your Kick ability a 100% chance to silence the target for 2 sec.
  talent.dagger_specialization:
    name: Dagger Specialization
    tooltip:
    - Increases your chance to get a critical strike with Daggers by 1%.
    - Increases your chance to get a critical strike with Daggers by 2%.
    - Increases your chance to get a critical strike with Daggers by 3%.
    - Increases your chance to get a critical strike with Daggers by 4%.
    - Increases your chance to get a critical strike with Daggers by 5%.
  talent.dual_wield_specialization:
    name: Dual Wield Specialization
    tooltip:
    - Increases the damage done by your offhand weapon by 10%.
    - Increases the damage done by your offhand weapon by 20%.
    - Increases the damage done by your offhand weapon by 30%.
    - Increases the damage done by your offhand weapon by 40%.
    - Increases the damage done by your offhand weapon by 50%.
  talent.mace_specialization:
    name: Mace Specialization
    tooltip:
    - Increases your skill with Maces by 1, and gives you a 1% chance to stun your
      target for 3 sec with a mace.
    - Increases your skill with Maces by 2, and gives you a 2% chance to stun your
      target for 3 sec with a mace.
    - Increases your skill with Maces by 3, and gives you a 3% chance to stun your
      target for 3 sec with a mace.
    - Increases your skill with Maces by 4, and gives you a 4% chance to stun your
      target for 3 sec with a mace.
    - Increases your skill with Maces by 5, and gives you a 5% chance to stun your
      target for 3 sec with a mace.
  talent.blade_flurry:
    name: Blade Flurry
    tooltip:
    - Increases your attack speed by 20%. In addition, attacks strike an additional
      nearby opponent. Lasts 15 sec.
  talent.sword_specialization:
    name: Sword Specialization
    tooltip:
    - Gives you a 1% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 2% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 3% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 4% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 5% chance to get an extra attack on the same target after dealing
      damage with your Sword.
  talent.fist_weapon_specialization:
    name: Fist Weapon Specialization
    tooltip:
    - Increases your chance to get a critical strike with Fist Weapons by 1%.
    - Increases your chance to get a critical strike with Fist Weapons by 2%.
    - Increases your chance to get a critical strike with Fist Weapons by 3%.
    - Increases your chance to get a critical strike with Fist Weapons by 4%.
    - Increases your chance to get a critical strike with Fist Weapons by 5%.
  talent.weapon_expertise:
    name: Weapon Expertise
    tooltip:
    - Increases your skill with Swords, Fist, and Daggers by 3.
    - Increases your skill with Swords, Fist, and Daggers by 5.
  talent.aggression:
    name: Aggression
    tooltip:
    - Increases the damage of your Sinister Strike and Eviscerate abilities by 2%.
    - Increases the damage of your Sinister Strike and Eviscerate abilities by 4%.
    - Increases the damage of your Sinister Strike and Eviscerate abilities by 6%.
  talent.adrenaline_rush:
    name: Adrenaline Rush
    tooltip:
    - Increases your Energy regeneration rate by 100% for 15 sec.
  tree.3:
    name: Subtlety
  talent.master_of_deception:
    name: Master of Deception
    tooltip:
    - Reduces the chance enemies have to detect you while in Stealth mode.
    - Reduces the chance enemies have to detect you while in Stealth mode. More effective
      than Master of Deception (Rank 1).
    - Reduces the chance enemies have to detect you while in Stealth mode. More effective
      than Master of Deception (Rank 2).
    - Reduces the chance enemies have to detect you while in Stealth mode. More effective
      than Master of Deception (Rank 3).
    - Reduces the chance enemies have to detect you while in Stealth mode. More effective
      than Master of Deception (Rank 4).
  talent.opportunity:
    name: Opportunity
    tooltip:
    - Increases the damage dealt when striking from behind with your Backstab, Garrote,
      or Ambush abilities by 4%.
    - Increases the damage dealt when striking from behind with your Backstab, Garrote,
      or Ambush abilities by 8%.
    - Increases the damage dealt when striking from behind with your Backstab, Garrote,
      or Ambush abilities by 12%.
    - Increases the damage dealt when striking from behind with your Backstab, Garrote,
      or Ambush abilities by 16%.
    - Increases the damage dealt when striking from behind with your Backstab, Garrote,
      or Ambush abilities by 20%.
  talent.sleight_of_hand:
    name: Sleight of Hand
    tooltip:
    - Reduces the chance you are critically hit by melee and ranged attacks by 1%
      and increases the threat reduced by your Feint ability by 10%.
    - Reduces the chance you are critically hit by melee and ranged attacks by 2%
      and increases the threat reduced by your Feint ability by 20%.
  talent.elusiveness:
    name: Elusiveness
    tooltip:
    - Reduces the cooldown of your Vanish and Blind abilities by 45 sec.
    - Reduces the cooldown of your Vanish and Blind abilities by 1.5 min.
  talent.camouflage:
    name: Camouflage
    tooltip:
    - Increases your speed while stealthed by 3% and reduces the cooldown of your
      Stealth ability by 1 sec.
    - Increases your speed while stealthed by 6% and reduces the cooldown of your
      Stealth ability by 2 sec.
    - Increases your speed while stealthed by 9% and reduces the cooldown of your
      Stealth ability by 3 sec.
    - Increases your speed while stealthed by 12% and reduces the cooldown of your
      Stealth ability by 4 sec.
    - Increases your speed while stealthed by 15% and reduces the cooldown of your
      Stealth ability by 5 sec.
  talent.initiative:
    name: Initiative
    tooltip:
    - Gives you a 25% chance to add an additional combo point to your target when
      using your Ambush, Garrote, or Cheap Shot ability.
    - Gives you a 50% chance to add an additional combo point to your target when
      using your Ambush, Garrote, or Cheap Shot ability.
    - Gives you a 75% chance to add an additional combo point to your target when
      using your Ambush, Garrote, or Cheap Shot ability.
  talent.ghostly_strike:
    name: Ghostly Strike
    tooltip:
    - A strike that deals 125% weapon damage and increases your chance to dodge by
      15% for 7 sec. Awards 1 combo point.
  talent.improved_ambush:
    name: Improved Ambush
    tooltip:
    - Increases the critical strike chance of your Ambush ability by 15%.
    - Increases the critical strike chance of your Ambush ability by 30%.
    - Increases the critical strike chance of your Ambush ability by 45%.
  talent.setup:
    name: Setup
    tooltip:
    - Gives you a 15% chance to add a combo point to your target after dodging their
      attack or fully resisting one of their spells.
    - Gives you a 30% chance to add a combo point to your target after dodging their
      attack or fully resisting one of their spells.
    - Gives you a 45% chance to add a combo point to your target after dodging their
      attack or fully resisting one of their spells.
  talent.improved_sap:
    name: Improved Sap
    tooltip:
    - Gives you a 30% chance to return to stealth mode after using your Sap ability.
    - Gives you a 60% chance to return to stealth mode after using your Sap ability.
    - Gives you a 90% chance to return to stealth mode after using your Sap ability.
  talent.serrated_blades:
    name: Serrated Blades
    tooltip:
    - Causes your attacks to ignore 1.67 armor/level of your target's Armor and increases
      the damage dealt by your Rupture ability by 10%. The amount of Armor reduced
      increases with your level.
    - Causes your attacks to ignore 3.34 armor/level of your target's Armor and increases
      the damage dealt by your Rupture ability by 20%. The amount of Armor reduced
      increases with your level.
    - Causes your attacks to ignore 5 armor/level of your target's Armor and increases
      the damage dealt by your Rupture ability by 30%. The amount of Armor reduced
      increases with your level.
  talent.heightened_senses:
    name: Heightened Senses
    tooltip:
    - Increases your Stealth detection and reduces the chance you are hit by spells
      and ranged attacks by 2%.
    - Increases your Stealth detection and reduces the chance you are hit by spells
      and ranged attacks by 4%. More effective than Heightened Senses (Rank 1).
  talent.preparation:
    name: Preparation
    tooltip:
    - When activated, this ability immediately finishes the cooldown on your other
      Rogue abilities.
  talent.dirty_deeds:
    name: Dirty Deeds
    tooltip:
    - Reduces the Energy Cost of your Cheap Shot and Garrote abilities by 10
    - Reduces the Energy Cost of your Cheap Shot and Garrote abilities by 20
  talent.hemorrhage:
    name: Hemorrhage
    tooltip:
    - An instant strike that damages the opponent and causes the target to hemorrhage,
      increasing any Physical damage dealt to the target by up to 3. Lasts 30 charges
      or 15 sec. Awards 1 combo point.
  talent.deadliness:
    name: Deadliness
    tooltip:
    - Increases your Attack Power by 2%.
    - Increases your Attack Power by 4%.
    - Increases your Attack Power by 6%.
    - Increases your Attack Power by 8%.
    - Increases your Attack Power by 10%.
  talent.premeditation:
    name: Premeditation
    tooltip:
    - When used, adds 2 combo points to your target. You must add to or use those
      combo points within 10 sec or the combo points are lost.
  spell.Blind:
    name: Blind
  spell.Cheap Shot:
    name: Cheap Shot
  spell.Evasion:
    name: Evasion
  spell.Garrote:
    name: Garrote
  spell.Sprint:
    name: Sprint
  spell.Stealth:
    name: Stealth
  spell.Vanish:
    name: Vanish
