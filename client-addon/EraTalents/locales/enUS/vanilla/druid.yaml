    name: Dire Bear Form
  spell.Entangling Roots:
    name: Entangling Roots
  spell.Faerie Fire:
    name: Faerie Fire
  spell.Healing Touch:
    name: Healing Touch
  spell.Hurricane:
    name: Hurricane
  spell.Maul:
    name: Maul
