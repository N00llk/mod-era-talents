schemaVersion: 1
locale: enUS
era: vanilla
class: warrior
texts:
  tree.1:
    name: Arms
  talent.improved_heroic_strike:
    name: Improved Heroic Strike
    tooltip:
    - Reduces the cost of your Heroic Strike ability by 1 rage point.
    - Reduces the cost of your Heroic Strike ability by 2 rage points.
    - Reduces the cost of your Heroic Strike ability by 3 rage points.
  talent.deflection:
    name: Deflection
    tooltip:
    - Increases your Parry chance by 1%.
    - Increases your Parry chance by 2%.
    - Increases your Parry chance by 3%.
    - Increases your Parry chance by 4%.
    - Increases your Parry chance by 5%.
  talent.improved_rend:
    name: Improved Rend
    tooltip:
    - Increases the bleed damage done by your Rend ability by 15%.
    - Increases the bleed damage done by your Rend ability by 25%.
    - Increases the bleed damage done by your Rend ability by 35%.
  talent.improved_charge:
    name: Improved Charge
    tooltip:
    - Increases the amount of rage generated by your Charge ability by 3.
    - Increases the amount of rage generated by your Charge ability by 6.
  talent.tactical_mastery:
    name: Tactical Mastery
    tooltip:
    - You retain up to 5 of your rage points when you change stances.
    - You retain up to 10 of your rage points when you change stances.
    - You retain up to 15 of your rage points when you change stances.
    - You retain up to 20 of your rage points when you change stances.
    - You retain up to 25 of your rage points when you change stances.
  talent.improved_thunder_clap:
    name: Improved Thunder Clap
    tooltip:
    - Reduces the cost of your Thunder Clap ability by 1 rage point and increases
      its damage by 10%.
    - Reduces the cost of your Thunder Clap ability by 2 rage points and increases
      its damage by 20%.
    - Reduces the cost of your Thunder Clap ability by 4 rage points and increases
      its damage by 30%.
  talent.improved_overpower:
    name: Improved Overpower
    tooltip:
    - Increases the critical strike chance of your Overpower ability by 25%.
    - Increases the critical strike chance of your Overpower ability by 50%.
  talent.anger_management:
    name: Anger Management
    tooltip:
    - Increases the time required for your Rage to decay while out of combat by 30%.
  talent.deep_wounds:
    name: Deep Wounds
    tooltip:
    - Your critical strikes cause the opponent to bleed, dealing 20% of your melee
      weapon's average damage over 12 sec.
    - Your critical strikes cause the opponent to bleed, dealing 40% of your melee
      weapon's average damage over 12 sec.
    - Your critical strikes cause the opponent to bleed, dealing 60% of your melee
      weapon's average damage over 12 sec.
  talent.two_handed_weapon_specialization:
    name: Two-Handed Weapon Specialization
    tooltip:
    - Increases the damage you deal with two-handed melee weapons by 1%.
    - Increases the damage you deal with two-handed melee weapons by 2%.
    - Increases the damage you deal with two-handed melee weapons by 3%.
    - Increases the damage you deal with two-handed melee weapons by 4%.
    - Increases the damage you deal with two-handed melee weapons by 5%.
  talent.impale:
    name: Impale
    tooltip:
    - Increases the critical strike damage bonus of your abilities in Battle, Defensive,
      and Berserker stance by 10%.
    - Increases the critical strike damage bonus of your abilities in Battle, Defensive,
      and Berserker stance by 20%.
  talent.axe_specialization:
    name: Axe Specialization
    tooltip:
    - Increases your chance to get a critical strike with Axes by 1%.
    - Increases your chance to get a critical strike with Axes by 2%.
    - Increases your chance to get a critical strike with Axes by 3%.
    - Increases your chance to get a critical strike with Axes by 4%.
    - Increases your chance to get a critical strike with Axes by 5%.
  talent.sweeping_strikes:
    name: Sweeping Strikes
    tooltip:
    - Your next 5 melee weapon swings strike an additional nearby opponent.
  talent.mace_specialization:
    name: Mace Specialization
    tooltip:
    - Gives you a 1% chance to stun your target for 3 sec with a Mace.
    - Gives you a 2% chance to stun your target for 3 sec with a Mace.
    - Gives you a 3% chance to stun your target for 3 sec with a Mace.
    - Gives you a 4% chance to stun your target for 3 sec with a Mace.
    - Gives you a 6% chance to stun your target for 3 sec with a Mace.
  talent.sword_specialization:
    name: Sword Specialization
    tooltip:
    - Gives you a 1% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 2% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 3% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 4% chance to get an extra attack on the same target after dealing
      damage with your Sword.
    - Gives you a 5% chance to get an extra attack on the same target after dealing
      damage with your Sword.
  talent.polearm_specialization:
    name: Polearm Specialization
    tooltip:
    - Increases your chance to get a critical strike with Polearms by 1%.
    - Increases your chance to get a critical strike with Polearms by 2%.
    - Increases your chance to get a critical strike with Polearms by 3%.
    - Increases your chance to get a critical strike with Polearms by 4%.
    - Increases your chance to get a critical strike with Polearms by 5%.
  talent.improved_hamstring:
    name: Improved Hamstring
    tooltip:
    - Gives your Hamstring ability a 5% chance to immobilize the target for 5 sec.
    - Gives your Hamstring ability a 10% chance to immobilize the target for 5 sec.
    - Gives your Hamstring ability a 15% chance to immobilize the target for 5 sec.
  talent.mortal_strike:
    name: Mortal Strike
    tooltip:
    - A vicious strike that deals weapon damage plus 85 and wounds the target, reducing
      the effectiveness of any healing by 50% for 10 sec.
  tree.2:
    name: Fury
  talent.booming_voice:
    name: Booming Voice
    tooltip:
    - Increases the area of effect and duration of your Battle Shout and Demoralizing
      Shout by 10%.
    - Increases the area of effect and duration of your Battle Shout and Demoralizing
      Shout by 20%.
    - Increases the area of effect and duration of your Battle Shout and Demoralizing
      Shout by 30%.
    - Increases the area of effect and duration of your Battle Shout and Demoralizing
      Shout by 40%.
    - Increases the area of effect and duration of your Battle Shout and Demoralizing
      Shout by 50%.
  talent.cruelty:
    name: Cruelty
    tooltip:
    - Increases your chance to get a critical strike with melee weapons by 1%.
    - Increases your chance to get a critical strike with melee weapons by 2%.
    - Increases your chance to get a critical strike with melee weapons by 3%.
    - Increases your chance to get a critical strike with melee weapons by 4%.
    - Increases your chance to get a critical strike with melee weapons by 5%.
  talent.improved_demoralizing_shout:
    name: Improved Demoralizing Shout
    tooltip:
    - Increases the Attack Power reduction of your Demoralizing Shout by 8%.
    - Increases the Attack Power reduction of your Demoralizing Shout by 16%.
    - Increases the attack power reduction of your Demoralizing Shout by 24%.
    - Increases the Attack Power reduction of your Demoralizing Shout by 32%.
    - Increases the attack power reduction of your Demoralizing Shout by 40%.
  talent.unbridled_wrath:
    name: Unbridled Wrath
    tooltip:
    - Gives you a 8% chance to generate an additional Rage point when you deal melee
      damage with a weapon.
    - Gives you a 16% chance to generate an additional Rage point when you deal melee
      damage with a weapon.
    - Gives you a 24% chance to generate an additional Rage point when you deal melee
      damage with a weapon.
    - Gives you a 32% chance to generate an additional Rage point when you deal melee
      damage with a weapon.
    - Gives you a 40% chance to generate an additional Rage point when you deal melee
      damage with a weapon.
  talent.improved_cleave:
    name: Improved Cleave
    tooltip:
    - Increases the bonus damage done by your Cleave ability by 40%.
    - Increases the bonus damage done by your Cleave ability by 80%.
    - Increases the bonus damage done by your Cleave ability by 120%.
  talent.piercing_howl:
    name: Piercing Howl
    tooltip:
    - Causes all enemies near the warrior to be dazed, reducing movement speed by
      50% for 6 sec.
  talent.blood_craze:
    name: Blood Craze
    tooltip:
    - Regenerates 1% of your total health over 6 sec after being the victim of a critical
      strike.
    - Regenerates 2% of your total health over 6 sec after being the victim of a critical
      strike.
    - Regenerates 3% of your total health over 6 sec after being the victim of a critical
      strike.
  talent.improved_battle_shout:
    name: Improved Battle Shout
    tooltip:
    - Increases the Attack Power bonus of your Battle Shout by 5%.
    - Increases the Attack Power bonus of your Battle Shout by 10%.
    - Increases the Attack Power bonus of your Battle Shout by 15%.
    - Increases the Attack Power bonus of your Battle Shout by 20%.
    - Increases the Attack Power bonus of your Battle Shout by 25%.
  talent.dual_wield_specialization:
    name: Dual Wield Specialization
    tooltip:
    - Increases the damage done by your offhand weapon by 5%.
    - Increases the damage done by your offhand weapon by 10%.
    - Increases the damage done by your offhand weapon by 15%.
    - Increases the damage done by your offhand weapon by 20%.
    - Increases the damage done by your offhand weapon by 25%.
  talent.improved_execute:
    name: Improved Execute
    tooltip:
    - Reduces the Rage cost of your Execute ability by 2.
    - Reduces the Rage cost of your Execute ability by 5.
  talent.enrage:
    name: Enrage
    tooltip:
    - Gives you a 5% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 10% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 15% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 20% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
    - Gives you a 25% melee damage bonus for 12 sec up to a maximum of 12 swings after
      being the victim of a critical strike.
  talent.improved_slam:
    name: Improved Slam
    tooltip:
    - Decreases the casting time of your Slam ability by 0.1 sec.
    - Decreases the casting time of your Slam ability by 0.2 sec.
    - Decreases the casting time of your Slam ability by 0.3 sec.
    - Decreases the casting time of your Slam ability by 0.4 sec.
    - Decreases the casting time of your Slam ability by 0.5 sec.
  talent.death_wish:
    name: Death Wish
    tooltip:
    - When activated, increases your physical damage by 20% and makes you immune to
      Fear effects, but lowers your armor and all resistances by 20%. Lasts 30 sec.
  talent.improved_intercept:
    name: Improved Intercept
    tooltip:
    - Reduces the cooldown of your Intercept ability by 5 sec.
    - Reduces the cooldown of your Intercept ability by 10 sec.
  talent.improved_berserker_rage:
    name: Improved Berserker Rage
    tooltip:
    - The Berserker Rage ability will generate 5 rage when used.
    - The Berserker Rage ability will generate 10 rage when used.
  talent.flurry:
    name: Flurry
    tooltip:
    - Increases your attack speed by 10% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 15% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 20% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 25% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 30% for your next 3 swings after dealing a critical
      strike.
  talent.bloodthirst:
    name: Bloodthirst
    tooltip:
    - Instantly attack the target, causing damage equal to 45% of your attack power.
      In addition, the next 5 successful melee attacks will restore 10 health. This
      effect lasts 8 sec.
  tree.3:
    name: Protection
  talent.shield_specialization:
    name: Shield Specialization
    tooltip:
    - Increases your chance to block attacks with a shield by 1% and has a 20% chance
      to generate 1 rage when a block occurs.
    - Increases your chance to block attacks with a shield by 2% and has a 40% chance
      to generate 1 rage when a block occurs.
    - Increases your chance to block attacks with a shield by 3% and has a 60% chance
      to generate 1 rage when a block occurs.
    - Increases your chance to block attacks with a shield by 4% and has a 80% chance
      to generate 1 rage when a block occurs.
    - Increases your chance to block attacks with a shield by 5% and has a 100% chance
      to generate 1 rage when a block occurs.
  talent.anticipation:
    name: Anticipation
    tooltip:
    - Increases your Defense skill by 2.
    - Increases your Defense skill by 4.
    - Increases your Defense skill by 6.
    - Increases your Defense skill by 8.
    - Increases your Defense skill by 10.
  talent.improved_bloodrage:
    name: Improved Bloodrage
    tooltip:
    - Increases the instant Rage generated by your Bloodrage ability by 2.
    - Increases the instant Rage generated by your Bloodrage ability by 5.
  talent.toughness:
    name: Toughness
    tooltip:
    - Increases your armor value from items by 2%.
    - Increases your armor value from items by 4%.
    - Increases your armor value from items by 6%.
    - Increases your armor value from items by 8%.
    - Increases your armor value from items by 10%.
  talent.iron_will:
    name: Iron Will
    tooltip:
    - Increases your chance to resist stun and charm effects by 3%.
    - Increases your chance to resist stun and charm effects by 6%.
    - Increases your chance to resist stun and charm effects by 9%.
    - Increases your chance to resist stun and charm effects by 12%.
    - Increases your chance to resist stun and charm effects by 15%.
  talent.last_stand:
    name: Last Stand
    tooltip:
    - When activated, this ability temporarily grants you 30% of your maximum hit
      points for 20 sec. After the effect expires, the hit points are lost.
  talent.improved_shield_block:
    name: Improved Shield Block
    tooltip:
    - Allows your Shield Block ability to block an additional attack, and increases
      the duration by 0.5 sec.
    - Allows your Shield Block ability to block an additional attack, and increases
      the duration by 1 sec.
    - Allows your Shield Block ability to block an additional attack, and increases
      the duration by 2 sec.
  talent.improved_revenge:
    name: Improved Revenge
    tooltip:
    - Gives your Revenge ability a 15% chance to stun the target for 3 sec.
    - Gives your Revenge ability a 30% chance to stun the target for 3 sec.
    - Gives your Revenge ability a 45% chance to stun the target for 3 sec.
  talent.defiance:
    name: Defiance
    tooltip:
    - Increases the threat generated by your attacks by 3% while in Defensive Stance.
    - Increases the threat generated by your attacks by 6% while in Defensive Stance.
    - Increases the threat generated by your attacks by 9% while in Defensive Stance.
    - Increases the threat generated by your attacks by 12% while in Defensive Stance.
    - Increases the threat generated by your attacks by 15% while in Defensive Stance.
  talent.improved_sunder_armor:
    name: Improved Sunder Armor
    tooltip:
    - Reduces the cost of your Sunder Armor ability by 1 rage point.
    - Reduces the cost of your Sunder Armor ability by 2 rage points.
    - Reduces the cost of your Sunder Armor ability by 3 rage points.
  talent.improved_disarm:
    name: Improved Disarm
    tooltip:
    - Increases the duration of your Disarm ability by 1 secs.
    - Increases the duration of your Disarm ability by 2 secs.
    - Increases the duration of your Disarm ability by 3 secs.
  talent.improved_taunt:
    name: Improved Taunt
    tooltip:
    - Reduces the cooldown of your Taunt ability by 1 sec.
    - Reduces the cooldown of your Taunt ability by 2 sec.
  talent.improved_shield_wall:
    name: Improved Shield Wall
    tooltip:
    - Increases the effect duration of your Shield Wall ability by 3 secs.
    - Increases the effect duration of your Shield Wall ability by 5 secs.
  talent.concussion_blow:
    name: Concussion Blow
    tooltip:
    - Stuns the opponent for 5 sec.
  talent.improved_shield_bash:
    name: Improved Shield Bash
    tooltip:
    - Gives your Shield Bash ability a 50% chance to silence the target for 3 sec.
    - Gives your Shield Bash ability a 100% chance to silence the target for 3 sec.
  talent.one_handed_weapon_specialization:
    name: One-Handed Weapon Specialization
    tooltip:
    - Increases the damage you deal with One-Handed Melee weapons by 2%.
    - Increases the damage you deal with One-Handed Melee weapons by 4%.
    - Increases the damage you deal with One-Handed Melee weapons by 6%.
    - Increases the damage you deal with One-Handed Melee weapons by 8%.
    - Increases the damage you deal with One-Handed Melee weapons by 10%.
  talent.shield_slam:
    name: Shield Slam
    tooltip:
    - Slam the target with your shield, causing 225 to 235 damage, modified by your
      shield block value, and has a 50% chance of dispelling 1 magic effect on the
      target. Also causes a high amount of threat.
