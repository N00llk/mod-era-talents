schemaVersion: 1
locale: enUS
era: vanilla
class: shaman
texts:
  tree.1:
    name: Elemental
  talent.convection:
    name: Convection
    tooltip:
    - Reduces the mana cost of your Shock, Lightning Bolt and Chain Lightning spells
      by 2%.
    - Reduces the mana cost of your Shock, Lightning Bolt and Chain Lightning spells
      by 4%.
    - Reduces the mana cost of your Shock, Lightning Bolt and Chain Lightning spells
      by 6%.
    - Reduces the mana cost of your Shock, Lightning Bolt and Chain Lightning spells
      by 8%.
    - Reduces the mana cost of your Shock, Lightning Bolt and Chain Lightning spells
      by 10%.
  talent.concussion:
    name: Concussion
    tooltip:
    - Increases the damage done by your Lightning Bolt, Chain Lightning and Shock
      spells by 1%.
    - Increases the damage done by your Lightning Bolt, Chain Lightning and Shock
      spells by 2%.
    - Increases the damage done by your Lightning Bolt, Chain Lightning and Shock
      spells by 3%.
    - Increases the damage done by your Lightning Bolt, Chain Lightning and Shock
      spells by 4%.
    - Increases the damage done by your Lightning Bolt, Chain Lightning and Shock
      spells by 5%.
  talent.earth_s_grasp:
    name: Earth's Grasp
    tooltip:
    - Increases the health of your Stoneclaw Totem by 25% and the radius of your Earthbind
      Totem by 10%.
    - Increases the health of your Stoneclaw Totem by 50% and the radius of your Earthbind
      Totem by 20%.
  talent.elemental_warding:
    name: Elemental Warding
    tooltip:
    - Reduces damage taken from Fire, Frost and Nature effects by 4%.
    - Reduces damage taken from Fire, Frost and Nature effects by 7%.
    - Reduces damage taken from Fire, Frost and Nature effects by 10%.
  talent.call_of_flame:
    name: Call of Flame
    tooltip:
    - Increases the damage done by your Fire Totems by 5%.
    - Increases the damage done by your Fire Totems by 10%.
    - Increases the damage done by your Fire Totems by 15%.
  talent.elemental_focus:
    name: Elemental Focus
    tooltip:
    - Gives you a 10% chance to enter a Clearcasting state after casting any Fire,
      Frost, or Nature damage spell. The Clearcasting state reduces the mana cost
      of your next damage spell by 100%.
  talent.reverberation:
    name: Reverberation
    tooltip:
    - Reduces the cooldown of your Shock spells by 0.2 sec.
    - Reduces the cooldown of your Shock spells by 0.4 sec.
    - Reduces the cooldown of your Shock spells by 0.6 sec.
    - Reduces the cooldown of your Shock spells by 0.8 sec.
    - Reduces the cooldown of your Shock spells by 1 sec.
  talent.call_of_thunder:
    name: Call of Thunder
    tooltip:
    - Increases the critical strike chance of your Lightning Bolt and Chain Lightning
      spells by 1%.
    - Increases the critical strike chance of your Lightning Bolt and Chain Lightning
      spells by 2%.
    - Increases the critical strike chance of your Lightning Bolt and Chain Lightning
      spells by 3%.
    - Increases the critical strike chance of your Lightning Bolt and Chain Lightning
      spells by 4%.
    - Increases the critical strike chance of your Lightning Bolt and Chain Lightning
      spells by 6%.
  talent.improved_fire_totems:
    name: Improved Fire Totems
    tooltip:
    - Reduces the delay before your Fire Nova Totem activates by 1 sec. and decreases
      the threat generated by your Magma Totem by 25%.
    - Reduces the delay before your Fire Nova Totem activates by 2 sec. and decreases
      the threat generated by your Magma Totem by 50%.
  talent.eye_of_the_storm:
    name: Eye of the Storm
    tooltip:
    - Gives you a 33% chance to gain the Focused Casting effect that lasts for 6 sec
      after being the victim of a melee or ranged critical strike. The Focused Casting
      effect prevents you from losing casting time when taking damage.
    - Gives you a 66% chance to gain the Focused Casting effect that lasts for 6 sec
      after being the victim of a melee or ranged critical strike. The Focused Casting
      effect prevents you from losing casting time when taking damage.
    - Gives you a 100% chance to gain the Focused Casting effect that lasts for 6
      sec after being the victim of a melee or ranged critical strike. The Focused
      Casting effect prevents you from losing casting time when taking damage.
  talent.elemental_devastation:
    name: Elemental Devastation
    tooltip:
    - Your offensive spell crits will increase your chance to get a critical strike
      with melee attacks by 3% for 10 sec.
    - Your offensive spell crits will increase your chance to get a critical strike
      with melee attacks by 6% for 10 sec.
    - Your offensive spell crits will increase your chance to get a critical strike
      with melee attacks by 9% for 10 sec.
  talent.storm_reach:
    name: Storm Reach
    tooltip:
    - Increases the range of your Lightning Bolt and Chain Lightning spells by 3 yards.
    - Increases the range of your Lightning Bolt and Chain Lightning spells by 6 yards.
  talent.elemental_fury:
    name: Elemental Fury
    tooltip:
    - Increases the critical strike damage bonus of your Searing, Magma, and Fire
      Nova Totems and your Fire, Frost, and Nature spells by 100%.
  talent.lightning_mastery:
    name: Lightning Mastery
    tooltip:
    - Reduces the cast time of your Lightning Bolt and Chain Lightning spells by 0.2
      sec.
    - Reduces the cast time of your Lightning Bolt and Chain Lightning spells by 0.4
      sec.
    - Reduces the cast time of your Lightning Bolt and Chain Lightning spells by 0.6
      sec.
    - Reduces the cast time of your Lightning Bolt and Chain Lightning spells by 0.8
      sec.
    - Reduces the cast time of your Lightning Bolt and Chain Lightning spells by 1
      sec.
  talent.elemental_mastery:
    name: Elemental Mastery
    tooltip:
    - When activated, this spell gives your next Fire, Frost, or Nature damage spell
      a 100% critical strike chance and reduces the mana cost by 100%.
  tree.2:
    name: Enhancement
  talent.ancestral_knowledge:
    name: Ancestral Knowledge
    tooltip:
    - Increases your maximum Mana by 1%.
    - Increases your maximum Mana by 2%.
    - Increases your maximum Mana by 3%.
    - Increases your maximum Mana by 4%.
    - Increases your maximum Mana by 5%.
  talent.shield_specialization:
    name: Shield Specialization
    tooltip:
    - Increases your chance to block attacks with a shield by 1% and increases the
      amount blocked by 5%.
    - Increases your chance to block attacks with a shield by 2% and increases the
      amount blocked by 10%.
    - Increases your chance to block attacks with a shield by 3% and increases the
      amount blocked by 15%.
    - Increases your chance to block attacks with a shield by 4% and increases the
      amount blocked by 20%.
    - Increases your chance to block attacks with a shield by 5% and increases the
      amount blocked by 25%.
  talent.guardian_totems:
    name: Guardian Totems
    tooltip:
    - Increases the amount of damage reduced by your Stoneskin Totem and Windwall
      Totem by 10% and reduces the cooldown of your Grounding Totem by 1 sec.
    - Increases the amount of damage reduced by your Stoneskin Totem and Windwall
      Totem by 20% and reduces the cooldown of your Grounding Totem by 2 sec.
  talent.thundering_strikes:
    name: Thundering Strikes
    tooltip:
    - Improves your chance to get a critical strike with your weapon attacks by 1%.
    - Improves your chance to get a critical strike with your weapon attacks by 2%.
    - Improves your chance to get a critical strike with your weapon attacks by 3%.
    - Improves your chance to get a critical strike with your weapon attacks by 4%.
    - Improves your chance to get a critical strike with your weapon attacks by 5%.
  talent.improved_ghost_wolf:
    name: Improved Ghost Wolf
    tooltip:
    - Reduces the cast time of your Ghost Wolf spell by 1 sec.
    - Reduces the cast time of your Ghost Wolf spell by 2 sec.
  talent.improved_lightning_shield:
    name: Improved Lightning Shield
    tooltip:
    - Increases the damage done by your Lightning Shield orbs by 5%.
    - Increases the damage done by your Lightning Shield orbs by 10%.
    - Increases the damage done by your Lightning Shield orbs by 15%.
  talent.enhancing_totems:
    name: Enhancing Totems
    tooltip:
    - Increases the effect of your Strength of Earth and Grace of Air Totems by 8%.
    - Increases the effect of your Strength of Earth and Grace of Air Totems by 15%.
  talent.two_handed_axes_and_maces:
    name: Two-Handed Axes and Maces
    tooltip:
    - Allows you to use Two-Handed Axes and Two-Handed Maces.
  talent.anticipation:
    name: Anticipation
    tooltip:
    - Increases your chance to dodge by an additional 1%.
    - Increases your chance to dodge by an additional 2%.
    - Increases your chance to dodge by an additional 3%.
    - Increases your chance to dodge by an additional 4%.
    - Increases your chance to dodge by an additional 5%.
  talent.flurry:
    name: Flurry
    tooltip:
    - Increases your attack speed by 10% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 15% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 20% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 25% for your next 3 swings after dealing a critical
      strike.
    - Increases your attack speed by 30% for your next 3 swings after dealing a critical
      strike.
  talent.toughness:
    name: Toughness
    tooltip:
    - Increases your armor value from items by 2%.
    - Increases your armor value from items by 4%.
    - Increases your armor value from items by 6%.
    - Increases your armor value from items by 8%.
    - Increases your armor value from items by 10%.
  talent.improved_weapon_totems:
    name: Improved Weapon Totems
    tooltip:
    - Increases the melee attack power bonus of your Windfury Totem by 15% and increases
      the damage caused by your Flametongue Totem by 6%
    - Increases the melee attack power bonus of your Windfury Totem by 30% and increases
      the damage caused by your Flametongue Totem by 12%
  talent.elemental_weapons:
    name: Elemental Weapons
    tooltip:
    - Increases the melee attack power bonus of your Rockbiter Weapon by 7%, your
      Windfury Weapon effect by 13% and increases the damage caused by your Flametongue
      Weapon and Frostbrand Weapon by 5%.
    - Increases the melee attack power bonus of your Rockbiter Weapon by 14%, your
      Windfury Weapon effect by 27% and increases the damage caused by your Flametongue
      Weapon and Frostbrand Weapon by 10%.
    - Increases the melee attack power bonus of your Rockbiter Weapon by 20%, your
      Windfury Weapon effect by 40% and increases the damage caused by your Flametongue
      Weapon and Frostbrand Weapon by 15%.
  talent.parry:
    name: Parry
    tooltip:
    - Gives a chance to parry enemy melee attacks.
  talent.weapon_mastery:
    name: Weapon Mastery
    tooltip:
    - Increases the damage you deal with all weapons by 2%.
    - Increases the damage you deal with all weapons by 4%.
    - Increases the damage you deal with all weapons by 6%.
    - Increases the damage you deal with all weapons by 8%.
    - Increases the damage you deal with all weapons by 10%.
  talent.stormstrike:
    name: Stormstrike
    tooltip:
    - Gives you an extra attack. In addition, the next 2 sources of Nature damage
      dealt to the target are increased by 20%. Lasts 12 sec.
  tree.3:
    name: Restoration
  talent.improved_healing_wave:
    name: Improved Healing Wave
    tooltip:
    - Reduces the casting time of your Healing Wave spell by 0.1 sec.
    - Reduces the casting time of your Healing Wave spell by 0.2 sec.
    - Reduces the casting time of your Healing Wave spell by 0.3 sec.
    - Reduces the casting time of your Healing Wave spell by 0.4 sec.
    - Reduces the casting time of your Healing Wave spell by 0.5 sec.
  talent.tidal_focus:
    name: Tidal Focus
    tooltip:
    - Reduces the Mana cost of your healing spells by 1%.
    - Reduces the Mana cost of your healing spells by 2%.
    - Reduces the Mana cost of your healing spells by 3%.
    - Reduces the Mana cost of your healing spells by 4%.
    - Reduces the Mana cost of your healing spells by 5%.
  talent.improved_reincarnation:
    name: Improved Reincarnation
    tooltip:
    - Reduces the cooldown of your Reincarnation spell by 10 min and increases the
      amount of health and mana you reincarnate with by an additional 10%.
    - Reduces the cooldown of your Reincarnation spell by 20 min and increases the
      amount of health and mana you reincarnate with by an additional 20%.
  talent.ancestral_healing:
    name: Ancestral Healing
    tooltip:
    - Increases your target's armor value by 8% for 15 sec after getting a critical
      effect from one of your healing spells.
    - Increases your target's armor value by 16% for 15 sec after getting a critical
      effect from one of your healing spells.
    - Increases your target's armor value by 25% for 15 sec after getting a critical
      effect from one of your healing spells.
  talent.totemic_focus:
    name: Totemic Focus
    tooltip:
    - Reduces the Mana cost of your totems by 5%.
    - Reduces the Mana cost of your totems by 10%.
    - Reduces the Mana cost of your totems by 15%.
    - Reduces the Mana cost of your totems by 20%.
    - Reduces the Mana cost of your totems by 25%.
  talent.nature_s_guidance:
    name: Nature's Guidance
    tooltip:
    - Increases your chance to hit with melee attacks and spells by 1%
    - Increases your chance to hit with melee attacks and spells by 2%
    - Increases your chance to hit with melee attacks and spells by 3%
  talent.healing_focus:
    name: Healing Focus
    tooltip:
    - Gives you a 14% chance to avoid interruption caused by damage while casting
      any healing spell.
    - Gives you a 28% chance to avoid interruption caused by damage while casting
      any healing spell.
    - Gives you a 42% chance to avoid interruption caused by damage while casting
      any healing spell.
    - Gives you a 56% chance to avoid interruption caused by damage while casting
      any healing spell.
    - Gives you a 70% chance to avoid interruption caused by damage while casting
      any healing spell.
  talent.totemic_mastery:
    name: Totemic Mastery
    tooltip:
    - The radius of your totems that affect friendly targets is increased by 10 yd.
      Does not stack with the 3 piece Earthfury bonus.
  talent.healing_grace:
    name: Healing Grace
    tooltip:
    - Reduces the threat generated by your healing spells by 5%.
    - Reduces the threat generated by your healing spells by 10%.
    - Reduces the threat generated by your healing spells by 15%.
  talent.restorative_totems:
    name: Restorative Totems
    tooltip:
    - Increases the effect of your Mana Spring and Healing Stream Totems by 5%.
    - Increases the effect of your Mana Spring and Healing Stream Totems by 10%.
    - Increases the effect of your Mana Spring and Healing Stream Totems by 15%.
    - Increases the effect of your Mana Spring and Healing Stream Totems by 20%.
    - Increases the effect of your Mana Spring and Healing Stream Totems by 25%.
  talent.tidal_mastery:
    name: Tidal Mastery
    tooltip:
    - Increases the critical effect chance of your healing and lightning spells by
      1%.
    - Increases the critical effect chance of your healing and lightning spells by
      2%.
    - Increases the critical effect chance of your healing and lightning spells by
      3%.
    - Increases the critical effect chance of your healing and lightning spells by
      4%.
    - Increases the critical effect chance of your healing and lightning spells by
      5%.
  talent.healing_way:
    name: Healing Way
    tooltip:
    - Your Healing Wave spells have a 33% chance to increase the effect of subsequent
      Healing Wave spells on that target by 6% for 15 sec. This effect will stack
      up to 3 times.
    - Your Healing Wave spells have a 66% chance to increase the effect of subsequent
      Healing Wave spells on that target by 6% for 15 sec. This effect will stack
      up to 3 times.
    - Your Healing Wave spells have a 100% chance to increase the effect of subsequent
      Healing Wave spells on that target by 6% for 15 sec. This effect will stack
      up to 3 times.
  talent.nature_s_swiftness:
    name: Nature's Swiftness
    tooltip:
    - When activated, your next Nature spell with a casting time less than 10 sec
      becomes an instant cast spell.
  talent.purification:
    name: Purification
    tooltip:
    - Increases the effectiveness of your healing spells by 2%.
    - Increases the effectiveness of your healing spells by 4%.
    - Increases the effectiveness of your healing spells by 6%.
    - Increases the effectiveness of your healing spells by 8%.
    - Increases the effectiveness of your healing spells by 10%.
  talent.mana_tide_totem:
    name: Mana Tide Totem
    tooltip:
    - '20 Mana Instant cast 5 min cooldown Tools: Water Totem Summons a Mana Tide
      Totem with 5 health at the feet of the caster for 12 sec that restores 140 mana
      every 3 seconds to group members within 20 yards.'
  spell.Chain Heal:
    name: Chain Heal
  spell.Chain Lightning:
    name: Chain Lightning
  spell.Earth Shock:
    name: Earth Shock
  spell.Flame Shock:
    name: Flame Shock
  spell.Frost Shock:
    name: Frost Shock
  spell.Ghost Wolf:
    name: Ghost Wolf
  spell.Grounding Totem:
    name: Grounding Totem
  spell.Healing Wave:
    name: Healing Wave
  spell.Lesser Healing Wave:
    name: Lesser Healing Wave
  spell.Lightning Bolt:
    name: Lightning Bolt
  spell.Magma Totem:
    name: Magma Totem
  spell.Mana Spring Totem:
    name: Mana Spring Totem
  spell.Reincarnation:
    name: Reincarnation
  spell.Searing Totem:
    name: Searing Totem
  spell.Stoneclaw Totem:
    name: Stoneclaw Totem
  spell.Strength of Earth Totem:
    name: Strength of Earth Totem
