  spell.948550:
    name: Soul Link
    description: When active, 20% of all damage taken by the caster is taken by your Imp, Voidwalker, Succubus,
      Felhunter, Felguard, or enslaved demon instead.  That damage cannot be prevented.  In addition, both the demon
      and master will inflict 5% more damage.  Lasts as long as the demon is active and controlled.
    auraDescription: 20% of all damage you take is redirected to your demon, and both of you deal 5% more damage.
  spell.948552:
    name: Demonic Sacrifice
    description: 'When activated, sacrifices your summoned demon to grant you an effect that lasts 30 min.  The
      effect is canceled if any Demon is summoned.  Imp: Increases your Fire damage by 15%.  Voidwalker: Restores
      2% of total health every 4 sec.  Succubus: Increases your Shadow damage by 15%.  Felhunter: Restores 3% of
      total mana every 4 sec.  Felguard: Increases your Shadow damage by 10% and restores 2% of total mana every
      4 sec.'
  spell.948553:
