  spell.948470:
    name: Unstable Affliction
    description: Shadow energy slowly destroys the target, causing 660 damage over 18 sec.  In addition, if the
      Unstable Affliction is dispelled it will cause 990 damage to the dispeller and silence them for 5 sec.
    auraDescription: Shadow energy slowly destroying the target.
  spell.948471:
    name: Unstable Affliction
    description: Shadow energy slowly destroys the target, causing 840 damage over 18 sec.  In addition, if the
      Unstable Affliction is dispelled it will cause 1260 damage to the dispeller and silence them for 5 sec.
    auraDescription: Shadow energy slowly destroying the target.
  spell.948472:
