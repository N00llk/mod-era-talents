  spell.948425:
    name: Create Spellstone
    description: Creates a Spellstone that can be equipped in the off-hand. While equipped, it increases spell critical
      strike chance, and it can be used to remove harmful magic effects and absorb magic damage.
  spell.948426:
    name: Create Spellstone (Greater)
    description: Creates a Greater Spellstone that can be equipped in the off-hand. While equipped, it increases
