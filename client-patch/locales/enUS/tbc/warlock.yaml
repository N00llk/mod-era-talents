  spell.948420:
    name: Create Firestone (Lesser)
    description: Creates a Lesser Firestone that can be equipped in the off-hand. When equipped, it enchants the
      main hand weapon with fire and increases Fire spell damage.
  spell.948421:
    name: Create Firestone
    description: Creates a Firestone that can be equipped in the off-hand. When equipped, it enchants the main hand
      weapon with fire and increases Fire spell damage.
