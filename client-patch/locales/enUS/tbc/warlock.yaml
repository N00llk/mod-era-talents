  spell.948450:
    name: Amplify Curse
    description: Increases the effect of your next Curse of Doom or Curse of Agony by 50%, or your next Curse of
      Exhaustion by an additional 20%.  Lasts 30 sec.
    auraDescription: Your next Curse of Doom or Agony is 50% stronger (Exhaustion 20%).
