  spell.946256:
    name: Leader of the Pack
    description: While in Cat, Bear or Dire Bear Form, the Leader of the Pack increases ranged and melee critical
      chance of all party members within 45 yards by 5%.
    auraDescription: Melee and ranged critical strike chance of nearby party members increased by 5%.
