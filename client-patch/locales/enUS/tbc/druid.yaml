  spell.946269:
    name: Omen of Clarity
    description: Imbues the Druid with natural energy. Each of the Druid's melee attacks has a chance of causing
      the caster to enter a Clearcasting state. The Clearcasting state reduces the Mana, Rage or Energy cost of
      your next damage or healing spell or offensive ability by 100%. Lasts 30 min.
    auraDescription: Each of your melee attacks has a chance to reduce the cost of your next spell or ability by
      100%.
  spell.946266:
    name: Tree of Life
    description: Increases healing received by party members within 45 yards by an amount equal to 25% of the Tree
      of Life Druid's Spirit.
    auraDescription: Healing received is increased by an amount equal to 25% of the Tree of Life Druid's Spirit.
  spell.946276:
    name: Tree of Life
    description: 'Shapeshift into the Tree of Life.  While in this form you increase healing received by all party
      members within 45 yards by an amount equal to 25% of your total Spirit, and you can only cast Restoration
      spells in addition to Innervate, Barkskin, Nature''s Grasp and Thorns spells.


      The act of shapeshifting frees the caster of Polymorph and Movement Impairing effects.'
    auraDescription: Immune to Polymorph effects.  Increases healing received by all party members within 45 yards
      by an amount equal to 25% of your total Spirit.
