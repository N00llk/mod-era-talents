  spell.948760:
    name: Arcane Power
    description: When activated, your spells deal 30% more damage while costing 30% more mana to cast. This effect
      lasts 15 sec.
    auraDescription: Spell damage increased by 30%. Mana cost increased by 30%.
  spell.948761:
    name: Presence of Mind
    description: When activated, your next Mage spell with a casting time less than 10 sec becomes an instant cast
      spell.
    auraDescription: Your next Mage spell with a casting time less than 10 sec becomes an instant cast spell.
  spell.948762:
    name: Magic Absorption
    description: Increases all resistances by 2 and causes all spells you fully resist to restore 1% of your total
      mana. 1 sec. cooldown.
  spell.948763:
