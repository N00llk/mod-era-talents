  spell.948281:
    name: Scorpid Sting
    description: Stings the target, reducing chance to hit with melee and ranged attacks by 5% for 20 sec.  Only
      one Sting per Hunter can be active on any one target.
    auraDescription: Chance to hit with melee and ranged attacks reduced by 5%.
  spell.948290:
    name: Bestial Wrath
    description: Send your pet into a rage causing 50% additional damage for 18 sec. While enraged, the beast does
      not feel pity or remorse or fear and it cannot be stopped unless killed.
    auraDescription: Enraged.
  spell.948291:
    name: The Beast Within
    description: When your pet is under the effects of Bestial Wrath, you also go into a rage causing 10% additional
      damage and reducing mana costs of all spells by 20% for 18 sec. While enraged, you do not feel pity or remorse
      or fear and you cannot be stopped unless killed.
  spell.948292:
    name: The Beast Within
    description: When your pet is under the effects of Bestial Wrath, you also go into a rage causing 10% additional
      damage and reducing mana costs of all spells by 20% for 18 sec. While enraged, you do not feel pity or remorse
      or fear and you cannot be stopped unless killed.
    auraDescription: Damage increased by 10% and mana costs reduced by 20%. Cannot be stopped unless killed.
