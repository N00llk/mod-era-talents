    auraDescription: Reduces the casting time of your next spell by 0.5 sec.
  spell.932505:
    name: Nature's Grasp
    description: While active, any time an enemy strikes the caster they have a chance to become afflicted by Entangling
      Roots (Rank 1). Only useable outdoors. 1 charge. Lasts 45 sec.
