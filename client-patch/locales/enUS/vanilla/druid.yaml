  spell.932512:
    name: Omen of Clarity
    description: Imbues the Druid with natural energy. Each of the Druid's melee attacks has a chance of causing
      the caster to enter a Clearcasting state. The Clearcasting state reduces the Mana, Rage or Energy cost of
      your next damage or healing spell or offensive ability by 100%. Lasts 10 min.
    auraDescription: Each of your melee attacks has a chance to reduce the cost of your next spell or ability by
      100%.
  spell.932513:
    name: Enrage
    description: Generates 20 Rage over 10 sec. Only usable in Bear Form and Dire Bear Form.
    auraDescription: Generating Rage.
