  spell.932965:
    name: Wyvern Sting
    description: A stinging shot that puts the target to sleep for 12 sec. Any damage will cancel the effect. When
      the target wakes up, the Sting causes 300 Nature damage over 12 sec. Only usable out of combat. Only one Sting
      per Hunter can be active on the target at a time.
    auraDescription: Asleep. Any damage will cancel the effect. When the target wakes up, the Sting causes 300 Nature
      damage over 12 sec.
