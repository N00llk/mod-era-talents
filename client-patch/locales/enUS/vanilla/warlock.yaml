  spell.932922:
    name: Create Firestone (Lesser)
    description: Creates a Lesser Firestone that can be equipped in the off-hand. When equipped, it enchants the
      main hand weapon with fire and increases Fire spell damage.
  spell.932923:
    name: Create Firestone
    description: Creates a Firestone that can be equipped in the off-hand. When equipped, it enchants the main hand
      weapon with fire and increases Fire spell damage.
  spell.932924:
    name: Create Firestone (Greater)
    description: Creates a Greater Firestone that can be equipped in the off-hand. When equipped, it enchants the
      main hand weapon with fire and increases Fire spell damage.
  spell.932925:
    name: Create Firestone (Major)
    description: Creates a Major Firestone that can be equipped in the off-hand. When equipped, it enchants the
      main hand weapon with fire and increases Fire spell damage.
  spell.932926:
    name: Create Spellstone
    description: Creates a Spellstone that can be equipped in the off-hand. While equipped, it increases spell critical
      strike chance, and it can be used to remove harmful magic effects and absorb magic damage.
  spell.932927:
    name: Create Spellstone (Greater)
    description: Creates a Greater Spellstone that can be equipped in the off-hand. While equipped, it increases
      spell critical strike chance, and it can be used to remove harmful magic effects and absorb magic damage.
  spell.932928:
