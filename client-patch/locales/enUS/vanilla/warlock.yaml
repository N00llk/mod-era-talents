texts:
  spell.932900:
    name: Soul Link
    description: While active and your demon is alive, 30% of all damage taken by you is taken by your demon instead.
      Lasts as long as the demon is active.
    auraDescription: 30% of all damage you take is redirected to your demon.
  spell.932902:
