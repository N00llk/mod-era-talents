  spell.932929:
    name: Demonic Sacrifice
    description: 'Sacrifices your summoned demon to grant you an effect that lasts 30 min. The effect is canceled
      if any Demon is summoned. Imp: Increases your Fire damage by 15%. Voidwalker: Restores 3% of total Health
      every 4 sec. Succubus: Increases your Shadow damage by 15%. Felhunter: Restores 2% of total Mana every 4 sec.'
