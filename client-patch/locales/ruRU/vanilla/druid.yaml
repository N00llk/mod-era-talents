  spell.932503:
    name: Вожак стаи
    auraDescription: Вероятность критического удара в ближнем и дальнем бою у ближайших участников группы повышена
      на 3%.
    sourceHash: c7001e55a0d3ecc14c8114367192ba1270f8b64458fa0ea6045611833fd0d29c
