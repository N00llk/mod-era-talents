  spell.932512:
    name: Знамение ясности
    description: Наполняет друида энергией природы. Каждая атака ближнего боя может вызвать состояние ясности мысли,
      снижающее затраты маны, ярости или энергии на следующее атакующее или исцеляющее заклинание либо атакующую
      способность на 100%. Время действия — 10 мин.
    auraDescription: Каждая атака ближнего боя может снизить стоимость следующего заклинания или способности на
      100%.
    sourceHash: 5ad15328ac4942cab624e6d7dd10eb53ccf4338bf670e4cbcef3172fe1f84d7e
  spell.932513:
    name: Исступление
    description: Восстанавливает 20 ед. ярости в течение 10 сек. Можно применять только в облике медведя или лютого
      медведя.
    auraDescription: Накапливает ярость.
    sourceHash: 12d659404076cf9c210be36232f22b4f924a3763111861bb9484484274dfd17b
  spell.932514:
    name: Рой насекомых
    description: Рой насекомых атакует цель, снижая вероятность ее попадания на $s2% и нанося $o1 ед. урона от сил
      природы в течение $d.
    auraDescription: Вероятность попадания снижена на $s2%. Наносит $s1 ед. урона от сил природы раз в $t1 сек.
    sourceHash: 427a33c4fb8d4efbf97b260e49fcb02e419eacd13b1e48d13576b530111b2a5d
