  spell.932300:
    name: Жало скорпида
    description: Жалит цель, снижая ее силу и ловкость на 21 ед. на 20 сек. На каждую цель может действовать только
      одно жало от каждого охотника.
    auraDescription: Сила и ловкость снижены на 21.
    sourceHash: 2d2943893c13f6197aaf9529bbe12c5375cd0edd6a514e854d0b9152c5e83046
