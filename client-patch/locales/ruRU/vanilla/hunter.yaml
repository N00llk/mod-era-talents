  spell.932967:
    name: Звериный гнев
    description: Приводит питомца в ярость, повышающую наносимый им урон на 50% на 18 сек. В состоянии ярости зверь
      не знает ни страха, ни жалости, и только смерть может остановить его.
    auraDescription: В состоянии ярости наносимый урон повышен на 50%. Остановить можно только убийством.
    sourceHash: 60778febd339dc48805ceb3430024b3b00731dff73cd2301267986920e2bc621
  spell.932968:
    name: Узы духа
    auraDescription: Вы и ваш питомец восстанавливаете 1% от максимального здоровья раз в 10 сек.
    sourceHash: e3789a38d6a0e2f68d7852b8a529ed5f74b2abdda817b136b40e443853b34014
  spell.932969:
    name: Узы духа
    auraDescription: Вы и ваш питомец восстанавливаете 2% от максимального здоровья раз в 10 сек.
    sourceHash: ce9899ed7d2c82ce7a04a528c9b5915a6d203405cbaf8e82205c94ee6d203e41
  spell.932964:
    name: Сдерживание
    description: После активации повышает вероятность уклонения и парирования на 25% на 10 сек.
    auraDescription: Вероятность уклонения и парирования повышена на 25%.
    sourceHash: cb8a31c9fa4cab01a01c41e4d5b6a19382cf044c473b43398045e2e2b7cf2421
  spell.932965:
    name: Жало виверны
    description: Жалящий выстрел, усыпляющий цель на 12 сек. Любой урон отменяет эффект. После пробуждения жало
      наносит цели 300 ед. урона от сил природы в течение 12 сек. Можно применять только вне боя. На каждую цель
      может действовать только одно жало от каждого охотника.
    auraDescription: Усыплен. Любой урон снимает эффект. После пробуждения цель получает 300 ед. урона от сил природы
      за 12 сек.
    sourceHash: 0bba4280280cecaeb6e02dd1e33ecedada5fa253e642c7252095cafc50c66cf8
  spell.932966:
    name: Жало виверны
    auraDescription: Наносит 50 ед. урона от сил природы раз в 2 сек.
    sourceHash: 81464678639766f4a8c948735a31ce95b4feb93ad331c72992028c7fc80e1c6b
  spell.932972:
