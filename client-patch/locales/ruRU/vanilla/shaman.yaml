  spell.931390:
    name: Тотем-часовой
    auraDescription: Позволяет смотреть глазами сторожевого тотема. Щелкните правой кнопкой мыши по эффекту, чтобы
      переключиться между обзором тотема и шамана.
    description: Создает рядом с вами неподвижный тотем-часовой с 100 ед. здоровья на 5 мин. Он позволяет осматривать
      окружающую местность и предупреждает об атакующих его противниках. Щелкните правой кнопкой мыши по значку
      положительного эффекта, чтобы переключаться между зрением тотема и шамана.
    sourceHash: 2805df4b8fec13c8480e14d6c773e8d2d6dd9b3c5e6d9676a32511202a3e9e01
