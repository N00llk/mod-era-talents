  spell.932900:
    name: Связка души
    description: Пока эффект активен и ваш демон жив, он получает вместо вас 30% всего получаемого вами урона. Действует,
      пока демон активен.
    auraDescription: 30% получаемого вами урона перенаправляется вашему демону.
    sourceHash: 1de1042e2f4aa3fbd8b4501dd0f02c61cdf1faae23ca3b292ef7536c15212dca
