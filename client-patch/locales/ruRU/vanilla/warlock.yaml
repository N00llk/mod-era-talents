      магический урон.
    sourceHash: 4f89d772fd50916339ec1c4914362ddd22c6e38fe135639786aaa0606ab66c30
  spell.932931:
    name: Камень огня
    description: 'Наделяет оружие в правой руке огненными свойствами: каждая атака может нанести от 25 до 35 ед.
      дополнительного урона от огня. Также повышает урон заклинаний и эффектов огня на величину до 10 ед.'
    sourceHash: ad32c535a72e7308b635cd295ac81e8697980d78a4e9ca1766c2dbba9ee2557d
  spell.932932:
