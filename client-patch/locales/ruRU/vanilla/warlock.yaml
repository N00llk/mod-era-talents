  spell.932929:
    name: Демоническое жертвоприношение
    description: 'Приносит призванного демона в жертву и дает эффект на 30 мин. Призыв любого демона отменяет эффект.
      Бес: повышает урон от огня на 15%. Демон Бездны: восстанавливает 3% максимального запаса здоровья раз в 4
      сек. Суккуб: повышает урон от темной магии на 15%. Охотник Скверны: восстанавливает 2% максимального запаса
      маны раз в 4 сек.'
