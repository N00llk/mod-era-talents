    description: Благословляет дружественную цель, снижая любой получаемый ею урон на величину до 10 ед. в течение
      5 мин. Когда цель блокирует атаку ближнего боя, атакующий получает 14 ед. урона от светлой магии. На каждого
      игрока может действовать только одно благословение от каждого паладина.
    auraDescription: Получаемый урон из любых источников уменьшен максимум на 10 ед. При блокировании атакующий
