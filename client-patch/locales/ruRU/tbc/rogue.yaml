  spell.947777:
    name: Ответный удар
    description: Удар, доступный после парирования атаки противника. Наносит $s1% урона от оружия и обезоруживает
      цель на $d.
    auraDescription: Обезоружен.
    sourceHash: 01fe7455233a0b39fc6e71ed19ea74081d6af6d5d94c1f1982704ce85f06fe72
  spell.947778:
    name: Выброс адреналина
    description: Повышает скорость восстановления энергии на $s1% на $d.
    auraDescription: Восстановление энергии повышено на $s1%.
    sourceHash: fcd56ec4a5338bd96a35f9bb924f6caed621be2f913be22e3885103e8b83ff54
  spell.947784:
    name: Оглушение дробящим оружием
