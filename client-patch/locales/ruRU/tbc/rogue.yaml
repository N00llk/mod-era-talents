  spell.947773:
    name: Расправа
    description: Мгновенно атакует обоими оружиями, нанося каждым $<percent>% урона от оружия и дополнительно $5374s1
      ед. урона. Урон по отравленным целям повышен на 50%. Требуется находиться за спиной цели. Длина серии приемов
      увеличивается на 2.
    sourceHash: 232b798bdfe851ce0c0e0ce10b44b80a88890a6be45d21075031e58e4d87a008
