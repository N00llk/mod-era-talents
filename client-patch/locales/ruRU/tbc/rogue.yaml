    auraDescription: Скорость передвижения снижена.
    sourceHash: b7afd3a80da9df0934145f79b2c9f273ad82dc6863fb6acd99bbac5af1bf4c61
  spell.947786:
    name: Подготовка
    description: После активации немедленно завершает восстановление способностей «Ускользание», «Спринт», «Исчезновение»,
      «Хладнокровие», «Шаг сквозь тень» и «Умысел».
    sourceHash: 1a01fed948f1f2f6bd180108d14561494e154325b221dcac07c4aab2317b91f5
  spell.947787:
    name: Умысел
    description: Добавляет $s1 приемов к серии против текущей цели. Необходимо продолжить или завершить серию в
      течение $d, иначе добавленные приемы будут потеряны.
    auraDescription: Серия приемов не прервется.
    sourceHash: 1708a04092c3efd9aa16ed942e1c5e2a3004002d17870d2ee8090e957db96f31
