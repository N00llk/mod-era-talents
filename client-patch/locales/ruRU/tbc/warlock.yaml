    auraDescription: Темная энергия постепенно разрушает цель.
    sourceHash: d4b4398238350ba883acadc8c0c984c65a09ec7cdf96f5876547c9bd5d8cfafc
  spell.948472:
    name: Нестабильное колдовство
    description: Энергия Тьмы постепенно разрушает цель, нанося 1050 ед. урона в течение 18 сек. При рассеивании
      «Нестабильного колдовства» рассеивающий получает 1575 ед. урона и немоту на 5 сек.
