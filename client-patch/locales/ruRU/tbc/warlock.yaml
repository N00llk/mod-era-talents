  spell.948470:
    name: Нестабильное колдовство
    description: Энергия Тьмы постепенно разрушает цель, нанося 660 ед. урона в течение 18 сек. При рассеивании
      «Нестабильного колдовства» рассеивающий получает 990 ед. урона и немоту на 5 сек.
    auraDescription: Темная энергия постепенно разрушает цель.
    sourceHash: c090753fe1af37ecc59afd3542f5778f3e149b151b9d3286098758185a8cb492
  spell.948471:
    name: Нестабильное колдовство
    description: Энергия Тьмы постепенно разрушает цель, нанося 840 ед. урона в течение 18 сек. При рассеивании
