  spell.948570:
    name: Господство Скверны
    description: Время произнесения следующего заклинания призыва беса, демона Бездны, суккуба, охотника Скверны
      или стража Скверны сокращается на 5.5 сек., а затраты маны — на 50%.
    auraDescription: Следующее призывание демона происходит на 5.5 сек. быстрее и требует на 50% меньше маны.
    sourceHash: 3f3033ea7dcaab579184bc1d41ef232d5941f516f7776de2da45286150b653f9
