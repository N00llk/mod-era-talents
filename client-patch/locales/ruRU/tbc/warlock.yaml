  spell.948410:
    name: Чернокнижник (Пылающий поход)
    sourceHash: 154c6b850ce42a271b4e8ce07a7fe80b6092be115f1a8fa3f0c7e7c3421ad751
  spell.948420:
    name: Создание малого камня огня
    description: Создает малый камень огня, который можно взять в левую руку. Пока камень экипирован, он наделяет
      оружие в правой руке огненными свойствами и повышает урон заклинаний огня.
    sourceHash: 2b0eec88222a84dc419d4d81fc34e0602d4270e57c5d97c60f9700599f502e02
  spell.948421:
    name: Создание камня огня
    description: Создает камень огня, который можно взять в левую руку. Пока камень экипирован, он наделяет оружие
      в правой руке огненными свойствами и повышает урон заклинаний огня.
    sourceHash: fd072e401632ffbd45712cd9ac97ed4cb9e19a58bafb9e98aa39a5bd3f796af8
  spell.948422:
    name: Создание большого камня огня
    description: Создает большой камень огня, который можно взять в левую руку. Пока камень экипирован, он наделяет
      оружие в правой руке огненными свойствами и повышает урон заклинаний огня.
    sourceHash: 170b5b08760c2e1c263afb6e460d9c23764a266b6ca2aa30b6d43cbc07b3a74e
  spell.948423:
    name: Создание мощного камня огня
    description: Создает мощный камень огня, который можно взять в левую руку. Пока камень экипирован, он наделяет
      оружие в правой руке огненными свойствами и повышает урон заклинаний огня.
    sourceHash: 7b385e2fd8d23cd021af9a2f8969b12f034a2b68a4796eeec01518eb5fa2ea8c
  spell.948424:
    name: Создание камня огня искусника
    description: Создает камень огня искусника, который можно взять в левую руку. Пока камень экипирован, он наделяет
      оружие в правой руке огненными свойствами и повышает урон заклинаний огня.
    sourceHash: cb0ed3d8157a3c53eece1aea2787d70157dec316d16c0223c553f42cbcadd533
  spell.948425:
    name: Создание камня чар
    description: Создает камень чар, который можно взять в левую руку. Пока камень экипирован, он повышает вероятность
      критического удара заклинаниями. При использовании снимает вредоносные магические эффекты и поглощает магический
      урон.
    sourceHash: a1c15ae67de7fa42783810191ca0506978edba564aec1ed777d381f0df0fdce1
  spell.948426:
    name: Создание большого камня чар
    description: Создает большой камень чар, который можно взять в левую руку. Пока камень экипирован, он повышает
      вероятность критического удара заклинаниями. При использовании снимает вредоносные магические эффекты и поглощает
      магический урон.
    sourceHash: f77b7854d5d90efcbe3e13617dfa5b83b444e34fda293f23547039baf823e354
  spell.948427:
    name: Создание мощного камня чар
    description: Создает мощный камень чар, который можно взять в левую руку. Пока камень экипирован, он повышает
      вероятность критического удара заклинаниями. При использовании снимает вредоносные магические эффекты и поглощает
      магический урон.
    sourceHash: 4f89d772fd50916339ec1c4914362ddd22c6e38fe135639786aaa0606ab66c30
  spell.948428:
    name: Создание камня чар искусника
    description: Создает камень чар искусника, который можно взять в левую руку. Пока камень экипирован, он повышает
      рейтинг критического удара заклинаниями. При использовании снимает вредоносные магические эффекты.
    sourceHash: 0e94b20e9da44226ed698bf674733c1fbf9591c900de24d6f79bd8347c8fe100
  spell.948430:
    name: Камень огня
    description: 'Наделяет оружие в правой руке огненными свойствами: каждая атака может нанести от 116 до 174 ед.
      дополнительного урона от огня. Также повышает урон заклинаний и эффектов огня на величину до 30 ед.'
    sourceHash: e97113654f907ce1afc33a75ba0e2c31cb3277a2bcb5a0c5630a70fc288deff5
  spell.948431:
    name: Атака камня огня
    sourceHash: d10b362dbe88bc8d42188e79cdc47d3b1f4051309dc13d5d11e8789ca68910b0
  spell.948432:
    name: Камень чар
    description: Снимает с заклинателя все вредоносные магические эффекты.
    sourceHash: a1b4be188a480ea073b1cd09db0c595adec0467f1c35c93bb031f248d6c28f8e
  spell.948433:
    name: Камень чар
    description: Повышает рейтинг критического удара заклинаниями на 20 ед.
    sourceHash: 3388cf96898d689264fecfff851487982082d5386ab7357943e4d4d84bbd45d3
  spell.948450:
    name: Усиление проклятия
    description: Усиливает эффект следующего вашего заклинания «Проклятие рока» или «Проклятие агонии» на 50% либо
      следующего «Проклятия изнеможения» дополнительно на 20%. Время действия — 30 сек.
    auraDescription: Следующее «Проклятие рока» или «Проклятие агонии» усилено на 50% («Проклятие изнеможения» —
      на 20%).
    sourceHash: b0faeca3b808ea47cac60f2c1a66ffc1be0293a1ac21d2991d9cc92a89d3d78e
  spell.948451:
