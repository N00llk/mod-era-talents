    sourceHash: 4e5d1ec8e29bd0afcd7223f5cb7612155856beea432ebbdfefbc7aeb7dccd4eb
  spell.948550:
    name: Связка души
    description: Пока эффект активен, ваш бес, демон Бездны, суккуб, охотник Скверны, страж Скверны или порабощенный
      демон получает вместо вас 20% всего получаемого вами урона. Этот урон нельзя предотвратить. Кроме того, урон
      демона и хозяина повышается на 5%. Действует, пока демон активен и находится под вашим контролем.
    auraDescription: 20% получаемого вами урона перенаправляется вашему демону, а урон вас обоих повышен на 5%.
    sourceHash: 787b8ee8482c79927dff5f3999a36142fdd11b8e142f37c5f4184765eed30650
  spell.948552:
    name: Демоническое жертвоприношение
    description: 'Приносит призванного демона в жертву и дает эффект на 30 мин. Призыв любого демона отменяет эффект.
      Бес: повышает урон от огня на 15%. Демон Бездны: восстанавливает 2% максимального запаса здоровья раз в 4
      сек. Суккуб: повышает урон от темной магии на 15%. Охотник Скверны: восстанавливает 3% максимального запаса
      маны раз в 4 сек. Страж Скверны: повышает урон от темной магии на 10% и восстанавливает 2% максимального запаса
      маны раз в 4 сек.'
    sourceHash: 6ac5ae93523199c3c90a3d77bfc7268354724a2c6d1a9b31ff65461593909d68
  spell.948553:
