  spell.946281:
    name: Рой насекомых
    description: Рой насекомых атакует цель, снижая вероятность ее попадания на $s2% и нанося $o1 ед. урона от сил
      природы в течение $d.
    auraDescription: Вероятность попадания снижена на $s2%. Наносит $s1 ед. урона от сил природы раз в $t1 сек.
    sourceHash: 427a33c4fb8d4efbf97b260e49fcb02e419eacd13b1e48d13576b530111b2a5d
