  spell.946256:
    name: Вожак стаи
    description: В облике кошки, медведя или лютого медведя «Вожак стаи» повышает вероятность критического удара
      в ближнем и дальнем бою всех участников группы в радиусе 45 м на 5%.
    auraDescription: Вероятность критического удара в ближнем и дальнем бою у ближайших участников группы повышена
      на 5%.
    sourceHash: edff3dc9e16f38426b5a0480a19dadda544407fba47c0f585d483b883650b59f
  spell.946257:
    name: Вожак стаи
    auraDescription: Вероятность критического удара в ближнем и дальнем бою повышена на $s1%.
    sourceHash: d3ae5e4e278b8e1e4ea2624e95d30e9043b5ba78490e7b0495503e0bbc165363
  spell.946258:
    name: Увечье (медведь)
    description: Наносит цели увечье, причиняя $s3% обычного урона и дополнительно ${$m1*$m3/100} ед. урона. Повышает
      получаемый целью урон от кровотечений на $s2% на $d.
    auraDescription: Урон от всех эффектов кровотечения повышен на $s2%.
    sourceHash: e0fa510c087a939031cf5c868bc5d12e5220b9bba1b03835f881d1ab0864f8fa
  spell.946259:
