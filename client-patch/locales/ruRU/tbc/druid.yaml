  spell.946269:
    name: Знамение ясности
    description: Наполняет друида энергией природы. Каждая атака ближнего боя может вызвать состояние ясности мысли,
      снижающее затраты маны, ярости или энергии на следующее атакующее или исцеляющее заклинание либо атакующую
      способность на 100%. Время действия — 30 мин.
    auraDescription: Каждая атака ближнего боя может снизить стоимость следующего заклинания или способности на
      100%.
    sourceHash: 4dfbafa547de009e366861c2e03d631bb0de19eceb06926650ec01a1ba191e5d
  spell.946266:
    name: Древо жизни
    description: Повышает получаемое участниками группы в радиусе 45 м исцеление на величину, равную 25% духа друида
      в облике древа жизни.
    auraDescription: Получаемое исцеление повышено на величину, равную 25% духа друида в облике древа жизни.
    sourceHash: a008010b0559f934a874c176ea46c2d1e6792535ce7a7128ad21f8fe011b71a3
  spell.946276:
    name: Древо жизни
    description: 'Превращает в древо жизни. В этом облике получаемое всеми участниками группы в радиусе 45 м исцеление
      повышается на величину, равную 25% вашего духа. Вы можете применять только заклинания исцеления, а также «Озарение»,
      «Дубовую кожу», «Природный захват» и «Шипы».


      Смена облика снимает с заклинателя эффекты превращения и ограничения передвижения.'
    auraDescription: Невосприимчивость к превращению. Получаемое исцеление всех участников группы в радиусе 45 м
      повышено на величину, равную 25% вашего духа.
    sourceHash: 5027713dedfbe776e6b0ed6eee19ab0abb178ad40923b5a361c70976a74391a7
  spell.946277:
    name: Улучшенный волшебный огонь
    description: Повышает вероятность попадания по цели атаками ближнего и дальнего боя на 1% на $d.
    auraDescription: Вероятность получить удар атакой ближнего или дальнего боя повышена на 1%.
