texts:
  spell.946268:
    name: Благоволение природы
    auraDescription: Время произнесения следующего заклинания сокращено на 0.5 сек.
    sourceHash: 4d6d9ea84c6c7d9b17ae10f575892ce9e0aa549a2e5d5288ef896147694e250e
  spell.946270:
    name: Природный захват
    description: 'Пока эффект действует, атакующий заклинателя противник может попасть под действие «Гнева деревьев»
      (ранг 1). Можно применять только под открытым небом. Количество зарядов: 1. Время действия — 45 сек.'
    auraDescription: При получении урона от атаки ближнего боя атакующий может быть обездвижен.
    sourceHash: be951ca7507e5d37fc1e49dbde394e1a53ef55ba31022f3cb3fd02f1645d7317
