  spell.946537:
    name: Щит земли
    description: 'Окружает цель земляным щитом, который с вероятностью 30% позволяет избежать замедления произнесения
      заклинаний при получении урона. Атаки по защищенной цели восстанавливают ей 150 ед. здоровья. Исцеление может
      срабатывать лишь раз в несколько секунд. Количество зарядов: 6. Время действия — 10 мин. Щит земли может защищать
      только одну цель. На цели одновременно может действовать только один щит стихий.'
    auraDescription: С вероятностью 30% предотвращает задержку произнесения заклинаний при получении урона; атаки
      исцеляют защищенную цель на 150 ед.
    sourceHash: 5d8b9f97f5db3a206916f530e401978e324794eb92a61692a8ddd0da49b51fd6
