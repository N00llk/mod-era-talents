  spell.946512:
    name: Средоточие заклинаний
    auraDescription: Получение урона не задерживает произнесение заклинаний шамана.
    sourceHash: c666e98f686f07d9b2733b041d94455289651abcb883d00359c1533b81d20cbe
  spell.946513:
    name: Покорение стихий
    description: После активации следующее ваше атакующее заклинание огня, льда или сил природы имеет 100% вероятности
      критического эффекта и требует на 100% меньше маны.
    auraDescription: Следующее наносящее урон заклинание огня, льда или сил природы требует на 100% меньше маны
      и гарантированно наносит критический удар.
    sourceHash: 76a3aa73fd77abe961d46896bbea8bd6291eb83281a3e3c3450845d78acbb123
  spell.946514:
