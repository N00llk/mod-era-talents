texts:
  spell.948760:
    name: Мощь тайной магии
    description: После активации урон ваших заклинаний повышается на 30%, а затраты маны на них — на 30%. Время
      действия — 15 сек.
    auraDescription: Урон от заклинаний повышен на 30%. Затраты маны повышены на 30%.
    sourceHash: 9c694818d234a365c301f5f29a7fe73b96f351376c35e2d9d882da5e4429fab7
  spell.948761:
    name: Присутствие разума
    description: После активации следующее ваше заклинание со временем произнесения менее 10 сек. становится мгновенным.
    auraDescription: Следующее заклинание мага со временем произнесения менее 10 сек. применяется мгновенно.
    sourceHash: c01e2e591617e63c165a7f8a50af6a753d24ae311a61e0e1a50778bbb5ce9cb3
  spell.948762:
    name: Магическое поглощение
    description: Повышает все виды сопротивления на 2 ед. Каждое заклинание, которому вы полностью сопротивляетесь,
      восстанавливает 1% вашего максимального запаса маны. Время восстановления — 1 сек.
    sourceHash: b2bb7e7ba979953ebac747c7f462d5e4ef34d2350fa78f71b5b020866d924b5c
  spell.948763:
    name: Магическое поглощение
    description: Повышает все виды сопротивления на 4 ед. Каждое заклинание, которому вы полностью сопротивляетесь,
