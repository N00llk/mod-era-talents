    description: Снижает скорость передвижения цели на 50%, увеличивает время между атаками дальнего боя на 50%
      и время произнесения заклинаний на 50%. Время действия — 15 сек. Одновременно «Замедление» может действовать
      только на одну цель.
    auraDescription: Скорость передвижения снижена на 50%, время между атаками дальнего боя увеличено на 50%, время
      произнесения заклинаний увеличено на 50%.
