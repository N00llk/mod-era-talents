    sourceHash: b76a386e4b4b32e9cc3a29f0ef1275ca99a842ae1613ec9026ef11617629b112
  spell.948764:
    name: Магическое поглощение
    description: Повышает все виды сопротивления на 6 ед. Каждое заклинание, которому вы полностью сопротивляетесь,
