  spell.948771:
    name: Улучшенный скачок
    description: Вероятность попадания по вам любых атак и заклинаний снижена на 13%.
    auraDescription: Вероятность получить удар атакой или заклинанием снижена на 13%.
    sourceHash: 7787f12ebe6e6f71ed79df71de88887d7014e88c99f094d33319725b5e0b1342
