  spell.948280:
    name: Охотник (Пылающий поход)
    sourceHash: 5f9826b1ff37adcd6dc05fbfaa5759aa380e8990c39be2cbf42982561ebeb636
  spell.948281:
    name: Жало скорпида
    description: Жалит цель, снижая вероятность попадания ее атак ближнего и дальнего боя на 5% на 20 сек. На каждую
      цель может действовать только одно жало от каждого охотника.
    auraDescription: Вероятность попадания атаками ближнего и дальнего боя снижена на 5%.
    sourceHash: 06bca452c7c457537e7574d4bcef247b8ab3f53b30ed178f3c98a1d657153370
  spell.948290:
    name: Звериный гнев
    description: Приводит питомца в ярость, повышающую наносимый им урон на 50% на 18 сек. В состоянии ярости зверь
      не знает ни страха, ни жалости, и только смерть может остановить его.
    auraDescription: В состоянии ярости.
    sourceHash: 6ffb99b56685d054b1581ecd9a12a1e6b2e834c2b0c780fa4d9ccf94fdd9078f
  spell.948291:
    name: Звериная сущность
    description: 'Пока питомец находится под действием «Звериного гнева», вы тоже впадаете в ярость: наносимый урон
      повышается на 10%, а затраты маны на все заклинания снижаются на 20% на 18 сек. В состоянии ярости вы не знаете
      ни страха, ни жалости, и только смерть может остановить вас.'
    sourceHash: 70ffa11fa32aa767d0479086804699826dcb8d899a16133d074b3efd460cc841
  spell.948292:
    name: Звериная сущность
    description: 'Пока питомец находится под действием «Звериного гнева», вы тоже впадаете в ярость: наносимый урон
      повышается на 10%, а затраты маны на все заклинания снижаются на 20% на 18 сек. В состоянии ярости вы не знаете
      ни страха, ни жалости, и только смерть может остановить вас.'
    auraDescription: Наносимый урон повышен на 10%, затраты маны снижены на 20%. Остановить можно только убийством.
    sourceHash: 3237a66fb20f394b61a715f41148f4de044ae60baf5546b55c889d6e2ab80941
  spell.948293:
    name: Узы духа
    auraDescription: Вы и ваш питомец восстанавливаете 1% от максимального здоровья раз в 10 сек.
    sourceHash: e3789a38d6a0e2f68d7852b8a529ed5f74b2abdda817b136b40e443853b34014
